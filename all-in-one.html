4';\nctx.beginPath();\nctx.moveTo(0, H);\nfor (let x = 0; x < W; x += 2) ctx.lineTo(x, ground[x]);\nctx.lineTo(W, H);\nctx.fill();\nctx.strokeStyle = '#65a30d';\nctx.lineWidth = 3;\nctx.beginPath();\nfor (let x = 0; x < W; x += 2) x ? ctx.lineTo(x, ground[x]) : ctx.moveTo(0, ground[0]);\nctx.stroke();\nif (!tanks) return;\ntanks.forEach((t, i) => drawTank(t, i === turn && (state === 'aim' || state === 'ai')));\nctx.fillStyle = 'rgba(255,255,255,.4)';\ntrail.forEach(([x, y], i) => { if (i % 3 === 0) ctx.fillRect(x, y, 2, 2); });\nif (shell) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(shell.x, shell.y, 4, 0, 7); ctx.fill(); }\nbooms.forEach(b => {\nctx.fillStyle = `rgba(253,224,71,${1 - b.t / 500})`;\nctx.beginPath(); ctx.arc(b.x, b.y, BLAST * (0.5 + b.t / 1000), 0, 7); ctx.fill();\n});\nctx.fillStyle = '#e6e7f2';\nctx.font = '14px system-ui';\nctx.textAlign = 'center';\nctx.fillText(`Wind ${Math.abs(wind)} ${wind < 0 ? '◀' : wind > 0 ? '▶' : ''}`, W / 2, 24);\nctx.fillStyle = 'rgba(255,255,255,.6)';\nctx.fillRect(W / 2, 32, wind * 1.2, 4);\nctx.textAlign = 'left';\nctx.fillText(state === 'ai' || (state !== 'aim' && turn === 1) ? 'CPU is aiming…' : 'Your turn', 12, 24);\n}\nfunction loop(t) {\nconst dt = Math.min(40, t - last);\nlast = t;\nif (state !== 'ready' && state !== 'over') update(dt);\ndraw();\nrequestAnimationFrame(loop);\n}\nfunction setAim(da, dp) {\nif (state !== 'aim') return;\nconst t = tanks[0];\nt.angle = clamp(t.angle + da, 0, 180);\nt.power = clamp(t.power + dp, 10, 100);\nsyncInputs();\n}\nangEl.oninput = () => { if (state === 'aim') { tanks[0].angle = +angEl.value; syncInputs(); } };\npowEl.oninput = () => { if (state === 'aim') { tanks[0].power = +powEl.value; syncInputs(); } };\ndocument.getElementById('fire').onclick = () => { if (state === 'aim') fire(tanks[0]); };\ndocument.getElementById('newgame').onclick = newGame;\ndocument.addEventListener('keydown', e => {\nif (e.target.tagName === 'INPUT') return;\nif (e.key === 'ArrowLeft') set  0.03); hud(); }\nif (c === '^' && me.y + me.h > ty * T + 14 && me.x + me.w > tx * T + 5 && me.x < tx * T + T - 5) return die();\n}\nfor (const f of foes) {\nif (f.dead) { f.dead -= dt; continue; }\nf.hitWall = false;\nmoveBody(f, f.vx * s, 0);\nconst aheadX = f.vx > 0 ? f.x + f.w + 2 : f.x - 2;\nconst blocked = f.hitWall || tileAt(Math.floor(aheadX / T), Math.floor((f.y + f.h / 2) / T)) === '^';\nconst noFloor = !solidAt(aheadX, f.y + f.h + 4);\nif (blocked || noFloor) f.vx = -f.vx;\nif (me.x < f.x + f.w && me.x + me.w > f.x && me.y < f.y + f.h && me.y + me.h > f.y) {\nif (me.vy > 0 && me.y + me.h - f.y < 16) {\nf.dead = 400;\nf.squashed = true;\nme.vy = -JUMP * 0.7;\ncoins += 2;\nSound.beep(300, 0.1, 'square', 0.04);\nhud();\n} else return die();\n}\n}\nfoes = foes.filter(f => !(f.squashed && f.dead <= 0));\nconst L = LEVELS[lvl];\nif (me.x + me.w > L.flag[0] * T + 8) {\ntotalCoins += coins;\ncoins = 0;\nSound.beep(880, 0.3, 'triangle');\nif (lvl + 1 < LEVELS.length) {\nstate = 'between';\noverlay(ov, `<h2>Level ${lvl + 1} complete!<\/h2><p>Coins so far: ${totalCoins}<\/p><button class=\"btn\" onclick=\"nextLevel()\">Continue<\/button>`);\n} else {\nstate = 'won';\nconst secs = Math.round((performance.now() - startTime) / 1000);\nconst bestT = recordBest('jumper-time', secs, true);\noverlay(ov, `<h2>You beat every level! 🏁<\/h2><p>${totalCoins} coins · ${secs}s (best ${bestT}s)<\/p><button class=\"btn\" onclick=\"newGame()\">Play again<\/button>`);\n}\nhud();\n}\ncam = clamp(me.x - VW / 2 + me.w / 2, 0, lw * T - VW);\n}\nfunction nextLevel() { lvl++; loadLevel(lvl); state = 'play'; overlay(ov, null); }\nfunction newGame() { lvl = 0; lives = 3; totalCoins = 0; loadLevel(0); state = 'play'; startTime = performance.now(); overlay(ov, null); }\nfunction draw() {\nconst g = ctx.createLinearGradient(0, 0, 0, VH);\ng.addColorStop(0, '#60a5fa'); g.addColorStop(1, '#bfdbfe');\nctx.fillStyle = g;\nctx.fillRect(0, 0, VW, VH);\nctx.fillStyle = '#86efac';\nfor (let i = -1; i < 6; i++) {\nconst x = i * 220 - (cam * 0.3) % 220;\nctx.beginPath(); ctx.ellipse(x + 110, VH - 60, 140, 110, 0, Math.PI, 0); ctx.fill();\n}\nctx.fillStyle = 'rgba(255,255,255,.85)';\nfor (let i = -1; i < 5; i++) {\nconst x = i * 260 - (cam * 0.15) % 260;\nctx.beginPath(); ctx.arc(x + 60, 60, 20, 0, 7); ctx.arc(x + 85, 50, 26, 0, 7); ctx.arc(x + 112, 60, 20, 0, 7); ctx.fill();\n}\nif (!map) return;\nconst x0 = Math.floor(cam / T), x1 = Math.min(lw - 1, x0 + Math.ceil(VW / T) + 1);\nfor (let y = 0; y < ROWS; y++) for (let x = x0; x <= x1; x++) {\nconst c = map[y][x], px = Math.round(x * T - cam), py = y * T;\nif (c === '#') {\nctx.fillStyle = '#92400e';\nctx.fillRect(px, py, T, T);\nctx.fillStyle = '#78350f';\nctx.fillRect(px + 6, py + 12, 4, 4); ctx.fillRect(px + 20, py + 22, 4, 4);\nif (y === 0 || !solidCh(map[y - 1][x])) { ctx.fillStyle = '#16a34a'; ctx.fillRect(px, py, T, 8); }\n} else if (c === 'B') {\nctx.fillStyle = '#ea580c';\nctx.fillRect(px, py, T, T);\nctx.strokeStyle = '#7c2d12';\nctx.lineWidth = 2;\nctx.strokeRect(px + 1, py + 1, T - 2, T - 2);\nctx.beginPath(); ctx.moveTo(px, py + T / 2); ctx.lineTo(px + T, py + T / 2); ctx.moveTo(px + T / 2, py); ctx.lineTo(px + T / 2, py + T / 2); ctx.moveTo(px + T / 4, py + T / 2); ctx.lineTo(px + T / 4, py + T); ctx.stroke();\n} else if (c === '^') {\nctx.fillStyle = '#9ca3af';\nfor (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(px + k * 11, py + T); ctx.lineTo(px + k * 11 + 5.5, py + 12); ctx.lineTo(px + k * 11 + 11, py + T); ctx.fill(); }\n} else if (c === 'o') {\nconst sx = Math.abs(Math.cos(tick / 250 + x));\nctx.fillStyle = '#facc15';\nctx.beginPath(); ctx.ellipse(px + T / 2, py + T / 2, 9 * sx + 1, 11, 0, 0, 7); ctx.fill();\nctx.fillStyle = '#fde68a';\nctx.beginPath(); ctx.ellipse(px + T / 2, py + T / 2, 4 * sx, 6, 0, 0, 7); ctx.fill();\n}\n}\nconst L = LEVELS[lvl], fx = L.flag[0] * T - cam + T / 2, fy = (L.flag[1] + 1) * T;\nctx.fillStyle = '#e5e7eb';\nctx.fillRect(fx - 2, fy - 5 * T, 4, 5 * T);\nctx.fillStyle = '#ef4444';\nctx.beginPath(); ctx.moveTo(fx + 2, fy - 5 * T); ctx.lineTo(fx + 40, fy - 4.5 * T); ctx.lineTo(fx + 2, fy - 4 * T); ctx.fill();\nfor (const f of foes) {\nconst px = f.x - cam, py = f.y;\nctx.fillStyle = '#7e22ce';\nif (f.squashed) { ctx.fillRect(px, py + f.h - 8, f.w, 8); continue; }\nctx.beginPath(); ctx.roundRect(px, py, f.w, f.h, [12, 12, 4, 4]); ctx.fill();\nctx.fillStyle = '#fff';\nctx.fillRect(px + 6, py + 6, 6, 7); ctx.fillRect(px + 16, py + 6, 6, 7);\nctx.fillStyle = '#000';\nconst lx = f.vx > 0 ? 2 : 0;\nctx.fillRect(px + 7 + lx, py + 8, 3, 4); ctx.fillRect(px + 17 + lx, py + 8, 3, 4);\nctx.fillStyle = '#581c87';\nconst step = Math.floor(tick / 150) % 2;\nctx.fillRect(px + 2, py + f.h - 4, 9, 4 + step * 2); ctx.fillRect(px + f.w - 11, py + f.h - 4, 9, 6 - step * 2);\n}\nconst px = me.x - cam, py = me.y;\nctx.fillStyle = '#dc2626';\nctx.fillRect(px + 2, py, me.w - 4, 8);\nctx.fillRect(me.face > 0 ? px + 8 : px - 2, py + 4, 16, 4);\nctx.fillStyle = '#fcd34d';\nctx.fillRect(px + 3, py + 8, me.w - 6, 9);\nctx.fillStyle = '#000';\nctx.fillRect(me.face > 0 ? px + 13 : px + 6, py + 10, 3, 4);\nctx.fillStyle = '#2563eb';\nctx.fillRect(px + 2, py + 17, me.w - 4, 9);\nctx.fillStyle = '#7c2d12';\nconst run = me.ground && Math.abs(me.vx) > 20 ? Math.floor(tick / 90) % 2 : 0;\nctx.fillRect(px + 2, py + 26, 7, 4 - run * 2);\nctx.fillRect(px + me.w - 9, py + 26, 7, 2 + run * 2);\n}\nfunction loop(t) {\nconst dt = Math.min(33, t - last);\nlast = t;\nif (state === 'play' || state === 'dead') update(dt);\ndraw();\nrequestAnimationFrame(loop);\n}\nfunction pressJump() { jumpBuf = 0.12; }\ndocument.addEventListener('keydown', e => {\nkeys[e.key] = true;\nif ((e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') && !e.repeat) {\nif (state === 'ready' || state === 'over' || state === 'won') return newGame();\nif (state === 'between') return nextLevel();\npressJump();\n}\n});\ndocument.addEventListener('keyup', e => { keys[e.key] = false; });\nholdButton(document.getElementById('tL'), v => { keys.ArrowLeft = v; });\nholdButton(document.getElementById('tR'), v => { keys.ArrowRight = v; });\nholdButton(document.getElementById('tJ'), v => { keys.jump = v; if (v) pressJump(); });\nlvl = 0; lives = 3; totalCoins = 0;\nloadLevel(0);\noverlay(ov, '<h2>Pixel Jumper<\/h2><p>Three levels of running, jumping and stomping.<\/p><button class=\"btn\" onclick=\"newGame()\">Start<\/button>');\nrequestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>",
"whack-a-mole": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Whack-a-Mole<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<style>\n#field {\ndisplay: grid;\ngrid-template-columns: repeat(3, 1fr);\ngap: 18px;\npadding: 24px;\nbackground: linear-gradient(#65a30d, #3f6212);\nborder-radius: 16px;\nwidth: min(520px, calc(100vw - 24px));\nposition: relative;\ncursor: crosshair;\nuser-select: none;\n-webkit-user-select: none;\ntouch-action: manipulation;\n}\n.hole { aspect-ratio: 1; position: relative; overflow: hidden; border-radius: 50% 50% 46% 46% / 30% 30% 70% 70%; }\n.hole::after { content: ''; position: absolute; left: 6%; right: 6%; bottom: 4%; height: 34%; background: #1c1917; border-radius: 50%; box-shadow: inset 0 8px 12px #000; }\n.mole {\nposition: absolute; left: 18%; width: 64%; bottom: -75%; height: 72%;\nfont-size: min(64px, 13vw); display: flex; align-items: flex-start; justify-content: center;\ntransition: bottom .12s ease-out; z-index: 1;\n}\n.hole.up .mole { bottom: 18%; }\n.hole.hit .mole { filter: grayscale(1) brightness(.6); transform: scaleY(.8); }\n.hole::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 22%; background: #4d7c0f; z-index: 2; border-radius: 0 0 40% 40%; }\n.pop { position: absolute; font-weight: 800; font-size: 22px; pointer-events: none; animation: rise .7s ease-out forwards; z-index: 3; }\n@keyframes rise { to { transform: translateY(-40px); opacity: 0; } }\n.timebar { width: min(520px, calc(100vw - 24px)); height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; margin-top: 10px; }\n.timebar div { height: 100%; background: var(--good); width: 100%; transition: width .1s linear; }\n<\/style>\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>🔨 Whack-a-Mole<\/h1>\n<div class=\"stats\">Score <b id=\"score\">0<\/b> Time <b id=\"time\">30<\/b> Best <b id=\"best\">0<\/b><\/div>\n<\/header>\n<div class=\"timebar\"><div id=\"bar\"><\/div><\/div>\n<div class=\"stage\">\n<div id=\"field\"><\/div>\n<div class=\"overlay\" id=\"ov\"><\/div>\n<\/div>\n<p class=\"help\">Click or tap moles as they pop up. 🐹 = 1 point, 👑 golden mole = 5 points, 💣 bomb = −5. You can also use the number keys <kbd>1<\/kbd>–<kbd>9<\/kbd> (numpad layout).<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst field = document.getElementById('field'), ov = document.getElementById('ov');\nconst ROUND = 30000;\nlet holes = [], score, timeLeft, state = 'ready', spawnT, last = 0;\nlet best = Store.get('mole-best', 0);\ndocument.getElementById('best').textContent = best;\nfor (let i = 0; i < 9; i++) {\nconst h = document.createElement('div');\nh.className = 'hole';\nh.innerHTML = '<div class=\"mole\"><\/div>';\nh.addEventListener('pointerdown', e => { e.preventDefault(); whack(i, e); });\nfield.appendChild(h);\nholes.push({ el: h, mole: h.firstChild, up: false, kind: null, t: 0 });\n}\nfunction start() {\nscore = 0;\ntimeLeft = ROUND;\nspawnT = 400;\nholes.forEach(h => { h.up = false; h.el.classList.remove('up', 'hit'); });\nstate = 'play';\noverlay(ov, null);\nhud();\n}\nfunction hud() {\ndocument.getElementById('score').textContent = score;\ndocument.getElementById('time').textContent = Math.ceil(timeLeft / 1000);\ndocument.getElementById('bar').style.width = (timeLeft / ROUND * 100) + '%';\ndocument.getElementById('bar').style.background = timeLeft < 8000 ? 'var(--bad)' : 'var(--good)';\n}\nfunction popText(h, text, color) {\nconst p = document.createElement('div');\np.className = 'pop';\np.textContent = text;\np.style.color = color;\nconst r = h.el.getBoundingClientRect(), fr = field.getBoundingClientRect();\np.style.left = (r.left - fr.left + r.width / 2 - 14) + 'px';\np.style.top = (r.top - fr.top + 10) + 'px';\nfield.appendChild(p);\nsetTimeout(() => p.remove(), 700);\n}\nfunction whack(i) {\nif (state !== 'play') return;\nconst h = holes[i];\nif (!h.up || h.el.classList.contains('hit')) return;\nh.el.classList.add('hit');\nconst pts = h.kind === 'bomb' ? -5 : h.kind === 'gold' ? 5 : 1;\nscore = Math.max(0, score + pts);\npopText(h, (pts > 0 ? '+' : '') + pts, pts > 0 ? '#fef08a' : '#fca5a5');\nSound.beep(pts > 0 ? 600 + pts * 60 : 120, 0.08, pts > 0 ? 'square' : 'sawtooth', 0.04);\nh.t = Math.min(h.t, 250);\nhud();\n}\nfunction update(dt) {\ntimeLeft -= dt;\nconst progress = 1 - timeLeft / ROUND;\nfor (const h of holes) {\nif (!h.up) continue;\nh.t -= dt;\nif (h.t <= 0) { h.up = false; h.el.classList.remove('up', 'hit'); }\n}\nspawnT -= dt;\nif (spawnT <= 0) {\nconst free = holes.filter(h => !h.up);\nif (free.length) {\nconst h = pick(free), r = Math.random();\nh.kind = r < 0.12 ? 'bomb' : r < 0.2 ? 'gold' : 'mole';\nh.mole.textContent = { mole: '🐹', gold: '👑', bomb: '💣' }[h.kind];\nh.up = true;\nh.t = (h.kind === 'gold' ? 650 : 1100) - progress * 450;\nh.el.classList.remove('hit');\nh.el.classList.add('up');\n}\nspawnT = rand(350, 800) * (1 - progress * 0.5);\n}\nif (timeLeft <= 0) {\ntimeLeft = 0;\nstate = 'over';\nholes.forEach(h => { h.up = false; h.el.classList.remove('up', 'hit'); });\nbest = recordBest('mole-best', score);\ndocument.getElementById('best').textContent = best;\noverlay(ov, `<h2>Time's up!<\/h2><p>You scored ${score}. Best ${best}<\/p><button class=\"btn\" onclick=\"start()\">Play again<\/button>`);\n}\nhud();\n}\nfunction loop(t) {\nconst dt = Math.min(50, t - last);\nlast = t;\nif (state === 'play') update(dt);\nrequestAnimationFrame(loop);\n}\ndocument.addEventListener('keydown', e => {\nconst n = +e.key;\nif (n >= 1 && n <= 9) whack([6, 7, 8, 3, 4, 5, 0, 1, 2][n - 1]);\nif ((e.key === ' ' || e.key === 'Enter') && state !== 'play') start();\n});\noverlay(ov, '<h2>Whack-a-Mole<\/h2><p>30 seconds. Hit as many moles as you can!<\/p><button class=\"btn\" onclick=\"start()\">Start<\/button>');\nrequestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>",
"simon": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Simon Says<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<style>\n#board {\nwidth: min(440px, calc(100vw - 32px));\naspect-ratio: 1;\nborder-radius: 50%;\nbackground: #111;\ndisplay: grid;\ngrid-template-columns: 1fr 1fr;\ngap: 12px;\npadding: 12px;\nposition: relative;\nmargin: 12px auto;\nbox-shadow: 0 10px 40px rgba(0,0,0,.5);\n}\n.pad { border: 0; cursor: pointer; opacity: .55; transition: opacity .08s, filter .08s; touch-action: manipulation; }\n.pad.lit { opacity: 1; filter: brightness(1.35) saturate(1.2); }\n.pad:disabled { cursor: default; }\n.p0 { background: #22c55e; border-radius: 100% 0 0 0; }\n.p1 { background: #ef4444; border-radius: 0 100% 0 0; }\n.p2 { background: #facc15; border-radius: 0 0 0 100%; }\n.p3 { background: #3b82f6; border-radius: 0 0 100% 0; }\n#center {\nposition: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);\nwidth: 38%; aspect-ratio: 1; border-radius: 50%; background: #1f2937; border: 10px solid #111;\ndisplay: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #e5e7eb;\n}\n#center .big { font-size: 34px; font-weight: 800; }\n#center .small { font-size: 12px; color: var(--muted); }\n<\/style>\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>🚦 Simon Says<\/h1>\n<div class=\"stats\">Best <b id=\"best\">0<\/b><\/div>\n<\/header>\n<div class=\"controls\">\n<button class=\"btn\" id=\"go\">Start<\/button>\n<label class=\"help\" style=\"margin:0\"><input type=\"checkbox\" id=\"strict\"> Strict mode (one mistake ends the game)<\/label>\n<\/div>\n<div id=\"board\">\n<button class=\"pad p0\" data-i=\"0\"><\/button>\n<button class=\"pad p1\" data-i=\"1\"><\/button>\n<button class=\"pad p2\" data-i=\"2\"><\/button>\n<button class=\"pad p3\" data-i=\"3\"><\/button>\n<div id=\"center\"><div class=\"big\" id=\"count\">--<\/div><div class=\"small\" id=\"status\">Press start<\/div><\/div>\n<\/div>\n<p class=\"help\">Watch the sequence, then repeat it by clicking the pads or pressing <kbd>Q<\/kbd> <kbd>W<\/kbd> <kbd>A<\/kbd> <kbd>S<\/kbd> (top-left, top-right, bottom-left, bottom-right). Each round adds one more step.<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst pads = [...document.querySelectorAll('.pad')];\nconst TONES = [329.6, 440, 277.2, 164.8];\nlet seq = [], pos = 0, accepting = false, timers = [];\nlet best = Store.get('simon-best', 0);\ndocument.getElementById('best').textContent = best;\nfunction setStatus(count, msg) {\ndocument.getElementById('count').textContent = count;\ndocument.getElementById('status').textContent = msg;\n}\nfunction light(i, ms) {\npads[i].classList.add('lit');\nSound.beep(TONES[i], ms / 1000, 'triangle', 0.08);\ntimers.push(setTimeout(() => pads[i].classList.remove('lit'), ms));\n}\nfunction clearTimers() { timers.forEach(clearTimeout); timers = []; }\nfunction playSeq() {\naccepting = false;\npos = 0;\nsetStatus(seq.length, 'Watch…');\nconst speed = Math.max(220, 600 - seq.length * 22);\nseq.forEach((p, k) => timers.push(setTimeout(() => light(p, speed * 0.7), 600 + k * speed)));\ntimers.push(setTimeout(() => { accepting = true; setStatus(seq.length, 'Your turn'); }, 600 + seq.length * speed));\n}\nfunction start() {\nclearTimers();\nseq = [randInt(0, 3)];\nplaySeq();\n}\nfunction press(i) {\nif (!accepting) return;\nlight(i, 220);\nif (i !== seq[pos]) {\naccepting = false;\nSound.beep(110, 0.6, 'sawtooth', 0.08);\nconst score = seq.length - 1;\nif (document.getElementById('strict').checked) {\nbest = recordBest('simon-best', score);\ndocument.getElementById('best').textContent = best;\nsetStatus('✖', `Game over · ${score}`);\n} else {\nsetStatus('✖', 'Try again…');\ntimers.push(setTimeout(playSeq, 1200));\n}\nreturn;\n}\npos++;\nif (pos === seq.length) {\naccepting = false;\nbest = recordBest('simon-best', seq.length);\ndocument.getElementById('best').textContent = best;\nsetStatus(seq.length, 'Nice!');\nseq.push(randInt(0, 3));\ntimers.push(setTimeout(playSeq, 900));\n}\n}\npads.forEach(p => p.addEventListener('pointerdown', e => { e.preventDefault(); press(+p.dataset.i); }));\ndocument.getElementById('go').onclick = start;\ndocument.addEventListener('keydown', e => {\nconst i = { q: 0, w: 1, a: 2, s: 3, Q: 0, W: 1, A: 2, S: 3 }[e.key];\nif (i != null) press(i);\nif (e.key === 'Enter') start();\n});\n<\/script>\n<\/body>\n<\/html>",
"reaction-time": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Reaction Time<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<style>\n#pad {\nwidth: min(760px, calc(100vw - 24px));\nheight: min(420px, 60vh);\nborder-radius: 16px;\ndisplay: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;\ntext-align: center; cursor: pointer; user-select: none; -webkit-user-select: none;\ntransition: background .05s; padding: 20px; touch-action: manipulation;\n}\n#pad h2 { font-size: clamp(28px, 6vw, 48px); margin: 0; }\n#pad p { margin: 0; font-size: 18px; opacity: .85; }\n.idle { background: #2563eb; }\n.wait { background: #b91c1c; }\n.go { background: #16a34a; }\n.early { background: #9a3412; }\n.result { background: #1e293b; }\n#history { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 12px; }\n#history span { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-variant-numeric: tabular-nums; }\n<\/style>\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>⚡ Reaction Time<\/h1>\n<div class=\"stats\">Best average <b id=\"best\">—<\/b><\/div>\n<\/header>\n<div id=\"pad\" class=\"idle\"><h2>Reaction Time Test<\/h2><p>When the red box turns green, click as fast as you can.<\/p><p>Click anywhere (or press Space) to begin. 5 attempts.<\/p><\/div>\n<div id=\"history\"><\/div>\n<p class=\"help\">Clicking while it's still red counts as a false start and the attempt restarts. Average human reaction time is around 250 ms.<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst pad = document.getElementById('pad'), hist = document.getElementById('history');\nlet state = 'idle', timer = null, t0 = 0, times = [];\nlet best = Store.get('reaction-best', null);\nconst showBest = () => { document.getElementById('best').textContent = best ? best + ' ms' : '—'; };\nshowBest();\nfunction set(cls, html) { pad.className = cls; pad.innerHTML = html; }\nfunction arm() {\nstate = 'wait';\nset('wait', `<h2>Wait for green…<\/h2><p>Attempt ${times.length + 1} of 5<\/p>`);\ntimer = setTimeout(() => {\nstate = 'go';\nt0 = performance.now();\nset('go', '<h2>CLICK!<\/h2>');\n}, rand(1200, 4000));\n}\nfunction renderHistory() {\nhist.innerHTML = times.map((t, i) => `<span>#${i + 1}: <b>${t}<\/b> ms<\/span>`).join('');\n}\nfunction act() {\nif (state === 'idle' || state === 'result' || state === 'early') {\nif (state === 'result' || state === 'idle') { times = []; renderHistory(); }\nreturn arm();\n}\nif (state === 'wait') {\nclearTimeout(timer);\nstate = 'early';\nSound.beep(150, 0.2, 'sawtooth');\nset('early', '<h2>Too soon!<\/h2><p>Click to try that attempt again.<\/p>');\nreturn;\n}\nif (state === 'go') {\nconst ms = Math.round(performance.now() - t0);\ntimes.push(ms);\nrenderHistory();\nSound.beep(880, 0.06, 'triangle');\nif (times.length >= 5) {\nconst avg = Math.round(times.reduce((a, b) => a + b, 0) / times.length);\nbest = recordBest('reaction-best', avg, true);\nshowBest();\nconst verdict = avg < 200 ? 'Lightning fast! ⚡' : avg < 250 ? 'Great reflexes!' : avg < 320 ? 'Pretty average.' : 'Keep practicing!';\nstate = 'result';\nset('result', `<h2>Average: ${avg} ms<\/h2><p>${verdict}<\/p><p>Fastest ${Math.min(...times)} ms · Slowest ${Math.max(...times)} ms<\/p><p>Click to go again.<\/p>`);\n} else {\nstate = 'between';\nset('result', `<h2>${ms} ms<\/h2><p>Get ready for the next one…<\/p>`);\nsetTimeout(arm, 900);\n}\n}\n}\npad.addEventListener('pointerdown', e => { e.preventDefault(); act(); });\ndocument.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) act(); });\n<\/script>\n<\/body>\n<\/html>",
"aim-trainer": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Aim Trainer<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>🎯 Aim Trainer<\/h1>\n<div class=\"stats\">Targets <b id=\"left\">30<\/b> Accuracy <b id=\"acc\">—<\/b> Best <b id=\"best\">—<\/b><\/div>\n<\/header>\n<div class=\"controls\">\n<select id=\"mode\">\n<option value=\"static\">Classic · 30 targets<\/option>\n<option value=\"shrink\">Shrinking targets<\/option>\n<option value=\"moving\">Moving targets<\/option>\n<\/select>\n<\/div>\n<div class=\"stage\">\n<canvas id=\"c\" class=\"game\" width=\"800\" height=\"480\" style=\"cursor:crosshair\"><\/canvas>\n<div class=\"overlay\" id=\"ov\"><\/div>\n<\/div>\n<p class=\"help\">Click each target as fast as possible. Misses lower your accuracy. Your score is the average time per target (lower is better), with a penalty for misses.<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov');\nconst W = cv.width, H = cv.height, TOTAL = 30;\nlet target, hits, shots, startT, lastHit, state = 'ready', last = 0, mode, marks = [], splits = [];\nfunction bestKey() { return 'aim-best-' + document.getElementById('mode').value; }\nfunction showBest() { const b = Store.get(bestKey(), null); document.getElementById('best').textContent = b ? b + ' ms' : '—'; }\nshowBest();\nfunction newTarget() {\nconst r = mode === 'shrink' ? 34 : 26;\ntarget = { x: rand(r + 10, W - r - 10), y: rand(r + 10, H - r - 10), r, born: performance.now(), vx: 0, vy: 0 };\nif (mode === 'moving') { const a = rand(0, 7), sp = rand(1.5, 3.5); target.vx = Math.cos(a) * sp; target.vy = Math.sin(a) * sp; }\n}\nfunction start() {\nmode = document.getElementById('mode').value;\nhits = 0; shots = 0; marks = []; splits = [];\nnewTarget();\nstartT = lastHit = performance.now();\nstate = 'play';\noverlay(ov, null);\nhud();\n}\nfunction hud() {\ndocument.getElementById('left').textContent = TOTAL - hits;\ndocument.getElementById('acc').textContent = shots ? Math.round(hits / shots * 100) + '%' : '—';\n}\nfunction finish() {\nstate = 'over';\nconst total = performance.now() - startT;\nconst acc = hits / shots;\nconst avg = Math.round(total / TOTAL);\nconst score = Math.round(avg / Math.max(acc, 0.3));\nconst best = recordBest(bestKey(), score, true);\nshowBest();\noverlay(ov, `<h2>${score} ms<\/h2><p>Average ${avg} ms per target · Accuracy ${Math.round(acc * 100)}%<\/p><p>Fastest ${Math.min(...splits)} ms · Best score ${best} ms<\/p><button class=\"btn\" onclick=\"start()\">Again<\/button>`);\n}\nfunction shoot(e) {\nif (state !== 'play') return;\nconst p = canvasPoint(cv, e);\nshots++;\nconst now = performance.now();\nif (Math.hypot(p.x - target.x, p.y - target.y) <= target.r) {\nhits++;\nsplits.push(Math.round(now - lastHit));\nlastHit = now;\nmarks.push({ x: target.x, y: target.y, t: 300, hit: true });\nSound.beep(900, 0.04, 'square', 0.03);\nif (hits >= TOTAL) { hud(); return finish(); }\nnewTarget();\n} else {\nmarks.push({ x: p.x, y: p.y, t: 400, hit: false });\nSound.beep(200, 0.05, 'square', 0.03);\n}\nhud();\n}\nfunction update(dt) {\nconst f = dt / 16.67;\nif (mode === 'moving') {\ntarget.x += target.vx * f; target.y += target.vy * f;\nif (target.x < target.r || target.x > W - target.r) target.vx *= -1;\nif (target.y < target.r || target.y > H - target.r) target.vy *= -1;\n}\nif (mode === 'shrink') {\nconst age = performance.now() - target.born;\ntarget.r = 34 * (1 - age / 1600);\nif (target.r <= 3) { shots++; marks.push({ x: target.x, y: target.y, t: 400, hit: false }); newTarget(); hud(); }\n}\nmarks.forEach(m => { m.t -= dt; });\nmarks = marks.filter(m => m.t > 0);\n}\nfunction draw() {\nctx.fillStyle = '#0b1020';\nctx.fillRect(0, 0, W, H);\nctx.strokeStyle = '#141a33';\nfor (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }\nfor (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }\nif (state === 'play' && target) {\nconst { x, y, r } = target;\n[['#ef4444', 1], ['#fff', 0.7], ['#ef4444', 0.42], ['#fff', 0.16]].forEach(([c, k]) => {\nctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r * k), 0, 7); ctx.fill();\n});\n}\nmarks.forEach(m => {\nctx.globalAlpha = m.t / 400;\nif (m.hit) { ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(m.x, m.y, 30 + (300 - m.t) / 6, 0, 7); ctx.stroke(); }\nelse { ctx.strokeStyle = '#f87171'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(m.x - 6, m.y - 6); ctx.lineTo(m.x + 6, m.y + 6); ctx.moveTo(m.x + 6, m.y - 6); ctx.lineTo(m.x - 6, m.y + 6); ctx.stroke(); }\n});\nctx.globalAlpha = 1;\n}\nfunction loop(t) {\nconst dt = Math.min(40, t - last);\nlast = t;\nif (state === 'play') update(dt);\ndraw();\nrequestAnimationFrame(loop);\n}\ncv.addEventListener('pointerdown', e => { e.preventDefault(); shoot(e); });\ndocument.getElementById('mode').onchange = () => { showBest(); state = 'ready'; overlay(ov, '<h2>Aim Trainer<\/h2><button class=\"btn\" onclick=\"start()\">Start<\/button>'); };\ndocument.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && state !== 'play') start(); });\noverlay(ov, '<h2>Aim Trainer<\/h2><p>Hit 30 targets as quickly and accurately as you can.<\/p><button class=\"btn\" onclick=\"start()\">Start<\/button>');\nrequestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>",
"typing-rush": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Typing Rush<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<style>\n#typed {\nwidth: min(400px, calc(100vw - 24px)); font-size: 22px; padding: 10px 14px; border-radius: 10px;\nborder: 2px solid var(--line); background: var(--panel); color: var(--fg); text-align: center; outline: none;\n}\n#typed:focus { border-color: var(--accent); }\n#typed.bad { border-color: var(--bad); }\n<\/style>\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>⌨️ Typing Rush<\/h1>\n<div class=\"stats\">Score <b id=\"score\">0<\/b> Lives <b id=\"lives\">5<\/b> WPM <b id=\"wpm\">0<\/b> Best <b id=\"best\">0<\/b><\/div>\n<\/header>\n<div class=\"stage\">\n<canvas id=\"c\" class=\"game\" width=\"760\" height=\"460\"><\/canvas>\n<div class=\"overlay\" id=\"ov\"><\/div>\n<\/div>\n<input id=\"typed\" autocomplete=\"off\" autocapitalize=\"off\" autocorrect=\"off\" spellcheck=\"false\" placeholder=\"type here…\">\n<p class=\"help\">Type the falling words before they hit the ground. Words that match what you've typed so far light up. <kbd>Esc<\/kbd> clears your input.<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov'), input = document.getElementById('typed');\nconst W = cv.width, H = cv.height;\nconst WORDS = ('time year people way day man thing woman life child world school state family student group country problem hand part place case week company system program question work government number night point home water room mother area money story fact month lot right study book eye job word business issue side kind head house service friend father power hour game line end member law car city community name president team minute idea kid body information back parent face others level office door health person art war history party result change morning reason research girl guy moment air teacher force education foot boy age policy music market sense nation plan college interest death experience effect class control care field development role effort rate heart drug show leader light voice wife police mind price report decision son view relationship town road arm difference value building action model season society tax director position player record paper space ground form event official matter center couple site project activity star table need court oil situation cost industry figure street image phone data picture practice piece land product doctor wall patient worker news test movie north love support technology step baby computer type attention film tree source organization hair window evidence population site chance amazing rocket keyboard galaxy dragon puzzle wizard castle thunder planet jungle volcano pirate penguin balloon whisper mystery crystal lantern harbor meadow blizzard compass voyage tornado').split(' ');\nlet words, score, lives, typedChars, startT, spawnT, level, parts, state = 'ready', last = 0;\nlet best = Store.get('typing-best', 0);\nfunction hud() {\ndocument.getElementById('score').textContent = score;\ndocument.getElementById('lives').textContent = lives;\nconst mins = (performance.now() - startT) / 60000;\ndocument.getElementById('wpm').textContent = state === 'play' && mins > 0.05 ? Math.round(typedChars / 5 / mins) : document.getElementById('wpm').textContent;\ndocument.getElementById('best').textContent = best;\n}\nfunction start() {\nwords = []; parts = [];\nscore = 0; lives = 5; typedChars = 0; level = 1; spawnT = 0;\nstartT = performance.now();\nstate = 'play';\ninput.value = '';\ninput.focus();\noverlay(ov, null);\nhud();\n}\nfunction spawn() {\nconst maxLen = 4 + Math.min(level, 6);\nconst pool = WORDS.filter(w => w.length <= maxLen && !words.some(o => o.text === w));\nconst text = pick(pool);\nctx.font = 'bold 20px ui-monospace, monospace';\nconst w = ctx.measureText(text).width;\nwords.push({ text, x: rand(10, W - w - 10), y: -10, speed: rand(18, 30) + level * 6, w });\n}\nfunction update(dt) {\nconst s = dt / 1000;\nlevel = 1 + Math.floor(score / 150);\nspawnT -= dt;\nif (spawnT <= 0) { spawn(); spawnT = Math.max(600, 2300 - level * 170) * rand(0.7, 1.2); }\nfor (const w of words) {\nw.y += w.speed * s;\nif (w.y > H - 8) {\nw.dead = true;\nlives--;\nSound.beep(140, 0.25, 'sawtooth');\nfor (let i = 0; i < 12; i++) parts.push({ x: w.x + w.w / 2, y: H - 10, vx: rand(-90, 90), vy: rand(-160, -40), life: 600, c: '#ef4444' });\n}\n}\nwords = words.filter(w => !w.dead);\nparts.forEach(p => { p.x += p.vx * s; p.y += p.vy * s; p.vy += 300 * s; p.life -= dt; });\nparts = parts.filter(p => p.life > 0);\nhud();\nif (lives <= 0) {\nstate = 'over';\nbest = recordBest('typing-best', score);\nhud();\noverlay(ov, `<h2>Game over<\/h2><p>Score ${score} · ${document.getElementById('wpm').textContent} WPM<\/p><button class=\"btn\" onclick=\"start()\">Play again<\/button>`);\n}\n}\nfunction checkInput() {\nconst v = input.value.trim().toLowerCase();\nif (state !== 'play') return;\nconst hit = words.find(w => w.text === v);\nif (hit) {\nhit.dead = true;\nscore += hit.text.length * 5;\ntypedChars += hit.text.length + 1;\nfor (let i = 0; i < 16; i++) parts.push({ x: hit.x + hit.w / 2, y: hit.y, vx: rand(-120, 120), vy: rand(-120, 60), life: 500, c: '#22d3ee' });\nwords = words.filter(w => !w.dead);\ninput.value = '';\nSound.beep(700 + hit.text.length * 40, 0.06, 'triangle');\n}\ninput.classList.toggle('bad', v.length > 0 && !words.some(w => w.text.startsWith(v)));\n}\nfunction draw() {\nconst g = ctx.createLinearGradient(0, 0, 0, H);\ng.addColorStop(0, '#0b1020'); g.addColorStop(1, '#1e1b4b');\nctx.fillStyle = g;\nctx.fillRect(0, 0, W, H);\nctx.fillStyle = '#ef4444';\nctx.fillRect(0, H - 4, W, 4);\nif (!words) return;\nconst v = input.value.trim().toLowerCase();\nctx.font = 'bold 20px ui-monospace, monospace';\nctx.textBaseline = 'middle';\nfor (const w of words) {\nconst match = v && w.text.startsWith(v);\nctx.fillStyle = match ? 'rgba(34,211,238,.18)' : 'rgba(255,255,255,.06)';\nctx.beginPath(); ctx.roundRect(w.x - 6, w.y - 14, w.w + 12, 28, 6); ctx.fill();\nctx.fillStyle = '#e6e7f2';\nctx.fillText(w.text, w.x, w.y);\nif (match) { ctx.fillStyle = '#22d3ee'; ctx.fillText(w.text.slice(0, v.length), w.x, w.y); }\n}\nparts.forEach(p => { ctx.globalAlpha = p.life / 600; ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, 3, 3); });\nctx.globalAlpha = 1;\nctx.textBaseline = 'alphabetic';\nctx.fillStyle = '#9097b8';\nctx.font = '13px system-ui';\nctx.fillText('Level ' + level, 10, 20);\n}\nfunction loop(t) {\nconst dt = Math.min(50, t - last);\nlast = t;\nif (state === 'play') update(dt);\ndraw();\nrequestAnimationFrame(loop);\n}\ninput.addEventListener('input', checkInput);\ninput.addEventListener('keydown', e => {\nif (e.key === 'Escape') { input.value = ''; checkInput(); }\nif (e.key === 'Enter' && state !== 'play') start();\n});\ncv.addEventListener('pointerdown', () => input.focus());\nscore = 0; lives = 5; level = 1;\nhud();\noverlay(ov, '<h2>Typing Rush<\/h2><p>Type fast to stop the words from landing.<\/p><button class=\"btn\" onclick=\"start()\">Start<\/button>');\nrequestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>",
"piano-tiles": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Piano Tiles<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>🎹 Piano Tiles<\/h1>\n<div class=\"stats\">Score <b id=\"score\">0<\/b> Best <b id=\"best\">0<\/b><\/div>\n<\/header>\n<div class=\"stage\">\n<canvas id=\"c\" class=\"game\" width=\"400\" height=\"620\"><\/canvas>\n<div class=\"overlay\" id=\"ov\"><\/div>\n<\/div>\n<p class=\"help\">Tap only the black tiles, from the bottom up. Keyboard: <kbd>D<\/kbd> <kbd>F<\/kbd> <kbd>J<\/kbd> <kbd>K<\/kbd> for the four columns. Don't touch the white and don't let a black tile slip past!<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov');\nconst W = cv.width, H = cv.height, COLS = 4, CW = W / COLS, RH = 155;\nconst MELODY = [330, 330, 349, 392, 392, 349, 330, 294, 262, 262, 294, 330, 330, 294, 294, 330, 330, 349, 392, 392, 349, 330, 294, 262, 262, 294, 330, 294, 262, 262];\nlet rows, speed, score, state = 'ready', last = 0, wrong = null, flashT = 0;\nlet best = Store.get('piano-best', 0);\ndocument.getElementById('best').textContent = best;\nfunction reset() {\nrows = [];\nfor (let i = 0; i < 6; i++) rows.push({ col: randInt(0, 3), y: H - RH * (i + 1) - 10, hit: false, start: i === 0 });\nspeed = 0;\nscore = 0;\nwrong = null;\ndocument.getElementById('score').textContent = 0;\n}\nfunction lowest() {\nlet r = null;\nfor (const row of rows) if (!row.hit && (!r || row.y > r.y)) r = row;\nreturn r;\n}\nfunction fail(col, y, msg) {\nstate = 'over';\nwrong = { col, y };\nflashT = 0;\nSound.beep(110, 0.5, 'sawtooth', 0.06);\nbest = recordBest('piano-best', score);\ndocument.getElementById('best').textContent = best;\nsetTimeout(() => overlay(ov, `<h2>${msg}<\/h2><p>Score ${score} · Best ${best}<\/p><button class=\"btn\" onclick=\"restart()\">Play again<\/button>`), 700);\n}\nfunction tap(col, y) {\nif (state === 'over') return;\nconst r = lowest();\nif (!r) return;\nif (col === r.col) {\nr.hit = true;\nif (state === 'ready') { state = 'play'; speed = 280; }\nscore++;\nspeed += 5;\ndocument.getElementById('score').textContent = score;\nSound.beep(MELODY[(score - 1) % MELODY.length], 0.25, 'triangle', 0.09);\n} else if (y == null || y > r.y - RH * 1.5) {\nfail(col, y == null ? r.y : r.y + Math.floor((y - r.y) / RH) * RH, 'Wrong tile!');\n}\n}\nfunction update(dt) {\nconst s = dt / 1000;\nrows.forEach(r => { r.y += speed * s; });\nconst top = Math.min(...rows.map(r => r.y));\nif (top > -RH) rows.push({ col: randInt(0, 3), y: top - RH, hit: false });\nconst miss = rows.find(r => !r.hit && r.y > H);\nif (miss) {\nconst back = miss.y - (H - RH - 10);\nrows.forEach(r => { r.y -= back; });\nfail(miss.col, miss.y, 'Missed one!');\nreturn;\n}\nrows = rows.filter(r => r.y < H + RH);\n}\nfunction draw() {\nctx.fillStyle = '#f8fafc';\nctx.fillRect(0, 0, W, H);\nctx.strokeStyle = '#cbd5e1';\nfor (let c = 1; c < COLS; c++) { ctx.beginPath(); ctx.moveTo(c * CW, 0); ctx.lineTo(c * CW, H); ctx.stroke(); }\nfor (const r of rows) {\nctx.fillStyle = r.hit ? '#cbd5e1' : '#0f172a';\nctx.fillRect(r.col * CW + 1, r.y + 1, CW - 2, RH - 2);\nif (r.start && !r.hit) {\nctx.fillStyle = '#fff';\nctx.font = 'bold 20px system-ui';\nctx.textAlign = 'center';\nctx.fillText('START', r.col * CW + CW / 2, r.y + RH / 2 + 7);\n}\n}\nif (wrong) {\nflashT += 16;\nif (Math.floor(flashT / 120) % 2 === 0) { ctx.fillStyle = '#ef4444'; ctx.fillRect(wrong.col * CW + 1, wrong.y + 1, CW - 2, RH - 2); }\n}\nctx.fillStyle = 'rgba(239,68,68,.9)';\nctx.font = 'bold 40px system-ui';\nctx.textAlign = 'center';\nif (state !== 'ready') ctx.fillText(score, W / 2, 50);\n}\nfunction loop(t) {\nconst dt = Math.min(40, t - last);\nlast = t;\nif (state === 'play') update(dt);\ndraw();\nrequestAnimationFrame(loop);\n}\nfunction restart() { reset(); state = 'ready'; overlay(ov, null); }\ncv.addEventListener('pointerdown', e => {\ne.preventDefault();\nconst p = canvasPoint(cv, e);\ntap(clamp(Math.floor(p.x / CW), 0, 3), p.y);\n});\ndocument.addEventListener('keydown', e => {\nif (e.repeat) return;\nconst col = { d: 0, f: 1, j: 2, k: 3, D: 0, F: 1, J: 2, K: 3 }[e.key];\nif (col != null) tap(col, null);\nif ((e.key === ' ' || e.key === 'Enter') && state === 'over') restart();\n});\nreset();\nrequestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>",
"color-match": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Color Match<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<style>\n.game-area { width: min(480px, calc(100vw - 24px)); display: flex; flex-direction: column; gap: 14px; align-items: center; position: relative; padding: 16px 0; }\n.card { width: 100%; background: #f8fafc; color: #000; border-radius: 14px; padding: 24px; text-align: center; font-size: clamp(36px, 10vw, 56px); font-weight: 900; letter-spacing: 2px; box-shadow: 0 8px 30px rgba(0,0,0,.4); }\n.label { color: var(--muted); font-size: 14px; margin-bottom: -8px; }\n.answers { display: flex; gap: 14px; width: 100%; }\n.answers button { flex: 1; font-size: 22px; padding: 16px; border-radius: 12px; border: 0; cursor: pointer; font-weight: 800; color: #fff; }\n#no { background: #dc2626; }\n#yes { background: #16a34a; }\n.feedback { height: 6px; width: 100%; border-radius: 3px; background: var(--panel-2); overflow: hidden; }\n.feedback div { height: 100%; width: 100%; }\n.flash-good .card { outline: 4px solid var(--good); }\n.flash-bad .card { outline: 4px solid var(--bad); }\n<\/style>\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>🎨 Color Match<\/h1>\n<div class=\"stats\">Score <b id=\"score\">0<\/b> Time <b id=\"time\">45<\/b> Best <b id=\"best\">0<\/b><\/div>\n<\/header>\n<div class=\"stage\">\n<div class=\"game-area\" id=\"area\">\n<div class=\"label\">MEANING<\/div>\n<div class=\"card\" id=\"top\">RED<\/div>\n<div class=\"label\">INK COLOUR<\/div>\n<div class=\"card\" id=\"bottom\">BLUE<\/div>\n<div class=\"feedback\"><div id=\"bar\"><\/div><\/div>\n<div class=\"answers\"><button id=\"no\">✗ No<\/button><button id=\"yes\">✓ Yes<\/button><\/div>\n<\/div>\n<div class=\"overlay\" id=\"ov\"><\/div>\n<\/div>\n<p class=\"help\">Does the <b>meaning<\/b> of the top word match the <b>ink colour<\/b> of the bottom word? Answer with the buttons or <kbd>←<\/kbd> No / <kbd>→<\/kbd> Yes. Streaks multiply your points. 45 seconds.<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst COLORS = { RED: '#dc2626', BLUE: '#2563eb', GREEN: '#16a34a', BLACK: '#111827', YELLOW: '#ca8a04', PURPLE: '#9333ea' };\nconst NAMES = Object.keys(COLORS);\nconst ROUND = 45000, ov = document.getElementById('ov'), area = document.getElementById('area');\nlet answer, score, streak, correct, total, timeLeft, state = 'ready', last = 0, flashTimer;\nlet best = Store.get('colormatch-best', 0);\ndocument.getElementById('best').textContent = best;\nfunction next() {\nconst match = Math.random() < 0.5;\nconst meaning = pick(NAMES);\nconst ink = match ? meaning : pick(NAMES.filter(n => n !== meaning));\nconst topEl = document.getElementById('top'), botEl = document.getElementById('bottom');\ntopEl.textContent = meaning;\ntopEl.style.color = '#111827';\nbotEl.textContent = pick(NAMES);\nbotEl.style.color = COLORS[ink];\nanswer = match;\n}\nfunction start() {\nscore = 0; streak = 0; correct = 0; total = 0; timeLeft = ROUND;\nstate = 'play';\nnext();\noverlay(ov, null);\nhud();\n}\nfunction hud() {\ndocument.getElementById('score').textContent = score;\ndocument.getElementById('time').textContent = Math.ceil(timeLeft / 1000);\nconst mult = Math.min(1 + Math.floor(streak / 5), 5);\nconst bar = document.getElementById('bar');\nbar.style.width = ((streak % 5) / 5 * 100 || (streak ? 100 : 0)) + '%';\nbar.style.background = ['#64748b', '#22c55e', '#22d3ee', '#a855f7', '#f59e0b'][mult - 1];\n}\nfunction respond(yes) {\nif (state !== 'play') return;\ntotal++;\nclearTimeout(flashTimer);\narea.classList.remove('flash-good', 'flash-bad');\nif (yes === answer) {\ncorrect++;\nstreak++;\nscore += 10 * Math.min(1 + Math.floor((streak - 1) / 5), 5);\narea.classList.add('flash-good');\nSound.beep(760, 0.05, 'triangle');\n} else {\nstreak = 0;\narea.classList.add('flash-bad');\nSound.beep(160, 0.15, 'sawtooth');\n}\nflashTimer = setTimeout(() => area.classList.remove('flash-good', 'flash-bad'), 180);\nnext();\nhud();\n}\nfunction loop(t) {\nconst dt = Math.min(50, t - last);\nlast = t;\nif (state === 'play') {\ntimeLeft -= dt;\nif (timeLeft <= 0) {\ntimeLeft = 0;\nstate = 'over';\nbest = recordBest('colormatch-best', score);\ndocument.getElementById('best').textContent = best;\nconst acc = total ? Math.round(correct / total * 100) : 0;\noverlay(ov, `<h2>Time's up!<\/h2><p>Score ${score} · ${correct}/${total} correct (${acc}%)<\/p><p>Best ${best}<\/p><button class=\"btn\" onclick=\"start()\">Play again<\/button>`);\n}\nhud();\n}\nrequestAnimationFrame(loop);\n}\ndocument.getElementById('yes').onclick = () => respond(true);\ndocument.getElementById('no').onclick = () => respond(false);\ndocument.addEventListener('keydown', e => {\nif (e.key === 'ArrowRight') respond(true);\nif (e.key === 'ArrowLeft') respond(false);\nif ((e.key === ' ' || e.key === 'Enter') && state !== 'play') start();\n});\noverlay(ov, '<h2>Color Match<\/h2><p>Train your focus: ignore what the bottom word says, look at its colour.<\/p><button class=\"btn\" onclick=\"start()\">Start<\/button>');\nrequestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>",
"quick-math": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Quick Math<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<style>\n.area { width: min(480px, calc(100vw - 24px)); display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 28px 16px; position: relative; }\n#problem { font-size: clamp(40px, 12vw, 72px); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 1px; }\n#answer { font-size: 32px; width: 220px; text-align: center; padding: 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); color: var(--fg); outline: none; }\n#answer:focus { border-color: var(--accent); }\n.pad { display: grid; grid-template-columns: repeat(3, 72px); gap: 8px; }\n.pad button { height: 56px; font-size: 22px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); cursor: pointer; }\n@media (pointer: fine) { .pad { display: none; } }\n.good { color: var(--good); } .bad { color: var(--bad); }\n<\/style>\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>➗ Quick Math<\/h1>\n<div class=\"stats\">Score <b id=\"score\">0<\/b> Time <b id=\"time\">60<\/b> Best <b id=\"best\">0<\/b><\/div>\n<\/header>\n<div class=\"stage\">\n<div class=\"panel area\">\n<div id=\"problem\">7 × 8<\/div>\n<input id=\"answer\" inputmode=\"numeric\" autocomplete=\"off\" placeholder=\"?\">\n<div class=\"msg\" id=\"msg\"><\/div>\n<div class=\"pad\" id=\"pad\"><\/div>\n<button class=\"btn alt\" id=\"skip\">Skip (−1)<\/button>\n<\/div>\n<div class=\"overlay\" id=\"ov\"><\/div>\n<\/div>\n<p class=\"help\">Solve as many problems as you can in 60 seconds. The answer is accepted as soon as you type it. Problems get harder as your score climbs.<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst ov = document.getElementById('ov'), input = document.getElementById('answer'), msg = document.getElementById('msg');\nlet answer, score, timeLeft, solved, state = 'ready', last = 0;\nlet best = Store.get('quickmath-best', 0);\ndocument.getElementById('best').textContent = best;\nconst pad = document.getElementById('pad');\n['7', '8', '9', '4', '5', '6', '1', '2', '3', '−', '0', '⌫'].forEach(k => {\nconst b = document.createElement('button');\nb.textContent = k;\nb.onclick = () => {\nif (k === '⌫') input.value = input.value.slice(0, -1);\nelse if (k === '−') input.value = input.value.startsWith('-') ? input.value.slice(1) : '-' + input.value;\nelse input.value += k;\ncheck();\n};\npad.appendChild(b);\n});\nfunction makeProblem() {\nconst lvl = Math.min(Math.floor(score / 8), 5);\nconst ops = lvl === 0 ? ['+', '-'] : lvl < 2 ? ['+', '-', '×'] : ['+', '-', '×', '÷'];\nconst op = pick(ops);\nconst hi = [10, 20, 50, 100, 200, 500][lvl];\nlet a, b;\nif (op === '+') { a = randInt(1, hi); b = randInt(1, hi); answer = a + b; }\nelse if (op === '-') { a = randInt(1, hi); b = randInt(1, hi); if (lvl < 2 && b > a) [a, b] = [b, a]; answer = a - b; }\nelse if (op === '×') { const m = [10, 10, 12, 15, 20, 25][lvl]; a = randInt(2, m); b = randInt(2, m); answer = a * b; }\nelse { const m = [10, 10, 12, 15, 20, 25][lvl]; b = randInt(2, m); answer = randInt(2, m); a = answer * b; }\ndocument.getElementById('problem').textContent = `${a} ${op === '-' ? '−' : op} ${b}`;\ninput.value = '';\n}\nfunction start() {\nscore = 0; solved = 0; timeLeft = 60000;\nstate = 'play';\nmsg.textContent = '';\nmakeProblem();\noverlay(ov, null);\ninput.focus();\nhud();\n}\nfunction hud() {\ndocument.getElementById('score').textContent = score;\ndocument.getElementById('time').textContent = Math.ceil(timeLeft / 1000);\n}\nfunction check() {\nif (state !== 'play') return;\nconst v = input.value.trim().replace('−', '-');\nif (v !== '' && v !== '-' && Number(v) === answer) {\nscore++;\nsolved++;\nmsg.textContent = pick(['Nice!', 'Correct!', 'Yes!', 'Great!', '✓']);\nmsg.className = 'msg good';\nSound.beep(880, 0.05, 'triangle');\nmakeProblem();\nhud();\n}\n}\ninput.addEventListener('input', check);\ninput.addEventListener('keydown', e => {\nif (e.key === 'Enter') {\nif (state !== 'play') return start();\nif (input.value.trim() !== '') { msg.textContent = `Not quite`; msg.className = 'msg bad'; Sound.beep(160, 0.12, 'sawtooth'); input.select(); }\n}\n});\ndocument.getElementById('skip').onclick = () => {\nif (state !== 'play') return;\nscore = Math.max(0, score - 1);\nmsg.textContent = `It was ${answer}`;\nmsg.className = 'msg bad';\nmakeProblem();\nhud();\ninput.focus();\n};\nfunction loop(t) {\nconst dt = Math.min(50, t - last);\nlast = t;\nif (state === 'play') {\ntimeLeft -= dt;\nif (timeLeft <= 0) {\ntimeLeft = 0;\nstate = 'over';\nbest = recordBest('quickmath-best', score);\ndocument.getElementById('best').textContent = best;\noverlay(ov, `<h2>Time's up!<\/h2><p>You solved ${solved} problems · Score ${score}<\/p><p>Best ${best}<\/p><button class=\"btn\" onclick=\"start()\">Play again<\/button>`);\n}\nhud();\n}\nrequestAnimationFrame(loop);\n}\noverlay(ov, '<h2>Quick Math<\/h2><p>60 seconds of mental arithmetic.<\/p><button class=\"btn\" onclick=\"start()\">Start<\/button>');\nrequestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>",
"gem-clicker": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Gem Clicker<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<style>\n.wrap { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; width: min(900px, calc(100vw - 24px)); align-items: flex-start; }\n.left { flex: 1 1 320px; display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; }\n#count { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }\n#rate { color: var(--muted); }\n#gem {\nfont-size: 150px; background: radial-gradient(circle, rgba(139,92,246,.35), transparent 65%); border: 0; cursor: pointer;\nwidth: 260px; height: 260px; border-radius: 50%; transition: transform .06s; user-select: none; -webkit-user-select: none; touch-action: manipulation;\nanimation: float 3s ease-in-out infinite;\n}\n#gem:active { transform: scale(.92); }\n@keyframes float { 50% { translate: 0 -8px; } }\n.float { position: absolute; pointer-events: none; font-weight: 800; color: #e9d5ff; animation: up 1s ease-out forwards; }\n@keyframes up { to { transform: translateY(-80px); opacity: 0; } }\n.shop { flex: 1 1 320px; display: flex; flex-direction: column; gap: 8px; }\n.item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; text-align: left; color: var(--fg); width: 100%; }\n.item:disabled { opacity: .45; cursor: default; }\n.item .ic { font-size: 30px; }\n.item .info { flex: 1; }\n.item .name { font-weight: 700; }\n.item .desc { font-size: 12px; color: var(--muted); }\n.item .own { font-size: 24px; font-weight: 800; color: var(--muted); }\n.item .cost { font-size: 13px; color: #c4b5fd; }\nh3 { margin: 6px 0; }\n<\/style>\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>💎 Gem Clicker<\/h1>\n<div class=\"stats\">All-time <b id=\"total\">0<\/b><\/div>\n<\/header>\n<div class=\"wrap\">\n<div class=\"left\">\n<div id=\"count\">0 gems<\/div>\n<div id=\"rate\">0 per second<\/div>\n<button id=\"gem\" aria-label=\"Mine a gem\">💎<\/button>\n<div class=\"help\" id=\"clickinfo\"><\/div>\n<button class=\"btn alt\" id=\"reset\">Reset progress<\/button>\n<\/div>\n<div class=\"shop\">\n<h3>Shop<\/h3>\n<div id=\"items\"><\/div>\n<\/div>\n<\/div>\n<p class=\"help\">Click the gem to mine. Spend gems on upgrades that mine for you — progress is saved in your browser and keeps growing (at half speed) while you're away.<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst ITEMS = [\n{ id: 'pick', name: 'Better Pickaxe', icon: '⛏️', base: 15, click: 1, desc: '+1 gem per click' },\n{ id: 'miner', name: 'Miner', icon: '👷', base: 25, rate: 0.3, desc: '+0.3 gems / sec' },\n{ id: 'cart', name: 'Mine Cart', icon: '🛒', base: 120, rate: 1.5, desc: '+1.5 gems / sec' },\n{ id: 'drill', name: 'Power Drill', icon: '🔩', base: 900, rate: 9, desc: '+9 gems / sec' },\n{ id: 'dyn', name: 'Dynamite Crew', icon: '🧨', base: 6500, rate: 55, desc: '+55 gems / sec' },\n{ id: 'dig', name: 'Excavator', icon: '🚜', base: 45000, rate: 320, desc: '+320 gems / sec' },\n{ id: 'gloves', name: 'Golden Gloves', icon: '🧤', base: 60000, click: 50, desc: '+50 gems per click' },\n{ id: 'lab', name: 'Crystal Lab', icon: '🧪', base: 350000, rate: 1900, desc: '+1,900 gems / sec' },\n{ id: 'portal', name: 'Gem Portal', icon: '🌀', base: 3e6, rate: 12000, desc: '+12,000 gems / sec' },\n{ id: 'moon', name: 'Moon Mine', icon: '🌕', base: 4e7, rate: 90000, desc: '+90,000 gems / sec' }\n];\nconst fresh = () => ({ gems: 0, total: 0, owned: {}, saved: Date.now() });\nlet S = Store.get('clicker-save', null) || fresh();\nS.owned = S.owned || {};\nfunction fmt(n) {\nif (n < 1000) return n < 10 && n % 1 ? n.toFixed(1) : Math.floor(n).toLocaleString();\nconst u = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi'];\nconst e = Math.min(Math.floor(Math.log10(n) / 3), u.length - 1);\nreturn (n / 10 ** (e * 3)).toFixed(2) + u[e];\n}\nconst owned = id => S.owned[id] || 0;\nconst cost = it => Math.ceil(it.base * Math.pow(1.15, owned(it.id)));\nconst perClick = () => 1 + ITEMS.reduce((s, it) => s + (it.click || 0) * owned(it.id), 0);\nconst perSec = () => ITEMS.reduce((s, it) => s + (it.rate || 0) * owned(it.id), 0);\nconst away = Math.min((Date.now() - (S.saved || Date.now())) / 1000, 8 * 3600);\nif (away > 5 && perSec() > 0) {\nconst earned = perSec() * away * 0.5;\nS.gems += earned;\nS.total += earned;\nsetTimeout(() => float(document.getElementById('gem'), `+${fmt(earned)} while away`), 400);\n}\nconst list = document.getElementById('items');\nITEMS.forEach(it => {\nconst b = document.createElement('button');\nb.className = 'item';\nb.innerHTML = `<span class=\"ic\">${it.icon}<\/span><span class=\"info\"><div class=\"name\">${it.name}<\/div><div class=\"desc\">${it.desc}<\/div><div class=\"cost\"><\/div><\/span><span class=\"own\"><\/span>`;\nb.onclick = () => {\nconst c = cost(it);\nif (S.gems < c) return;\nS.gems -= c;\nS.owned[it.id] = owned(it.id) + 1;\nSound.beep(660, 0.06, 'triangle');\nrender();\n};\nit.el = b;\nlist.appendChild(b);\n});\nfunction float(el, text) {\nconst f = document.createElement('div');\nf.className = 'float';\nf.textContent = text;\nconst left = el.parentElement;\nf.style.left = (el.offsetLeft + el.offsetWidth / 2 - 20 + rand(-40, 40)) + 'px';\nf.style.top = (el.offsetTop + 60 + rand(-20, 20)) + 'px';\nleft.appendChild(f);\nsetTimeout(() => f.remove(), 1000);\n}\nfunction render() {\ndocument.getElementById('count').textContent = fmt(S.gems) + ' gems';\ndocument.getElementById('rate').textContent = fmt(perSec()) + ' per second';\ndocument.getElementById('total').textContent = fmt(S.total);\ndocument.getElementById('clickinfo').textContent = `${fmt(perClick())} per click`;\nITEMS.forEach((it, i) => {\nconst visible = i === 0 || owned(ITEMS[i - 1].id) > 0 || S.total >= it.base * 0.5;\nit.el.style.display = visible ? '' : 'none';\nit.el.disabled = S.gems < cost(it);\nit.el.querySelector('.cost').textContent = '💎 ' + fmt(cost(it));\nit.el.querySelector('.own').textContent = owned(it.id) || '';\n});\n}\ndocument.getElementById('gem').addEventListener('click', e => {\nconst n = perClick();\nS.gems += n;\nS.total += n;\nfloat(e.currentTarget, '+' + fmt(n));\nSound.beep(rand(900, 1200), 0.03, 'square', 0.02);\nrender();\n});\ndocument.getElementById('reset').onclick = () => {\nif (!confirm('Erase all progress?')) return;\nS = fresh();\nStore.set('clicker-save', S);\nrender();\n};\nlet last = performance.now(), saveT = 0, renderT = 0;\nfunction loop(t) {\nconst dt = Math.min(1000, t - last) / 1000;\nlast = t;\nconst g = perSec() * dt;\nS.gems += g;\nS.total += g;\nsaveT += dt;\nrenderT += dt;\nif (renderT > 0.1) { renderT = 0; render(); }\nif (saveT > 3) { saveT = 0; S.saved = Date.now(); Store.set('clicker-save', S); }\nrequestAnimationFrame(loop);\n}\nwindow.addEventListener('beforeunload', () => { S.saved = Date.now(); Store.set('clicker-save', S); });\nrender();\nrequestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>",
"2048": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>2048<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<style>\n#board {\n--size: min(460px, calc(100vw - 24px));\n--gap: calc(var(--size) * 0.03);\n--cell: calc((var(--size) - 5 * var(--gap)) / 4);\nwidth: var(--size); height: var(--size);\nbackground: #3b3552; border-radius: 12px; position: relative; touch-action: none; user-select: none; -webkit-user-select: none;\n}\n.slot, .tile { position: absolute; width: var(--cell); height: var(--cell); border-radius: 8px;\ntransform: translate(calc(var(--gap) + var(--c) * (var(--cell) + var(--gap))), calc(var(--gap) + var(--r) * (var(--cell) + var(--gap)))); }\n.slot { background: rgba(255,255,255,.07); }\n.tile { transition: transform .11s ease-in-out; z-index: 1; }\n.tile .in { width: 100%; height: 100%; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: calc(var(--cell) * .42); }\n.tile.new .in { animation: appear .16s ease-out .08s backwards; }\n.tile.pop .in { animation: pop .18s ease-out; }\n.tile.merged { z-index: 2; }\n@keyframes appear { from { transform: scale(0); } }\n@keyframes pop { 50% { transform: scale(1.18); } }\n.scores { display: flex; gap: 10px; }\n.scorebox { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 14px; text-align: center; min-width: 76px; }\n.scorebox small { display: block; color: var(--muted); font-size: 11px; letter-spacing: 1px; }\n.scorebox b { font-size: 20px; }\n<\/style>\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>🔢 2048<\/h1>\n<div class=\"scores\"><div class=\"scorebox\"><small>SCORE<\/small><b id=\"score\">0<\/b><\/div><div class=\"scorebox\"><small>BEST<\/small><b id=\"best\">0<\/b><\/div><\/div>\n<\/header>\n<div class=\"controls\">\n<button class=\"btn\" id=\"new\">New game<\/button>\n<button class=\"btn alt\" id=\"undo\">Undo<\/button>\n<\/div>\n<div class=\"stage\">\n<div id=\"board\"><\/div>\n<div class=\"overlay hidden\" id=\"ov\"><\/div>\n<\/div>\n<p class=\"help\">Use <kbd>←<\/kbd><kbd>↑<\/kbd><kbd>→<\/kbd><kbd>↓<\/kbd> / <kbd>WASD<\/kbd> or swipe to slide the tiles. Equal tiles merge. Reach the <b>2048<\/b> tile to win! <kbd>U<\/kbd> undoes one move.<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst boardEl = document.getElementById('board'), ov = document.getElementById('ov');\nconst N = 4;\nconst COLORS = {\n2: ['#eee4da', '#776e65'], 4: ['#ede0c8', '#776e65'], 8: ['#f2b179', '#fff'], 16: ['#f59563', '#fff'],\n32: ['#f67c5f', '#fff'], 64: ['#f65e3b', '#fff'], 128: ['#edcf72', '#fff'], 256: ['#edcc61', '#fff'],\n512: ['#edc850', '#fff'], 1024: ['#edc53f', '#fff'], 2048: ['#edc22e', '#fff'], 4096: ['#a78bfa', '#fff'], 8192: ['#8b5cf6', '#fff']\n};\nlet tiles, score, won, keepPlaying, history = [], nextId = 1, busy = false;\nlet best = Store.get('2048-best', 0);\ndocument.getElementById('best').textContent = best;\nfor (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {\nconst s = document.createElement('div');\ns.className = 'slot';\ns.style.setProperty('--r', r);\ns.style.setProperty('--c', c);\nboardEl.appendChild(s);\n}\nfunction makeTile(r, c, value, cls) {\nconst el = document.createElement('div');\nel.className = 'tile ' + (cls || '');\nel.innerHTML = '<div class=\"in\"><\/div>';\nconst t = { id: nextId++, r, c, value, el };\nplace(t);\npaint(t);\nboardEl.appendChild(el);\nreturn t;\n}\nfunction place(t) { t.el.style.setProperty('--r', t.r); t.el.style.setProperty('--c', t.c); }\nfunction paint(t) {\nconst [bg, fg] = COLORS[t.value] || ['#3c3a32', '#fff'];\nconst inner = t.el.firstChild;\ninner.style.background = bg;\ninner.style.color = fg;\ninner.textContent = t.value;\nif (t.value >= 1024) inner.style.fontSize = 'calc(var(--cell) * .32)';\nelse if (t.value >= 128) inner.style.fontSize = 'calc(var(--cell) * .37)';\nelse inner.style.fontSize = '';\n}\nfunction at(r, c) { return tiles.find(t => t.r === r && t.c === c); }\nfunction addRandom() {\nconst empty = [];\nfor (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!at(r, c)) empty.push([r, c]);\nif (!empty.length) return;\nconst [r, c] = pick(empty);\ntiles.push(makeTile(r, c, Math.random() < 0.9 ? 2 : 4, 'new'));\n}\nfunction snapshot() { return { cells: tiles.map(t => [t.r, t.c, t.value]), score, won }; }\nfunction restore(s) {\ntiles.forEach(t => t.el.remove());\ntiles = s.cells.map(([r, c, v]) => makeTile(r, c, v));\nscore = s.score;\nwon = s.won;\nupdateScore();\n}\nfunction newGame() {\nif (tiles) tiles.forEach(t => t.el.remove());\ntiles = [];\nscore = 0; won = false; keepPlaying = false; history = [];\naddRandom(); addRandom();\nupdateScore();\noverlay(ov, null);\n}\nfunction updateScore() {\ndocument.getElementById('score').textContent = score;\nif (score > best) { best = score; Store.set('2048-best', best); }\ndocument.getElementById('best').textContent = best;\n}\nfunction move(dir) {\nif (busy || !ov.classList.contains('hidden')) return;\nconst before = snapshot();\nconst vertical = dir === 'up' || dir === 'down';\nconst reverse = dir === 'right' || dir === 'down';\nlet moved = false;\nconst removed = [];\nfor (let i = 0; i < N; i++) {\nlet line = tiles.filter(t => (vertical ? t.c : t.r) === i).sort((a, b) => vertical ? a.r - b.r : a.c - b.c);\nif (reverse) line.reverse();\nconst out = [];\nfor (const t of line) {\nconst prev = out[out.length - 1];\nif (prev && prev.value === t.value && !prev.justMerged) {\nprev.justMerged = true;\nt.into = prev;\nremoved.push(t);\n} else out.push(t);\n}\nout.forEach((t, k) => {\nconst pos = reverse ? N - 1 - k : k;\nconst r = vertical ? pos : i, c = vertical ? i : pos;\nif (t.r !== r || t.c !== c) moved = true;\nt.r = r; t.c = c;\n});\nremoved.forEach(t => { if (t.into) { moved = true; t.r = t.into.r; t.c = t.into.c; } });\n}\nif (!moved) return;\nhistory.push(before);\nif (history.length > 20) history.shift();\ntiles.forEach(t => { t.el.classList.remove('new', 'pop', 'merged'); place(t); });\nbusy = true;\nsetTimeout(() => {\nremoved.forEach(t => t.el.remove());\ntiles = tiles.filter(t => !removed.includes(t));\ntiles.forEach(t => {\nif (t.justMerged) {\nt.value *= 2;\nscore += t.value;\npaint(t);\nvoid t.el.offsetWidth;\nt.el.classList.add('pop', 'merged');\nif (t.value === 2048 && !won) won = true;\n}\nt.justMerged = false;\nt.into = null;\n});\naddRandom();\nupdateScore();\nbusy = false;\nif (removed.length) Sound.beep(300 + Math.log2(Math.max(...tiles.map(t => t.value))) * 40, 0.05, 'triangle', 0.03);\nif (won && !keepPlaying) {\nkeepPlaying = true;\noverlay(ov, `<h2>You made 2048! 🎉<\/h2><p>Score ${score}<\/p><button class=\"btn\" onclick=\"overlay(ov, null)\">Keep going<\/button><button class=\"btn alt\" onclick=\"newGame()\">New game<\/button>`);\n} else if (!canMove()) {\noverlay(ov, `<h2>Game over<\/h2><p>Score ${score}<\/p><button class=\"btn\" onclick=\"newGame()\">Try again<\/button><button class=\"btn alt\" onclick=\"undo()\">Undo<\/button>`);\n}\n}, 120);\n}\nfunction canMove() {\nif (tiles.length < N * N) return true;\nfor (const t of tiles) {\nconst right = at(t.r, t.c + 1), down = at(t.r + 1, t.c);\nif ((right && right.value === t.value) || (down && down.value === t.value)) return true;\n}\nreturn false;\n}\nfunction undo() {\nif (busy || !history.length) return;\nrestore(history.pop());\noverlay(ov, null);\n}\nconst KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };\ndocument.addEventListener('keydown', e => {\nif (KEYS[e.key]) move(KEYS[e.key]);\nif (e.key === 'u' || e.key === 'U') undo();\n});\nonSwipe(boardEl, move);\ndocument.getElementById('new').onclick = newGame;\ndocument.getElementById('undo').onclick = undo;\nnewGame();\n<\/script>\n<\/body>\n<\/html>",
"minesweeper": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Minesweeper<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<style>\n.wrap { max-width: calc(100vw - 16px); overflow-x: auto; padding: 4px; }\n#board { display: grid; gap: 2px; background: #2e3260; padding: 6px; border-radius: 10px; user-select: none; -webkit-user-select: none; touch-action: manipulation; width: max-content; margin: 0 auto; }\n.cell {\nwidth: var(--s); height: var(--s); border: 0; border-radius: 4px; padding: 0;\nbackground: linear-gradient(#5b5f97, #474b80); color: #fff; font-weight: 800; font-size: calc(var(--s) * .55);\ndisplay: flex; align-items: center; justify-content: center; cursor: pointer; line-height: 1;\n}\n.cell:hover:not(.open) { filter: brightness(1.15); }\n.cell.open { background: #1a1c33; cursor: default; }\n.cell.boom { background: #b91c1c; }\n.cell.wrong { background: #7c2d12; }\n.n1 { color: #60a5fa; } .n2 { color: #4ade80; } .n3 { color: #f87171; } .n4 { color: #c084fc; }\n.n5 { color: #fb923c; } .n6 { color: #22d3ee; } .n7 { color: #f472b6; } .n8 { color: #e5e7eb; }\n.bar { display: flex; gap: 12px; align-items: center; justify-content: center; margin: 6px 0; font-variant-numeric: tabular-nums; }\n.bar .lcd { background: #05060d; color: #f87171; font-family: ui-monospace, monospace; font-size: 22px; padding: 2px 10px; border-radius: 6px; min-width: 64px; text-align: center; }\n#face { font-size: 26px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; width: 46px; height: 42px; cursor: pointer; }\n#flagmode.on { background: var(--warn); color: #000; }\n<\/style>\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>🚩 Minesweeper<\/h1>\n<div class=\"stats\">Best <b id=\"best\">—<\/b><\/div>\n<\/header>\n<div class=\"controls\">\n<select id=\"level\">\n<option value=\"9,9,10\">Beginner · 9×9<\/option>\n<option value=\"16,16,40\" selected>Intermediate · 16×16<\/option>\n<option value=\"30,16,99\">Expert · 30×16<\/option>\n<\/select>\n<button class=\"btn alt\" id=\"flagmode\">🚩 Flag mode: off<\/button>\n<\/div>\n<div class=\"bar\"><div class=\"lcd\" id=\"mines\">000<\/div><button id=\"face\">🙂<\/button><div class=\"lcd\" id=\"timer\">000<\/div><\/div>\n<div class=\"wrap\"><div id=\"board\"><\/div><\/div>\n<p class=\"help\">Left-click reveals, right-click (or long-press, or flag mode) plants a flag. Click a number whose flags are all placed to clear its neighbours. Your first click is always safe.<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst boardEl = document.getElementById('board');\nlet W, H, M, cells, started, over, flags, revealed, t0, timerId, flagMode = false;\nconst key = () => 'mines-best-' + document.getElementById('level').value;\nfunction showBest() { const b = Store.get(key(), null); document.getElementById('best').textContent = b ? b + 's' : '—'; }\nfunction newGame() {\n[W, H, M] = document.getElementById('level').value.split(',').map(Number);\nconst s = Math.max(22, Math.min(34, Math.floor((Math.min(window.innerWidth, 1000) - 40) / W)));\nboardEl.style.setProperty('--s', s + 'px');\nboardEl.style.gridTemplateColumns = `repeat(${W}, var(--s))`;\nboardEl.innerHTML = '';\ncells = [];\nfor (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {\nconst el = document.createElement('button');\nel.className = 'cell';\nconst c = { x, y, mine: false, open: false, flag: false, n: 0, el };\nbindCell(c);\ncells.push(c);\nboardEl.appendChild(el);\n}\nstarted = false; over = false; flags = 0; revealed = 0;\nclearInterval(timerId);\ndocument.getElementById('timer').textContent = '000';\ndocument.getElementById('face').textContent = '🙂';\nupdateMines();\nshowBest();\n}\nconst get = (x, y) => (x < 0 || y < 0 || x >= W || y >= H) ? null : cells[y * W + x];\nfunction around(c) {\nconst out = [];\nfor (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {\nif (!dx && !dy) continue;\nconst n = get(c.x + dx, c.y + dy);\nif (n) out.push(n);\n}\nreturn out;\n}\nfunction plant(safe) {\nconst forbidden = new Set([safe, ...around(safe)]);\nconst pool = shuffle(cells.filter(c => !forbidden.has(c)));\npool.slice(0, M).forEach(c => { c.mine = true; });\ncells.forEach(c => { c.n = around(c).filter(n => n.mine).length; });\nstarted = true;\nt0 = Date.now();\ntimerId = setInterval(() => {\ndocument.getElementById('timer').textContent = String(Math.min(999, Math.floor((Date.now() - t0) / 1000))).padStart(3, '0');\n}, 250);\n}\nfunction updateMines() {\nconst v = M - flags;\ndocument.getElementById('mines').textContent = (v < 0 ? '-' : '') + String(Math.abs(v)).padStart(3, '0');\n}\nfunction reveal(c) {\nif (over || c.open || c.flag) return;\nif (!started) plant(c);\nif (c.mine) return lose(c);\nconst stack = [c];\nwhile (stack.length) {\nconst cur = stack.pop();\nif (cur.open || cur.flag) continue;\ncur.open = true;\nrevealed++;\ncur.el.classList.add('open');\nif (cur.n) { cur.el.textContent = cur.n; cur.el.classList.add('n' + cur.n); }\nelse around(cur).forEach(n => { if (!n.open && !n.mine) stack.push(n); });\n}\nif (revealed === W * H - M) win();\n}\nfunction chord(c) {\nif (!c.open || !c.n) return;\nconst ns = around(c);\nif (ns.filter(n => n.flag).length !== c.n) return;\nns.forEach(n => { if (!n.flag && !n.open) reveal(n); });\n}\nfunction toggleFlag(c) {\nif (over || c.open) return;\nc.flag = !c.flag;\nc.el.textContent = c.flag ? '🚩' : '';\nflags += c.flag ? 1 : -1;\nupdateMines();\n}\nfunction lose(hit) {\nover = true;\nclearInterval(timerId);\ndocument.getElementById('face').textContent = '😵';\nSound.beep(90, 0.5, 'sawtooth', 0.06);\ncells.forEach(c => {\nif (c.mine && !c.flag) { c.el.textContent = '💣'; c.el.classList.add('open'); }\nif (!c.mine && c.flag) c.el.classList.add('wrong');\n});\nhit.el.classList.add('boom');\n}\nfunction win() {\nover = true;\nclearInterval(timerId);\nconst secs = Math.max(1, Math.round((Date.now() - t0) / 1000));\ndocument.getElementById('face').textContent = '😎';\ncells.forEach(c => { if (c.mine && !c.flag) { c.flag = true; c.el.textContent = '🚩'; } });\nflags = M;\nupdateMines();\nrecordBest(key(), secs, true);\nshowBest();\nSound.beep(880, 0.3, 'triangle');\n}\nfunction bindCell(c) {\nlet pressT = null, longPressed = false;\nc.el.addEventListener('contextmenu', e => { e.preventDefault(); toggleFlag(c); });\nc.el.addEventListener('pointerdown', e => {\nif (e.button !== 0) return;\nlongPressed = false;\nif (e.pointerType !== 'mouse') pressT = setTimeout(() => { longPressed = true; toggleFlag(c); if (navigator.vibrate) navigator.vibrate(30); }, 380);\nif (!over && !c.open) document.getElementById('face').textContent = '😮';\n});\nc.el.addEventListener('pointerup', () => { clearTimeout(pressT); if (!over) document.getElementById('face').textContent = '🙂'; });\nc.el.addEventListener('pointerleave', () => clearTimeout(pressT));\nc.el.addEventListener('click', () => {\nif (longPressed) return;\nif (c.open) return chord(c);\nif (flagMode) toggleFlag(c);\nelse reveal(c);\n});\n}\ndocument.getElementById('face').onclick = newGame;\ndocument.getElementById('level').onchange = newGame;\ndocument.getElementById('flagmode').onclick = e => {\nflagMode = !flagMode;\ne.currentTarget.classList.toggle('on', flagMode);\ne.currentTarget.textContent = '🚩 Flag mode: ' + (flagMode ? 'on' : 'off');\n};\nnewGame();\n<\/script>\n<\/body>\n<\/html>",
"sudoku": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Sudoku<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<style>\n#board {\n--s: min(52px, calc((100vw - 32px) / 9));\ndisplay: grid; grid-template-columns: repeat(9, var(--s)); background: #0b0c18; border: 3px solid #8b5cf6; border-radius: 8px; overflow: hidden;\nuser-select: none; -webkit-user-select: none;\n}\n.c {\nwidth: var(--s); height: var(--s); display: flex; align-items: center; justify-content: center; position: relative;\nbackground: #1a1c33; border-right: 1px solid #2e3260; border-bottom: 1px solid #2e3260; cursor: pointer;\nfont-size: calc(var(--s) * .55); font-weight: 600; color: #c4b5fd;\n}\n.c.given { color: #e6e7f2; font-weight: 800; }\n.c.br { border-right: 3px solid #8b5cf6; }\n.c.bb { border-bottom: 3px solid #8b5cf6; }\n.c.peer { background: #222545; }\n.c.same { background: #3b2f6b; }\n.c.sel { background: #5b46b8; }\n.c.bad { color: #f87171; }\n.notes { position: absolute; inset: 2px; display: grid; grid-template-columns: repeat(3, 1fr); font-size: calc(var(--s) * .22); color: var(--muted); font-weight: 500; }\n.notes span { display: flex; align-items: center; justify-content: center; }\n.numpad { display: grid; grid-template-columns: repeat(9, minmax(0, 46px)); gap: 6px; margin: 12px 0; max-width: calc(100vw - 24px); }\n.numpad button { height: 46px; font-size: 20px; font-weight: 700; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); cursor: pointer; padding: 0; }\n.numpad button.done { opacity: .3; }\n#notesBtn.on { background: var(--warn); color: #000; }\n<\/style>\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>🧮 Sudoku<\/h1>\n<div class=\"stats\">Time <b id=\"time\">0:00<\/b> Mistakes <b id=\"mistakes\">0<\/b><\/div>\n<\/header>\n<div class=\"controls\">\n<select id=\"diff\"><option value=\"40\">Easy<\/option><option value=\"32\" selected>Medium<\/option><option value=\"26\">Hard<\/option><\/select>\n<button class=\"btn\" id=\"new\">New puzzle<\/button>\n<button class=\"btn alt\" id=\"notesBtn\">✏️ Notes<\/button>\n<button class=\"btn alt\" id=\"undoBtn\">↶ Undo<\/button>\n<button class=\"btn alt\" id=\"hintBtn\">💡 Hint<\/button>\n<\/div>\n<div class=\"stage\">\n<div id=\"board\"><\/div>\n<div class=\"overlay hidden\" id=\"ov\"><\/div>\n<\/div>\n<div class=\"numpad\" id=\"numpad\"><\/div>\n<p class=\"help\">Click a cell, then type <kbd>1<\/kbd>–<kbd>9<\/kbd> or use the buttons. <kbd>N<\/kbd> toggles pencil notes, <kbd>Backspace<\/kbd> erases, arrows move. Every row, column and 3×3 box must contain 1–9 once.<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst boardEl = document.getElementById('board'), ov = document.getElementById('ov');\nlet puzzle, solution, grid, notes, sel = -1, notesMode = false, undoStack = [], mistakes = 0, t0, timerId, done = false;\nconst BOX = i => Math.floor(Math.floor(i / 9) / 3) * 3 + Math.floor((i % 9) / 3);\nfunction countSolutions(g, limit = 2) {\nconst rows = Array(9).fill(0), cols = Array(9).fill(0), boxes = Array(9).fill(0);\nfor (let i = 0; i < 81; i++) if (g[i]) { const b = 1 << g[i]; rows[Math.floor(i / 9)] |= b; cols[i % 9] |= b; boxes[BOX(i)] |= b; }\nlet count = 0;\nconst cells = g.slice();\n(function solve() {\nif (count >= limit) return;\nlet best = -1, bestMask = 0, bestN = 10;\nfor (let i = 0; i < 81; i++) {\nif (cells[i]) continue;\nconst used = rows[Math.floor(i / 9)] | cols[i % 9] | boxes[BOX(i)];\nconst mask = ~used & 0x3fe;\nlet n = 0;\nfor (let m = mask; m; m &= m - 1) n++;\nif (n < bestN) { bestN = n; best = i; bestMask = mask; if (n <= 1) break; }\n}\nif (best < 0) { count++; return; }\nconst r = Math.floor(best / 9), c = best % 9, bx = BOX(best);\nfor (let d = 1; d <= 9; d++) {\nif (!(bestMask & (1 << d))) continue;\nconst b = 1 << d;\ncells[best] = d; rows[r] |= b; cols[c] |= b; boxes[bx] |= b;\nsolve();\ncells[best] = 0; rows[r] &= ~b; cols[c] &= ~b; boxes[bx] &= ~b;\nif (count >= limit) return;\n}\n})();\nreturn count;\n}\nfunction fullGrid() {\nconst g = Array(81).fill(0);\n(function fill(i) {\nif (i === 81) return true;\nconst r = Math.floor(i / 9), c = i % 9;\nfor (const d of shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9])) {\nlet ok = true;\nfor (let k = 0; k < 9 && ok; k++) {\nif (g[r * 9 + k] === d || g[k * 9 + c] === d) ok = false;\nconst br = Math.floor(r / 3) * 3 + Math.floor(k / 3), bc = Math.floor(c / 3) * 3 + k % 3;\nif (g[br * 9 + bc] === d) ok = false;\n}\nif (!ok) continue;\ng[i] = d;\nif (fill(i + 1)) return true;\ng[i] = 0;\n}\nreturn false;\n})(0);\nreturn g;\n}\nfunction generate(clues) {\nconst sol = fullGrid();\nconst p = sol.slice();\nlet filled = 81;\nfor (const i of shuffle([...Array(81).keys()])) {\nif (filled <= clues) break;\nconst v = p[i];\np[i] = 0;\nif (countSolutions(p) !== 1) p[i] = v;\nelse filled--;\n}\nreturn { p, sol };\n}\nconst cellEls = [];\nfor (let i = 0; i < 81; i++) {\nconst el = document.createElement('div');\nel.className = 'c' + (i % 9 === 2 || i % 9 === 5 ? ' br' : '') + (Math.floor(i / 9) === 2 || Math.floor(i / 9) === 5 ? ' bb' : '');\nel.addEventListener('pointerdown', () => { sel = i; render(); });\nboardEl.appendChild(el);\ncellEls.push(el);\n}\nconst numpad = document.getElementById('numpad');\nfor (let d = 1; d <= 9; d++) {\nconst b = document.createElement('button');\nb.textContent = d;\nb.onclick = () => input(d);\nnumpad.appendChild(b);\n}\nfunction newGame() {\noverlay(ov, '<h2>Generating…<\/h2>');\nsetTimeout(() => {\nconst { p, sol } = generate(+document.getElementById('diff').value);\npuzzle = p; solution = sol; grid = p.slice();\nnotes = Array.from({ length: 81 }, () => new Set());\nundoStack = []; mistakes = 0; done = false;\nsel = grid.indexOf(0);\nt0 = Date.now();\nclearInterval(timerId);\ntimerId = setInterval(tickTime, 500);\ntickTime();\noverlay(ov, null);\nrender();\n}, 30);\n}\nfunction tickTime() {\nconst s = Math.floor(
