(Date.now() - t0) / 1000);\ndocument.getElementById('time').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');\n}\nfunction conflicts(i) {\nconst v = grid[i];\nif (!v) return false;\nconst r = Math.floor(i / 9), c = i % 9;\nfor (let j = 0; j < 81; j++) {\nif (j === i || grid[j] !== v) continue;\nif (Math.floor(j / 9) === r || j % 9 === c || BOX(j) === BOX(i)) return true;\n}\nreturn false;\n}\nfunction render() {\nconst sv = sel >= 0 ? grid[sel] : 0;\nfor (let i = 0; i < 81; i++) {\nconst el = cellEls[i];\nel.classList.toggle('given', !!puzzle[i]);\nel.classList.toggle('sel', i === sel);\nconst peer = sel >= 0 && i !== sel && (Math.floor(i / 9) === Math.floor(sel / 9) || i % 9 === sel % 9 || BOX(i) === BOX(sel));\nel.classList.toggle('peer', peer);\nel.classList.toggle('same', !!sv && i !== sel && grid[i] === sv);\nel.classList.toggle('bad', !puzzle[i] && !!grid[i] && (grid[i] !== solution[i] || conflicts(i)));\nif (grid[i]) el.textContent = grid[i];\nelse if (notes[i].size) el.innerHTML = '<div class=\"notes\">' + [1, 2, 3, 4, 5, 6, 7, 8, 9].map(d => `<span>${notes[i].has(d) ? d : ''}<\/span>`).join('') + '<\/div>';\nelse el.textContent = '';\n}\n[...numpad.children].forEach((b, k) => b.classList.toggle('done', grid.filter(v => v === k + 1).length >= 9));\ndocument.getElementById('mistakes').textContent = mistakes;\n}\nfunction input(d) {\nif (done || sel < 0 || puzzle[sel]) return;\nundoStack.push({ i: sel, v: grid[sel], n: new Set(notes[sel]) });\nif (notesMode && d) {\nif (grid[sel]) return;\nnotes[sel].has(d) ? notes[sel].delete(d) : notes[sel].add(d);\n} else {\ngrid[sel] = grid[sel] === d ? 0 : d;\nnotes[sel].clear();\nif (d && grid[sel] === d) {\nif (d !== solution[sel]) { mistakes++; Sound.beep(160, 0.12, 'sawtooth', 0.03); }\nelse {\nfor (let j = 0; j < 81; j++) if (Math.floor(j / 9) === Math.floor(sel / 9) || j % 9 === sel % 9 || BOX(j) === BOX(sel)) notes[j].delete(d);\n}\n}\n}\nrender();\nif (grid.every((v, i) => v === solution[i])) win();\n}\nfunction win() {\ndone = true;\nclearInterval(timerId);\nconst secs = Math.floor((Date.now() - t0) / 1000);\nconst k = 'sudoku-best-' + document.getElementById('diff').value;\nconst best = recordBest(k, secs, true);\nconst f = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');\nSound.beep(880, 0.3, 'triangle');\noverlay(ov, `<h2>Solved! 🎉<\/h2><p>Time ${f(secs)} · Best ${f(best)} · Mistakes ${mistakes}<\/p><button class=\"btn\" onclick=\"newGame()\">New puzzle<\/button>`);\n}\nfunction hint() {\nif (done) return;\nlet i = sel >= 0 && !puzzle[sel] && grid[sel] !== solution[sel] ? sel : -1;\nif (i < 0) {\nconst empties = grid.map((v, k) => (v !== solution[k] ? k : -1)).filter(k => k >= 0);\nif (!empties.length) return;\ni = pick(empties);\n}\nsel = i;\nconst was = notesMode;\nnotesMode = false;\ngrid[i] = 0;\ninput(solution[i]);\nnotesMode = was;\n}\ndocument.addEventListener('keydown', e => {\nif (e.key >= '1' && e.key <= '9') input(+e.key);\nelse if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') {\nif (sel >= 0 && !puzzle[sel] && !done) { undoStack.push({ i: sel, v: grid[sel], n: new Set(notes[sel]) }); grid[sel] = 0; notes[sel].clear(); render(); }\n}\nelse if (e.key === 'n' || e.key === 'N') toggleNotes();\nelse if (e.key.startsWith('Arrow')) {\nif (sel < 0) sel = 0;\nconst r = Math.floor(sel / 9), c = sel % 9;\nconst [dr, dc] = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];\nsel = ((r + dr + 9) % 9) * 9 + (c + dc + 9) % 9;\nrender();\n} else if ((e.key === 'z' && (e.ctrlKey || e.metaKey)) || e.key === 'u') undo();\n});\nfunction undo() {\nconst u = undoStack.pop();\nif (!u || done) return;\ngrid[u.i] = u.v;\nnotes[u.i] = u.n;\nsel = u.i;\nrender();\n}\nfunction toggleNotes() {\nnotesMode = !notesMode;\ndocument.getElementById('notesBtn').classList.toggle('on', notesMode);\n}\ndocument.getElementById('new').onclick = newGame;\ndocument.getElementById('notesBtn').onclick = toggleNotes;\ndocument.getElementById('undoBtn').onclick = undo;\ndocument.getElementById('hintBtn').onclick = hint;\nnewGame();\n<\/script>\n<\/body>\n<\/html>",
"sliding-puzzle": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Sliding Puzzle<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<style>\n#board {\n--size: min(440px, calc(100vw - 24px));\nwidth: var(--size); height: var(--size); position: relative; background: #11132a; border-radius: 12px; border: 2px solid var(--line);\nuser-select: none; -webkit-user-select: none; touch-action: manipulation;\n}\n.t {\nposition: absolute; width: calc(var(--size) / var(--n) - 6px); height: calc(var(--size) / var(--n) - 6px);\nleft: 3px; top: 3px; border-radius: 10px; display: flex; align-items: center; justify-content: center;\nfont-weight: 800; font-size: calc(var(--size) / var(--n) * .38); color: #fff; cursor: pointer;\ntransform: translate(calc(var(--c) * var(--size) / var(--n)), calc(var(--r) * var(--size) / var(--n)));\ntransition: transform .12s ease-out; box-shadow: inset 0 -4px 0 rgba(0,0,0,.25);\n}\n.t.home { outline: 2px solid rgba(255,255,255,.35); outline-offset: -4px; }\n<\/style>\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>🧩 Sliding Puzzle<\/h1>\n<div class=\"stats\">Moves <b id=\"moves\">0<\/b> Time <b id=\"time\">0<\/b>s Best <b id=\"best\">—<\/b><\/div>\n<\/header>\n<div class=\"controls\">\n<select id=\"size\"><option value=\"3\">3 × 3 (8-puzzle)<\/option><option value=\"4\" selected>4 × 4 (15-puzzle)<\/option><option value=\"5\">5 × 5 (24-puzzle)<\/option><\/select>\n<button class=\"btn\" id=\"shuffle\">Shuffle<\/button>\n<\/div>\n<div class=\"stage\">\n<div id=\"board\"><\/div>\n<div class=\"overlay hidden\" id=\"ov\"><\/div>\n<\/div>\n<p class=\"help\">Click a tile in the same row or column as the gap to slide it (and any tiles between). Arrow keys slide the tile next to the gap. Put the numbers in order with the gap in the bottom-right corner.<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst boardEl = document.getElementById('board'), ov = document.getElementById('ov');\nlet n, cells, els, moves, t0, timerId, solved, started;\nconst bestKey = () => 'slide-best-' + n;\nfunction showBest() { const b = Store.get(bestKey(), null); document.getElementById('best').textContent = b ?? '—'; }\nfunction setup() {\nn = +document.getElementById('size').value;\nboardEl.style.setProperty('--n', n);\nboardEl.innerHTML = '';\nels = [];\nfor (let v = 1; v < n * n; v++) {\nconst el = document.createElement('div');\nel.className = 't';\nel.textContent = v;\nconst hue = 250 + ((v - 1) / (n * n - 1)) * 120;\nel.style.background = `linear-gradient(135deg, hsl(${hue % 360},70%,60%), hsl(${(hue + 30) % 360},70%,45%))`;\nel.addEventListener('pointerdown', e => { e.preventDefault(); clickTile(v); });\nboardEl.appendChild(el);\nels[v] = el;\n}\ncells = [...Array(n * n - 1).keys()].map(i => i + 1).concat(0);\nlet blank = n * n - 1, prev = -1;\nfor (let k = 0; k < n * n * 40; k++) {\nconst opts = neighbors(blank).filter(i => i !== prev);\nconst i = pick(opts);\n[cells[blank], cells[i]] = [cells[i], cells[blank]];\nprev = blank;\nblank = i;\n}\nif (isSolved()) return setup();\nmoves = 0; solved = false; started = false;\nclearInterval(timerId);\ndocument.getElementById('time').textContent = 0;\noverlay(ov, null);\nshowBest();\nrender();\n}\nfunction neighbors(i) {\nconst r = Math.floor(i / n), c = i % n, out = [];\nif (r > 0) out.push(i - n);\nif (r < n - 1) out.push(i + n);\nif (c > 0) out.push(i - 1);\nif (c < n - 1) out.push(i + 1);\nreturn out;\n}\nconst isSolved = () => cells.every((v, i) => (i === n * n - 1 ? v === 0 : v === i + 1));\nfunction render() {\ncells.forEach((v, i) => {\nif (!v) return;\nels[v].style.setProperty('--r', Math.floor(i / n));\nels[v].style.setProperty('--c', i % n);\nels[v].classList.toggle('home', v === i + 1);\n});\ndocument.getElementById('moves').textContent = moves;\n}\nfunction slideFrom(i) {\nif (solved) return;\nconst blank = cells.indexOf(0);\nconst br = Math.floor(blank / n), bc = blank % n, r = Math.floor(i / n), c = i % n;\nif (r !== br && c !== bc) return;\nif (i === blank) return;\nconst step = r === br ? (c < bc ? -1 : 1) : (r < br ? -n : n);\nfor (let p = blank; p !== i; p += step) {\ncells[p] = cells[p + step];\ncells[p + step] = 0;\nmoves++;\n}\nif (!started) {\nstarted = true;\nt0 = Date.now();\ntimerId = setInterval(() => { document.getElementById('time').textContent = Math.floor((Date.now() - t0) / 1000); }, 500);\n}\nSound.beep(420, 0.03, 'triangle', 0.03);\nrender();\nif (isSolved()) {\nsolved = true;\nclearInterval(timerId);\nconst secs = Math.floor((Date.now() - t0) / 1000);\nconst best = recordBest(bestKey(), moves, true);\nshowBest();\nSound.beep(880, 0.3, 'triangle');\nsetTimeout(() => overlay(ov, `<h2>Solved! 🎉<\/h2><p>${moves} moves in ${secs}s · Best ${best} moves<\/p><button class=\"btn\" onclick=\"setup()\">Play again<\/button>`), 250);\n}\n}\nfunction clickTile(v) { slideFrom(cells.indexOf(v)); }\ndocument.addEventListener('keydown', e => {\nconst blank = cells.indexOf(0), r = Math.floor(blank / n), c = blank % n;\nif (e.key === 'ArrowLeft' && c < n - 1) slideFrom(blank + 1);\nif (e.key === 'ArrowRight' && c > 0) slideFrom(blank - 1);\nif (e.key === 'ArrowUp' && r < n - 1) slideFrom(blank + n);\nif (e.key === 'ArrowDown' && r > 0) slideFrom(blank - n);\n});\ndocument.getElementById('shuffle').onclick = setup;\ndocument.getElementById('size').onchange = setup;\nsetup();\n<\/script>\n<\/body>\n<\/html>",
"memory-match": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Memory Match<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<style>\n#board { display: grid; gap: 10px; width: min(560px, calc(100vw - 24px)); perspective: 800px; }\n.card { aspect-ratio: 1; position: relative; cursor: pointer; transform-style: preserve-3d; transition: transform .35s; border: 0; padding: 0; background: none; }\n.card.up, .card.done { transform: rotateY(180deg); }\n.card .face { position: absolute; inset: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; }\n.card .back { background: linear-gradient(135deg, #8b5cf6, #22d3ee); box-shadow: inset 0 0 0 4px rgba(255,255,255,.15); }\n.card .back::after { content: '?'; font-size: 28px; font-weight: 800; color: rgba(255,255,255,.6); }\n.card .front { background: #f1f5f9; transform: rotateY(180deg); font-size: min(44px, 9vw); }\n.card.done .front { background: #bbf7d0; }\n<\/style>\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>🃏 Memory Match<\/h1>\n<div class=\"stats\">Moves <b id=\"moves\">0<\/b> Pairs <b id=\"pairs\">0<\/b> Time <b id=\"time\">0<\/b>s Best <b id=\"best\">—<\/b><\/div>\n<\/header>\n<div class=\"controls\">\n<select id=\"size\"><option value=\"4\">4 × 4 (8 pairs)<\/option><option value=\"5\" selected>5 × 4 (10 pairs)<\/option><option value=\"6\">6 × 6 (18 pairs)<\/option><\/select>\n<select id=\"theme\"><option value=\"animals\">Animals<\/option><option value=\"food\">Food<\/option><option value=\"space\">Space & travel<\/option><\/select>\n<button class=\"btn\" id=\"new\">New game<\/button>\n<\/div>\n<div class=\"stage\">\n<div id=\"board\"><\/div>\n<div class=\"overlay hidden\" id=\"ov\"><\/div>\n<\/div>\n<p class=\"help\">Flip two cards at a time. Find all the matching pairs in as few moves as possible.<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst THEMES = {\nanimals: '🐶 🐱 🐭 🐹 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐮 🐷 🐸 🐵 🐔 🐧 🦄 🐙 🦋'.split(' '),\nfood: '🍎 🍕 🍔 🌮 🍩 🍪 🍓 🍉 🍇 🍒 🥑 🥕 🌽 🍿 🧁 🍦 🥨 🍣 🥐 🍋'.split(' '),\nspace: '🚀 🛸 🌍 🌙 ⭐ ☄️ 🪐 🌞 🚗 ✈️ 🚂 🚲 ⛵ 🚁 🏎️ 🛶 🚜 🛵 🗽 🗼'.split(' ')\n};\nconst boardEl = document.getElementById('board'), ov = document.getElementById('ov');\nlet open = [], moves, pairs, total, lock, t0, timerId, started;\nconst key = () => 'memory-best-' + document.getElementById('size').value;\nfunction showBest() { const b = Store.get(key(), null); document.getElementById('best').textContent = b ?? '—'; }\nfunction newGame() {\nconst s = +document.getElementById('size').value;\nconst cols = s === 5 ? 5 : s, rows = s === 5 ? 4 : s;\ntotal = cols * rows / 2;\nconst icons = shuffle(THEMES[document.getElementById('theme').value].slice()).slice(0, total);\nconst deck = shuffle([...icons, ...icons]);\nboardEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;\nboardEl.style.width = cols === 6 ? 'min(560px, calc(100vw - 24px))' : 'min(480px, calc(100vw - 24px))';\nboardEl.innerHTML = '';\ndeck.forEach(icon => {\nconst b = document.createElement('button');\nb.className = 'card';\nb.dataset.icon = icon;\nb.innerHTML = `<div class=\"face back\"><\/div><div class=\"face front\">${icon}<\/div>`;\nb.onclick = () => flip(b);\nboardEl.appendChild(b);\n});\nopen = []; moves = 0; pairs = 0; lock = false; started = false;\nclearInterval(timerId);\ndocument.getElementById('time').textContent = 0;\noverlay(ov, null);\nshowBest();\nhud();\n}\nfunction hud() {\ndocument.getElementById('moves').textContent = moves;\ndocument.getElementById('pairs').textContent = `${pairs}/${total}`;\n}\nfunction flip(card) {\nif (lock || card.classList.contains('up') || card.classList.contains('done')) return;\nif (!started) {\nstarted = true;\nt0 = Date.now();\ntimerId = setInterval(() => { document.getElementById('time').textContent = Math.floor((Date.now() - t0) / 1000); }, 500);\n}\ncard.classList.add('up');\nopen.push(card);\nSound.beep(520, 0.03, 'triangle', 0.03);\nif (open.length < 2) return;\nmoves++;\nconst [a, b] = open;\nif (a.dataset.icon === b.dataset.icon) {\nopen = [];\npairs++;\nsetTimeout(() => { a.classList.add('done'); b.classList.add('done'); Sound.beep(880, 0.1, 'triangle'); }, 300);\nif (pairs === total) {\nclearInterval(timerId);\nconst secs = Math.floor((Date.now() - t0) / 1000);\nconst best = recordBest(key(), moves, true);\nsetTimeout(() => { showBest(); overlay(ov, `<h2>All pairs found! 🎉<\/h2><p>${moves} moves in ${secs}s · Best ${best} moves<\/p><button class=\"btn\" onclick=\"newGame()\">Play again<\/button>`); }, 700);\n}\n} else {\nlock = true;\nsetTimeout(() => { a.classList.remove('up'); b.classList.remove('up'); open = []; lock = false; }, 850);\n}\nhud();\n}\ndocument.getElementById('new').onclick = newGame;\ndocument.getElementById('size').onchange = newGame;\ndocument.getElementById('theme').onchange = newGame;\nnewGame();\n<\/script>\n<\/body>\n<\/html>",
"lights-out": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Lights Out<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<style>\n#board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: min(420px, calc(100vw - 24px)); padding: 14px; background: #0b0c18; border-radius: 16px; border: 1px solid var(--line); }\n.l { aspect-ratio: 1; border-radius: 12px; border: 0; cursor: pointer; background: #1f2241; box-shadow: inset 0 -4px 0 rgba(0,0,0,.35); transition: background .12s, box-shadow .12s; }\n.l.on { background: radial-gradient(circle at 40% 35%, #fef9c3, #facc15 55%, #ca8a04); box-shadow: 0 0 18px rgba(250,204,21,.6), inset 0 -4px 0 rgba(0,0,0,.2); }\n.l.hint { outline: 3px dashed #22d3ee; outline-offset: -6px; }\n<\/style>\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>💡 Lights Out<\/h1>\n<div class=\"stats\">Level <b id=\"level\">1<\/b> Moves <b id=\"moves\">0<\/b> Par <b id=\"par\">0<\/b><\/div>\n<\/header>\n<div class=\"controls\">\n<button class=\"btn alt\" id=\"restart\">Restart level<\/button>\n<button class=\"btn alt\" id=\"hint\">Show a hint<\/button>\n<button class=\"btn alt\" id=\"skip\">Skip level<\/button>\n<\/div>\n<div class=\"stage\">\n<div id=\"board\"><\/div>\n<div class=\"overlay hidden\" id=\"ov\"><\/div>\n<\/div>\n<p class=\"help\">Pressing a light toggles it and its four neighbours. Switch every light off. Each level is built from random presses, so it's always solvable — \"par\" is the number of presses used to make it.<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst N = 5, boardEl = document.getElementById('board'), ov = document.getElementById('ov');\nlet lights, start, level = Store.get('lightsout-level', 1), moves, par, btns = [];\nfor (let i = 0; i < N * N; i++) {\nconst b = document.createElement('button');\nb.className = 'l';\nb.onclick = () => press(i, true);\nboardEl.appendChild(b);\nbtns.push(b);\n}\nfunction toggle(arr, i) {\nconst r = Math.floor(i / N), c = i % N;\n[[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dr, dc]) => {\nconst rr = r + dr, cc = c + dc;\nif (rr >= 0 && rr < N && cc >= 0 && cc < N) arr[rr * N + cc] ^= 1;\n});\n}\nfunction newLevel() {\npar = Math.min(3 + level, 15);\ndo {\nlights = Array(N * N).fill(0);\nshuffle([...Array(N * N).keys()]).slice(0, par).forEach(i => toggle(lights, i));\n} while (!lights.some(Boolean));\nstart = lights.slice();\nmoves = 0;\noverlay(ov, null);\nrender();\n}\nfunction render() {\nlights.forEach((v, i) => { btns[i].classList.toggle('on', !!v); btns[i].classList.remove('hint'); });\ndocument.getElementById('level').textContent = level;\ndocument.getElementById('moves').textContent = moves;\ndocument.getElementById('par').textContent = par;\n}\nfunction press(i) {\nif (!ov.classList.contains('hidden')) return;\ntoggle(lights, i);\nmoves++;\nSound.beep(lights[i] ? 660 : 440, 0.04, 'triangle', 0.03);\nrender();\nif (!lights.some(Boolean)) {\nconst stars = moves <= par ? '⭐⭐⭐' : moves <= par * 1.5 ? '⭐⭐' : '⭐';\nlevel++;\nStore.set('lightsout-level', level);\nSound.beep(880, 0.25, 'triangle');\noverlay(ov, `<h2>Lights out! ${stars}<\/h2><p>Solved in ${moves} moves (par ${par})<\/p><button class=\"btn\" onclick=\"newLevel()\">Level ${level}<\/button>`);\n}\n}\nfunction solve() {\nconst M = N * N;\nconst rows = [];\nfor (let i = 0; i < M; i++) {\nconst row = Array(M + 1).fill(0);\nfor (let j = 0; j < M; j++) { const t = Array(M).fill(0); toggle(t, j); row[j] = t[i]; }\nrow[M] = lights[i];\nrows.push(row);\n}\nconst where = Array(M).fill(-1);\nlet r = 0;\nfor (let c = 0; c < M && r < M; c++) {\nconst p = rows.findIndex((row, k) => k >= r && row[c]);\nif (p < 0) continue;\n[rows[r], rows[p]] = [rows[p], rows[r]];\nfor (let k = 0; k < M; k++) if (k !== r && rows[k][c]) for (let j = c; j <= M; j++) rows[k][j] ^= rows[r][j];\nwhere[c] = r++;\n}\nreturn where.map(w => (w >= 0 ? rows[w][M] : 0));\n}\ndocument.getElementById('hint').onclick = () => {\nconst s = solve();\nconst i = s.findIndex(Boolean);\nif (i >= 0) btns[i].classList.add('hint');\n};\ndocument.getElementById('restart').onclick = () => { lights = start.slice(); moves = 0; render(); };\ndocument.getElementById('skip').onclick = () => { level++; Store.set('lightsout-level', level); newLevel(); };\nnewLevel();\n<\/script>\n<\/body>\n<\/html>",
"box-pusher": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Box Pusher<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>📦 Box Pusher<\/h1>\n<div class=\"stats\">Moves <b id=\"moves\">0<\/b> Pushes <b id=\"pushes\">0<\/b> Solved <b id=\"solved\">0<\/b><\/div>\n<\/header>\n<div class=\"controls\">\n<button class=\"btn alt\" id=\"prev\">◀<\/button>\n<select id=\"pick\"><\/select>\n<button class=\"btn alt\" id=\"next\">▶<\/button>\n<button class=\"btn alt\" id=\"undo\">↶ Undo<\/button>\n<button class=\"btn alt\" id=\"reset\">↺ Restart<\/button>\n<\/div>\n<div class=\"stage\">\n<canvas id=\"c\" class=\"game\" width=\"560\" height=\"440\"><\/canvas>\n<div class=\"overlay hidden\" id=\"ov\"><\/div>\n<\/div>\n<div class=\"touchpad\"><button id=\"tL\">◀<\/button><button id=\"tU\">▲<\/button><button id=\"tD\">▼<\/button><button id=\"tR\">▶<\/button><\/div>\n<p class=\"help\">Push every crate onto a target. You can only push (never pull), one crate at a time. <kbd>←<\/kbd><kbd>↑<\/kbd><kbd>→<\/kbd><kbd>↓<\/kbd> or swipe to move, <kbd>Z<\/kbd>/<kbd>U<\/kbd> undo, <kbd>R<\/kbd> restart.<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst LEVELS = [\n['#######', '#     #', '# .$@ #', '#     #', '#######'],\n[' ######', ' #    #', '##$## #', '# .   #', '# $@. #', '#######'],\n['########', '#  .   #', '# #$## #', '# .$ @ #', '# #$## #', '#  .   #', '########'],\n['########', '#      #', '# $  . #', '#  ##  #', '# .  $ #', '#   @  #', '########'],\n['  ####', '###  #', '# $  #', '# .$.#', '## @ #', ' #####'],\n['#######', '#. .  #', '# $$  #', '#  #@ #', '#     #', '#######'],\n['  ######', '  #    #', '### $# #', '#  $ . #', '# #.## #', '# $ .@ #', '#   ####', '#####'],\n['#########', '#   #   #', '# $ . $ #', '# .@ .  #', '#   $   #', '#       #', '#########'],\n['#######', '#.    #', '#.$$$ #', '#.  @ #', '#######'],\n['#########', '#.  #  .#', '# $   $ #', '#  #@#  #', '# $   $ #', '#.  #  .#', '#########'],\n['  #####', '  #   #', '###$# ##', '# .$.  #', '#  @#  #', '## $  .#', ' #######'],\n['########', '#   #  #', '# $  $ #', '#.# ## #', '#.  $  #', '#.#  @ #', '########'],\n[' #######', ' #  .  #', '##$#$#.#', '#  @   #', '# $#.  #', '#    ###', '######'],\n['  #######', '  #     #', '### ### #', '# $ $ $ #', '#  ...  #', '### @ ###', '  #####']\n];\nconst cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov');\nlet idx = Store.get('sokoban-level', 0), W, H, walls, goals, boxes, player, inside, moves, pushes, history, T, ox, oy, face = 'down';\nlet solved = new Set(Store.get('sokoban-solved', []));\nconst pickEl = document.getElementById('pick');\nLEVELS.forEach((_, i) => { const o = document.createElement('option'); o.value = i; o.textContent = 'Level ' + (i + 1); pickEl.appendChild(o); });\nfunction load(i) {\nidx = clamp(i, 0, LEVELS.length - 1);\nStore.set('sokoban-level', idx);\nconst rows = LEVELS[idx];\nH = rows.length;\nW = Math.max(...rows.map(r => r.length));\nwalls = new Set(); goals = new Set(); boxes = new Set();\nrows.forEach((row, y) => [...row.padEnd(W)].forEach((c, x) => {\nconst k = y * W + x;\nif (c === '#') walls.add(k);\nif ('.*+'.includes(c)) goals.add(k);\nif ('$*'.includes(c)) boxes.add(k);\nif ('@+'.includes(c)) player = k;\n}));\ninside = new Set([player]);\nconst q = [player];\nwhile (q.length) {\nconst k = q.pop();\nfor (const d of [1, -1, W, -W]) {\nconst n = k + d;\nif (n >= 0 && n < W * H && !walls.has(n) && !inside.has(n)) { inside.add(n); q.push(n); }\n}\n}\nmoves = 0; pushes = 0; history = [];\nT = Math.floor(Math.min(cv.width / W, cv.height / H, 64));\nox = Math.floor((cv.width - W * T) / 2);\noy = Math.floor((cv.height - H * T) / 2);\npickEl.value = idx;\ndelete ov.dataset.won;\noverlay(ov, null);\nhud();\ndraw();\n}\nfunction hud() {\ndocument.getElementById('moves').textContent = moves;\ndocument.getElementById('pushes').textContent = pushes;\ndocument.getElementById('solved').textContent = `${solved.size}/${LEVELS.length}`;\n}\nfunction step(dx, dy) {\nif (!ov.classList.contains('hidden')) {\nif (ov.dataset.won) load(idx + 1);\nreturn;\n}\nface = dx > 0 ? 'right' : dx < 0 ? 'left' : dy < 0 ? 'up' : 'down';\nconst d = dy * W + dx, to = player + d;\nif (walls.has(to)) return draw();\nif (boxes.has(to)) {\nconst beyond = to + d;\nif (walls.has(beyond) || boxes.has(beyond)) return draw();\nhistory.push({ player, boxes: new Set(boxes), moves, pushes });\nboxes.delete(to);\nboxes.add(beyond);\npushes++;\nSound.beep(goals.has(beyond) ? 760 : 260, 0.05, 'triangle', 0.04);\n} else {\nhistory.push({ player, boxes: new Set(boxes), moves, pushes });\n}\nplayer = to;\nmoves++;\nhud();\ndraw();\nif ([...boxes].every(b => goals.has(b))) {\nsolved.add(idx);\nStore.set('sokoban-solved', [...solved]);\nhud();\nov.dataset.won = '1';\nconst last = idx === LEVELS.length - 1;\noverlay(ov, `<h2>${last ? 'All levels complete! 🏆' : 'Level complete!'}<\/h2><p>${moves} moves · ${pushes} pushes<\/p>` +\n(last ? '<button class=\"btn\" onclick=\"load(0)\">Back to level 1<\/button>' : `<button class=\"btn\" onclick=\"load(${idx + 1})\">Next level<\/button>`));\n}\n}\nfunction undo() {\nconst h = history.pop();\nif (!h) return;\n({ player, moves, pushes } = h);\nboxes = h.boxes;\noverlay(ov, null);\ndelete ov.dataset.won;\nhud();\ndraw();\n}\nfunction draw() {\nctx.fillStyle = '#0b0c18';\nctx.fillRect(0, 0, cv.width, cv.height);\nfor (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {\nconst k = y * W + x, px = ox + x * T, py = oy + y * T;\nif (walls.has(k)) {\nctx.fillStyle = '#4c3d7a';\nctx.fillRect(px, py, T, T);\nctx.fillStyle = '#5f4d96';\nctx.fillRect(px + 2, py + 2, T / 2 - 3, T / 2 - 3);\nctx.fillRect(px + T / 2 + 1, py + T / 2 + 1, T / 2 - 3, T / 2 - 3);\n} else if (inside.has(k)) {\nctx.fillStyle = (x + y) % 2 ? '#1e2140' : '#22264a';\nctx.fillRect(px, py, T, T);\n}\nif (goals.has(k)) {\nctx.strokeStyle = '#22d3ee';\nctx.lineWidth = 3;\nctx.beginPath(); ctx.arc(px + T / 2, py + T / 2, T * 0.18, 0, 7); ctx.stroke();\n}\nif (boxes.has(k)) {\nconst on = goals.has(k);\nctx.fillStyle = on ? '#16a34a' : '#d97706';\nctx.beginPath(); ctx.roundRect(px + 4, py + 4, T - 8, T - 8, 5); ctx.fill();\nctx.strokeStyle = on ? '#14532d' : '#92400e';\nctx.lineWidth = 3;\nctx.strokeRect(px + 9, py + 9, T - 18, T - 18);\nctx.beginPath(); ctx.moveTo(px + 9, py + 9); ctx.lineTo(px + T - 9, py + T - 9); ctx.moveTo(px + T - 9, py + 9); ctx.lineTo(px + 9, py + T - 9); ctx.stroke();\n}\n}\nconst px = ox + (player % W) * T + T / 2, py = oy + Math.floor(player / W) * T + T / 2;\nctx.fillStyle = '#f472b6';\nctx.beginPath(); ctx.arc(px, py, T * 0.32, 0, 7); ctx.fill();\nctx.fillStyle = '#fff';\nconst ex = { left: -1, right: 1, up: 0, down: 0 }[face], ey = { up: -1, down: 1, left: 0, right: 0 }[face];\n[-1, 1].forEach(s => {\nconst exx = px + (ey ? s * T * 0.12 : ex * T * 0.12), eyy = py + (ex ? s * T * 0.12 : ey * T * 0.12) - (ex ? T * 0.05 : 0);\nctx.beginPath(); ctx.arc(exx, eyy, T * 0.07, 0, 7); ctx.fill();\n});\n}\nconst DIRS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1], a: [-1, 0], d: [1, 0], w: [0, -1], s: [0, 1] };\ndocument.addEventListener('keydown', e => {\nif (DIRS[e.key]) step(...DIRS[e.key]);\nelse if (e.key === 'z' || e.key === 'u' || e.key === 'Z' || e.key === 'U' || e.key === 'Backspace') undo();\nelse if (e.key === 'r' || e.key === 'R') load(idx);\n});\nonSwipe(cv, d => step(...{ left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] }[d]));\n[['tL', [-1, 0]], ['tR', [1, 0]], ['tU', [0, -1]], ['tD', [0, 1]]].forEach(([id, d]) =>\ndocument.getElementById(id).addEventListener('pointerdown', e => { e.preventDefault(); step(...d); }));\ndocument.getElementById('undo').onclick = undo;\ndocument.getElementById('reset').onclick = () => load(idx);\ndocument.getElementById('prev').onclick = () => load(idx - 1);\ndocument.getElementById('next').onclick = () => load(idx + 1);\npickEl.onchange = () => load(+pickEl.value);\nload(idx);\n<\/script>\n<\/body>\n<\/html>",
"nonogram": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Nonogram<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<style>\n.wrap { max-width: calc(100vw - 12px); overflow: auto; }\n#board { display: grid; gap: 0; user-select: none; -webkit-user-select: none; touch-action: none; width: max-content; margin: 0 auto; background: var(--panel); padding: 6px; border-radius: 10px; }\n.cell { width: var(--s); height: var(--s); background: #e2e8f0; border: 1px solid #94a3b8; display: flex; align-items: center; justify-content: center; font-size: calc(var(--s) * .6); color: #64748b; cursor: pointer; }\n.cell.fill { background: #312e81; border-color: #312e81; }\n.cell.x::after { content: '✕'; }\n.cell.t { border-top: 2px solid #1e1b4b; }\n.cell.l { border-left: 2px solid #1e1b4b; }\n.cell.hl { box-shadow: inset 0 0 0 100px rgba(139,92,246,.12); }\n.cell.fill.hl { box-shadow: none; }\n.clue { display: flex; align-items: flex-end; justify-content: center; font-size: calc(var(--s) * .45); font-weight: 700; color: var(--fg); padding: 2px; gap: 1px; }\n.clue.col { flex-direction: column; align-items: center; justify-content: flex-end; line-height: 1.1; }\n.clue.row { justify-content: flex-end; align-items: center; gap: 6px; padding-right: 6px; }\n.clue.done { color: #4b5280; }\n#mode.x { background: var(--warn); color: #000; }\n<\/style>\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>🖼️ Nonogram<\/h1>\n<div class=\"stats\">Time <b id=\"time\">0<\/b>s<\/div>\n<\/header>\n<div class=\"controls\">\n<select id=\"size\"><option value=\"5\">5 × 5<\/option><option value=\"10\" selected>10 × 10<\/option><option value=\"15\">15 × 15<\/option><\/select>\n<button class=\"btn\" id=\"new\">New puzzle<\/button>\n<button class=\"btn alt\" id=\"mode\">✏️ Fill mode<\/button>\n<button class=\"btn alt\" id=\"clear\">Clear<\/button>\n<\/div>\n<div class=\"stage\">\n<div class=\"wrap\"><div id=\"board\"><\/div><\/div>\n<div class=\"overlay hidden\" id=\"ov\"><\/div>\n<\/div>\n<p class=\"help\">The numbers tell you the lengths of filled runs in each row and column, in order. Left-click (or drag) to fill, right-click to mark a cell as empty ✕. On touch, switch modes with the button.<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst boardEl = document.getElementById('board'), ov = document.getElementById('ov');\nlet N, sol, state, rowClues, colClues, cellEls, xMode = false, dragVal = null, t0, timerId, solved;\nconst runs = arr => { const out = []; let n = 0; arr.forEach(v => { if (v) n++; else if (n) { out.push(n); n = 0; } }); if (n) out.push(n); return out; };\nconst same = (a, b) => a.length === b.length && a.every((v, i) => v === b[i]);\nfunction newPuzzle() {\nN = +document.getElementById('size').value;\ndo {\nsol = Array.from({ length: N }, () => Array.from({ length: N }, () => Math.random() < 0.58 ? 1 : 0));\n} while (sol.some(r => !r.some(Boolean)));\nrowClues = sol.map(runs);\ncolClues = sol[0].map((_, c) => runs(sol.map(r => r[c])));\nstate = Array.from({ length: N }, () => Array(N).fill(0)); // 0 empty, 1 filled, 2 crossed\nconst s = Math.max(20, Math.min(36, Math.floor((Math.min(window.innerWidth, 900) - 40) / (N + Math.ceil(N / 2) + 1))));\nboardEl.style.setProperty('--s', s + 'px');\nconst maxRow = Math.max(...rowClues.map(c => c.length)), maxCol = Math.max(...colClues.map(c => c.length));\nboardEl.style.gridTemplateColumns = `${Math.max(2, maxRow) * s * 0.62 + 10}px repeat(${N}, var(--s))`;\nboardEl.style.gridTemplateRows = `${Math.max(2, maxCol) * s * 0.52 + 6}px repeat(${N}, var(--s))`;\nboardEl.innerHTML = '<div><\/div>';\ncolClues.forEach((c, i) => { const d = document.createElement('div'); d.className = 'clue col'; d.id = 'cc' + i; d.innerHTML = (c.length ? c : [0]).map(v => `<span>${v}<\/span>`).join(''); boardEl.appendChild(d); });\ncellEls = [];\nfor (let r = 0; r < N; r++) {\nconst d = document.createElement('div');\nd.className = 'clue row';\nd.id = 'rc' + r;\nd.innerHTML = (rowClues[r].length ? rowClues[r] : [0]).map(v => `<span>${v}<\/span>`).join('');\nboardEl.appendChild(d);\ncellEls.push([]);\nfor (let c = 0; c < N; c++) {\nconst el = document.createElement('div');\nel.className = 'cell' + (r && r % 5 === 0 ? ' t' : '') + (c && c % 5 === 0 ? ' l' : '');\nel.dataset.r = r;\nel.dataset.c = c;\nboardEl.appendChild(el);\ncellEls[r].push(el);\n}\n}\nsolved = false;\nclearInterval(timerId);\nt0 = Date.now();\ntimerId = setInterval(() => { document.getElementById('time').textContent = Math.floor((Date.now() - t0) / 1000); }, 500);\noverlay(ov, null);\nrender();\n}\nfunction render() {\nfor (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {\nconst el = cellEls[r][c];\nel.classList.toggle('fill', state[r][c] === 1);\nel.classList.toggle('x', state[r][c] === 2);\n}\nfor (let r = 0; r < N; r++) document.getElementById('rc' + r).classList.toggle('done', same(runs(state[r].map(v => v === 1)), rowClues[r]));\nfor (let c = 0; c < N; c++) document.getElementById('cc' + c).classList.toggle('done', same(runs(state.map(row => row[c] === 1)), colClues[c]));\n}\nfunction apply(el) {\nif (!el || !el.classList.contains('cell') || solved) return;\nconst r = +el.dataset.r, c = +el.dataset.c;\nif (state[r][c] === dragVal) return;\nstate[r][c] = dragVal;\nrender();\ncheck();\n}\nfunction check() {\nconst ok = state.every((row, r) => same(runs(row.map(v => v === 1)), rowClues[r])) &&\nstate[0].every((_, c) => same(runs(state.map(row => row[c] === 1)), colClues[c]));\nif (!ok) return;\nsolved = true;\nclearInterval(timerId);\nconst secs = Math.floor((Date.now() - t0) / 1000);\nconst best = recordBest('nonogram-best-' + N, secs, true);\nfor (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (state[r][c] === 2) state[r][c] = 0;\nrender();\nSound.beep(880, 0.3, 'triangle');\nsetTimeout(() => overlay(ov, `<h2>Picture complete! 🎨<\/h2><p>${secs}s · Best for ${N}×${N}: ${best}s<\/p><button class=\"btn\" onclick=\"newPuzzle()\">Next puzzle<\/button><button class=\"btn alt\" onclick=\"overlay(ov, null)\">Admire it<\/button>`), 400);\n}\nfunction highlight(el) {\nconst r = el && el.dataset.r != null ? +el.dataset.r : -1, c = el && el.dataset.c != null ? +el.dataset.c : -1;\ncellEls.forEach((row, rr) => row.forEach((cel, cc) => cel.classList.toggle('hl', rr === r || cc === c)));\n}\nboardEl.addEventListener('contextmenu', e => e.preventDefault());\nboardEl.addEventListener('pointerdown', e => {\nconst el = e.target.closest('.cell');\nif (!el) return;\ne.preventDefault();\nconst r = +el.dataset.r, c = +el.dataset.c;\nconst want = e.button === 2 || xMode ? 2 : 1;\ndragVal = state[r][c] === want ? 0 : want;\nSound.beep(dragVal === 1 ? 520 : 330, 0.03, 'triangle', 0.025);\napply(el);\n});\nboardEl.addEventListener('pointermove', e => {\nconst el = document.elementFromPoint(e.clientX, e.clientY);\nif (e.pointerType === 'mouse') highlight(el && el.closest ? el.closest('.cell') : null);\nif (dragVal === null) return;\napply(el && el.closest ? el.closest('.cell') : null);\n});\nwindow.addEventListener('pointerup', () => { dragVal = null; });\nboardEl.addEventListener('pointerleave', () => highlight(null));\ndocument.getElementById('new').onclick = newPuzzle;\ndocument.getElementById('size').onchange = newPuzzle;\ndocument.getElementById('clear').onclick = () => { state = state.map(r => r.map(() => 0)); solved = false; render(); };\ndocument.getElementById('mode').onclick = e => {\nxMode = !xMode;\ne.currentTarget.classList.toggle('x', xMode);\ne.currentTarget.textContent = xMode ? '✕ Cross mode' : '✏️ Fill mode';\n};\nnewPuzzle();\n<\/script>\n<\/body>\n<\/html>",
"maze-runner": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Maze Runner<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>🌀 Maze Runner<\/h1>\n<div class=\"stats\">Level <b id=\"level\">1<\/b> Time <b id=\"time\">0.0<\/b>s Steps <b id=\"steps\">0<\/b><\/div>\n<\/header>\n<div class=\"controls\">\n<label class=\"help\" style=\"margin:0\"><input type=\"checkbox\" id=\"fog\"> Fog of war<\/label>\n<button class=\"btn alt\" id=\"restart\">Restart from level 1<\/button>\n<\/div>\n<div class=\"stage\">\n<canvas id=\"c\" class=\"game\" width=\"600\" height=\"600\"><\/canvas>\n<div class=\"overlay hidden\" id=\"ov\"><\/div>\n<\/div>\n<div class=\"touchpad\"><button id=\"tL\">◀<\/button><button id=\"tU\">▲<\/button><button id=\"tD\">▼<\/button><button id=\"tR\">▶<\/button><\/div>\n<p class=\"help\">Guide the dot from the top-left to the flag in the bottom-right with <kbd>←<\/kbd><kbd>↑<\/kbd><kbd>→<\/kbd><kbd>↓<\/kbd>, WASD, swipes, or by dragging. Holding a key slides you along a corridor. Mazes grow every level.<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov');\nlet level = 1, N, walls, px, py, steps, t0, done, trail, S;\nfunction generate(n) {\nconst w = Array.from({ length: n }, () => Array(n).fill(15));\nconst seen = Array.from({ length: n }, () => Array(n).fill(false));\nconst stack = [[0, 0]];\nseen[0][0] = true;\nconst D = [[0, -1, 1, 4], [1, 0, 2, 8], [0, 1, 4, 1], [-1, 0, 8, 2]];\nwhile (stack.length) {\nconst [x, y] = stack[stack.length - 1];\nconst opts = D.filter(([dx, dy]) => { const nx = x + dx, ny = y + dy; return nx >= 0 && ny >= 0 && nx < n && ny < n && !seen[ny][nx]; });\nif (!opts.length) { stack.pop(); continue; }\nconst [dx, dy, b, ob] = pick(opts);\nw[y][x] &= ~b;\nw[y + dy][x + dx] &= ~ob;\nseen[y + dy][x + dx] = true;\nstack.push([x + dx, y + dy]);\n}\nreturn w;\n}\nfunction startLevel() {\nN = Math.min(6 + level * 2, 40);\nwalls = generate(N);\nS = cv.width / N;\npx = 0; py = 0; steps = 0; done = false;\ntrail = [[0, 0]];\nt0 = null;\ndocument.getElementById('level').textContent = level;\ndocument.getElementById('steps').textContent = 0;\ndocument.getElementById('time').textContent = '0.0';\noverlay(ov, null);\ndraw();\n}\nfunction tryMove(dx, dy) {\nif (done) return false;\nconst bit = dx > 0 ? 2 : dx < 0 ? 8 : dy > 0 ? 4 : 1;\nif (walls[py][px] & bit) return false;\nif (t0 === null) t0 = performance.now();\npx += dx; py += dy;\nsteps++;\nconst lastT = trail[trail.length - 2];\nif (lastT && lastT[0] === px && lastT[1] === py) trail.pop(); else trail.push([px, py]);\ndocument.getElementById('steps').textContent = steps;\nif (px === N - 1 && py === N - 1) finish();\nreturn true;\n}\nfunction slide(dx, dy) {\nif (!tryMove(dx, dy)) return;\nfor (let k = 0; k < N * N && !done; k++) {\nconst w = walls[py][px];\nconst exits = [[0, -1, 1], [1, 0, 2], [0, 1, 4], [-1, 0, 8]].filter(([ex, ey, b]) => !(w & b) && !(ex === -dx && ey === -dy));\nif (exits.length !== 1) break;\n[dx, dy] = exits[0];\ntryMove(dx, dy);\n}\ndraw();\n}\nfunction finish() {\ndone = true;\nconst secs = ((performance.now() - t0) / 1000).toFixed(1);\nconst best = recordBest('maze-level-best', level);\nSound.beep(880, 0.25, 'triangle');\ndraw();\noverlay(ov, `<h2>Level ${level} cleared!<\/h2><p>${secs}s · ${steps} steps · Highest level ${best}<\/p><button class=\"btn\" onclick=\"level++; startLevel()\">Next maze<\/button>`);\n}\nfunction draw() {\nctx.fillStyle = '#0b0c18';\nctx.fillRect(0, 0, cv.width, cv.height);\nconst fog = document.getElementById('fog').checked;\nctx.fillStyle = 'rgba(34,211,238,.15)';\ntrail.forEach(([x, y]) => ctx.fillRect(x * S, y * S, S, S));\nctx.fillStyle = '#22c55e';\nctx.font = `${S * 0.7}px system-ui`;\nctx.textAlign = 'center';\nctx.textBaseline = 'middle';\nctx.fillText('🏁', (N - 0.5) * S, (N - 0.5) * S);\nctx.strokeStyle = '#a78bfa';\nctx.lineWidth = Math.max(2, S * 0.12);\nctx.lineCap = 'round';\nctx.beginPath();\nfor (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {\nconst w = walls[y][x], X = x * S, Y = y * S;\nif (w & 1) { ctx.moveTo(X, Y); ctx.lineTo(X + S, Y); }\nif (w & 8) { ctx.moveTo(X, Y); ctx.lineTo(X, Y + S); }\nif (y === N - 1 && (w & 4)) { ctx.moveTo(X, Y + S); ctx.lineTo(X + S, Y + S); }\nif (x === N - 1 && (w & 2)) { ctx.moveTo(X + S, Y); ctx.lineTo(X + S, Y + S); }\n}\nctx.stroke();\nctx.fillStyle = '#f472b6';\nctx.beginPath(); ctx.arc((px + 0.5) * S, (py + 0.5) * S, S * 0.3, 0, 7); ctx.fill();\nif (fog && !done) {\nconst g = ctx.createRadialGradient((px + 0.5) * S, (py + 0.5) * S, S * 1.5, (px + 0.5) * S, (py + 0.5) * S, S * 4);\ng.addColorStop(0, 'rgba(11,12,24,0)');\ng.addColorStop(1, 'rgba(11,12,24,1)');\nctx.fillStyle = g;\nctx.fillRect(0, 0, cv.width, cv.height);\n}\nctx.textBaseline = 'alphabetic';\n}\nfunction tick() {\nif (t0 !== null && !done) document.getElementById('time').textContent = ((performance.now() - t0) / 1000).toFixed(1);\nrequestAnimationFrame(tick);\n}\nconst DIRS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1], a: [-1, 0], d: [1, 0], w: [0, -1], s: [0, 1] };\ndocument.addEventListener('keydown', e => {\nif (DIRS[e.key]) slide(...DIRS[e.key]);\nif (e.key === 'Enter' && done) { level++; startLevel(); }\n});\nlet dragging = false, dragged = false;\nonSwipe(cv, d => { if (!dragged) slide(...{ left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] }[d]); });\ncv.addEventListener('pointerdown', e => { const p = canvasPoint(cv, e); dragged = false; if (Math.floor(p.x / S) === px && Math.floor(p.y / S) === py) dragging = dragged = true; });\ncv.addEventListener('pointermove', e => {\nif (!dragging) return;\nconst p = canvasPoint(cv, e), cx = Math.floor(p.x / S), cy = Math.floor(p.y / S);\nif (Math.abs(cx - px) + Math.abs(cy - py) === 1) { tryMove(cx - px, cy - py); draw(); }\n});\nwindow.addEventListener('pointerup', () => { dragging = false; });\n[['tL', [-1, 0]], ['tR', [1, 0]], ['tU', [0, -1]], ['tD', [0, 1]]].forEach(([id, d]) =>\ndocument.getElementById(id).addEventListener('pointerdown', e => { e.preventDefault(); slide(...d); }));\ndocument.getElementById('fog').onchange = draw;\ndocument.getElementById('restart').onclick = () => { level = 1; startLevel(); };\nstartLevel();\ntick();\n<\/script>\n<\/body>\n<\/html>",
"peg-solitaire": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Peg Solitaire<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<style>\n#board { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; width: min(440px, calc(100vw - 24px)); padding: 18px; border-radius: 50%; background: radial-gradient(circle, #92400e, #78350f 70%, #451a03); box-shadow: 0 12px 40px rgba(0,0,0,.5); aspect-ratio: 1; }\n.h { aspect-ratio: 1; border-radius: 50%; border: 0; padding: 0; background: radial-gradient(circle at 50% 40%, #1c0d02, #2b1505); cursor: pointer; position: relative; }\n.h.off { visibility: hidden; }\n.h.peg::after { content: ''; position: absolute; inset: 12%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fde68a, #f59e0b 55%, #b45309); box-shadow: 0 3px 4px rgba(0,0,0,.5); transition: transform .1s; }\n.h.sel::after { transform: translateY(-4px) scale(1.08); background: radial-gradient(circle at 35% 30%, #e9d5ff, #a855f7 55%, #6b21a8); }\n.h.target { box-shadow: 0 0 0 3px #22d3ee inset; }\n<\/style>\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>🟠 Peg Solitaire<\/h1>\n<div class=\"stats\">Pegs left <b id=\"pegs\">32<\/b> Best <b id=\"best\">—<\/b><\/div>\n<\/header>\n<div class=\"controls\">\n<button class=\"btn alt\" id=\"undo\">↶ Undo<\/button>\n<button class=\"btn alt\" id=\"reset\">↺ Restart<\/button>\n<\/div>\n<div class=\"stage\">\n<div id=\"board\"><\/div>\n<div class=\"overlay hidden\" id=\"ov\"><\/div>\n<\/div>\n<p class=\"help\">Jump a peg over a neighbouring peg into an empty hole (no diagonals); the jumped peg is removed. Finish with one peg — in the centre for a perfect game.<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst boardEl = document.getElementById('board'), ov = document.getElementById('ov');\nconst valid = (r, c) => (r >= 2 && r <= 4) || (c >= 2 && c <= 4);\nlet pegs, sel = null, history = [], els = [];\nlet best = Store.get('peg-best', null);\nfor (let r = 0; r < 7; r++) for (let c = 0; c < 7; c++) {\nconst b = document.createElement('button');\nb.className = 'h' + (valid(r, c) ? '' : ' off');\nb.onclick = () => click(r, c);\nboardEl.appendChild(b);\nels.push(b);\n}\nfunction reset() {\npegs = Array.from({ length: 7 }, (_, r) => Array.from({ length: 7 }, (_, c) => valid(r, c) && !(r === 3 && c === 3)));\nsel = null;\nhistory = [];\noverlay(ov, null);\nrender();\n}\nfunction movesFrom(r, c) {\nconst out = [];\nfor (const [dr, dc] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {\nconst mr = r + dr, mc = c + dc, tr = r + 2 * dr, tc = c + 2 * dc;\nif (tr < 0 || tr > 6 || tc < 0 || tc > 6 || !valid(tr, tc)) continue;\nif (pegs[mr][mc] && !pegs[tr][tc]) out.push([tr, tc, mr, mc]);\n}\nreturn out;\n}\nconst count = () => pegs.flat().filter(Boolean).length;\nfunction render() {\nconst targets = sel ? movesFrom(...sel).map(m => m[0] * 7 + m[1]) : [];\nfor (let r = 0; r < 7; r++) for (let c = 0; c < 7; c++) {\nconst el = els[r * 7 + c];\nel.classList.toggle('peg', !!pegs[r][c]);\nel.classList.toggle('sel', !!sel && sel[0] === r && sel[1] === c);\nel.classList.toggle('target', targets.includes(r * 7 + c));\n}\ndocument.getElementById('pegs').textContent = count();\ndocument.getElementById('best').textContent = best ?? '—';\n}\nfunction click(r, c) {\nif (!valid(r, c)) return;\nif (pegs[r][c]) {\nsel = sel && sel[0] === r && sel[1] === c ? null : (movesFrom(r, c).length ? [r, c] : null);\nif (!sel) Sound.beep(200, 0.04, 'square', 0.02);\nreturn render();\n}\nif (!sel) return;\nconst m = movesFrom(...sel).find(([tr, tc]) => tr === r && tc === c);\nif (!m) return;\nhistory.push(pegs.map(row => row.slice()));\npegs[sel[0]][sel[1]] = false;\npegs[m[2]][m[3]] = false;\npegs[r][c] = true;\nsel = movesFrom(r, c).length ? [r, c] : null;\nSound.beep(500 + (32 - count()) * 12, 0.05, 'triangle', 0.04);\nrender();\ncheckEnd();\n}\nfunction checkEnd() {\nfor (let r = 0; r < 7; r++) for (let c = 0; c < 7; c++) if (pegs[r][c] && movesFrom(r, c).length) return;\nconst n = count();\nbest = recordBest('peg-best', n, true);\nrender();\nconst perfect = n === 1 && pegs[3][3];\nconst msg = perfect ? 'Perfect! One peg, dead centre. 🏆' : n === 1 ? 'Excellent — just one peg left!' : n <= 3 ? 'Very good!' : n <= 5 ? 'Not bad.' : 'Keep practising.';\noverlay(ov, `<h2>No more moves<\/h2><p>${n} peg${n > 1 ? 's' : ''} left. ${msg}<\/p><button class=\"btn\" onclick=\"reset()\">Play again<\/button><button class=\"btn alt\" onclick=\"undoMove()\">Undo<\/button>`);\n}\nfunction undoMove() {\nconst h = history.pop();\nif (!h) return;\npegs = h;\nsel = null;\noverlay(ov, null);\nrender();\n}\ndocument.getElementById('undo').onclick = undoMove;\ndocument.getElementById('reset').onclick = reset;\ndocument.addEventListener('keydown', e => { if (e.key === 'z' || e.key === 'u') undoMove(); });\nreset();\n<\/script>\n<\/body>\n<\/html>",
"tower-of-hanoi": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Tower of Hanoi<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<style>\n#board { display: flex; gap: 10px; width: min(720px, calc(100vw - 24px)); height: 320px; align-items: flex-end; padding: 16px; background: linear-gradient(#1a1c33, #23264a); border-radius: 14px; border: 1px solid var(--line); }\n.peg { flex: 1; height: 100%; position: relative; display: flex; flex-direction: column-reverse; align-items: center; cursor: pointer; padding-bottom: 14px; border-radius: 10px; }\n.peg:hover { background: rgba(255,255,255,.03); }\n.peg.sel { background: rgba(139,92,246,.12); }\n.peg::before { content: ''; position: absolute; bottom: 14px; width: 10px; height: 88%; background: #78350f; border-radius: 5px 5px 0 0; }\n.peg::after { content: attr(data-k); position: absolute; bottom: -4px; color: var(--muted); font-size: 12px; }\n.base { position: absolute; bottom: 8px; left: 4%; right: 4%; height: 8px; background: #92400e; border-radius: 4px; }\n.disk { height: 24px; border-radius: 12px; margin-top: 3px; position: relative; z-index: 1; box-shadow: inset 0 -4px 0 rgba(0,0,0,.2); transition: transform .12s; }\n.disk.lift { transform: translateY(-30px); }\n<\/style>\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>🗼 Tower of Hanoi<\/h1>\n<div class=\"stats\">Moves <b id=\"moves\">0<\/b> Minimum <b id=\"min\">7<\/b><\/div>\n<\/header>\n<div class=\"controls\">\n<select id=\"n\"><\/select>\n<button class=\"btn\" id=\"reset\">Restart<\/button>\n<button class=\"btn alt\" id=\"solve\">▶ Watch solution<\/button>\n<\/div>\n<div class=\"stage\">\n<div id=\"board\"><\/div>\n<div class=\"overlay hidden\" id=\"ov\"><\/div>\n<\/div>\n<p class=\"help\">Move the whole tower to the right-most peg. Click a peg to pick up its top disk, then click another peg to drop it. A disk can never sit on a smaller one. Keys <kbd>1<\/kbd> <kbd>2<\/kbd> <kbd>3<\/kbd> select pegs.<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst boardEl = document.getElementById('board'), ov = document.getElementById('ov'), nEl = document.getElementById('n');\nfor (let i = 3; i <= 8; i++) nEl.insertAdjacentHTML('beforeend', `<option value=\"${i}\" ${i === 4 ? 'selected' : ''}>${i} disks<\/option>`);\nlet n, pegs, sel = null, moves, solving = null;\nfunction reset() {\nclearInterval(solving);\nsolving = null;\nn = +nEl.value;\npegs = [[...Array(n).keys()].map(i => n - i), [], []];\nsel = null;\nmoves = 0;\ndocument.getElementById('min').textContent = 2 ** n - 1;\noverlay(ov, null);\nrender();\n}\nfunction render() {\nboardEl.innerHTML = '';\npegs.forEach((p, i) => {\nconst el = document.createElement('div');\nel.className = 'peg' + (sel === i ? ' sel' : '');\nel.dataset.k = i + 1;\nel.innerHTML = '<div class=\"base\"><\/div>';\np.forEach((d, k) => {\nconst disk = document.createElement('div');\ndisk.className = 'disk' + (sel === i && k === p.length - 1 ? ' lift' : '');\ndisk.style.width = (20 + d / n * 75) + '%';\ndisk.style.background = `hsl(${(d * 360 / n + 260) % 360}, 75%, 58%)`;\nel.appendChild(disk);\n});\nel.onclick = () => { if (!solving) choose(i); };\nboardEl.appendChild(el);\n});\ndocument.getElementById('moves').textContent = moves;\n}\nfunction move(from, to) {\nconst a = pegs[from], b = pegs[to];\nif (!a.length || (b.length && b[b.length - 1] < a[a.length - 1])) return false;\nb.push(a.pop());\nmoves++;\nSound.beep(300 + b[b.length - 1] * 60, 0.06, 'triangle', 0.04);\nreturn true;\n}\nfunction choose(i) {\nif (sel === null) { if (pegs[i].length) sel = i; }\nelse if (sel === i) sel = null;\nelse {\nif (!move(sel, i)) Sound.beep(140, 0.12, 'sawtooth', 0.03);\nsel = null;\n}\nrender();\nif (pegs[2].length === n) {\nconst perfect = moves === 2 ** n - 1;\nif (!solving) recordBest('hanoi-' + n, moves, true);\nsetTimeout(() => overlay(ov, `<h2>${perfect ? 'Perfect solution! 🏆' : 'Tower moved!'}<\/h2><p>${moves} moves (minimum ${2 ** n - 1})<\/p><button class=\"btn\" onclick=\"reset()\">Play again<\/button>`), 200);\n}\n}\nfunction solve() {\nreset();\nconst steps = [];\n(function h(k, a, b, c) { if (!k) return; h(k - 1, a, c, b); steps.push([a, c]); h(k - 1, b, a, c); })(n, 0, 1, 2);\nlet i = 0;\nsolving = setInterval(() => {\nif (i >= steps.length) { clearInterval(solving); solving = null; return; }\nconst [a, c] = steps[i++];\nmove(a, c);\nrender();\nif (i >= steps.length) { clearInterval(solving); solving = null; overlay(ov, `<h2>That's how it's done<\/h2><p>${moves} moves<\/p><button class=\"btn\" onclick=\"reset()\">Your turn<\/button>`); }\n}, Math.max(60, 500 - n * 50));\n}\ndocument.addEventListener('keydown', e => { const i = +e.key - 1; if (i >= 0 && i <= 2 && !solving) choose(i); });\ndocument.getElementById('reset').onclick = reset;\ndocument.getElementById('solve').onclick = solve;\nnEl.onchange = reset;\nreset();\n<\/script>\n<\/body>\n<\/html>",
"flood-it": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Flood It<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<style>\n.palette { display: flex; gap: 10px; margin: 12px 0; flex-wrap: wrap; justify-content: center; }\n.palette button { width: 52px; height: 52px; border-radius: 50%; border: 3px solid rgba(255,255,255,.2); cursor: pointer; }\n.palette button:hover { transform: scale(1.08); }\n.palette button.cur { border-color: #fff; }\n<\/style>\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>🌊 Flood It<\/h1>\n<div class=\"stats\">Moves <b id=\"moves\">0<\/b> / <b id=\"max\">25<\/b> Wins <b id=\"wins\">0<\/b><\/div>\n<\/header>\n<div class=\"controls\">\n<select id=\"size\"><option value=\"10\">Small 10×10 (17 moves)<\/option><option value=\"14\" selected>Medium 14×14 (25 moves)<\/option><option value=\"18\">Large 18×18 (32 moves)<\/option><\/select>\n<button class=\"btn\" id=\"new\">New board<\/button>\n<\/div>\n<div class=\"stage\">\n<canvas id=\"c\" class=\"game\" width=\"504\" height=\"504\"><\/canvas>\n<div class=\"overlay hidden\" id=\"ov\"><\/div>\n<\/div>\n<div class=\"palette\" id=\"pal\"><\/div>\n<p class=\"help\">Pick a colour to flood the area connected to the top-left corner. Fill the whole board with one colour before you run out of moves. Keys <kbd>1<\/kbd>–<kbd>6<\/kbd> work too, or click a cell of the colour you want.<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov');\nconst COLORS = ['#ef4444', '#f59e0b', '#facc15', '#22c55e', '#3b82f6', '#a855f7'];\nconst MAX = { 10: 17, 14: 25, 18: 32 };\nlet N, grid, moves, maxMoves, flooded, over;\nlet wins = Store.get('flood-wins', 0);\nconst pal = document.getElementById('pal');\nCOLORS.forEach((c, i) => {\nconst b = document.createElement('button');\nb.style.background = c;\nb.title = 'Colour ' + (i + 1);\nb.onclick = () => play(i);\npal.appendChild(b);\n});\nfunction newGame() {\nN = +document.getElementById('size').value;\nmaxMoves = MAX[N];\ngrid = Array.from({ length: N * N }, () => randInt(0, COLORS.length - 1));\nmoves = 0;\nover = false;\ncomputeFlood();\noverlay(ov, null);\nrender();\n}\nfunction computeFlood() {\nconst c = grid[0];\nflooded = new Set([0]);\nconst q = [0];\nwhile (q.length) {\nconst k = q.pop(), x = k % N, y = Math.floor(k / N);\nfor (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {\nconst nx = x + dx, ny = y + dy, nk = ny * N + nx;\nif (nx >= 0 && ny >= 0 && nx < N && ny < N && !flooded.has(nk) && grid[nk] === c) { flooded.add(nk); q.push(nk); }\n}\n}\n}\nfunction play(color) {\nif (over || color === grid[0]) return;\nflooded.forEach(k => { grid[k] = color; });\nmoves++;\ncomputeFlood();\nSound.beep(300 + color * 80, 0.05, 'triangle', 0.04);\nrender();\nif (flooded.size === N * N) {\nover = true;\nwins++;\nStore.set('flood-wins', wins);\nrender();\noverlay(ov, `<h2>Flooded! 🌊<\/h2><p>Done in ${moves} of ${maxMoves} moves<\/p><button class=\"btn\" onclick=\"newGame()\">Next board<\/button>`);\n} else if (moves >= maxMoves) {\nover = true;\noverlay(ov, `<h2>Out of moves<\/h2><p>${Math.round(flooded.size / (N * N) * 100)}% flooded<\/p><button class=\"btn\" onclick=\"newGame()\">Try again<\/button>`);\n}\n}\nfunction render() {\nconst s = cv.width / N;\nfor (let k = 0; k < N * N; k++) {\nctx.fillStyle = COLORS[grid[k]];\nctx.fillRect((k % N) * s, Math.floor(k / N) * s, s + 0.5, s + 0.5);\n}\nctx.strokeStyle = 'rgba(255,255,255,.85)';\nctx.lineWidth = 2;\nctx.beginPath();\nflooded.forEach(k => {\nconst x = k % N, y = Math.floor(k / N);\nif (y === 0 || !flooded.has(k - N)) { ctx.moveTo(x * s, y * s); ctx.lineTo(x * s + s, y * s); }\nif (y === N - 1 || !flooded.has(k + N)) { ctx.moveTo(x * s, y * s + s); ctx.lineTo(x * s + s, y * s + s); }\nif (x === 0 || !flooded.has(k - 1)) { ctx.moveTo(x * s, y * s); ctx.lineTo(x * s, y * s + s); }\nif (x === N - 1 || !flooded.has(k + 1)) { ctx.moveTo(x * s + s, y * s); ctx.lineTo(x * s + s, y * s + s); }\n});\nctx.stroke();\ndocument.getElementById('moves').textContent = moves;\ndocument.getElementById('max').textContent = maxMoves;\ndocument.getElementById('wins').textContent = wins;\n[...pal.children].forEach((b, i) => b.classList.toggle('cur', i === grid[0]));\n}\ncv.addEventListener('pointerdown', e => {\nconst p = canvasPoint(cv, e), s = cv.width / N;\nconst k = Math.floor(p.y / s) * N + Math.floor(p.x / s);\nif (grid[k] != null) play(grid[k]);\n});\ndocument.addEventListener('keydown', e => { const i = +e.key - 1; if (i >= 0 && i < COLORS.length) play(i); });\ndocument.getElementById('new').onclick = newGame;\ndocument.getElementById('size').onchange = newGame;\nnewGame();\n<\/script>\n<\/body>\n<\/html>",
"gem-swap": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Gem Swap<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>💠 Gem Swap<\/h1>\n<div class=\"stats\">Score <b id=\"score\">0<\/b> Moves <b id=\"moves\">30<\/b> Best <b id=\"best\">0<\/b><\/div>\n<\/header>\n<div class=\"stage\">\n<canvas id=\"c\" class=\"game\" width=\"512\" height=\"512\"><\/canvas>\n<div class=\"overlay\" id=\"ov\"><\/div>\n<\/div>\n<p class=\"help\">Swap two neighbouring gems (click one then the other, or drag) to line up 3 or more of a kind. Chain reactions multiply your points. You have 30 moves — make them count!<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov');\nconst N = 8, S = cv.width / N, TYPES = 6, MOVES = 30;\nconst COLORS = ['#ef4444', '#f59e0b', '#facc15', '#22c55e', '#3b82f6', '#a855f7'];\nlet board, phase = 'idle', sel = null, pending, clearT, cascade, score, movesLeft, last = 0, idleT = 0, hint = null, popups = [], started = false;\nlet best = Store.get('gemswap-best', 0);\nfunction hud() {\ndocument.getElementById('score').textContent = score;\ndocument.getElementById('moves').textContent = movesLeft;\ndocument.getElementById('best').textContent = best;\n}\nconst gem = (t, r, c) => ({ t, x: c, y: r, vy: 0, scale: 1, dying: false });\nfunction fill() {\nboard = Array.from({ length: N }, () => Array(N).fill(null));\nfor (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {\nlet t;\ndo { t = randInt(0, TYPES - 1); } while ((c >= 2 && board[r][c - 1].t === t && board[r][c - 2].t === t) || (r >= 2 && board[r - 1][c].t === t && board[r - 2][c].t === t));\nboard[r][c] = gem(t, r - N, c);\n}\nif (!hasMoves()) fill();\n}\nfunction findMatches(b = board) {\nconst out = new Set();\nfor (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {\nconst t = b[r][c] && b[r][c].t;\nif (t == null) continue;\nif (c <= N - 3 && b[r][c + 1] && b[r][c + 2] && b[r][c + 1].t === t && b[r][c + 2].t === t) { let k = c; while (k < N && b[r][k] && b[r][k].t === t) out.add(r * N + k++); }\nif (r <= N - 3 && b[r + 1][c] && b[r + 2][c] && b[r + 1][c].t === t && b[r + 2][c].t === t) { let k = r; while (k < N && b[k][c] && b[k][c].t === t) out.add(k++ * N + c); }\n}\nreturn out;\n}\nfunction swapCells(a, b) { const t = board[a[0]][a[1]]; board[a[0]][a[1]] = board[b[0]][b[1]]; board[b[0]][b[1]] = t; }\nfunction hasMoves() {\nfor (let r = 0; r < N; r++) for (let c = 0; c < N; c++) for (const [dr, dc] of [[0, 1], [1, 0]]) {\nconst r2 = r + dr, c2 = c + dc;\nif (r2 >= N || c2 >= N) continue;\nswapCells([r, c], [r2, c2]);\nconst ok = findMatches().size > 0;\nswapCells([r, c], [r2, c2]);\nif (ok) return [[r, c], [r2, c2]];\n}\nreturn null;\n}\nfunction start() {\nscore = 0; movesLeft = MOVES; started = true;\nfill();\nphase = 'falling';\noverlay(ov, null);\nhud();\n}\nfunction trySwap(a, b) {\nif (phase !== 'idle' || movesLeft <= 0) return;\nswapCells(a, b);\npending = [a, b];\nphase = 'swapping';\nhint = null;\nidleT = 0;\nSound.beep(400, 0.04, 'triangle', 0.03);\n}\nfunction startClear(m) {\nconst pts = m.size * 10 * cascade + (m.size >= 4 ? (m.size - 3) * 30 : 0);\nscore += pts;\nlet sx = 0, sy = 0;\nm.forEach(k => { const g = board[Math.floor(k / N)][k % N]; g.dying = true; sx += k % N; sy += Math.floor(k / N); });\npopups.push({ x: (sx / m.size + 0.5) * S, y: (sy / m.size + 0.5) * S, text: (cascade > 1 ? `×${cascade} ` : '') + '+' + pts, t: 800 });\nSound.beep(500 + cascade * 120, 0.12, 'triangle', 0.05);\nclearT = 220;\nphase = 'clearing';\nhud();\n}\nfunction collapse() {\nfor (let c = 0; c < N; c++) {\nconst col = [];\nfor (let r = N - 1; r >= 0; r--) if (!board[r][c].dying) col.push(board[r][c]);\nlet spawnY = -1;\nfor (let r = N - 1; r >= 0; r--) {\nconst g = col[N - 1 - r];\nboard[r][c] = g || gem(randInt(0, TYPES - 1), spawnY--, c);\n}\n}\n}\nfunction settled() {\nfor (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { const g = board[r][c]; if (g.x !== c || g.y !== r) return false; }\nreturn true;\n}\nfunction update(dt) {\nconst s = dt / 1000;\nfor (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {\nconst g = board[r][c];\nif (g.x !== c) g.x = g.x < c ? Math.min(c, g.x + 8 * s) : Math.max(c, g.x - 8 * s);\nif (g.y < r) { g.vy += 45 * s; g.y = Math.min(r, g.y + Math.max(g.vy, 8) * s); if (g.y === r) g.vy = 0; }\nelse if (g.y > r) g.y = Math.max(r, g.y - 8 * s);\n}\npopups.forEach(p => { p.t -= dt; p.y -= 30 * s; });\npopups = popups.filter(p => p.t > 0);\nif (phase === 'swapping' && settled()) {\nconst m = findMatches();\nif (m.size) { movesLeft--; cascade = 1; startClear(m); }\nelse { swapCells(...pending); phase = 'unswap'; Sound.beep(180, 0.08, 'square', 0.03); }\n} else if (phase === 'unswap' && settled()) phase = 'idle';\nelse if (phase === 'clearing') {\nclearT -= dt;\nfor (const row of board) for (const g of row) if (g.dying) g.scale = Math.max(0, clearT / 220);\nif (clearT <= 0) { collapse(); phase = 'falling'; }\n} else if (phase === 'falling' && settled()) {\nconst m = findMatches();\nif (m.size) { cascade++; startClear(m); }\nelse {\nphase = 'idle';\nif (movesLeft <= 0) return gameOver();\nif (!hasMoves()) {\npopups.push({ x: cv.width / 2, y: cv.height / 2, text: 'No moves — shuffling!', t: 1200 });\nconst types = shuffle(board.flat().map(g => g.t));\nlet tries = 0;\ndo { shuffle(types); board.forEach((row, r) => row.forEach((g, c) => { g.t = types[r * N + c]; })); } while ((findMatches().size || !hasMoves()) && ++tries < 200);\nif (findMatches().size) phase = 'falling';\n}\n}\n}\nif (phase === 'idle') {\nidleT += dt;\nif (idleT > 6000 && !hint) hint = hasMoves();\n}\n}\nfunction gameOver() {\nphase = 'over';\nbest = recordBest('gemswap-best', score);\nhud();\noverlay(ov, `<h2>Out of moves!<\/h2><p>Final score ${score} · Best ${best}<\/p><button class=\"btn\" onclick=\"start()\">Play again<\/button>`);\n}\nfunction drawGem(g) {\nconst cx = (g.x + 0.5) * S, cy = (g.y + 0.5) * S, r = S * 0.36 * g.scale;\nif (r <= 0 || cy < -S) return;\nctx.fillStyle = COLORS[g.t];\nctx.beginPath();\nswitch (g.t) {\ncase 0: ctx.arc(cx, cy, r, 0, 7); break;\ncase 1: ctx.roundRect(cx - r * 0.85, cy - r * 0.85, r * 1.7, r * 1.7, r * 0.25); break;\ncase 2: ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r, cy); ctx.lineTo(cx, cy + r); ctx.lineTo(cx - r, cy); break;\ncase 3: ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r, cy + r * 0.8); ctx.lineTo(cx - r, cy + r * 0.8); break;\ncase 4: for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3 + Math.PI / 6; ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); } break;\ncase 5: for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); } break;\n}\nctx.closePath();\nctx.fill();\nctx.fillStyle = 'rgba(255,255,255,.45)';\nctx.beginPath(); ctx.ellipse(cx - r * 0.25, cy - r * 0.35, r * 0.28, r * 0.14, -0.5, 0, 7); ctx.fill();\n}\nfunction draw() {\nfor (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {\nctx.fillStyle = (r + c) % 2 ? '#191b36' : '#20234a';\nctx.fillRect(c * S, r * S, S, S);\n}\nif (!board) return;\nif (sel) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.strokeRect(sel[1] * S + 3, sel[0] * S + 3, S - 6, S - 6); }\nif (hint && Math.floor(performance.now() / 400) % 2) {\nctx.strokeStyle = '#22d3ee'; ctx.lineWidth = 3;\nhint.forEach(([r, c]) => ctx.strokeRect(c * S + 5, r * S + 5, S - 10, S - 10));\n}\nfor (const row of board) for (const g of row) drawGem(g);\nctx.font = 'bold 22px system-ui';\nctx.textAlign = 'center';\npopups.forEach(p => { ctx.globalAlpha = Math.min(1, p.t / 400); ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.strokeText(p.text, p.x, p.y); ctx.fillText(p.text, p.x, p.y); });\nctx.globalAlpha = 1;\n}\nfunction loop(t) {\nconst dt = Math.min(40, t - last);\nlast = t;\nif (started && phase !== 'over') update(dt);\ndraw();\nrequestAnimationFrame(loop);\n}\nlet down = null;\ncv.addEventListener('pointerdown', e => {\nconst p = canvasPoint(cv, e), cell = [Math.floor(p.y / S), Math.floor(p.x / S)];\nif (phase !== 'idle') return;\ndown = { p, cell };\nif (sel && Math.abs(sel[0] - cell[0]) + Math.abs(sel[1] - cell[1]) === 1) { trySwap(sel, cell); sel = null; down = null; return; }\nsel = sel && sel[0] === cell[0] && sel[1] === cell[1] ? null : cell;\n});\ncv.addEventListener('pointermove', e => {\nif (!down) return;\nconst p = canvasPoint(cv, e), dx = p.x - down.p.x, dy = p.y - down.p.y;\nif (Math.max(Math.abs(dx), Math.abs(dy)) < S * 0.4) return;\nconst [r, c] = down.cell;\nconst t = Math.abs(dx) > Math.abs(dy) ? [r, c + Math.sign(dx)] : [r + Math.sign(dy), c];\ndown = null;\nif (t[0] < 0 || t[1] < 0 || t[0] >= N || t[1] >= N) return;\nsel = null;\ntrySwap([r, c], t);\n});\nwindow.addEventListener('pointerup', () => { down = null; });\nscore = 0;\nmovesLeft = MOVES;\nhud();\noverlay(ov, '<h2>Gem Swap<\/h2><p>Match three or more. 30 moves.<\/p><button class=\"btn\" onclick=\"start()\">Start<\/button>');\nrequestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>",
"same-game": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>SameGame<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>🟪 SameGame<\/h1>\n<div class=\"stats\">Score <b id=\"score\">0<\/b> Left <b id=\"left\">0<\/b> Best <b id=\"best\">0<\/b><\/div>\n<\/header>\n<div class=\"controls\">\n<select id=\"colors\"><option value=\"3\">3 colours (easy)<\/option><option value=\"4\" selected>4 colours<\/option><option value=\"5\">5 colours (hard)<\/option><\/select>\n<button class=\"btn\" id=\"new\">New game<\/button>\n<button class=\"btn alt\" id=\"undo\">↶ Undo<\/button>\n<\/div>\n<div class=\"stage\">\n<canvas id=\"c\" class=\"game\" width=\"600\" height=\"400\"><\/canvas>\n<div class=\"overlay hidden\" id=\"ov\"><\/div>\n<\/div>\n<p class=\"help\">Click a group of two or more touching blocks of the same colour to remove it. Blocks fall down and columns slide left. Big groups score much more: (n − 2)². Clear the whole board for a 1000-point bonus.<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov');\nconst COLS = 15, ROWS = 10, S = 40;\nconst COLORS = ['#ef4444', '#3b82f6', '#22c55e', '#facc15', '#a855f7'];\nlet grid, score, hover = [], history = [];\nlet best = Store.get('samegame-best', 0);\nfunction newGame() {\nconst k = +document.getElementById('colors').value;\ngrid = Array.from({ length: COLS }, () => Array.from({ length: ROWS }, () => randInt(0, k - 1))); // grid[x][y], y=0 bottom\nscore = 0;\nhistory = [];\nhover = [];\noverlay(ov, null);\nrender();\n}\nfunction groupAt(x, y) {\nconst col = grid[x] && grid[x][y];\nif (col == null) return [];\nconst seen = new Set([x + ',' + y]), out = [[x, y]], q = [[x, y]];\nwhile (q.length) {\nconst [cx, cy] = q.pop();\nfor (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {\nconst nx = cx + dx, ny = cy + dy, k = nx + ',' + ny;\nif (grid[nx] && grid[nx][ny] === col && !seen.has(k)) { seen.add(k); out.push([nx, ny]); q.push([nx, ny]); }\n}\n}\nreturn out;\n}\nfunction remaining() { return grid.reduce((s, c) => s + c.filter(v => v != null).length, 0); }\nfunction anyMoves() {\nfor (let x = 0; x < grid.length; x++) for (let y = 0; y < grid[x].length; y++) {\nconst v = grid[x][y];\nif (v == null) continue;\nif ((grid[x + 1] && grid[x + 1][y] === v) || grid[x][y + 1] === v) return true;\n}\nreturn false;\n}\nfunction click(x, y) {\nconst g = groupAt(x, y);\nif (g.length < 2) return;\nhistory.push({ grid: grid.map(c => c.slice()), score });\ng.forEach(([gx, gy]) => { grid[gx][gy] = null; });\ngrid = grid.map(c => c.filter(v => v != null)).filter(c => c.length);\nscore += (g.length - 2) ** 2;\nSound.beep(300 + Math.min(g.length, 20) * 30, 0.08, 'triangle', 0.04);\nhover = [];\nif (!anyMoves()) {\nconst left = remaining();\nif (left === 0) score += 1000;\nbest = recordBest('samegame-best', score);\nrender();\noverlay(ov, `<h2>${left === 0 ? 'Board cleared! +1000 🎉' : 'No more moves'}<\/h2><p>Score ${score} · ${left} blocks left<\/p><button class=\"btn\" onclick=\"newGame()\">New game<\/button><button class=\"btn alt\" onclick=\"undo()\">Undo<\/button>`);\nreturn;\n}\nrender();\n}\nfunction undo() {\nconst h = history.pop();\nif (!h) return;\ngrid = h.grid;\nscore = h.score;\noverlay(ov, null);\nrender();\n}\nfunction render() {\nctx.fillStyle = '#0b0c18';\nctx.fillRect(0, 0, cv.width, cv.height);\nconst hs = new Set(hover.map(([x, y]) => x + ',' + y));\ngrid.forEach((col, x) => col.forEach((v, y) => {\nif (v == null) return;\nconst px = x * S, py = (ROWS - 1 - y) * S;\nctx.fillStyle = COLORS[v];\nctx.globalAlpha = hover.length && !hs.has(x + ',' + y) ? 0.55 : 1;\nctx.beginPath(); ctx.roundRect(px + 2, py + 2, S - 4, S - 4, 7); ctx.fill();\nctx.fillStyle = 'rgba(255,255,255,.3)';\nctx.fillRect(px + 7, py + 6, S - 18, 5);\n}));\nctx.globalAlpha = 1;\nif (hover.length >= 2) {\nconst [x, y] = hover[0];\nconst pts = (hover.length - 2) ** 2;\nctx.fillStyle = '#fff';\nctx.font = 'bold 15px system-ui';\nctx.textAlign = 'center';\nctx.fillText(`${hover.length} → +${pts}`, clamp(x * S + S / 2, 40, cv.width - 40), clamp((ROWS - 1 - y) * S - 6, 16, cv.height));\n}\ndocument.getElementById('score').textContent = score;\ndocument.getElementById('left').textContent = remaining();\ndocument.getElementById('best').textContent = best;\n}\nconst cellOf = e => { const p = canvasPoint(cv, e); return [Math.floor(p.x / S), ROWS - 1 - Math.floor(p.y / S)]; };\ncv.addEventListener('pointermove', e => {\nif (e.pointerType !== 'mouse') return;\nconst g = groupAt(...cellOf(e));\nhover = g.length >= 2 ? g : [];\nrender();\n});\ncv.addEventListener('pointerleave', () => { hover = []; render(); });\ncv.addEventListener('click', e => click(...cellOf(e)));\ndocument.getElementById('new').onclick = newGame;\ndocument.getElementById('colors').onchange = newGame;\ndocument.getElementById('undo').onclick = undo;\ndocument.addEventListener('keydown', e => { if (e.key === 'z' || e.key === 'u') undo(); });\nnewGame();\n<\/script>\n<\/body>\n<\/html>",
"code-breaker": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Code Breaker<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<style>\n#rows { display: flex; flex-direction: column-reverse; gap: 6px; background: var(--panel); padding: 12px; border-radius: 12px; border: 1px solid var(--line); }\n.row { display: flex; align-items: center; gap: 12px; padding: 4px 8px; border-radius: 8px; }\n.row.active { background: var(--panel-2); }\n.row .n { width: 18px; color: var(--muted); font-size: 12px; text-align: right; }\n.slots { display: flex; gap: 8px; }\n.slot { width: 34px; height: 34px; border-radius: 50%; background: #0b0c18; box-shadow: inset 0 2px 4px rgba(0,0,0,.6); border: 0; padding: 0; }\n.row.active .slot { cursor: pointer; outline: 1px dashed #4b5280; }\n.fb { display: grid; grid-template-columns: repeat(3, 10px); gap: 3px; width: 42px; }\n.fb i { width: 10px; height: 10px; border-radius: 50%; background: #0b0c18; display: block; }\n.fb i.b { background: #f8fafc; } .fb i.w { background: #64748b; box-shadow: inset 0 0 0 2px #f8fafc; }\n.palette { display: flex; gap: 10px; margin: 14px 0 8px; flex-wrap: wrap; justify-content: center; }\n.palette button { width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); cursor: pointer; }\n.secret .slot { box-shadow: none; }\n.peg { box-shadow: inset -3px -4px 6px rgba(0,0,0,.35), inset 3px 3px 5px rgba(255,255,255,.35) !important; }\n<\/style>\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>🔐 Code Breaker<\/h1>\n<div class=\"stats\">Solved <b id=\"wins\">0<\/b> Best <b id=\"best\">—<\/b><\/div>\n<\/header>\n<div class=\"controls\">\n<select id=\"mode\"><option value=\"4,6\">Classic · 4 pegs, 6 colours<\/option><option value=\"5,8\">Hard · 5 pegs, 8 colours<\/option><\/select>\n<button class=\"btn alt\" id=\"new\">New code<\/button>\n<\/div>\n<div class=\"stage\">\n<div id=\"rows\"><\/div>\n<\/div>\n<div class=\"palette\" id=\"pal\"><\/div>\n<div class=\"controls\"><button class=\"btn alt\" id=\"back\">⌫ Erase<\/button><button class=\"btn\" id=\"submit\">Check guess<\/button><\/div>\n<div class=\"msg\" id=\"msg\"><\/div>\n<p class=\"help\">Crack the hidden colour code in 10 guesses. After each guess: a <b>white<\/b> peg means right colour in the right spot, a <b>ringed grey<\/b> peg means right colour in the wrong spot. Colours can repeat. Keys <kbd>1<\/kbd>–<kbd>8<\/kbd>, <kbd>Backspace<\/kbd>, <kbd>Enter<\/kbd>.<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst COLORS = ['#ef4444', '#f59e0b', '#facc15', '#22c55e', '#3b82f6', '#a855f7', '#ec4899', '#f8fafc'];\nconst ROWS = 10;\nlet P, K, secret, guesses, cur, over;\nlet wins = Store.get('codebreaker-wins', 0);\nfunction newGame() {\n[P, K] = document.getElementById('mode').value.split(',').map(Number);\nsecret = Array.from({ length: P }, () => randInt(0, K - 1));\nguesses = [];\ncur = [];\nover = false;\nconst pal = document.getElementById('pal');\npal.innerHTML = '';\nfor (let i = 0; i < K; i++) {\nconst b = document.createElement('button');\nb.className = 'peg';\nb.style.background = COLORS[i];\nb.onclick = () => add(i);\npal.appendChild(b);\n}\ndocument.getElementById('msg').textContent = '';\nrender();\n}\nfunction score(g) {\nlet black = 0, white = 0;\nconst sc = Array(K).fill(0), gc = Array(K).fill(0);\ng.forEach((v, i) => { if (v === secret[i]) black++; else { sc[secret[i]]++; gc[v]++; } });\nfor (let i = 0; i < K; i++) white += Math.min(sc[i], gc[i]);\nreturn { black, white };\n}\nfunction render() {\nconst rows = document.getElementById('rows');\nrows.innerHTML = '';\nfor (let r = 0; r < ROWS; r++) {\nconst row = document.createElement('div');\nconst active = !over && r === guesses.length;\nrow.className = 'row' + (active ? ' active' : '');\nconst g = guesses[r], vals = g ? g.g : active ? cur : [];\nlet slots = '';\nfor (let i = 0; i < P; i++) {\nconst v = vals[i];\nslots += `<button class=\"slot${v != null ? ' peg' : ''}\" data-i=\"${i}\" style=\"${v != null ? 'background:' + COLORS[v] : ''}\"><\/button>`;\n}\nlet fb = '';\nif (g) for (let i = 0; i < P; i++) fb += `<i class=\"${i < g.black ? 'b' : i < g.black + g.white ? 'w' : ''}\"><\/i>`;\nrow.innerHTML = `<span class=\"n\">${r + 1}<\/span><div class=\"slots\">${slots}<\/div><div class=\"fb\">${fb}<\/div>`;\nif (active) row.querySelectorAll('.slot').forEach(s => { s.onclick = () => { const i = +s.dataset.i; if (i < cur.length) { cur.splice(i, 1); render(); } }; });\nrows.appendChild(row);\n}\nif (over) {\nconst row = document.createElement('div');\nrow.className = 'row secret';\nrow.innerHTML = `<span class=\"n\">🔓<\/span><div class=\"slots\">${secret.map(v => `<span class=\"slot peg\" style=\"background:${COLORS[v]}\"><\/span>`).join('')}<\/div><div class=\"fb\"><\/div>`;\nrows.prepend(row);\n}\ndocument.getElementById('wins').textContent = wins;\nconst b = Store.get('codebreaker-best-' + P, null);\ndocument.getElementById('best').textContent = b ? b + ' guesses' : '—';\n}\nfunction add(i) {\nif (over || cur.length >= P) return;\ncur.push(i);\nSound.beep(300 + i * 60, 0.04, 'triangle', 0.03);\nrender();\n}\nfunction submit() {\nconst msg = document.getElementById('msg');\nif (over) return newGame();\nif (cur.length < P) { msg.textContent = `Pick ${P} colours first`; return; }\nconst s = score(cur);\nguesses.push({ g: cur.slice(), ...s });\ncur = [];\nmsg.textContent = '';\nif (s.black === P) {\nover = true;\nwins++;\nStore.set('codebreaker-wins', wins);\nrecordBest('codebreaker-best-' + P, guesses.length, true);\nmsg.textContent = `Cracked it in ${guesses.length} ${guesses.length === 1 ? 'guess' : 'guesses'}! 🎉 Press Enter for a new code.`;\nSound.beep(880, 0.3, 'triangle');\n} else if (guesses.length >= ROWS) {\nover = true;\nmsg.textContent = 'Out of guesses — the code is shown above. Press Enter to try again.';\nSound.beep(150, 0.3, 'sawtooth');\n} else Sound.beep(500, 0.05, 'square', 0.03);\nrender();\n}\ndocument.getElementById('submit').onclick = submit;\ndocument.getElementById('back').onclick = () => { cur.pop(); render(); };\ndocument.getElementById('new').onclick = newGame;\ndocument.getElementById('mode').onchange = newGame;\ndocument.addEventListener('keydown', e => {\nconst n = +e.key;\nif (n >= 1 && n <= K) add(n - 1);\nelse if (e.key === 'Backspace') { cur.pop(); render(); }\nelse if (e.key === 'Enter') submit();\n});\nnewGame();\n<\/script>\n<\/body>\n<\/html>",
"pipes": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Pipes<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>🔌 Pipes<\/h1>\n<div class=\"stats\">Moves <b id=\"moves\">0<\/b> Connected <b id=\"conn\">0%<\/b> Time <b id=\"time\">0<\/b>s<\/div>\n<\/header>\n<div class=\"controls\">\n<select id=\"size\"><option value=\"5\">5 × 5<\/option><option value=\"7\" selected>7 × 7<\/option><option value=\"9\">9 × 9<\/option><option value=\"11\">11 × 11<\/option><\/select>\n<button class=\"btn\" id=\"new\">New puzzle<\/button>\n<\/div>\n<div class=\"stage\">\n<canvas id=\"c\" class=\"game\" width=\"560\" height=\"560\"><\/canvas>\n<div class=\"overlay hidden\" id=\"ov\"><\/div>\n<\/div>\n<p class=\"help\">Rotate the tiles so every pipe connects back to the power source in the middle and every 🖥️ lights up. Click to rotate clockwise, right-click (or <kbd>Shift<\/kbd>-click) for anticlockwise. There are no loops and no loose ends in the solution.<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov');\nconst DIRS = [[1, 0, -1, 4], [2, 1, 0, 8], [4, 0, 1, 1], [8, -1, 0, 2]];\nlet N, S, tiles, src, powered, moves, t0, timerId, done, anim = {};\nconst rotCW = m => ((m << 1) | (m >> 3)) & 15;\nconst rotCCW = m => ((m >> 1) | ((m & 1) << 3)) & 15;\nfunction generate() {\nN = +document.getElementById('size').value;\nS = cv.width / N;\nconst sol = Array(N * N).fill(0);\nsrc = Math.floor(N / 2) * N + Math.floor(N / 2);\nconst inTree = new Set([src]), frontier = [];\nconst addEdges = k => DIRS.forEach(([b, dx, dy, ob]) => {\nconst x = k % N + dx, y = Math.floor(k / N) + dy;\nif (x >= 0 && y >= 0 && x < N && y < N) frontier.push([k, y * N + x, b, ob]);\n});\naddEdges(src);\nwhile (frontier.length) {\nconst i = randInt(0, frontier
