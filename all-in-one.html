<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HTML Games Arcade — Mega All-In-One</title>
    <style>
      :root {
        --bg: #0b1021;
        --bg-2: #121a2d;
        --panel: rgba(17, 24, 39, 0.9);
        --panel-2: rgba(31, 41, 55, 0.8);
        --line: rgba(148, 163, 184, 0.25);
        --text: #e5eefb;
        --muted: #a8b5cf;
        --accent: #8b5cf6;
        --accent-2: #22d3ee;
        --shadow: rgba(15, 23, 42, 0.55);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(139, 92, 246, 0.14), transparent 28%),
          radial-gradient(circle at bottom right, rgba(34, 211, 238, 0.12), transparent 32%),
          var(--bg);
        color: var(--text);
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: stretch;
      }

      .app {
        width: 100%;
        display: grid;
        grid-template-columns: 360px minmax(0, 1fr);
        min-height: 100vh;
      }

      .sidebar {
        border-right: 1px solid var(--line);
        background: rgba(10, 16, 28, 0.92);
        backdrop-filter: blur(10px);
        padding: 18px 14px;
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 14px;
        padding: 2px 6px 10px;
      }

      .brand h1 {
        font-size: 1.2rem;
        margin: 0;
        letter-spacing: -0.04em;
      }

      .brand .badge {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: white;
        font-size: 0.72rem;
        font-weight: 700;
        padding: 6px 10px;
        border-radius: 999px;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        margin-bottom: 12px;
      }

      .controls input {
        width: 100%;
        background: rgba(15, 23, 42, 0.9);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 11px 12px;
        font-size: 0.96rem;
        outline: none;
      }

      .controls input:focus {
        border-color: rgba(139, 92, 246, 0.8);
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.18);
      }

      .controls button,
      .game-btn,
      .topbar button {
        border: 1px solid var(--line);
        background: rgba(31, 41, 55, 0.85);
        color: var(--text);
        border-radius: 12px;
        cursor: pointer;
        transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      }

      .controls button,
      .topbar button {
        padding: 10px 12px;
        font-weight: 600;
      }

      .controls button:hover,
      .game-btn:hover,
      .topbar button:hover {
        transform: translateY(-1px);
        border-color: rgba(139, 92, 246, 0.75);
      }

      .game-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: calc(100vh - 130px);
        overflow: auto;
        padding: 4px 2px 16px;
      }

      .game-btn {
        display: grid;
        grid-template-columns: 44px 1fr auto;
        align-items: center;
        gap: 10px;
        width: 100%;
        text-align: left;
        padding: 10px 10px;
        background: rgba(15, 23, 42, 0.7);
      }

      .game-btn.active {
        background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(34, 211, 238, 0.12));
        border-color: rgba(139, 92, 246, 0.7);
        box-shadow: inset 0 0 0 1px rgba(139, 92, 246, 0.35);
      }

      .game-icon {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-size: 1.4rem;
        background: rgba(139, 92, 246, 0.16);
        border: 1px solid rgba(148, 163, 184, 0.2);
      }

      .game-meta {
        min-width: 0;
      }

      .game-name {
        font-weight: 700;
        font-size: 0.96rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .game-desc {
        font-size: 0.73rem;
        color: var(--muted);
        line-height: 1.25;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .game-tag {
        font-size: 0.62rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 5px 7px;
        background: rgba(148, 163, 184, 0.08);
        border-radius: 999px;
      }

      .viewer {
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: rgba(8, 12, 22, 0.55);
      }

      .topbar {
        padding: 16px 18px 12px;
        border-bottom: 1px solid var(--line);
        background: rgba(14, 20, 31, 0.6);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .topbar h2 {
        margin: 0;
        font-size: 1.08rem;
        letter-spacing: -0.04em;
      }

      .topbar .actions {
        display: flex;
        gap: 8px;
      }

      .frame-wrap {
        flex: 1;
        min-height: 0;
        padding: 14px;
      }

      iframe {
        width: 100%;
        height: 100%;
        min-height: 760px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: white;
        box-shadow: 0 18px 48px var(--shadow);
      }

      .empty {
        color: var(--muted);
        background: rgba(15, 23, 42, 0.7);
        border: 1px dashed var(--line);
        padding: 18px 14px;
        border-radius: 12px;
        text-align: center;
      }

      @media (max-width: 980px) {
        .app {
          grid-template-columns: 1fr;
        }

        .sidebar {
          border-right: none;
          border-bottom: 1px solid var(--line);
        }

        .game-list {
          max-height: 40vh;
        }

        iframe {
          min-height: 560px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <h1>Mega All-In-One</h1>
          <span class="badge" id="totalBadge">0</span>
        </div>

        <div class="controls">
          <input id="searchInput" type="search" placeholder="Search games..." aria-label="Search games" />
          <button id="randomBtn" type="button">Random</button>
        </div>

        <div class="game-list" id="gameList"></div>
      </aside>

      <main class="viewer">
        <div class="topbar">
          <h2 id="titleLabel">Snake</h2>
          <div class="actions">
            <button id="openTabBtn" type="button">Open Game</button>
          </div>
        </div>
        <div class="frame-wrap">
          <iframe id="gameFrame" title="Game viewer" src="games/snake.html"></iframe>
        </div>
      </main>
    </div>

    <script>
      const GAMES = [
        ['snake', 'Snake', '🐍', 'Arcade', 'Eat apples and grow longer without biting yourself.'],
        ['blockfall', 'Blockfall', '🧱', 'Arcade', 'Classic falling-blocks puzzler with hold, ghost piece and levels.'],
        ['brick-breaker', 'Brick Breaker', '🏏', 'Arcade', 'Bounce the ball, smash bricks, catch power-ups.'],
        ['pong', 'Pong', '🏓', 'Arcade', 'The original paddle duel — vs the CPU or a friend.'],
        ['alien-invasion', 'Alien Invasion', '👾', 'Arcade', 'Hold off waves of marching aliens from behind your bunkers.'],
        ['asteroids', 'Asteroids', '☄️', 'Arcade', 'Thrust, rotate and blast drifting space rocks.'],
        ['flappy', 'Flappy', '🐤', 'Arcade', 'Tap to flap through an endless line of pipes.'],
        ['dino-run', 'Dino Run', '🦖', 'Arcade', 'Jump cacti and duck birds in an endless desert run.'],
        ['road-hopper', 'Road Hopper', '🐸', 'Arcade', 'Hop across traffic and ride logs to reach home.'],
        ['maze-muncher', 'Maze Muncher', '🟡', 'Arcade', 'Gobble every dot while four ghosts hunt you down.'],
        ['missile-defense', 'Missile Defense', '🚀', 'Arcade', 'Intercept incoming missiles to protect six cities.'],
        ['cave-flyer', 'Cave Flyer', '🚁', 'Arcade', 'Hold to climb, release to fall through a narrowing cave.'],
        ['sky-jumper', 'Sky Jumper', '🦘', 'Arcade', 'Bounce from platform to platform, ever upward.'],
        ['light-cycles', 'Light Cycles', '🏍️', 'Arcade', 'Trap up to three bots with your light trail.'],
        ['star-shooter', 'Star Shooter', '🌠', 'Arcade', 'Vertical space shooter with power-ups and bosses.'],
        ['lunar-lander', 'Lunar Lander', '🌙', 'Arcade', 'Feather the thrusters and touch down gently.'],
        ['stack-tower', 'Stack Tower', '🏗️', 'Arcade', 'Time each drop to build the tallest tower.'],
        ['fruit-catcher', 'Fruit Catcher', '🧺', 'Arcade', 'Catch falling fruit in your basket, dodge the bombs.'],
        ['bubble-shooter', 'Bubble Shooter', '🫧', 'Arcade', 'Aim, bounce and pop clusters of matching bubbles.'],
        ['air-hockey', 'Air Hockey', '🏒', 'Arcade', 'Fast-paced puck physics against a CPU opponent.'],
        ['artillery', 'Artillery', '💣', 'Arcade', 'Angle, power and wind — a turn-based tank duel.'],
        ['pixel-jumper', 'Pixel Jumper', '🍄', 'Arcade', 'A three-level side-scrolling platformer.'],
        ['whack-a-mole', 'Whack-a-Mole', '🔨', 'Skill', '30 seconds to bop as many moles as you can.'],
        ['simon', 'Simon Says', '🚦', 'Skill', 'Repeat the ever-growing sequence of lights and tones.'],
        ['reaction-time', 'Reaction Time', '⚡', 'Skill', 'How fast can you click when the screen turns green?'],
        ['aim-trainer', 'Aim Trainer', '🎯', 'Skill', 'Hit 30 targets as quickly and accurately as possible.'],
        ['typing-rush', 'Typing Rush', '⌨️', 'Skill', 'Type the falling words before they hit the ground.'],
        ['piano-tiles', 'Piano Tiles', '🎹', 'Skill', "Tap the black tiles and don't miss a beat."],
        ['color-match', 'Color Match', '🎨', 'Skill', 'A speedy brain teaser: meaning vs ink colour.'],
        ['quick-math', 'Quick Math', '➗', 'Skill', 'Solve as many sums as you can in 60 seconds.'],
        ['gem-clicker', 'Gem Clicker', '💎', 'Skill', 'Click, upgrade and automate your way to riches.'],
        ['2048', '2048', '🔢', 'Puzzle', 'Slide and merge tiles to reach 2048.'],
        ['minesweeper', 'Minesweeper', '🚩', 'Puzzle', 'Clear the field without setting off a mine.'],
        ['sudoku', 'Sudoku', '🧮', 'Puzzle', 'Freshly generated puzzles with notes and hints.'],
        ['sliding-puzzle', 'Sliding Puzzle', '🧩', 'Puzzle', 'The classic 8, 15 and 24 tile puzzles.'],
        ['memory-match', 'Memory Match', '🃏', 'Puzzle', 'Flip cards and find all the pairs.'],
        ['lights-out', 'Lights Out', '💡', 'Puzzle', 'Toggle lights in a cross pattern until all are off.'],
        ['box-pusher', 'Box Pusher', '📦', 'Puzzle', '14 hand-made crate-pushing levels.'],
        ['nonogram', 'Nonogram', '🖼️', 'Puzzle', 'Use number clues to paint a hidden picture.'],
        ['maze-runner', 'Maze Runner', '🌀', 'Puzzle', 'Escape randomly generated mazes that keep growing.'],
        ['peg-solitaire', 'Peg Solitaire', '🟠', 'Puzzle', 'Jump pegs until only one remains.'],
        ['tower-of-hanoi', 'Tower of Hanoi', '🗼', 'Puzzle', 'Move the tower one disk at a time.'],
        ['flood-it', 'Flood It', '🌊', 'Puzzle', 'Flood the board with one colour in limited moves.'],
        ['gem-swap', 'Gem Swap', '💠', 'Puzzle', 'Match-3 with cascades — 30 moves to score big.'],
        ['same-game', 'SameGame', '🟪', 'Puzzle', 'Pop groups of blocks; bigger groups score more.'],
        ['code-breaker', 'Code Breaker', '🔐', 'Puzzle', 'Deduce the hidden colour code in 10 guesses.'],
        ['pipes', 'Pipes', '🔌', 'Puzzle', 'Rotate tiles to connect every pipe to the power.'],
        ['word-guess', 'Word Guess', '🟩', 'Word', 'Find the 5-letter word in six tries. Daily and unlimited.'],
        ['hangman', 'Hangman', '🪢', 'Word', 'Guess the word letter by letter across seven categories.'],
        ['word-search', 'Word Search', '🔍', 'Word', 'Find the hidden words in a grid of letters.'],
        ['word-scramble', 'Word Scramble', '🔤', 'Word', 'Unscramble words against the clock.'],
        ['tic-tac-toe', 'Tic-Tac-Toe', '❌', 'Board', 'Noughts and crosses with an unbeatable CPU.'],
        ['connect-four', 'Connect Four', '🔴', 'Board', 'Drop discs and line up four before the CPU does.'],
        ['checkers', 'Checkers', '⛀', 'Board', 'Draughts with forced captures, kings and a smart CPU.'],
        ['reversi', 'Reversi', '⚫', 'Board', 'Outflank and flip your opponent’s discs.'],
        ['gomoku', 'Gomoku', '⚪', 'Board', 'Five in a row on a 15×15 board.'],
        ['dots-and-boxes', 'Dots & Boxes', '🔲', 'Board', 'Draw lines, close boxes, don’t give away chains.'],
        ['battleship', 'Battleship', '🚢', 'Board', 'Hunt down and sink the enemy fleet.'],
        ['mancala', 'Mancala', '🫘', 'Board', 'Sow and capture seeds in this ancient game.'],
        ['solitaire', 'Solitaire', '🂡', 'Cards & Dice', 'Klondike with drag-and-drop, undo and hints.'],
        ['blackjack', 'Blackjack', '♠️', 'Cards & Dice', 'Beat the dealer to 21. Split, double and bet.'],
        ['yacht-dice', 'Yacht Dice', '🎲', 'Cards & Dice', 'Roll five dice and fill the 13-box scorecard.'],
        ['higher-lower', 'Higher or Lower', '⬆️', 'Cards & Dice', 'Guess if the next card is higher or lower.'],
        ['rock-paper-scissors', 'Rock Paper Scissors', '✊', 'Cards & Dice', 'Against a CPU that learns your patterns.']
      ];

      const totalBadge = document.getElementById('totalBadge');
      const searchInput = document.getElementById('searchInput');
      const randomBtn = document.getElementById('randomBtn');
      const gameList = document.getElementById('gameList');
      const titleLabel = document.getElementById('titleLabel');
      const gameFrame = document.getElementById('gameFrame');
      const openTabBtn = document.getElementById('openTabBtn');

      let selectedId = 'snake';

      function getFilteredGames() {
        const query = searchInput.value.trim().toLowerCase();
        if (!query) return GAMES;

        return GAMES.filter(([id, name, icon, category, desc]) => {
          return `${id} ${name} ${category} ${desc}`.toLowerCase().includes(query);
        });
      }

      function renderList() {
        const filteredGames = getFilteredGames();
        totalBadge.textContent = filteredGames.length;
        gameList.innerHTML = '';

        if (!filteredGames.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = 'No games match your search.';
          gameList.appendChild(empty);
          return;
        }

        filteredGames.forEach(([id, name, icon, category, desc]) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'game-btn' + (selectedId === id ? ' active' : '');
          button.innerHTML = `
            <div class="game-icon" style="background: linear-gradient(135deg, rgba(139,92,246,.24), rgba(34,211,238,.12));">${icon}</div>
            <div class="game-meta">
              <div class="game-name">${name}</div>
              <div class="game-desc">${desc}</div>
            </div>
            <div class="game-tag">${category}</div>
          `;

          button.addEventListener('click', () => {
            selectedId = id;
            renderList();
            loadGame(id);
          });

          gameList.appendChild(button);
        });
      }

      function loadGame(id) {
        const matching = GAMES.find(([gameId]) => gameId === id);
        if (!matching) return;

        const [, name] = matching;
        titleLabel.textContent = name;
        gameFrame.src = `games/${id}.html`;
        openTabBtn.textContent = `Open ${name}`;
      }

      searchInput.addEventListener('input', () => {
        const filtered = getFilteredGames();
        if (!filtered.length) return;
        const first = filtered[0][0];
        if (!filtered.some(([id]) => id === selectedId)) {
          selectedId = first;
        }
        renderList();
        loadGame(selectedId);
      });

      randomBtn.addEventListener('click', () => {
        const filtered = getFilteredGames();
        const pool = filtered.length ? filtered : GAMES;
        const next = pool[Math.floor(Math.random() * pool.length)][0];
        selectedId = next;
        renderList();
        loadGame(next);
      });

      openTabBtn.addEventListener('click', () => {
        const url = new URL(`games/${selectedId}.html`, window.location.href);
        window.open(url.toString(), '_blank', 'noopener,noreferrer');
      });

      renderList();
      loadGame(selectedId);
    </script>
  </body>
</html>
