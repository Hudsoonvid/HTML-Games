n bag.pop();\n}\nfunction spawn(type) {\nconst m = SHAPES[type].map(r => r.slice());\npiece = { type, m, x: Math.floor((W - m.length) / 2), y: type === 'I' ? -1 : 0 };\nlockAcc = 0;\nlockMoves = 0;\nif (collides(piece.m, piece.x, piece.y)) gameOver();\n}\nfunction collides(m, px, py) {\nfor (let y = 0; y < m.length; y++) for (let x = 0; x < m[y].length; x++) {\nif (!m[y][x]) continue;\nconst bx = px + x, by = py + y;\nif (bx < 0 || bx >= W || by >= H) return true;\nif (by >= 0 && board[by][bx]) return true;\n}\nreturn false;\n}\nfunction move(dx, dy) {\nif (!collides(piece.m, piece.x + dx, piece.y + dy)) {\npiece.x += dx;\npiece.y += dy;\nif (dx && lockMoves < 15) { lockAcc = 0; lockMoves++; }\nreturn true;\n}\nreturn false;\n}\nfunction rotate(dir) {\nconst m = dir > 0 ? rotateCW(piece.m) : rotateCCW(piece.m);\nfor (const [kx, ky] of [[0, 0], [-1, 0], [1, 0], [-2, 0], [2, 0], [0, -1], [-1, -1], [1, -1]]) {\nif (!collides(m, piece.x + kx, piece.y + ky)) {\npiece.m = m;\npiece.x += kx;\npiece.y += ky;\nif (lockMoves < 15) { lockAcc = 0; lockMoves++; }\nreturn;\n}\n}\n}\nfunction ghostY() {\nlet y = piece.y;\nwhile (!collides(piece.m, piece.x, y + 1)) y++;\nreturn y;\n}\nfunction hardDrop() {\nconst y = ghostY();\nscore += (y - piece.y) * 2;\npiece.y = y;\nlock();\n}\nfunction lock() {\nfor (let y = 0; y < piece.m.length; y++) for (let x = 0; x < piece.m[y].length; x++) {\nif (!piece.m[y][x]) continue;\nif (piece.y + y < 0) return gameOver();\nboard[piece.y + y][piece.x + x] = piece.type;\n}\nlet cleared = 0;\nfor (let y = H - 1; y >= 0; y--) {\nif (board[y].every(Boolean)) {\nboard.splice(y, 1);\nboard.unshift(Array(W).fill(null));\ncleared++;\ny++;\n}\n}\nif (cleared) {\nscore += [0, 100, 300, 500, 800][cleared] * level;\nlines += cleared;\nlevel = Math.floor(lines / 10) + 1;\nSound.beep(520 + cleared * 120, 0.12, 'triangle');\n}\ncanHold = true;\nspawn(nextQ.shift());\nnextQ.push(nextType());\n}\nfunction doHold() {\nif (!canHold) return;\ncanHold = false;\nconst t = piece.type;\nif (hold) spawn(hold);\nelse { spawn(nextQ.shift()); nextQ.push(nextType()); }\nhold = t;\n}\nconst gravity = () => Math.max(40, 1000 * Math.pow(0.85, level - 1));\nfunction update(dt) {\ndropAcc += dt;\nconst g = gravity();\nwhile (dropAcc >= g) {\ndropAcc -= g;\nif (!move(0, 1)) break;\n}\nif (collides(piece.m, piece.x, piece.y + 1)) {\nlockAcc += dt;\nif (lockAcc > 500) lock();\n} else {\nlockAcc = 0;\n}\n}\nfunction cell(x, y, color, alpha = 1, size = S) {\nctx.globalAlpha = alpha;\nctx.fillStyle = color;\nctx.fillRect(x + 1, y + 1, size - 2, size - 2);\nctx.fillStyle = 'rgba(255,255,255,.25)';\nctx.fillRect(x + 1, y + 1, size - 2, 4);\nctx.fillStyle = 'rgba(0,0,0,.25)';\nctx.fillRect(x + 1, y + size - 5, size - 2, 4);\nctx.globalAlpha = 1;\n}\nfunction drawMini(type, ox, oy) {\nif (!type) return;\nconst m = SHAPES[type], s = 20;\nconst w = m[0].length * s, h = m.length * s;\nm.forEach((r, y) => r.forEach((v, x) => { if (v) cell(ox + x * s + (80 - w) / 2, oy + y * s + (60 - h) / 2, COLORS[type], 1, s); }));\n}\nfunction draw() {\nctx.fillStyle = '#070912';\nctx.fillRect(0, 0, cv.width, cv.height);\nctx.strokeStyle = '#131830';\nfor (let x = 0; x <= W; x++) { ctx.beginPath(); ctx.moveTo(x * S + .5, 0); ctx.lineTo(x * S + .5, H * S); ctx.stroke(); }\nfor (let y = 0; y <= H; y++) { ctx.beginPath(); ctx.moveTo(0, y * S + .5); ctx.lineTo(W * S, y * S + .5); ctx.stroke(); }\nboard.forEach((r, y) => r.forEach((t, x) => { if (t) cell(x * S, y * S, COLORS[t]); }));\nif (piece && state !== 'ready') {\nconst gy = ghostY();\npiece.m.forEach((r, y) => r.forEach((v, x) => { if (v && gy + y >= 0) cell((piece.x + x) * S, (gy + y) * S, COLORS[piece.type], 0.2); }));\npiece.m.forEach((r, y) => r.forEach((v, x) => { if (v && piece.y + y >= 0) cell((piece.x + x) * S, (piece.y + y) * S, COLORS[piece.type]); }));\n}\nctx.fillStyle = '#11142a';\nctx.fillRect(300, 0, 180, 600);\nctx.fillStyle = '#9097b8';\nctx.font = '14px system-ui';\nctx.fillText('NEXT', 320, 30);\nnextQ.slice(0, 3).forEach((t, i) => drawMini(t, 330, 40 + i * 70));\nctx.fillStyle = '#9097b8';\nctx.fillText('HOLD', 320, 270);\nctx.globalAlpha = canHold ? 1 : 0.4;\ndrawMini(hold, 330, 280);\nctx.globalAlpha = 1;\nconst stat = (label, val, y) => {\nctx.fillStyle = '#9097b8';\nctx.font = '14px system-ui';\nctx.fillText(label, 320, y);\nctx.fillStyle = '#e6e7f2';\nctx.font = 'bold 24px system-ui';\nctx.fillText(val, 320, y + 28);\n};\nstat('SCORE', score, 380);\nstat('LINES', lines, 450);\nstat('LEVEL', level, 520);\n}\nfunction loop(t) {\nconst dt = Math.min(100, t - last);\nlast = t;\nif (state === 'play') update(dt);\ndraw();\nrequestAnimationFrame(loop);\n}\nfunction start() {\nboard = Array.from({ length: H }, () => Array(W).fill(null));\nbag = [];\nnextQ = [nextType(), nextType(), nextType()];\nhold = null;\ncanHold = true;\nscore = 0; lines = 0; level = 1; dropAcc = 0;\nstate = 'play';\nspawn(nextType());\noverlay(ov, null);\n}\nfunction gameOver() {\nstate = 'over';\nbest = recordBest('blockfall-best', score);\ndocument.getElementById('best').textContent = best;\noverlay(ov, `<h2>Game over<\/h2><p>Score ${score} · Lines ${lines}<\/p><p>Best ${best}<\/p><button class=\"btn\" onclick=\"start()\">Play again<\/button>`);\n}\nfunction togglePause() {\nif (state === 'play') { state = 'paused'; overlay(ov, '<h2>Paused<\/h2><p>Press P to resume<\/p>'); }\nelse if (state === 'paused') { state = 'play'; overlay(ov, null); }\n}\nfunction act(a) {\nif (state !== 'play') return;\nif (a === 'left') move(-1, 0);\nelse if (a === 'right') move(1, 0);\nelse if (a === 'down') { if (move(0, 1)) { score += 1; dropAcc = 0; } }\nelse if (a === 'rot') rotate(1);\nelse if (a === 'rotl') rotate(-1);\nelse if (a === 'drop') hardDrop();\nelse if (a === 'hold') doHold();\n}\ndocument.addEventListener('keydown', e => {\nconst map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowDown: 'down', ArrowUp: 'rot', x: 'rot', X: 'rot', z: 'rotl', Z: 'rotl', ' ': 'drop', c: 'hold', C: 'hold', Shift: 'hold' };\nif (e.key === 'p' || e.key === 'P' || e.key === 'Escape') return togglePause();\nif ((state === 'ready' || state === 'over') && (e.key === ' ' || e.key === 'Enter')) return start();\nif (map[e.key]) act(map[e.key]);\n});\nonSwipe(cv, d => act({ left: 'left', right: 'right', down: 'drop', up: 'hold' }[d]), 30);\ncv.addEventListener('click', () => act('rot'));\n[['tL', 'left'], ['tR', 'right'], ['tRot', 'rot'], ['tD', 'down'], ['tH', 'drop']].forEach(([id, a]) =>\ndocument.getElementById(id).addEventListener('pointerdown', e => { e.preventDefault(); act(a); }));\nboard = Array.from({ length: H }, () => Array(W).fill(null));\nnextQ = []; score = 0; lines = 0; level = 1; canHold = true;\noverlay(ov, '<h2>Blockfall<\/h2><p>Clear lines, level up, survive.<\/p><button class=\"btn\" onclick=\"start()\">Start<\/button>');\nrequestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>",
"brick-breaker": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Brick Breaker<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>🏏 Brick Breaker<\/h1>\n<div class=\"stats\">Score <b id=\"score\">0<\/b> Lives <b id=\"lives\">3<\/b> Level <b id=\"level\">1<\/b> Best <b id=\"best\">0<\/b><\/div>\n<\/header>\n<div class=\"stage\">\n<canvas id=\"c\" class=\"game\" width=\"480\" height=\"600\"><\/canvas>\n<div class=\"overlay\" id=\"ov\"><\/div>\n<\/div>\n<p class=\"help\">Move the paddle with the mouse, touch, or <kbd>←<\/kbd><kbd>→<\/kbd>. <kbd>Space<\/kbd> / click launches the ball. Catch falling power-ups: <b style=\"color:#22d3ee\">W<\/b> wide, <b style=\"color:#f59e0b\">M<\/b> multiball, <b style=\"color:#22c55e\">S<\/b> slow, <b style=\"color:#ef4444\">+<\/b> extra life.<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov');\nconst CW = cv.width, CH = cv.height;\nconst COLS = 10, BW = 44, BH = 18, GAP = 3, TOP = 70;\nconst LEFT = (CW - (COLS * BW + (COLS - 1) * GAP)) / 2;\nlet paddle, balls, bricks, drops, score, lives, level, state = 'ready', keys = {}, last = 0, wideT = 0, slowT = 0;\nlet best = Store.get('brick-best', 0);\nfunction hud() {\ndocument.getElementById('score').textContent = score;\ndocument.getElementById('lives').textContent = lives;\ndocument.getElementById('level').textContent = level;\ndocument.getElementById('best').textContent = best;\n}\nfunction buildLevel() {\nbricks = [];\nconst rows = Math.min(5 + level, 10);\nfor (let r = 0; r < rows; r++) for (let c = 0; c < COLS; c++) {\nif (level % 3 === 2 && (r + c) % 4 === 0) continue;\nif (level % 3 === 0 && c > 1 && c < 8 && r % 3 === 1) continue;\nconst hp = r < Math.floor(level / 2) ? 2 : 1;\nbricks.push({ x: LEFT + c * (BW + GAP), y: TOP + r * (BH + GAP), hp, hue: (r * 32 + level * 40) % 360 });\n}\n}\nfunction newBall(stuck = true) {\nreturn { x: paddle.x, y: paddle.y - 10, vx: 0, vy: 0, r: 7, stuck };\n}\nconst baseSpeed = () => 5.2 + level * 0.35;\nfunction launch(b) {\nif (!b.stuck) return;\nb.stuck = false;\nconst a = rand(-0.4, 0.4) - Math.PI / 2;\nconst sp = baseSpeed();\nb.vx = Math.cos(a) * sp;\nb.vy = Math.sin(a) * sp;\n}\nfunction resetRound() {\npaddle = { x: CW / 2, y: CH - 40, w: 90, h: 12 };\nballs = [newBall()];\ndrops = [];\nwideT = slowT = 0;\n}\nfunction start() {\nscore = 0; lives = 3; level = 1;\nbuildLevel();\nresetRound();\nstate = 'play';\noverlay(ov, null);\nhud();\n}\nfunction loseLife() {\nlives--;\nSound.beep(160, 0.25, 'sawtooth');\nif (lives <= 0) {\nstate = 'over';\nbest = recordBest('brick-best', score);\nhud();\noverlay(ov, `<h2>Game over<\/h2><p>Score ${score} · reached level ${level}<\/p><button class=\"btn\">Play again<\/button>`);\nreturn;\n}\nresetRound();\nhud();\n}\nfunction hitBrick(b, br) {\nbr.hp--;\nscore += 10 * level;\nSound.beep(400 + br.hp * 200 + Math.random() * 80, 0.04);\nif (br.hp <= 0) {\nbricks.splice(bricks.indexOf(br), 1);\nif (Math.random() < 0.12) drops.push({ x: br.x + BW / 2, y: br.y, type: pick(['W', 'W', 'M', 'S', '+']) });\n}\n}\nfunction stepBall(b) {\nif (b.stuck) { b.x = paddle.x; b.y = paddle.y - paddle.h / 2 - b.r; return true; }\nconst slow = slowT > 0 ? 0.65 : 1;\nconst steps = 4;\nfor (let i = 0; i < steps; i++) {\nb.x += b.vx * slow / steps;\nb.y += b.vy * slow / steps;\nif (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); }\nif (b.x > CW - b.r) { b.x = CW - b.r; b.vx = -Math.abs(b.vx); }\nif (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy); }\nif (b.y > CH + 20) return false;\nconst pw = paddle.w / 2;\nif (b.vy > 0 && b.y + b.r >= paddle.y - paddle.h / 2 && b.y < paddle.y + paddle.h / 2 && b.x > paddle.x - pw - b.r && b.x < paddle.x + pw + b.r) {\nconst off = clamp((b.x - paddle.x) / pw, -1, 1);\nconst a = off * 1.05 - Math.PI / 2;\nconst sp = Math.min(Math.hypot(b.vx, b.vy) * 1.01, 11);\nb.vx = Math.cos(a) * sp;\nb.vy = Math.sin(a) * sp;\nb.y = paddle.y - paddle.h / 2 - b.r;\nSound.beep(240, 0.03);\n}\nfor (const br of bricks) {\nconst cx = clamp(b.x, br.x, br.x + BW), cy = clamp(b.y, br.y, br.y + BH);\nconst dx = b.x - cx, dy = b.y - cy;\nif (dx * dx + dy * dy < b.r * b.r) {\nconst overlapX = Math.min(b.x + b.r - br.x, br.x + BW - (b.x - b.r));\nconst overlapY = Math.min(b.y + b.r - br.y, br.y + BH - (b.y - b.r));\nif (overlapX < overlapY) { b.vx = b.x < br.x + BW / 2 ? -Math.abs(b.vx) : Math.abs(b.vx); }\nelse { b.vy = b.y < br.y + BH / 2 ? -Math.abs(b.vy) : Math.abs(b.vy); }\nhitBrick(b, br);\nbreak;\n}\n}\n}\nif (Math.abs(b.vy) < 1.2) b.vy = b.vy < 0 ? -1.2 : 1.2;\nreturn true;\n}\nfunction update(dt) {\nconst f = dt / 16.67;\nif (keys.ArrowLeft) paddle.x -= 8 * f;\nif (keys.ArrowRight) paddle.x += 8 * f;\nwideT = Math.max(0, wideT - dt);\nslowT = Math.max(0, slowT - dt);\npaddle.w = wideT > 0 ? 140 : 90;\npaddle.x = clamp(paddle.x, paddle.w / 2, CW - paddle.w / 2);\nballs = balls.filter(stepBall);\nif (!balls.length) return loseLife();\nfor (const d of drops) {\nd.y += 2.6 * f;\nif (d.y > paddle.y - 10 && d.y < paddle.y + 10 && Math.abs(d.x - paddle.x) < paddle.w / 2 + 10) {\nd.dead = true;\nSound.beep(880, 0.1, 'triangle');\nif (d.type === 'W') wideT = 12000;\nif (d.type === 'S') slowT = 10000;\nif (d.type === '+') lives++;\nif (d.type === 'M') {\nconst src = balls[0];\nfor (let k = 0; k < 2; k++) {\nconst nb = { ...src, stuck: false };\nconst a = rand(-2.4, -0.7), sp = baseSpeed();\nnb.vx = Math.cos(a) * sp;\nnb.vy = Math.sin(a) * sp;\nballs.push(nb);\n}\n}\nhud();\n}\n}\ndrops = drops.filter(d => !d.dead && d.y < CH + 20);\nif (!bricks.length) {\nlevel++;\nscore += 100 * lives;\nbuildLevel();\nresetRound();\nhud();\nstate = 'between';\noverlay(ov, `<h2>Level ${level}<\/h2><p>Click or press Space to continue<\/p>`);\n}\nhud();\n}\nfunction draw() {\nconst g = ctx.createLinearGradient(0, 0, 0, CH);\ng.addColorStop(0, '#0b0d22');\ng.addColorStop(1, '#05060d');\nctx.fillStyle = g;\nctx.fillRect(0, 0, CW, CH);\nfor (const br of bricks) {\nctx.fillStyle = `hsl(${br.hue}, 75%, ${br.hp > 1 ? 38 : 58}%)`;\nctx.beginPath();\nctx.roundRect(br.x, br.y, BW, BH, 4);\nctx.fill();\nctx.fillStyle = 'rgba(255,255,255,.22)';\nctx.fillRect(br.x + 3, br.y + 2, BW - 6, 4);\nif (br.hp > 1) { ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.strokeRect(br.x + 1.5, br.y + 1.5, BW - 3, BH - 3); }\n}\nfor (const d of drops) {\nctx.fillStyle = { W: '#22d3ee', M: '#f59e0b', S: '#22c55e', '+': '#ef4444' }[d.type];\nctx.beginPath();\nctx.roundRect(d.x - 14, d.y - 9, 28, 18, 9);\nctx.fill();\nctx.fillStyle = '#05060d';\nctx.font = 'bold 13px system-ui';\nctx.textAlign = 'center';\nctx.fillText(d.type, d.x, d.y + 5);\nctx.textAlign = 'left';\n}\nctx.fillStyle = wideT > 0 ? '#22d3ee' : '#c4b5fd';\nctx.beginPath();\nctx.roundRect(paddle.x - paddle.w / 2, paddle.y - paddle.h / 2, paddle.w, paddle.h, 6);\nctx.fill();\nfor (const b of balls) {\nctx.fillStyle = slowT > 0 ? '#86efac' : '#fff';\nctx.beginPath();\nctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);\nctx.fill();\n}\n}\nfunction loop(t) {\nconst dt = Math.min(50, t - last);\nlast = t;\nif (state === 'play') update(dt);\ndraw();\nrequestAnimationFrame(loop);\n}\nfunction primary() {\nif (state === 'ready' || state === 'over') return start();\nif (state === 'between') { state = 'play'; overlay(ov, null); return; }\nif (state === 'play') balls.forEach(launch);\n}\ncv.addEventListener('pointermove', e => { if (paddle) paddle.x = canvasPoint(cv, e).x; });\ncv.addEventListener('pointerdown', e => { if (paddle) paddle.x = canvasPoint(cv, e).x; primary(); });\nov.addEventListener('click', primary);\ndocument.addEventListener('keydown', e => {\nkeys[e.key] = true;\nif (e.key === ' ' || e.key === 'Enter') primary();\nif ((e.key === 'p' || e.key === 'P') && (state === 'play' || state === 'paused')) {\nstate = state === 'play' ? 'paused' : 'play';\noverlay(ov, state === 'paused' ? '<h2>Paused<\/h2><p>Press P to resume<\/p>' : null);\n}\n});\ndocument.addEventListener('keyup', e => { keys[e.key] = false; });\nscore = 0; lives = 3; level = 1;\nbuildLevel();\nresetRound();\nhud();\noverlay(ov, '<h2>Brick Breaker<\/h2><p>Smash every brick to advance.<\/p><button class=\"btn\">Start<\/button>');\nrequestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>",
"pong": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Pong<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>🏓 Pong<\/h1>\n<div class=\"stats\">First to <b>7<\/b><\/div>\n<\/header>\n<div class=\"controls\">\n<select id=\"mode\">\n<option value=\"easy\">1 player · Easy<\/option>\n<option value=\"normal\" selected>1 player · Normal<\/option>\n<option value=\"hard\">1 player · Hard<\/option>\n<option value=\"2p\">2 players<\/option>\n<\/select>\n<button class=\"btn\" id=\"go\">New match<\/button>\n<\/div>\n<div class=\"stage\">\n<canvas id=\"c\" class=\"game\" width=\"720\" height=\"440\"><\/canvas>\n<div class=\"overlay\" id=\"ov\"><\/div>\n<\/div>\n<p class=\"help\">Left paddle: <kbd>W<\/kbd>/<kbd>S<\/kbd>, mouse or touch. Right paddle (2 players): <kbd>↑<\/kbd>/<kbd>↓<\/kbd>. <kbd>Space<\/kbd> serves / pauses.<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov');\nconst W = cv.width, H = cv.height, PH = 80, PW = 12, WIN = 7;\nlet L, R, ball, state = 'ready', keys = {}, last = 0, mode = 'normal', serveDir = 1, aiError = 0, aiTimer = 0;\nconst AI = { easy: { speed: 4, react: 0.35, err: 60 }, normal: { speed: 6, react: 0.2, err: 35 }, hard: { speed: 8.5, react: 0.08, err: 12 } };\nfunction resetBall() {\nball = { x: W / 2, y: H / 2, vx: 0, vy: 0, r: 8, wait: 700 };\n}\nfunction newMatch() {\nmode = document.getElementById('mode').value;\nL = { y: H / 2, score: 0 };\nR = { y: H / 2, score: 0 };\nserveDir = Math.random() < 0.5 ? -1 : 1;\nresetBall();\nstate = 'play';\noverlay(ov, null);\n}\nfunction serve() {\nconst a = rand(-0.5, 0.5);\nball.vx = Math.cos(a) * 6 * serveDir;\nball.vy = Math.sin(a) * 6;\n}\nfunction paddleHit(p, x, dir) {\nif (Math.abs(ball.y - p.y) < PH / 2 + ball.r && Math.abs(ball.x - x) < PW / 2 + ball.r && Math.sign(ball.vx) !== dir) {\nconst off = (ball.y - p.y) / (PH / 2);\nconst sp = Math.min(Math.hypot(ball.vx, ball.vy) + 0.4, 15);\nconst a = off * 0.9;\nball.vx = Math.cos(a) * sp * dir;\nball.vy = Math.sin(a) * sp;\nball.x = x + dir * (PW / 2 + ball.r);\nSound.beep(dir > 0 ? 440 : 520, 0.04);\n}\n}\nfunction point(side) {\nside.score++;\nSound.beep(200, 0.2, 'triangle');\nserveDir = side === L ? 1 : -1;\nif (side.score >= WIN) {\nstate = 'over';\nconst who = mode === '2p' ? (side === L ? 'Left player wins!' : 'Right player wins!') : (side === L ? 'You win! 🎉' : 'The computer wins');\noverlay(ov, `<h2>${who}<\/h2><p>${L.score} – ${R.score}<\/p><button class=\"btn\" onclick=\"newMatch()\">Play again<\/button>`);\n}\nresetBall();\n}\nfunction update(dt) {\nconst f = dt / 16.67;\nconst sp = 7 * f;\nif (keys.w || keys.W) L.y -= sp;\nif (keys.s || keys.S) L.y += sp;\nif (mode === '2p') {\nif (keys.ArrowUp) R.y -= sp;\nif (keys.ArrowDown) R.y += sp;\n} else {\nconst ai = AI[mode];\naiTimer -= dt;\nif (aiTimer <= 0) { aiTimer = ai.react * 1000; aiError = rand(-ai.err, ai.err); }\nlet target = H / 2;\nif (ball.vx > 0) {\nconst t = (W - 30 - ball.x) / ball.vx;\nlet py = ball.y + ball.vy * t;\nconst span = H - 2 * ball.r;\npy = ((py - ball.r) % (2 * span) + 2 * span) % (2 * span);\npy = py > span ? 2 * span - py : py;\ntarget = py + ball.r + aiError;\n}\nconst d = target - R.y;\nR.y += clamp(d, -ai.speed * f, ai.speed * f);\n}\nL.y = clamp(L.y, PH / 2, H - PH / 2);\nR.y = clamp(R.y, PH / 2, H - PH / 2);\nif (ball.wait > 0) {\nball.wait -= dt;\nif (ball.wait <= 0) serve();\nreturn;\n}\nconst steps = 3;\nfor (let i = 0; i < steps; i++) {\nball.x += ball.vx * f / steps;\nball.y += ball.vy * f / steps;\nif (ball.y < ball.r) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }\nif (ball.y > H - ball.r) { ball.y = H - ball.r; ball.vy = -Math.abs(ball.vy); }\npaddleHit(L, 30, 1);\npaddleHit(R, W - 30, -1);\n}\nif (ball.x < -20) point(R);\nelse if (ball.x > W + 20) point(L);\n}\nfunction draw() {\nctx.fillStyle = '#05060d';\nctx.fillRect(0, 0, W, H);\nctx.fillStyle = '#23264a';\nfor (let y = 10; y < H; y += 30) ctx.fillRect(W / 2 - 2, y, 4, 16);\nctx.font = 'bold 56px system-ui';\nctx.textAlign = 'center';\nctx.fillStyle = '#2e3260';\nctx.fillText(L.score, W / 2 - 80, 70);\nctx.fillText(R.score, W / 2 + 80, 70);\nctx.fillStyle = '#8b5cf6';\nctx.fillRect(30 - PW / 2, L.y - PH / 2, PW, PH);\nctx.fillStyle = '#22d3ee';\nctx.fillRect(W - 30 - PW / 2, R.y - PH / 2, PW, PH);\nctx.fillStyle = '#fff';\nctx.beginPath();\nctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);\nctx.fill();\n}\nfunction loop(t) {\nconst dt = Math.min(50, t - last);\nlast = t;\nif (state === 'play') update(dt);\ndraw();\nrequestAnimationFrame(loop);\n}\nfunction pointerMove(e) {\nif (state !== 'play') return;\nconst p = canvasPoint(cv, e);\nif (mode === '2p' && p.x > W / 2) R.y = p.y;\nelse L.y = p.y;\n}\ncv.addEventListener('pointermove', pointerMove);\ncv.addEventListener('pointerdown', pointerMove);\ndocument.addEventListener('keydown', e => {\nkeys[e.key] = true;\nif (e.key === ' ') {\nif (state === 'play') { state = 'paused'; overlay(ov, '<h2>Paused<\/h2><p>Space to resume<\/p>'); }\nelse if (state === 'paused') { state = 'play'; overlay(ov, null); }\nelse newMatch();\n}\n});\ndocument.addEventListener('keyup', e => { keys[e.key] = false; });\ndocument.getElementById('go').onclick = newMatch;\ndocument.getElementById('mode').onchange = newMatch;\nL = { y: H / 2, score: 0 };\nR = { y: H / 2, score: 0 };\nresetBall();\noverlay(ov, '<h2>Pong<\/h2><p>Pick a mode above, then start.<\/p><button class=\"btn\" onclick=\"newMatch()\">Start<\/button>');\nrequestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>",
"alien-invasion": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Alien Invasion<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>👾 Alien Invasion<\/h1>\n<div class=\"stats\">Score <b id=\"score\">0<\/b> Lives <b id=\"lives\">3<\/b> Wave <b id=\"wave\">1<\/b> Best <b id=\"best\">0<\/b><\/div>\n<\/header>\n<div class=\"stage\">\n<canvas id=\"c\" class=\"game\" width=\"520\" height=\"600\"><\/canvas>\n<div class=\"overlay\" id=\"ov\"><\/div>\n<\/div>\n<div class=\"touchpad\"><button id=\"tL\">◀<\/button><button id=\"tF\">🔥<\/button><button id=\"tR\">▶<\/button><\/div>\n<p class=\"help\"><kbd>←<\/kbd><kbd>→<\/kbd> move · <kbd>Space<\/kbd> fire · <kbd>P<\/kbd> pause. Hide behind the bunkers and shoot the mystery ship for bonus points.<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov');\nconst W = cv.width, H = cv.height;\nconst SPRITES = {\nsquid: [[\n'   XX   ', '  XXXX  ', ' XXXXXX ', 'XX XX XX', 'XXXXXXXX', '  X  X  ', ' X XX X ', 'X X  X X'\n], [\n'   XX   ', '  XXXX  ', ' XXXXXX ', 'XX XX XX', 'XXXXXXXX', ' X XX X ', 'X      X', ' X    X '\n]],\ncrab: [[\n'  X     X  ', '   X   X   ', '  XXXXXXX  ', ' XX XXX XX ', 'XXXXXXXXXXX', 'X XXXXXXX X', 'X X     X X', '   XX XX   '\n], [\n'  X     X  ', 'X  X   X  X', 'X XXXXXXX X', 'XXX XXX XXX', 'XXXXXXXXXXX', ' XXXXXXXXX ', '  X     X  ', ' X       X '\n]],\nocto: [[\n'    XXXX    ', ' XXXXXXXXXX ', 'XXXXXXXXXXXX', 'XXX  XX  XXX', 'XXXXXXXXXXXX', '   XX  XX   ', '  XX XX XX  ', 'XX        XX'\n], [\n'    XXXX    ', ' XXXXXXXXXX ', 'XXXXXXXXXXXX', 'XXX  XX  XXX', 'XXXXXXXXXXXX', '  XXX  XXX  ', ' XX  XX  XX ', '  XX    XX  '\n]],\nship: [['      X      ', '     XXX     ', '     XXX     ', ' XXXXXXXXXXX ', 'XXXXXXXXXXXXX', 'XXXXXXXXXXXXX', 'XXXXXXXXXXXXX']],\nufo: [['     XXXXXX     ', '   XXXXXXXXXX   ', '  XXXXXXXXXXXX  ', ' XX XX XX XX XX ', 'XXXXXXXXXXXXXXXX', '  XXX  XX  XXX  ', '   X        X   ']]\n};\nconst SCALE = 3;\nfunction render(rows, color) {\nconst c = document.createElement('canvas');\nc.width = rows[0].length * SCALE;\nc.height = rows.length * SCALE;\nconst g = c.getContext('2d');\ng.fillStyle = color;\nrows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch === 'X') g.fillRect(x * SCALE, y * SCALE, SCALE, SCALE); }));\nreturn c;\n}\nconst IMG = {\nsquid: SPRITES.squid.map(f => render(f, '#f472b6')),\ncrab: SPRITES.crab.map(f => render(f, '#22d3ee')),\nocto: SPRITES.octo.map(f => render(f, '#a3e635')),\nship: render(SPRITES.ship[0], '#8b5cf6'),\nufo: render(SPRITES.ufo[0], '#ef4444')\n};\nconst ROW_TYPES = ['squid', 'crab', 'crab', 'octo', 'octo'];\nconst POINTS = { squid: 30, crab: 20, octo: 10 };\nlet player, shots, bombs, aliens, bunkers, ufo, score, lives, wave, dirX, stepT, frame, state = 'ready', keys = {}, last = 0, fireCd = 0, particles;\nlet best = Store.get('invaders-best', 0);\nfunction hud() {\ndocument.getElementById('score').textContent = score;\ndocument.getElementById('lives').textContent = lives;\ndocument.getElementById('wave').textContent = wave;\ndocument.getElementById('best').textContent = best;\n}\nfunction buildWave() {\naliens = [];\nconst top = 70 + Math.min(wave - 1, 5) * 14;\nfor (let r = 0; r < 5; r++) for (let c = 0; c < 11; c++) {\naliens.push({ type: ROW_TYPES[r], x: 40 + c * 38, y: top + r * 34, alive: true });\n}\ndirX = 1;\nstepT = 0;\nframe = 0;\nshots = [];\nbombs = [];\nufo = null;\n}\nfunction buildBunkers() {\nbunkers = [];\nconst shape = ['  XXXXXXXX  ', ' XXXXXXXXXX ', 'XXXXXXXXXXXX', 'XXXXXXXXXXXX', 'XXXXXXXXXXXX', 'XXX      XXX', 'XX        XX'];\nfor (let i = 0; i < 4; i++) {\nconst bx = 60 + i * 120;\nshape.forEach((row, y) => [...row].forEach((ch, x) => {\nif (ch === 'X') for (let sy = 0; sy < 2; sy++) for (let sx = 0; sx < 2; sx++) bunkers.push({ x: bx + x * 4 + sx * 2, y: 480 + y * 4 + sy * 2, alive: true });\n}));\n}\n}\nfunction start() {\nscore = 0; lives = 3; wave = 1;\nplayer = { x: W / 2, y: 560, dead: 0 };\nparticles = [];\nbuildWave();\nbuildBunkers();\nstate = 'play';\noverlay(ov, null);\nhud();\n}\nfunction burst(x, y, color, n = 12) {\nfor (let i = 0; i < n; i++) particles.push({ x, y, vx: rand(-3, 3), vy: rand(-3, 3), life: rand(300, 600), color });\n}\nfunction hitBunker(x, y, r = 5) {\nlet hit = false;\nfor (const b of bunkers) {\nif (b.alive && Math.abs(b.x - x) <= 2 && Math.abs(b.y - y) <= 3) { hit = true; break; }\n}\nif (!hit) return false;\nfor (const b of bunkers) if (b.alive && Math.hypot(b.x - x, b.y - y) < r + Math.random() * 3) b.alive = false;\nreturn true;\n}\nfunction update(dt) {\nconst f = dt / 16.67;\nconst live = aliens.filter(a => a.alive);\nif (player.dead > 0) {\nplayer.dead -= dt;\nif (player.dead <= 0) { player.x = W / 2; bombs = []; }\n} else {\nif (keys.ArrowLeft || keys.a) player.x -= 4 * f;\nif (keys.ArrowRight || keys.d) player.x += 4 * f;\nplayer.x = clamp(player.x, 24, W - 24);\nfireCd -= dt;\nif ((keys[' '] || keys.fire) && fireCd <= 0 && shots.length < 1 + (wave > 3 ? 1 : 0)) {\nshots.push({ x: player.x, y: player.y - 14 });\nfireCd = 300;\nSound.beep(880, 0.05);\n}\n}\nconst interval = Math.max(40, 30 + live.length * 13 - wave * 25);\nstepT += dt;\nif (stepT >= interval) {\nstepT = 0;\nframe ^= 1;\nconst minX = Math.min(...live.map(a => a.x)), maxX = Math.max(...live.map(a => a.x + 36));\nif ((dirX > 0 && maxX + 8 > W - 8) || (dirX < 0 && minX - 8 < 8)) {\ndirX = -dirX;\nlive.forEach(a => { a.y += 16; });\n} else {\nlive.forEach(a => { a.x += 8 * dirX; });\n}\nSound.beep(frame ? 70 : 60, 0.06, 'square', 0.03);\n}\nif (Math.random() < (0.012 + wave * 0.004) * f && bombs.length < 3 + wave) {\nconst shooter = pick(live);\nif (shooter) {\nconst col = live.filter(a => Math.abs(a.x - shooter.x) < 10);\nconst low = col.reduce((m, a) => (a.y > m.y ? a : m), col[0]);\nbombs.push({ x: low.x + 16, y: low.y + 24, t: 0 });\n}\n}\nif (!ufo && Math.random() < 0.0015 * f) ufo = { x: Math.random() < 0.5 ? -50 : W + 50, y: 40 };\nif (ufo) {\nufo.vx = ufo.vx || (ufo.x < 0 ? 2 : -2);\nufo.x += ufo.vx * f;\nif (ufo.x < -60 || ufo.x > W + 60) ufo = null;\n}\nfor (const s of shots) {\ns.y -= 9 * f;\nif (s.y < 0) s.dead = true;\nif (hitBunker(s.x, s.y)) s.dead = true;\nfor (const a of live) {\nconst img = IMG[a.type][0];\nif (!s.dead && s.x > a.x && s.x < a.x + img.width && s.y > a.y && s.y < a.y + img.height) {\na.alive = false;\ns.dead = true;\nscore += POINTS[a.type];\nburst(a.x + img.width / 2, a.y + 12, '#fde047');\nSound.beep(300, 0.08, 'sawtooth');\n}\n}\nif (ufo && !s.dead && Math.abs(s.x - (ufo.x + 24)) < 26 && Math.abs(s.y - (ufo.y + 10)) < 14) {\nconst pts = pick([50, 100, 150, 300]);\nscore += pts;\nburst(ufo.x + 24, ufo.y + 10, '#ef4444', 24);\nufo = null;\ns.dead = true;\n}\n}\nshots = shots.filter(s => !s.dead);\nfor (const b of bombs) {\nb.y += (3 + wave * 0.3) * f;\nb.t += dt;\nif (b.y > H) b.dead = true;\nif (hitBunker(b.x, b.y, 6)) b.dead = true;\nif (!b.dead && player.dead <= 0 && Math.abs(b.x - player.x) < 20 && b.y > player.y - 10 && b.y < player.y + 12) {\nb.dead = true;\nkillPlayer();\n}\n}\nbombs = bombs.filter(b => !b.dead);\nfor (const a of live) {\nif (a.y + 24 >= 480) for (const b of bunkers) if (b.alive && b.x > a.x && b.x < a.x + 36 && b.y > a.y && b.y < a.y + 24) b.alive = false;\nif (a.y + 24 >= player.y - 10) { lives = 0; killPlayer(); return; }\n}\nparticles.forEach(p => { p.x += p.vx * f; p.y += p.vy * f; p.life -= dt; });\nparticles = particles.filter(p => p.life > 0);\nif (!aliens.some(a => a.alive)) {\nwave++;\nscore += 100;\nbuildWave();\nif (wave % 3 === 1) buildBunkers();\n}\nhud();\n}\nfunction killPlayer() {\nburst(player.x, player.y, '#8b5cf6', 30);\nSound.beep(120, 0.4, 'sawtooth');\nlives = Math.max(0, lives - 1);\nplayer.dead = 1500;\nhud();\nif (lives <= 0) {\nstate = 'over';\nbest = recordBest('invaders-best', score);\nhud();\noverlay(ov, `<h2>Earth has fallen<\/h2><p>Score ${score} · Wave ${wave}<\/p><button class=\"btn\" onclick=\"start()\">Play again<\/button>`);\n}\n}\nfunction draw() {\nctx.fillStyle = '#05060d';\nctx.fillRect(0, 0, W, H);\nfor (let i = 0; i < 60; i++) {\nctx.fillStyle = 'rgba(255,255,255,' + ((i * 37) % 10) / 20 + ')';\nctx.fillRect((i * 97) % W, (i * 53) % H, 1, 1);\n}\naliens.forEach(a => { if (a.alive) ctx.drawImage(IMG[a.type][frame], a.x, a.y); });\nif (ufo) ctx.drawImage(IMG.ufo, ufo.x, ufo.y);\nctx.fillStyle = '#22c55e';\nbunkers.forEach(b => { if (b.alive) ctx.fillRect(b.x, b.y, 2, 2); });\nif (player && player.dead <= 0) ctx.drawImage(IMG.ship, player.x - IMG.ship.width / 2, player.y - 10);\nctx.fillStyle = '#fff';\nshots.forEach(s => ctx.fillRect(s.x - 1, s.y - 8, 3, 10));\nctx.fillStyle = '#fde047';\nbombs.forEach(b => {\nconst z = Math.floor(b.t / 80) % 2 ? 2 : -2;\nctx.fillRect(b.x - 1 + z, b.y - 8, 3, 4);\nctx.fillRect(b.x - 1 - z, b.y - 4, 3, 4);\nctx.fillRect(b.x - 1 + z, b.y, 3, 4);\n});\nparticles.forEach(p => { ctx.fillStyle = p.color; ctx.globalAlpha = Math.min(1, p.life / 300); ctx.fillRect(p.x, p.y, 3, 3); });\nctx.globalAlpha = 1;\nctx.fillStyle = '#22c55e';\nctx.fillRect(0, 585, W, 2);\n}\nfunction loop(t) {\nconst dt = Math.min(50, t - last);\nlast = t;\nif (state === 'play') update(dt);\ndraw();\nrequestAnimationFrame(loop);\n}\ndocument.addEventListener('keydown', e => {\nkeys[e.key] = true;\nif ((state === 'ready' || state === 'over') && (e.key === 'Enter' || e.key === ' ')) start();\nif (e.key === 'p' || e.key === 'P') {\nif (state === 'play') { state = 'paused'; overlay(ov, '<h2>Paused<\/h2>'); }\nelse if (state === 'paused') { state = 'play'; overlay(ov, null); }\n}\n});\ndocument.addEventListener('keyup', e => { keys[e.key] = false; });\nholdButton(document.getElementById('tL'), v => { keys.ArrowLeft = v; });\nholdButton(document.getElementById('tR'), v => { keys.ArrowRight = v; });\nholdButton(document.getElementById('tF'), v => { keys.fire = v; });\nscore = 0; lives = 3; wave = 1; particles = [];\nplayer = { x: W / 2, y: 560, dead: 0 };\nbuildWave();\nbuildBunkers();\nhud();\noverlay(ov, '<h2>Alien Invasion<\/h2><p>Defend Earth from the descending fleet.<\/p><button class=\"btn\" onclick=\"start()\">Start<\/button>');\nrequestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>",
"asteroids": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Asteroids<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>☄️ Asteroids<\/h1>\n<div class=\"stats\">Score <b id=\"score\">0<\/b> Lives <b id=\"lives\">3<\/b> Wave <b id=\"wave\">1<\/b> Best <b id=\"best\">0<\/b><\/div>\n<\/header>\n<div class=\"stage\">\n<canvas id=\"c\" class=\"game\" width=\"720\" height=\"520\"><\/canvas>\n<div class=\"overlay\" id=\"ov\"><\/div>\n<\/div>\n<div class=\"touchpad\"><button id=\"tL\">⟲<\/button><button id=\"tR\">⟳<\/button><button id=\"tT\">▲<\/button><button id=\"tF\">🔥<\/button><\/div>\n<p class=\"help\"><kbd>←<\/kbd><kbd>→<\/kbd> rotate · <kbd>↑<\/kbd> thrust · <kbd>Space<\/kbd> fire · <kbd>↓<\/kbd> hyperspace · <kbd>P<\/kbd> pause<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov');\nconst W = cv.width, H = cv.height;\nlet ship, rocks, bullets, parts, score, lives, wave, state = 'ready', keys = {}, last = 0, fireCd = 0, extraAt;\nlet best = Store.get('asteroids-best', 0);\nfunction hud() {\ndocument.getElementById('score').textContent = score;\ndocument.getElementById('lives').textContent = lives;\ndocument.getElementById('wave').textContent = wave;\ndocument.getElementById('best').textContent = best;\n}\nfunction wrap(o) {\nif (o.x < 0) o.x += W; if (o.x > W) o.x -= W;\nif (o.y < 0) o.y += H; if (o.y > H) o.y -= H;\n}\nfunction makeRock(x, y, size) {\nconst n = randInt(9, 13), pts = [];\nfor (let i = 0; i < n; i++) pts.push(rand(0.7, 1.15));\nconst r = [0, 14, 28, 50][size];\nconst a = rand(0, Math.PI * 2), sp = rand(0.6, 1.4) * (4 - size) * 0.55 + wave * 0.08;\nreturn { x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, size, r, pts, rot: 0, spin: rand(-0.02, 0.02) };\n}\nfunction spawnWave() {\nrocks = [];\nfor (let i = 0; i < 3 + wave; i++) {\nlet x, y;\ndo { x = rand(0, W); y = rand(0, H); } while (Math.hypot(x - W / 2, y - H / 2) < 160);\nrocks.push(makeRock(x, y, 3));\n}\n}\nfunction resetShip() {\nship = { x: W / 2, y: H / 2, vx: 0, vy: 0, a: -Math.PI / 2, inv: 2500, dead: 0, thrust: false };\n}\nfunction start() {\nscore = 0; lives = 3; wave = 1; extraAt = 10000;\nbullets = []; parts = [];\nresetShip();\nspawnWave();\nstate = 'play';\noverlay(ov, null);\nhud();\n}\nfunction explode(x, y, n, color = '#e6e7f2') {\nfor (let i = 0; i < n; i++) {\nconst a = rand(0, Math.PI * 2), s = rand(0.5, 3.5);\nparts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(400, 900), color });\n}\n}\nfunction breakRock(r, i) {\nrocks.splice(i, 1);\nscore += [0, 100, 50, 20][r.size];\nexplode(r.x, r.y, r.size * 6);\nSound.beep(90 + r.size * 30, 0.15, 'sawtooth', 0.05);\nif (r.size > 1) for (let k = 0; k < 2; k++) rocks.push(makeRock(r.x, r.y, r.size - 1));\nif (score >= extraAt) { lives++; extraAt += 10000; Sound.beep(1200, 0.2, 'triangle'); }\n}\nfunction update(dt) {\nconst f = dt / 16.67;\nif (ship.dead > 0) {\nship.dead -= dt;\nif (ship.dead <= 0) {\nif (lives <= 0) return gameOver();\nresetShip();\n}\n} else {\nif (keys.ArrowLeft || keys.a) ship.a -= 0.075 * f;\nif (keys.ArrowRight || keys.d) ship.a += 0.075 * f;\nship.thrust = !!(keys.ArrowUp || keys.w);\nif (ship.thrust) {\nship.vx += Math.cos(ship.a) * 0.16 * f;\nship.vy += Math.sin(ship.a) * 0.16 * f;\n}\nship.vx *= Math.pow(0.992, f);\nship.vy *= Math.pow(0.992, f);\nconst sp = Math.hypot(ship.vx, ship.vy);\nif (sp > 7) { ship.vx *= 7 / sp; ship.vy *= 7 / sp; }\nship.x += ship.vx * f;\nship.y += ship.vy * f;\nwrap(ship);\nship.inv = Math.max(0, ship.inv - dt);\nfireCd -= dt;\nif ((keys[' '] || keys.fire) && fireCd <= 0 && bullets.length < 6) {\nbullets.push({ x: ship.x + Math.cos(ship.a) * 14, y: ship.y + Math.sin(ship.a) * 14, vx: ship.vx + Math.cos(ship.a) * 9, vy: ship.vy + Math.sin(ship.a) * 9, life: 900 });\nfireCd = 180;\nSound.beep(1100, 0.04, 'square', 0.025);\n}\n}\nfor (const b of bullets) { b.x += b.vx * f; b.y += b.vy * f; b.life -= dt; wrap(b); }\nbullets = bullets.filter(b => b.life > 0);\nfor (const r of rocks) { r.x += r.vx * f; r.y += r.vy * f; r.rot += r.spin * f; wrap(r); }\nfor (let i = rocks.length - 1; i >= 0; i--) {\nconst r = rocks[i];\nconst b = bullets.find(b => Math.hypot(b.x - r.x, b.y - r.y) < r.r);\nif (b) { b.life = 0; breakRock(r, i); continue; }\nif (ship.dead <= 0 && ship.inv <= 0 && Math.hypot(ship.x - r.x, ship.y - r.y) < r.r + 10) {\nbreakRock(r, i);\nexplode(ship.x, ship.y, 40, '#8b5cf6');\nSound.beep(70, 0.5, 'sawtooth', 0.06);\nlives--;\nship.dead = 1800;\n}\n}\nbullets = bullets.filter(b => b.life > 0);\nparts.forEach(p => { p.x += p.vx * f; p.y += p.vy * f; p.life -= dt; });\nparts = parts.filter(p => p.life > 0);\nif (!rocks.length) { wave++; spawnWave(); ship.inv = 2000; }\nhud();\n}\nfunction hyperspace() {\nif (state !== 'play' || ship.dead > 0) return;\nship.x = rand(40, W - 40);\nship.y = rand(40, H - 40);\nship.vx = ship.vy = 0;\nif (Math.random() < 0.08) { explode(ship.x, ship.y, 40, '#8b5cf6'); lives--; ship.dead = 1800; }\n}\nfunction gameOver() {\nstate = 'over';\nbest = recordBest('asteroids-best', score);\nhud();\noverlay(ov, `<h2>Game over<\/h2><p>Score ${score} · Wave ${wave}<\/p><button class=\"btn\" onclick=\"start()\">Play again<\/button>`);\n}\nfunction draw() {\nctx.fillStyle = '#05060d';\nctx.fillRect(0, 0, W, H);\nctx.strokeStyle = '#e6e7f2';\nctx.lineWidth = 1.6;\nfor (const r of rocks) {\nctx.beginPath();\nr.pts.forEach((m, i) => {\nconst a = r.rot + (i / r.pts.length) * Math.PI * 2;\nconst x = r.x + Math.cos(a) * r.r * m, y = r.y + Math.sin(a) * r.r * m;\ni ? ctx.lineTo(x, y) : ctx.moveTo(x, y);\n});\nctx.closePath();\nctx.stroke();\n}\nif (ship && ship.dead <= 0 && !(ship.inv > 0 && Math.floor(ship.inv / 120) % 2)) {\nctx.save();\nctx.translate(ship.x, ship.y);\nctx.rotate(ship.a);\nctx.strokeStyle = '#c4b5fd';\nctx.beginPath();\nctx.moveTo(14, 0); ctx.lineTo(-10, -9); ctx.lineTo(-6, 0); ctx.lineTo(-10, 9); ctx.closePath();\nctx.stroke();\nif (ship.thrust && Math.random() < 0.8) {\nctx.strokeStyle = '#f59e0b';\nctx.beginPath();\nctx.moveTo(-7, -4); ctx.lineTo(-16 - Math.random() * 6, 0); ctx.lineTo(-7, 4);\nctx.stroke();\n}\nctx.restore();\n}\nctx.fillStyle = '#fff';\nbullets.forEach(b => ctx.fillRect(b.x - 1.5, b.y - 1.5, 3, 3));\nparts.forEach(p => { ctx.globalAlpha = Math.min(1, p.life / 400); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 2, 2); });\nctx.globalAlpha = 1;\n}\nfunction loop(t) {\nconst dt = Math.min(50, t - last);\nlast = t;\nif (state === 'play') update(dt);\ndraw();\nrequestAnimationFrame(loop);\n}\ndocument.addEventListener('keydown', e => {\nkeys[e.key] = true;\nif (e.key === 'ArrowDown' || e.key === 's') hyperspace();\nif ((state === 'ready' || state === 'over') && (e.key === 'Enter' || e.key === ' ')) start();\nif (e.key === 'p' || e.key === 'P') {\nif (state === 'play') { state = 'paused'; overlay(ov, '<h2>Paused<\/h2>'); }\nelse if (state === 'paused') { state = 'play'; overlay(ov, null); }\n}\n});\ndocument.addEventListener('keyup', e => { keys[e.key] = false; });\nholdButton(document.getElementById('tL'), v => { keys.ArrowLeft = v; });\nholdButton(document.getElementById('tR'), v => { keys.ArrowRight = v; });\nholdButton(document.getElementById('tT'), v => { keys.ArrowUp = v; });\nholdButton(document.getElementById('tF'), v => { keys.fire = v; });\nscore = 0; lives = 3; wave = 1; bullets = []; parts = [];\nspawnWave();\nhud();\noverlay(ov, '<h2>Asteroids<\/h2><p>Blast rocks, avoid collisions. Extra life every 10,000 points.<\/p><button class=\"btn\" onclick=\"start()\">Start<\/button>');\nrequestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>",
"flappy": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Flappy<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>🐤 Flappy<\/h1>\n<div class=\"stats\">Best <b id=\"best\">0<\/b><\/div>\n<\/header>\n<div class=\"stage\">\n<canvas id=\"c\" class=\"game\" width=\"380\" height=\"580\"><\/canvas>\n<div class=\"overlay\" id=\"ov\"><\/div>\n<\/div>\n<p class=\"help\">Click, tap, or press <kbd>Space<\/kbd> to flap. Fly through the gaps.<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov');\nconst W = cv.width, H = cv.height, GROUND = H - 70, GAP = 150, PIPE_W = 64, SPACING = 210;\nlet bird, pipes, score, state = 'ready', last = 0, scroll = 0, deadT = 0;\nlet best = Store.get('flappy-best', 0);\ndocument.getElementById('best').textContent = best;\nfunction reset() {\nbird = { x: 100, y: H / 2 - 40, vy: 0, r: 14 };\npipes = [];\nscore = 0;\nfor (let i = 0; i < 3; i++) addPipe(W + 120 + i * SPACING);\n}\nfunction addPipe(x) {\npipes.push({ x, top: rand(70, GROUND - GAP - 60), passed: false });\n}\nfunction flap() {\nif (state === 'ready') { state = 'play'; overlay(ov, null); }\nif (state === 'play') { bird.vy = -7.6; Sound.beep(700, 0.04, 'triangle'); }\nelse if (state === 'over' && deadT <= 0) { reset(); state = 'ready'; overlay(ov, '<h2>Get ready<\/h2><p>Flap to start<\/p>'); }\n}\nfunction die() {\nif (state !== 'play') return;\nstate = 'over';\ndeadT = 500;\nSound.beep(140, 0.3, 'sawtooth');\nbest = recordBest('flappy-best', score);\ndocument.getElementById('best').textContent = best;\nconst medal = score >= 40 ? '🏆' : score >= 25 ? '🥇' : score >= 10 ? '🥈' : score >= 5 ? '🥉' : '';\noverlay(ov, `<h2>${medal} Game over<\/h2><p>Score ${score} · Best ${best}<\/p><p>Flap to try again<\/p>`);\n}\nfunction update(dt) {\nconst f = dt / 16.67;\nif (state === 'over') {\ndeadT -= dt;\nif (bird.y < GROUND - bird.r) { bird.vy += 0.5 * f; bird.y = Math.min(GROUND - bird.r, bird.y + bird.vy * f); }\nreturn;\n}\nscroll = (scroll + 2.6 * f) % 24;\nif (state === 'ready') { bird.y = H / 2 - 40 + Math.sin(performance.now() / 250) * 8; return; }\nbird.vy = Math.min(bird.vy + 0.42 * f, 11);\nbird.y += bird.vy * f;\nif (bird.y > GROUND - bird.r) { bird.y = GROUND - bird.r; die(); }\nif (bird.y < -30) bird.y = -30;\nfor (const p of pipes) {\np.x -= 2.6 * f;\nif (!p.passed && p.x + PIPE_W < bird.x) { p.passed = true; score++; Sound.beep(980, 0.05, 'triangle'); }\nconst inX = bird.x + bird.r - 3 > p.x && bird.x - bird.r + 3 < p.x + PIPE_W;\nif (inX && (bird.y - bird.r + 3 < p.top || bird.y + bird.r - 3 > p.top + GAP)) die();\n}\nif (pipes[0].x < -PIPE_W) { pipes.shift(); addPipe(pipes[pipes.length - 1].x + SPACING); }\n}\nfunction drawPipe(x, y, h, flip) {\nconst g = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);\ng.addColorStop(0, '#16a34a'); g.addColorStop(0.5, '#4ade80'); g.addColorStop(1, '#15803d');\nctx.fillStyle = g;\nctx.fillRect(x, y, PIPE_W, h);\nctx.fillRect(x - 5, flip ? y + h - 24 : y, PIPE_W + 10, 24);\nctx.strokeStyle = '#14532d';\nctx.lineWidth = 2;\nctx.strokeRect(x, y, PIPE_W, h);\nctx.strokeRect(x - 5, flip ? y + h - 24 : y, PIPE_W + 10, 24);\n}\nfunction draw() {\nconst sky = ctx.createLinearGradient(0, 0, 0, H);\nsky.addColorStop(0, '#38bdf8'); sky.addColorStop(1, '#bae6fd');\nctx.fillStyle = sky;\nctx.fillRect(0, 0, W, H);\nctx.fillStyle = 'rgba(255,255,255,.8)';\n[[60, 120], [250, 80], [180, 200]].forEach(([x, y]) => {\nctx.beginPath(); ctx.arc(x, y, 22, 0, 7); ctx.arc(x + 25, y - 8, 26, 0, 7); ctx.arc(x + 50, y, 20, 0, 7); ctx.fill();\n});\nfor (const p of pipes) {\ndrawPipe(p.x, 0, p.top, true);\ndrawPipe(p.x, p.top + GAP, GROUND - p.top - GAP, false);\n}\nctx.fillStyle = '#ddd29b';\nctx.fillRect(0, GROUND, W, H - GROUND);\nctx.fillStyle = '#84cc16';\nctx.fillRect(0, GROUND, W, 14);\nctx.fillStyle = '#65a30d';\nfor (let x = -scroll; x < W; x += 24) ctx.fillRect(x, GROUND + 4, 12, 6);\nctx.save();\nctx.translate(bird.x, bird.y);\nctx.rotate(clamp(bird.vy / 10, -0.5, 1.2));\nctx.fillStyle = '#facc15';\nctx.beginPath(); ctx.ellipse(0, 0, bird.r + 3, bird.r, 0, 0, 7); ctx.fill();\nctx.fillStyle = '#fde68a';\nconst flapUp = Math.floor(performance.now() / 100) % 2 && state !== 'over';\nctx.beginPath(); ctx.ellipse(-6, flapUp ? -4 : 3, 8, 5, 0, 0, 7); ctx.fill();\nctx.fillStyle = '#fff';\nctx.beginPath(); ctx.arc(7, -5, 5, 0, 7); ctx.fill();\nctx.fillStyle = '#000';\nctx.beginPath(); ctx.arc(8.5, -5, 2.2, 0, 7); ctx.fill();\nctx.fillStyle = '#f97316';\nctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(22, 3); ctx.lineTo(12, 6); ctx.fill();\nctx.restore();\nif (state === 'play' || state === 'over') {\nctx.fillStyle = '#fff';\nctx.strokeStyle = '#000';\nctx.lineWidth = 4;\nctx.font = 'bold 48px system-ui';\nctx.textAlign = 'center';\nctx.strokeText(score, W / 2, 80);\nctx.fillText(score, W / 2, 80);\n}\n}\nfunction loop(t) {\nconst dt = Math.min(50, t - last);\nlast = t;\nupdate(dt);\ndraw();\nrequestAnimationFrame(loop);\n}\ndocument.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') flap(); });\ncv.addEventListener('pointerdown', e => { e.preventDefault(); flap(); });\nov.addEventListener('pointerdown', e => { e.preventDefault(); flap(); });\nreset();\noverlay(ov, '<h2>Flappy<\/h2><p>Click, tap or press Space to flap<\/p>');\nrequestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>",
"dino-run": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Dino Run<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>🦖 Dino Run<\/h1>\n<div class=\"stats\">Score <b id=\"score\">0<\/b> Best <b id=\"best\">0<\/b><\/div>\n<\/header>\n<div class=\"stage\">\n<canvas id=\"c\" class=\"game\" width=\"760\" height=\"260\"><\/canvas>\n<div class=\"overlay\" id=\"ov\"><\/div>\n<\/div>\n<div class=\"touchpad\"><button id=\"tJ\">⤒<\/button><button id=\"tD\">⤓<\/button><\/div>\n<p class=\"help\"><kbd>Space<\/kbd>/<kbd>↑<\/kbd> jump (hold for higher) · <kbd>↓<\/kbd> duck. Tap the game to jump on touch screens.<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov');\nconst W = cv.width, H = cv.height, GROUND = 210;\nlet dino, obs, clouds, speed, dist, state = 'ready', last = 0, jumpHeld = false, duckHeld = false, spawnT, night = 0;\nlet best = Store.get('dino-best', 0);\ndocument.getElementById('best').textContent = best;\nconst DINO = [\n'          XXXXXXXX',\n'         XXEXXXXXXX',\n'         XXXXXXXXXX',\n'         XXXXXXXXXX',\n'         XXXXX     ',\n'         XXXXXXXX  ',\n'X       XXXXX      ',\n'X      XXXXXXX     ',\n'XX   XXXXXXXXXXX   ',\n'XXX XXXXXXXXXX X   ',\n'XXXXXXXXXXXXXX     ',\n' XXXXXXXXXXXXX     ',\n'  XXXXXXXXXXX      ',\n'   XXXXXXXXX       ',\n'    XXX  XX        ',\n'    XX    X        ',\n'    X     X        ',\n'    XX    XX       '\n];\nconst PX = 2.6;\nfunction reset() {\ndino = { y: GROUND, vy: 0, duck: false, leg: 0 };\nobs = [];\nclouds = [{ x: 200, y: 50 }, { x: 520, y: 80 }];\nspeed = 6;\ndist = 0;\nspawnT = 900;\n}\nfunction hud() {\ndocument.getElementById('score').textContent = Math.floor(dist / 10);\ndocument.getElementById('best').textContent = best;\n}\nfunction jump() {\nif (state === 'ready' || (state === 'over' && performance.now() - deadAt > 400)) { reset(); state = 'play'; overlay(ov, null); return; }\nif (state === 'play' && dino.y >= GROUND) { dino.vy = -11.5; Sound.beep(600, 0.05, 'triangle'); }\n}\nlet deadAt = 0;\nfunction spawn() {\nconst score = dist / 10;\nif (score > 250 && Math.random() < 0.3) {\nobs.push({ type: 'bird', x: W + 20, y: pick([GROUND - 22, GROUND - 52, GROUND - 82]), w: 42, h: 26, flap: 0 });\n} else {\nconst big = Math.random() < 0.45, n = randInt(1, big ? 2 : 3);\nconst w = (big ? 24 : 16) * n + (n - 1) * 4, h = big ? 50 : 34;\nobs.push({ type: 'cactus', x: W + 20, y: GROUND - h, w, h, n, big });\n}\nspawnT = rand(650, 1400) * (7 / speed) + 250;\n}\nfunction update(dt) {\nconst f = dt / 16.67;\nspeed = Math.min(15, 6 + dist / 2500);\ndist += speed * f;\nconst g = jumpHeld && dino.vy < 0 ? 0.45 : 0.85;\ndino.vy += g * f;\nif (duckHeld && dino.y < GROUND) dino.vy += 1.2 * f;\ndino.y = Math.min(GROUND, dino.y + dino.vy * f);\nif (dino.y >= GROUND) dino.vy = 0;\ndino.duck = duckHeld && dino.y >= GROUND;\ndino.leg += dt;\nspawnT -= dt * (speed / 7);\nif (spawnT <= 0) spawn();\nfor (const o of obs) { o.x -= speed * f * (o.type === 'bird' ? 1.1 : 1); o.flap += dt; }\nobs = obs.filter(o => o.x + o.w > -10);\nfor (const c of clouds) { c.x -= speed * 0.2 * f; if (c.x < -80) { c.x = W + rand(0, 200); c.y = rand(30, 110); } }\nconst box = dino.duck ? { x: 34, y: dino.y - 28, w: 58, h: 26 } : { x: 40, y: dino.y - 44, w: 32, h: 42 };\nfor (const o of obs) {\nif (box.x < o.x + o.w - 4 && box.x + box.w > o.x + 4 && box.y < o.y + o.h - 2 && box.y + box.h > o.y + 4) {\nstate = 'over';\ndeadAt = performance.now();\nSound.beep(150, 0.3, 'sawtooth');\nbest = recordBest('dino-best', Math.floor(dist / 10));\noverlay(ov, `<h2>Game over<\/h2><p>Score ${Math.floor(dist / 10)} · Best ${best}<\/p><p>Jump to restart<\/p>`);\n}\n}\nif (Math.floor(dist / 10) % 100 === 0 && Math.floor(dist / 10) > 0 && !milestone) { milestone = true; Sound.beep(1200, 0.08, 'triangle'); }\nif (Math.floor(dist / 10) % 100 !== 0) milestone = false;\nnight = Math.floor(dist / 10 / 700) % 2;\nhud();\n}\nlet milestone = false;\nfunction drawDino() {\nconst fg = night ? '#e5e7eb' : '#374151', bg = night ? '#111827' : '#f8fafc';\nconst ox = 36, oy = dino.y - DINO.length * PX;\nif (dino.duck) {\nctx.fillStyle = fg;\nctx.fillRect(ox, dino.y - 26, 56, 18);\nctx.fillRect(ox + 40, dino.y - 30, 26, 16);\nctx.fillStyle = bg;\nctx.fillRect(ox + 52, dino.y - 26, 4, 4);\nctx.fillStyle = fg;\nconst step = Math.floor(dino.leg / 100) % 2;\nctx.fillRect(ox + 12, dino.y - 8, 6, step ? 8 : 4);\nctx.fillRect(ox + 30, dino.y - 8, 6, step ? 4 : 8);\nreturn;\n}\nconst running = dino.y >= GROUND && state === 'play';\nconst step = Math.floor(dino.leg / 100) % 2;\nDINO.forEach((row, y) => [...row].forEach((ch, x) => {\nif (ch === ' ') return;\nif (running && y >= 15 && ((step && x < 7) || (!step && x >= 7))) return;\nctx.fillStyle = ch === 'E' ? bg : fg;\nctx.fillRect(ox + x * PX, oy + y * PX, PX + 0.5, PX + 0.5);\n}));\n}\nfunction draw() {\nconst fg = night ? '#e5e7eb' : '#374151';\nctx.fillStyle = night ? '#111827' : '#f8fafc';\nctx.fillRect(0, 0, W, H);\nctx.fillStyle = night ? '#374151' : '#e2e8f0';\nfor (const c of clouds) { ctx.fillRect(c.x, c.y, 60, 10); ctx.fillRect(c.x + 14, c.y - 8, 30, 10); }\nctx.fillStyle = fg;\nctx.fillRect(0, GROUND, W, 2);\nfor (let i = 0; i < 40; i++) {\nconst x = ((i * 89 - dist) % W + W) % W;\nctx.fillRect(x, GROUND + 6 + (i % 3) * 5, 3 + (i % 4), 2);\n}\nfor (const o of obs) {\nctx.fillStyle = night ? '#86efac' : '#15803d';\nif (o.type === 'cactus') {\nconst cw = o.big ? 24 : 16;\nfor (let i = 0; i < o.n; i++) {\nconst x = o.x + i * (cw + 4);\nctx.fillRect(x + cw * 0.3, o.y, cw * 0.4, o.h);\nctx.fillRect(x, o.y + o.h * 0.3, cw * 0.2, o.h * 0.35);\nctx.fillRect(x, o.y + o.h * 0.55, cw * 0.4, cw * 0.15);\nctx.fillRect(x + cw * 0.8, o.y + o.h * 0.2, cw * 0.2, o.h * 0.35);\nctx.fillRect(x + cw * 0.6, o.y + o.h * 0.45, cw * 0.4, cw * 0.15);\n}\n} else {\nctx.fillStyle = fg;\nctx.fillRect(o.x, o.y + 10, 42, 8);\nctx.fillRect(o.x - 6, o.y + 8, 10, 6);\nconst up = Math.floor(o.flap / 160) % 2;\nctx.fillRect(o.x + 14, up ? o.y : o.y + 16, 12, 12);\n}\n}\ndrawDino();\n}\nfunction loop(t) {\nconst dt = Math.min(50, t - last);\nlast = t;\nif (state === 'play') update(dt);\ndraw();\nrequestAnimationFrame(loop);\n}\ndocument.addEventListener('keydown', e => {\nif (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') { if (!e.repeat) jump(); jumpHeld = true; }\nif (e.key === 'ArrowDown' || e.key === 's') duckHeld = true;\n});\ndocument.addEventListener('keyup', e => {\nif (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') jumpHeld = false;\nif (e.key === 'ArrowDown' || e.key === 's') duckHeld = false;\n});\nconst press = e => { e.preventDefault(); jump(); jumpHeld = true; };\ncv.addEventListener('pointerdown', press);\nov.addEventListener('pointerdown', press);\nwindow.addEventListener('pointerup', () => { jumpHeld = false; });\nholdButton(document.getElementById('tJ'), v => { if (v) jump(); jumpHeld = v; });\nholdButton(document.getElementById('tD'), v => { duckHeld = v; });\nreset();\nhud();\noverlay(ov, '<h2>Dino Run<\/h2><p>Press Space or tap to start running<\/p>');\nrequestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>",
"road-hopper": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Road Hopper<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>🐸 Road Hopper<\/h1>\n<div class=\"stats\">Score <b id=\"score\">0<\/b> Lives <b id=\"lives\">3<\/b> Level <b id=\"level\">1<\/b> Best <b id=\"best\">0<\/b><\/div>\n<\/header>\n<div class=\"stage\">\n<canvas id=\"c\" class=\"game\" width=\"520\" height=\"600\"><\/canvas>\n<div class=\"overlay\" id=\"ov\"><\/div>\n<\/div>\n<div class=\"touchpad\"><button id=\"tL\">◀<\/button><button id=\"tU\">▲<\/button><button id=\"tD\">▼<\/button><button id=\"tR\">▶<\/button><\/div>\n<p class=\"help\">Hop with <kbd>←<\/kbd><kbd>↑<\/kbd><kbd>→<\/kbd><kbd>↓<\/kbd> or swipe. Cross the road, ride logs and turtles over the river, and fill all five lily-pad homes before time runs out.<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov');\nconst C = 40, COLS = 13, SPAN = 19, HOMES = [2, 4, 6, 8, 10], TIME = 30000;\nconst LANES = [\n{ row: 12, type: 'car', len: 1, dir: -1, sp: 1.2, xs: [0, 5, 10, 15], color: '#facc15' },\n{ row: 11, type: 'car', len: 1, dir: 1, sp: 1.0, xs: [2, 8, 14], color: '#f472b6' },\n{ row: 10, type: 'car', len: 1, dir: -1, sp: 2.0, xs: [1, 7, 13], color: '#60a5fa' },\n{ row: 9, type: 'car', len: 1, dir: 1, sp: 3.2, xs: [4, 14], color: '#f87171' },\n{ row: 8, type: 'truck', len: 2, dir: -1, sp: 1.4, xs: [0, 7, 13], color: '#e5e7eb' },\n{ row: 6, type: 'turtle', len: 3, dir: -1, sp: 1.2, xs: [0, 5, 10, 15], dive: 1 },\n{ row: 5, type: 'log', len: 3, dir: 1, sp: 0.9, xs: [0, 6, 12] },\n{ row: 4, type: 'log', len: 5, dir: 1, sp: 1.8, xs: [0, 9] },\n{ row: 3, type: 'turtle', len: 2, dir: -1, sp: 1.4, xs: [0, 4, 8, 12, 16], dive: 2 },\n{ row: 2, type: 'log', len: 4, dir: 1, sp: 1.3, xs: [0, 6, 13] }\n];\nlet lanes, frog, homes, score, lives, level, timeLeft, maxRow, state = 'ready', last = 0, clock = 0, deathT = 0;\nlet best = Store.get('hopper-best', 0);\nfunction hud() {\ndocument.getElementById('score').textContent = score;\ndocument.getElementById('lives').textContent = lives;\ndocument.getElementById('level').textContent = level;\ndocument.getElementById('best').textContent = best;\n}\nfunction buildLanes() {\nlanes = LANES.map(l => ({ ...l, items: l.xs.map((x, i) => ({ x, diver: l.dive === i + 1 })) }));\n}\nfunction resetFrog() {\nfrog = { x: 6, y: 13 };\nmaxRow = 13;\ntimeLeft = TIME;\n}\nfunction start() {\nscore = 0; lives = 3; level = 1;\nhomes = HOMES.map(() => false);\nbuildLanes();\nresetFrog();\nstate = 'play';\noverlay(ov, null);\nhud();\n}\nfunction turtleState(item) {\nif (!item.diver) return 'up';\nconst t = (clock / 1000) % 6.5;\nreturn t < 4 ? 'up' : t < 5 ? 'sinking' : 'under';\n}\nfunction die(reason) {\nif (state !== 'play') return;\nlives--;\nSound.beep(130, 0.35, 'sawtooth');\nstate = 'dying';\ndeathT = 900;\nfrog.dead = reason;\nhud();\n}\nfunction hop(dx, dy) {\nif (state === 'ready' || state === 'over') return start();\nif (state !== 'play') return;\nconst nx = frog.x + dx, ny = frog.y + dy;\nif (nx < -0.4 || nx > COLS - 0.6 || ny > 13) return;\nfrog.x = nx;\nfrog.y = ny;\nif (frog.y >= 7) frog.x = clamp(Math.round(frog.x), 0, COLS - 1);\nSound.beep(500, 0.03, 'triangle');\nif (frog.y < maxRow) { maxRow = frog.y; score += 10; }\nif (frog.y === 1) {\nconst i = HOMES.findIndex(h => Math.abs(h - frog.x) < 0.5);\nif (i < 0 || homes[i]) return die('hedge');\nhomes[i] = true;\nscore += 50 + Math.floor(timeLeft / 1000) * 2;\nSound.beep(880, 0.15, 'triangle');\nif (homes.every(Boolean)) {\nlevel++;\nscore += 1000;\nhomes = HOMES.map(() => false);\n}\nresetFrog();\n}\nhud();\n}\nfunction update(dt) {\nclock += dt;\nconst mult = 1 + (level - 1) * 0.18;\nfor (const l of lanes) for (const it of l.items) {\nit.x += l.dir * l.sp * mult * dt / 1000;\nif (l.dir > 0 && it.x > COLS) it.x -= SPAN;\nif (l.dir < 0 && it.x + l.len < 0) it.x += SPAN;\n}\nif (state === 'dying') {\ndeathT -= dt;\nif (deathT <= 0) {\nif (lives <= 0) {\nstate = 'over';\nbest = recordBest('hopper-best', score);\nhud();\noverlay(ov, `<h2>Game over<\/h2><p>Score ${score} · Level ${level}<\/p><button class=\"btn\" onclick=\"start()\">Play again<\/button>`);\n} else {\nresetFrog();\nstate = 'play';\n}\n}\nreturn;\n}\ntimeLeft -= dt;\nif (timeLeft <= 0) return die('time');\nconst lane = lanes.find(l => l.row === frog.y);\nif (!lane) return;\nif (lane.type === 'car' || lane.type === 'truck') {\nfor (const it of lane.items) if (frog.x + 0.8 > it.x && frog.x + 0.2 < it.x + lane.len) return die('car');\n} else {\nconst cx = frog.x + 0.5;\nconst ride = lane.items.find(it => cx > it.x && cx < it.x + lane.len && (lane.type !== 'turtle' || turtleState(it) !== 'under'));\nif (!ride) return die('water');\nfrog.x += lane.dir * lane.sp * mult * dt / 1000;\nif (frog.x < -0.5 || frog.x > COLS - 0.5) die('water');\n}\n}\nfunction drawFrog() {\nconst x = frog.x * C + C / 2, y = frog.y * C + C / 2;\nif (frog.dead && state === 'dying') {\nctx.font = '28px system-ui';\nctx.textAlign = 'center';\nctx.fillText(frog.dead === 'water' ? '💦' : '💥', x, y + 10);\nreturn;\n}\nctx.fillStyle = '#4ade80';\nctx.beginPath(); ctx.ellipse(x, y + 2, 13, 15, 0, 0, 7); ctx.fill();\nctx.fillStyle = '#16a34a';\n[[-13, -8], [13, -8], [-14, 12], [14, 12]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.arc(x + dx, y + dy, 5, 0, 7); ctx.fill(); });\nctx.fillStyle = '#fff';\nctx.beginPath(); ctx.arc(x - 6, y - 10, 5, 0, 7); ctx.arc(x + 6, y - 10, 5, 0, 7); ctx.fill();\nctx.fillStyle = '#000';\nctx.beginPath(); ctx.arc(x - 6, y - 11, 2.4, 0, 7); ctx.arc(x + 6, y - 11, 2.4, 0, 7); ctx.fill();\n}\nfunction draw() {\nctx.fillStyle = '#1e3a8a';\nctx.fillRect(0, 0, cv.width, 7 * C);\nctx.fillStyle = '#14532d';\nctx.fillRect(0, 0, cv.width, 2 * C);\nHOMES.forEach((h, i) => {\nctx.fillStyle = '#1e3a8a';\nctx.fillRect(h * C - 4, C, C + 8, C);\nif (homes && homes[i]) { ctx.font = '26px system-ui'; ctx.textAlign = 'center'; ctx.fillText('🐸', h * C + C / 2, C + 30); }\nelse { ctx.fillStyle = '#16a34a'; ctx.beginPath(); ctx.arc(h * C + C / 2, C + C / 2 + 4, 10, 0.3, Math.PI * 2 - 0.3); ctx.lineTo(h * C + C / 2, C + C / 2 + 4); ctx.fill(); }\n});\nctx.fillStyle = '#6d28d9';\nctx.fillRect(0, 7 * C, cv.width, C);\nctx.fillRect(0, 13 * C, cv.width, C);\nctx.fillStyle = '#1f2937';\nctx.fillRect(0, 8 * C, cv.width, 5 * C);\nctx.strokeStyle = '#facc15';\nctx.setLineDash([16, 14]);\nfor (let r = 9; r < 13; r++) { ctx.beginPath(); ctx.moveTo(0, r * C); ctx.lineTo(cv.width, r * C); ctx.stroke(); }\nctx.setLineDash([]);\nfor (const l of lanes) for (const it of l.items) {\nconst x = it.x * C, y = l.row * C;\nif (l.type === 'log') {\nctx.fillStyle = '#92400e';\nctx.beginPath(); ctx.roundRect(x + 2, y + 6, l.len * C - 4, C - 12, 12); ctx.fill();\nctx.fillStyle = '#b45309';\nctx.fillRect(x + 10, y + 12, l.len * C - 30, 3);\nctx.fillRect(x + 20, y + 24, l.len * C - 40, 3);\n} else if (l.type === 'turtle') {\nconst st = turtleState(it);\nif (st === 'under') continue;\nctx.globalAlpha = st === 'sinking' ? 0.45 : 1;\nfor (let k = 0; k < l.len; k++) {\nconst cx = x + k * C + C / 2, cy = y + C / 2;\nctx.fillStyle = '#065f46';\nctx.beginPath(); ctx.arc(cx + 15 * l.dir, cy, 6, 0, 7); ctx.fill();\nctx.fillStyle = '#dc2626';\nctx.beginPath(); ctx.arc(cx, cy, 14, 0, 7); ctx.fill();\nctx.fillStyle = '#f87171';\nctx.beginPath(); ctx.arc(cx, cy, 8, 0, 7); ctx.fill();\n}\nctx.globalAlpha = 1;\n} else {\nconst w = l.len * C - 8;\nctx.fillStyle = l.color;\nctx.beginPath(); ctx.roundRect(x + 4, y + 7, w, C - 14, 6); ctx.fill();\nctx.fillStyle = 'rgba(0,0,0,.45)';\nconst wx = l.dir > 0 ? x + w - 10 : x + 8;\nctx.fillRect(wx, y + 10, 6, C - 20);\nctx.fillStyle = '#111';\nctx.fillRect(x + 8, y + 4, 8, 4); ctx.fillRect(x + w - 8, y + 4, 8, 4);\nctx.fillRect(x + 8, y + C - 8, 8, 4); ctx.fillRect(x + w - 8, y + C - 8, 8, 4);\n}\n}\nif (frog && state !== 'ready') drawFrog();\nctx.fillStyle = '#05060d';\nctx.fillRect(0, 14 * C, cv.width, C);\nif (frog) {\nconst frac = clamp(timeLeft / TIME, 0, 1);\nctx.fillStyle = frac < 0.25 ? '#ef4444' : '#22c55e';\nctx.fillRect(80, 14 * C + 14, (cv.width - 100) * frac, 12);\nctx.fillStyle = '#9097b8';\nctx.font = '14px system-ui';\nctx.textAlign = 'left';\nctx.fillText('TIME', 20, 14 * C + 25);\n}\n}\nfunction loop(t) {\nconst dt = Math.min(50, t - last);\nlast = t;\nif (state === 'play' || state === 'dying') update(dt);\ndraw();\nrequestAnimationFrame(loop);\n}\nconst DIRS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1], a: [-1, 0], d: [1, 0], w: [0, -1], s: [0, 1] };\ndocument.addEventListener('keydown', e => {\nif (DIRS[e.key] && !e.repeat) hop(...DIRS[e.key]);\nelse if ((e.key === ' ' || e.key === 'Enter') && (state === 'ready' || state === 'over')) start();\n});\nonSwipe(cv, d => hop(...{ left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] }[d]));\n[['tL', [-1, 0]], ['tR', [1, 0]], ['tU', [0, -1]], ['tD', [0, 1]]].forEach(([id, d]) =>\ndocument.getElementById(id).addEventListener('pointerdown', e => { e.preventDefault(); hop(...d); }));\nscore = 0; lives = 3; level = 1;\nhomes = HOMES.map(() => false);\nbuildLanes();\nhud();\noverlay(ov, '<h2>Road Hopper<\/h2><p>Get the frog home safely.<\/p><button class=\"btn\" onclick=\"start()\">Start<\/button>');\nrequestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>",
"maze-muncher": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Maze Muncher<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>🟡 Maze Muncher<\/h1>\n<div class=\"stats\">Score <b id=\"score\">0<\/b> Lives <b id=\"lives\">3<\/b> Level <b id=\"level\">1<\/b> Best <b id=\"best\">0<\/b><\/div>\n<\/header>\n<div class=\"stage\">\n<canvas id=\"c\" class=\"game\" width=\"456\" height=\"504\"><\/canvas>\n<div class=\"overlay\" id=\"ov\"><\/div>\n<\/div>\n<div class=\"touchpad\"><button id=\"tL\">◀<\/button><button id=\"tU\">▲<\/button><button id=\"tD\">▼<\/button><button id=\"tR\">▶<\/button><\/div>\n<p class=\"help\">Steer with <kbd>←<\/kbd><kbd>↑<\/kbd><kbd>→<\/kbd><kbd>↓<\/kbd>/<kbd>WASD<\/kbd> or swipe. Eat every dot. Big pellets let you eat the ghosts for a few seconds. <kbd>P<\/kbd> pauses.<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov');\nconst MAP = [\n'###################',\n'#........#........#',\n'#o##.###.#.###.##o#',\n'#.................#',\n'#.##.#.#####.#.##.#',\n'#....#...#...#....#',\n'####.### # ###.####',\n'___#.#       #.#___',\n'####.# ##-## #.####',\n'    .  #   #  .    ',\n'####.# ##### #.####',\n'___#.#       #.#___',\n'####.# ##### #.####',\n'#........#........#',\n'#.##.###.#.###.##.#',\n'#o.#.....P.....#.o#',\n'##.#.#.#####.#.#.##',\n'#....#...#...#....#',\n'#.######.#.######.#',\n'#.................#',\n'###################'\n];\nconst W = 19, H = MAP.length, T = 24;\nconst DOOR_OUT = { x: 9, y: 7 }, HOUSE = { x: 9, y: 9 };\nconst PHASES = [7, 20, 7, 20, 5, 1e9]; // scatter / chase alternation (seconds)\nconst GHOSTS = [\n{ name: 'blinky', color: '#ef4444', corner: { x: 18, y: -2 }, release: 0 },\n{ name: 'pinky', color: '#f9a8d4', corner: { x: 0, y: -2 }, release: 1500 },\n{ name: 'inky', color: '#22d3ee', corner: { x: 18, y: 22 }, release: 5000 },\n{ name: 'clyde', color: '#fb923c', corner: { x: 0, y: 22 }, release: 9000 }\n];\nlet grid, dots, pac, ghosts, score, lives, level, state = 'ready', last = 0, phaseIdx, phaseT, frightT, combo, stateT, fruit, eatenCount;\nlet best = Store.get('muncher-best', 0);\nconst tile = (x, y) => (y < 0 || y >= H) ? '#' : grid[y][(x + W) % W];\nfunction open(x, y, ghost) {\nconst c = tile(x, y);\nif (c === '#' || c === '_') return false;\nif (c === '-') return !!(ghost && (ghost.mode === 'eyes' || ghost.mode === 'house'));\nreturn true;\n}\nfunction hud() {\ndocument.getElementById('score').textContent = score;\ndocument.getElementById('lives').textContent = lives;\ndocument.getElementById('level').textContent = level;\ndocument.getElementById('best').textContent = best;\n}\nfunction loadDots() {\ngrid = MAP.map(r => r.split(''));\ndots = 0;\ngrid.forEach((r, y) => r.forEach((c, x) => {\nif (c === 'P') r[x] = ' ';\nif (c === '.' || c === 'o') dots++;\n}));\neatenCount = 0;\nfruit = null;\n}\nfunction resetActors() {\npac = { x: 9, y: 15, dir: { x: -1, y: 0 }, want: { x: -1, y: 0 }, p: 0, mouth: 0 };\nghosts = GHOSTS.map((g, i) => ({\n...g,\nx: i === 0 ? DOOR_OUT.x : HOUSE.x + (i - 2),\ny: i === 0 ? DOOR_OUT.y : HOUSE.y,\ndir: { x: -1, y: 0 },\np: 0,\nmode: i === 0 ? 'out' : 'house',\nfright: false,\nwait: g.release\n}));\nphaseIdx = 0;\nphaseT = PHASES[0] * 1000;\nfrightT = 0;\n}\nfunction start() {\nscore = 0; lives = 3; level = 1;\nloadDots();\nresetActors();\nstate = 'getready';\nstateT = 1600;\noverlay(ov, null);\nhud();\n}\nconst same = (a, b) => a.x === b.x && a.y === b.y;\nconst DIRS = [{ x: 0, y: -1 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 1, y: 0 }];\nfunction pacSpeed() { return (frightT > 0 ? 8.4 : 7.6) + Math.min(level - 1, 5) * 0.25; }\nfunction ghostSpeed(g) {\nif (g.mode === 'eyes') return 15;\nif (g.mode === 'house') return 2;\nif (g.y === 9 && (g.x < 4 || g.x > 14)) return 3.8;\nif (g.fright) return 4.2;\nreturn 6.8 + Math.min(level - 1, 6) * 0.35;\n}\nfunction eatAt(x, y) {\nconst c = grid[y][x];\nif (c === '.') { grid[y][x] = ' '; score += 10; dots--; eatenCount++; Sound.beep(eatenCount % 2 ? 600 : 520, 0.03, 'triangle', 0.025); }\nelse if (c === 'o') {\ngrid[y][x] = ' '; score += 50; dots--; eatenCount++;\nfrightT = Math.max(2000, 7000 - (level - 1) * 800);\ncombo = 200;\nghosts.forEach(g => { if (g.mode === 'out') { g.fright = true; reverse(g); } });\n}\nif (eatenCount === 70 || eatenCount === 140) fruit = { x: 9, y: 11, t: 9000 };\nif (fruit && x === fruit.x && y === fruit.y) { score += 100 * level; fruit = null; Sound.beep(1000, 0.15, 'triangle'); }\nif (dots === 0) { state = 'clear'; stateT = 2000; }\nhud();\n}\nfunction reverse(e) {\nif (!e.dir.x && !e.dir.y) return;\ne.x = (e.x + e.dir.x + W) % W;\ne.y += e.dir.y;\ne.dir = { x: -e.dir.x, y: -e.dir.y };\ne.p = 1 - e.p;\n}\nfunction movePac(dt) {\nif (pac.p > 0 && pac.want.x === -pac.dir.x && pac.want.y === -pac.dir.y) reverse(pac);\nif (pac.p === 0) {\nif (open(pac.x + pac.want.x, pac.y + pac.want.y)) pac.dir = { ...pac.want };\nif (!open(pac.x + pac.dir.x, pac.y + pac.dir.y)) { pac.dir = { x: 0, y: 0 }; return; }\n}\npac.p += pacSpeed() * dt / 1000;\npac.mouth += dt;\nwhile (pac.p >= 1) {\npac.p -= 1;\npac.x = (pac.x + pac.dir.x + W) % W;\npac.y += pac.dir.y;\neatAt(pac.x, pac.y);\nif (open(pac.x + pac.want.x, pac.y + pac.want.y)) pac.dir = { ...pac.want };\nif (!open(pac.x + pac.dir.x, pac.y + pac.dir.y)) { pac.dir = { x: 0, y: 0 }; pac.p = 0; break; }\n}\n}\nfunction ghostTarget(g) {\nif (g.mode === 'eyes') return DOOR_OUT;\nconst scatter = phaseIdx % 2 === 0;\nif (scatter) return g.corner;\nconst ahead = n => ({ x: pac.x + pac.dir.x * n, y: pac.y + pac.dir.y * n });\nif (g.name === 'blinky') return pac;\nif (g.name === 'pinky') return ahead(4);\nif (g.name === 'inky') {\nconst b = ghosts[0], a = ahead(2);\nreturn { x: a.x * 2 - b.x, y: a.y * 2 - b.y };\n}\nreturn Math.hypot(g.x - pac.x, g.y - pac.y) > 8 ? pac : g.corner;\n}\nfunction chooseDir(g) {\nconst back = { x: -g.dir.x, y: -g.dir.y };\nlet opts = DIRS.filter(d => open(g.x + d.x, g.y + d.y, g) && !same(d, back));\nif (g.mode !== 'eyes') opts = opts.filter(d => tile(g.x + d.x, g.y + d.y) !== '-');\nif (!opts.length) opts = [back];\nif (g.fright) return pick(opts);\nconst t = ghostTarget(g);\nlet bestD = opts[0], bd = Infinity;\nfor (const d of opts) {\nconst dd = Math.hypot(g.x + d.x - t.x, g.y + d.y - t.y);\nif (dd < bd) { bd = dd; bestD = d; }\n}\nreturn bestD;\n}\nfunction moveGhost(g, dt) {\nif (g.mode === 'house') {\ng.wait -= dt;\ng.bob = (g.bob || 0) + dt;\nif (g.wait <= 0) { g.mode = 'out'; g.x = DOOR_OUT.x; g.y = DOOR_OUT.y; g.p = 0; g.dir = { x: pick([-1, 1]), y: 0 }; g.fright = false; }\nreturn;\n}\ng.p += ghostSpeed(g) * dt / 1000;\nwhile (g.p >= 1) {\ng.p -= 1;\ng.x = (g.x + g.dir.x + W) % W;\ng.y += g.dir.y;\nif (g.mode === 'eyes' && same(g, DOOR_OUT)) {\ng.mode = 'house'; g.x = HOUSE.x; g.y = HOUSE.y; g.wait = 1200; g.p = 0; g.fright = false;\nreturn;\n}\ng.dir = chooseDir(g);\n}\n}\nfunction pos(e) { return { x: e.x + e.dir.x * e.p, y: e.y + e.dir.y * e.p }; }\nfunction update(dt) {\nif (state === 'getready') { stateT -= dt; if (stateT <= 0) state = 'play'; return; }\nif (state === 'dying') {\nstateT -= dt;\nif (stateT <= 0) {\nlives--;\nhud();\nif (lives <= 0) {\nstate = 'over';\nbest = recordBest('muncher-best', score);\nhud();\noverlay(ov, `<h2>Game over<\/h2><p>Score ${score} · Level ${level}<\/p><button class=\"btn\" onclick=\"start()\">Play again<\/button>`);\n} else { resetActors(); state = 'getready'; stateT = 1400; }\n}\nreturn;\n}\nif (state === 'clear') {\nstateT -= dt;\nif (stateT <= 0) { level++; loadDots(); resetActors(); state = 'getready'; stateT = 1400; hud(); }\nreturn;\n}\nif (frightT > 0) {\nfrightT -= dt;\nif (frightT <= 0) ghosts.forEach(g => { g.fright = false; });\n} else {\nphaseT -= dt;\nif (phaseT <= 0) {\nphaseIdx = Math.min(phaseIdx + 1, PHASES.length - 1);\nphaseT = PHASES[phaseIdx] * 1000;\nghosts.forEach(g => { if (g.mode === 'out') reverse(g); });\n}\n}\nif (fruit) { fruit.t -= dt; if (fruit.t <= 0) fruit = null; }\nmovePac(dt);\nif (state !== 'play') return;\nghosts.forEach(g => moveGhost(g, dt));\nconst pp = pos(pac);\nfor (const g of ghosts) {\nif (g.mode !== 'out') continue;\nconst gp = pos(g);\nlet dx = Math.abs(gp.x - pp.x);\ndx = Math.min(dx, W - dx);\nif (dx + Math.abs(gp.y - pp.y) < 0.7) {\nif (g.fright) {\ng.fright = false;\ng.mode = 'eyes';\nscore += combo;\ncombo *= 2;\nSound.beep(1200, 0.12, 'square', 0.04);\nhud();\n} else {\nstate = 'dying';\nstateT = 1500;\nSound.beep(200, 0.6, 'sawtooth', 0.05);\nreturn;\n}\n}\n}\n}\nfunction drawMaze(flash) {\nctx.fillStyle = '#000';\nctx.fillRect(0, 0, cv.width, cv.height);\nconst edge = flash ? '#fff' : '#3b82f6';\nfor (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {\nconst c = grid[y][x], px = x * T, py = y * T;\nif (c === '#') {\nctx.fillStyle = '#0b1440';\nctx.fillRect(px, py, T, T);\nctx.fillStyle = edge;\nconst wallish = (xx, yy) => { const t = yy < 0 || yy >= H ? '#' : grid[yy][(xx + W) % W]; return t === '#' || t === '_'; };\nif (!wallish(x, y - 1)) ctx.fillRect(px, py, T, 2);\nif (!wallish(x, y + 1)) ctx.fillRect(px, py + T - 2, T, 2);\nif (!wallish(x - 1, y) && x > 0) ctx.fillRect(px, py, 2, T);\nif (!wallish(x + 1, y) && x < W - 1) ctx.fillRect(px + T - 2, py, 2, T);\n} else if (c === '-') {\nctx.fillStyle = '#f9a8d4';\nctx.fillRect(px, py + T / 2 - 2, T, 4);\n} else if (c === '.') {\nctx.fillStyle = '#fde68a';\nctx.fillRect(px + T / 2 - 2, py + T / 2 - 2, 4, 4);\n} else if (c === 'o' && Math.floor(performance.now() / 200) % 2) {\nctx.fillStyle = '#fde68a';\nctx.beginPath(); ctx.arc(px + T / 2, py + T / 2, 7, 0, 7); ctx.fill();\n}\n}\n}\nfunction drawPac() {\nconst p = pos(pac), cx = p.x * T + T / 2, cy = p.y * T + T / 2;\nlet open = (Math.sin(pac.mouth / 50) + 1) / 2 * 0.8 + 0.05;\nlet ang = Math.atan2(pac.dir.y, pac.dir.x);\nif (!pac.dir.x && !pac.dir.y) { ang = Math.atan2(pac.want.y, pac.want.x); open = 0.4; }\nif (state === 'dying') open = Math.min(Math.PI, 0.2 + (1 - stateT / 1500) * Math.PI);\nctx.fillStyle = '#facc15';\nctx.beginPath();\nctx.moveTo(cx, cy);\nctx.arc(cx, cy, T / 2 - 1, ang + open, ang + Math.PI * 2 - open);\nctx.closePath();\nctx.fill();\n}\nfunction drawGhost(g) {\nlet p = g.mode === 'house' ? { x: g.x, y: g.y + Math.sin((g.bob || 0) / 150) * 0.2 } : pos(g);\nconst cx = p.x * T + T / 2, cy = p.y * T + T / 2, r = T / 2 - 1;\nif (g.mode !== 'eyes') {\nconst flashing = g.fright && frightT < 2000 && Math.floor(frightT / 200) % 2;\nctx.fillStyle = g.fright ? (flashing ? '#f8fafc' : '#1d4ed8') : g.color;\nctx.beginPath();\nctx.arc(cx, cy - 2, r, Math.PI, 0);\nctx.lineTo(cx + r, cy + r);\nconst wob = Math.floor(performance.now() / 150) % 2 ? 0 : 2;\nfor (let i = 0; i < 4; i++) {\nconst x1 = cx + r - (i + 0.5) * (r / 2);\nctx.lineTo(x1, cy + r - 5 + (i % 2 ? wob : -wob + 2));\nctx.lineTo(cx + r - (i + 1) * (r / 2), cy + r);\n}\nctx.closePath();\nctx.fill();\nif (g.fright) {\nctx.fillStyle = flashing ? '#ef4444' : '#fde68a';\nctx.fillRect(cx - 5, cy - 4, 3, 3);\nctx.fillRect(cx + 2, cy - 4, 3, 3);\nreturn;\n}\n}\nconst d = g.dir;\nctx.fillStyle = '#fff';\nctx.beginPath(); ctx.arc(cx - 4, cy - 3, 3.6, 0, 7); ctx.arc(cx + 4, cy - 3, 3.6, 0, 7); ctx.fill();\nctx.fillStyle = '#1e3a8a';\nctx.beginPath(); ctx.arc(cx - 4 + d.x * 1.6, cy - 3 + d.y * 1.6, 1.8, 0, 7); ctx.arc(cx + 4 + d.x * 1.6, cy - 3 + d.y * 1.6, 1.8, 0, 7); ctx.fill();\n}\nfunction draw() {\nconst flash = state === 'clear' && Math.floor(stateT / 250) % 2;\ndrawMaze(flash);\nif (!pac) return;\nif (fruit) { ctx.font = '18px system-ui'; ctx.textAlign = 'center'; ctx.fillText('🍒', fruit.x * T + T / 2, fruit.y * T + T / 2 + 6); }\nif (state !== 'clear') ghosts.forEach(g => { if (state !== 'dying' || stateT > 1100) drawGhost(g); });\ndrawPac();\nif (state === 'getready') {\nctx.fillStyle = '#facc15';\nctx.font = 'bold 18px system-ui';\nctx.textAlign = 'center';\nctx.fillText('READY!', cv.width / 2, 11 * T + 17);\n}\n}\nfunction loop(t) {\nconst dt = Math.min(40, t - last);\nlast = t;\nif (state !== 'ready' && state !== 'over' && state !== 'paused') update(dt);\ndraw();\nrequestAnimationFrame(loop);\n}\nfunction steer(x, y) {\nif (state === 'ready' || state === 'over') { start(); }\nif (pac) pac.want = { x, y };\n}\nconst KEYS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] };\ndocument.addEventListener('keydown', e => {\nif (KEYS[e.key]) steer(...KEYS[e.key]);\nif (e.key === 'p' || e.key === 'P') {\nif (state === 'paused') { state = prevState; overlay(ov, null); }\nelse if (state === 'play' || state === 'getready') { prevState = state; state = 'paused'; overlay(ov, '<h2>Paused<\/h2>'); }\n}\nif ((e.key === ' ' || e.key === 'Enter') && (state === 'ready' || state === 'over')) start();\n});\nlet prevState = 'play';\nonSwipe(cv, d => steer(...{ up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }[d]));\n[['tL', [-1, 0]], ['tR', [1, 0]], ['tU', [0, -1]], ['tD', [0, 1]]].forEach(([id, d]) =>\ndocument.getElementById(id).addEventListener('pointerdown', e => { e.preventDefault(); steer(...d); }));\nscore = 0; lives = 3; level = 1;\nloadDots();\nhud();\noverlay(ov, '<h2>Maze Muncher<\/h2><p>Eat all the dots and dodge the ghosts.<\/p><button class=\"btn\" onclick=\"start()\">Start<\/button>');\nrequestAnimationFrame(loop);\n<\/script>\n<\/body>\n<\/html>",
"missile-defense": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Missile Defense<\/title>\n<link rel=\"stylesheet\" href=\"shared.css\">\n<\/head>\n<body>\n<header class=\"topbar\">\n<h1>🚀 Missile Defense<\/h1>\n<div class=\"stats\">Score <b id=\"score\">0<\/b> Wave <b id=\"wave\">1<\/b> Best <b id=\"best\">0<\/b><\/div>\n<\/header>\n<div class=\"stage\">\n<canvas id=\"c\" class=\"game\" width=\"720\" height=\"520\"><\/canvas>\n<div class=\"overlay\" id=\"ov\"><\/div>\n<\/div>\n<p class=\"help\">Click / tap where you want a counter-missile to explode. The nearest battery with ammo fires. Keys <kbd>A<\/kbd> <kbd>S<\/kbd> <kbd>D<\/kbd> fire from the left, middle or right battery at the mouse position.<\/p>\n<script src=\"shared.js\"><\/script>\n<script>\nconst cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov');\nconst W = cv.width, H = cv.height, GROUND = H - 40;\nconst BASE_X = [60, W / 2, W - 60];\nconst CITY_X = [150, 230, 310, 410, 490, 570];\nlet cities, bases, enemies, shots, booms, score, wave, toSpawn, spawnT, state = 'ready', last = 0, mouse = { x: W / 2, y: H / 2 }, bonusT = 0, bonusText = '';\nlet best = Store.get('missile-best', 0);\nfunction hud() {\ndocument.getElementById('score').textContent = score;\ndocument.getElementById('wave').textContent = wave;\ndocument.getElementById('best').textContent = best;\n}\nfunction startWave() {\nbases = BASE_X.map(x => ({ x, ammo: 10, alive: true }));\nenemies = []; shots = []; booms = [];\ntoSpawn = 8 + wave * 3;\nspawnT = 600;\n}\nfunction start() {\nscore = 0; wave = 1;\ncities = CITY_X.map(x => ({ x, alive: true }));\nstartWave();\nstate = 'play';\noverlay(ov, null);\nhud();\n}\nfunction targets() {\nreturn [...cities.filter(c => c.alive).map(c => c.x), ...bases.filter(b => b.alive).map(b => b.x)];\n}\nfunction spawnEnemy(fromX, fromY) {\nconst t = targets();\nif (!t.length) return;\nconst tx = pick(t) + rand(-6, 6);\nconst sx = fromX ?? rand(20, W - 20), sy = fromY ?? 0;\nconst speed = 0.35 + wave * 0.06 + rand(0, 0.12);\nconst d = Math.hypot(tx - sx, GROUND - sy);\nenemies.push({ sx, sy, x: sx, y: sy, tx, ty: GROUND, vx: (tx - sx) / d * speed, vy: (GROUND - sy) / d * speed, split: wave > 1 && Math.random() < 0.15 + wave * 0.02 });\n}\nfunction fire(tx, ty, which) {\nif (state !== 'play' || ty > GROUND - 15) return;\nlet base;\nif (which != null) base = bases[which].alive && bases[which].ammo > 0 ? bases[which] : null;\nelse base = bases.filter(b => b.alive && b.ammo > 0).sort((a, b) => Math.abs(a.x - tx) - Math.abs(b.x - tx))[0];\nif (!base) return;\nbase.ammo--;\nconst sx = base.x, sy = GROUND - 18, d = Math.hypot(tx - sx, ty - sy), sp = base === bases[1] ? 9 : 6.5;\nshots.push({ sx, sy, x: sx, y: sy, tx, ty, vx: (tx - sx) / d * sp, vy: (ty - sy) / d * sp });\nSound.beep(700, 0.05, 'square', 0.03);\n}\nfunction update(dt) {\nconst f = dt / 16.67;\nif (bonusT > 0) {\nbonusT -= dt;\nif (bonusT <= 0) { wave++; startWave(); hud(); }\nreturn;\n}\nspawnT -= dt;\nif (spawnT <= 0 && toSpawn > 0) {\nconst n = Math.min(toSpawn, randInt(1, 2 + Math.floor(wave / 3)));\nfor (let i = 0; i < n; i++) spawnEnemy();\ntoSpawn -= n;\nspawnT = Math.max(500, 2200 - wave * 150) * rand(0.6, 1.3);\n}\nfor (const s of shots) {\ns.x += s.vx * f; s.y += s.vy * f;\nif ((s.vy < 0 && s.y <= s.ty) || Math.hypot(s.tx - s.x, s.ty - s.y) < 8) {\ns.dead = true;\nbooms.push({ x: s.tx, y: s.ty, r: 0, t: 0, friendly: true });\n}\n}\nshots = shots.filter(s => !s.dead);\nfor (const e of enemies) {\ne.x += e.vx * f; e.y += e.vy * f;\nif (e.split && e.y > H * 0.3 && e.y < H * 0.5) {\ne.split = false;\nfor (let k = 0; k < 2; k++) spawnEnemy(e.x, e.y);\n}\nif (e.y >= GROUND) {\ne.dead = true;\nbooms.push({ x: e.x, y: GROUND, r: 0, t: 0 });\ncities.forEach(c => { if (c.alive && Math.abs(c.x - e.x) < 28) c.alive = false; });\nbases.forEach(b => { if (b.alive && Math
