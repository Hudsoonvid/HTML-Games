<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuts &amp; Bolts</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<header class="topbar">
  <a class="back" href="../index.html">← Arcade</a>
  <h1>🔩 Nuts &amp; Bolts</h1>
  <div class="stats">Level <b id="level">1</b> Moves <b id="moves">0</b></div>
</header>
<div class="controls">
  <button class="btn alt" id="undo">↶ Undo</button>
  <button class="btn alt" id="extra">🔩 Extra bolt</button>
  <button class="btn alt" id="restart">↺ Restart</button>
</div>
<div class="stage">
  <canvas id="c" class="game" width="560" height="560"></canvas>
  <div class="overlay hidden" id="ov"></div>
</div>
<p class="help">Tap a bolt to unscrew its top nuts, then tap another bolt to screw them on. Nuts go onto an empty bolt or onto a nut of the same colour. Sort every colour onto its own bolt.</p>
<script src="shared.js"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov');
const COLORS = ['#ef4444', '#3b82f6', '#22c55e', '#facc15', '#a855f7', '#f97316', '#06b6d4', '#ec4899', '#84cc16', '#e5e7eb'];
const CAP = 4;
let level = Store.get('nutsbolts-level', 1), bolts, start, sel = -1, moves = 0, history = [], extraUsed = false, spin = 0;

function generate() {
  const n = Math.min(2 + Math.ceil(level / 2), COLORS.length);
  do {
    const units = shuffle([].concat(...Array.from({ length: n }, (_, c) => Array(CAP).fill(c))));
    bolts = Array.from({ length: n }, (_, i) => units.slice(i * CAP, i * CAP + CAP));
  } while (bolts.some(t => t.every(v => v === t[0])));
  bolts.push([], []);
  start = bolts.map(t => t.slice());
}

function startLevel(fresh) {
  if (fresh) generate();
  bolts = start.map(t => t.slice());
  sel = -1; moves = 0; history = []; extraUsed = false;
  overlay(ov, null);
  hud();
}

function hud() {
  document.getElementById('level').textContent = level;
  document.getElementById('moves').textContent = moves;
  document.getElementById('extra').disabled = extraUsed;
}

function layout() {
  const n = bolts.length, perRow = n <= 6 ? n : Math.ceil(n / 2), rows = Math.ceil(n / perRow);
  const bw = Math.min(70, (cv.width - 40) / perRow - 10), bh = 230;
  const out = [];
  for (let i = 0; i < n; i++) {
    const row = Math.floor(i / perRow), col = i % perRow, inRow = Math.min(perRow, n - row * perRow);
    const gap = (cv.width - inRow * bw) / (inRow + 1);
    out.push({ x: gap + col * (bw + gap), y: (cv.height - rows * bh - (rows - 1) * 30) / 2 + row * (bh + 30), w: bw, h: bh });
  }
  return out;
}

function movable(a, b) {
  const A = bolts[a], B = bolts[b];
  if (a === b || !A.length || B.length >= CAP) return 0;
  const top = A[A.length - 1];
  if (B.length && B[B.length - 1] !== top) return 0;
  let run = 0;
  for (let i = A.length - 1; i >= 0 && A[i] === top; i--) run++;
  return Math.min(run, CAP - B.length);
}

function move(a, b) {
  const k = movable(a, b);
  if (!k) return false;
  history.push(bolts.map(t => t.slice()));
  for (let i = 0; i < k; i++) bolts[b].push(bolts[a].pop());
  moves++;
  spin = 1;
  for (let i = 0; i < k; i++) setTimeout(() => Sound.beep(700 + i * 90, 0.05, 'square', 0.03), i * 70);
  hud();
  if (bolts.every(t => !t.length || (t.length === CAP && t.every(v => v === t[0])))) {
    level++;
    Store.set('nutsbolts-level', level);
    setTimeout(() => { Sound.beep(880, 0.3, 'triangle'); overlay(ov, `<h2>All sorted! 🔩</h2><p>${moves} moves</p><button class="btn" onclick="startLevel(true)">Level ${level}</button>`); }, 350);
  }
  return true;
}

function hexNut(cx, cy, w, h, col) {
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(cx - w / 2, cy - h / 2 + 4);
  ctx.lineTo(cx - w / 2 + 6, cy - h / 2);
  ctx.lineTo(cx + w / 2 - 6, cy - h / 2);
  ctx.lineTo(cx + w / 2, cy - h / 2 + 4);
  ctx.lineTo(cx + w / 2, cy + h / 2 - 4);
  ctx.lineTo(cx + w / 2 - 6, cy + h / 2);
  ctx.lineTo(cx - w / 2 + 6, cy + h / 2);
  ctx.lineTo(cx - w / 2, cy + h / 2 - 4);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.fillRect(cx - w / 2, cy + h / 2 - 7, w, 4);
  ctx.fillStyle = 'rgba(255,255,255,.3)';
  ctx.fillRect(cx - w * 0.3, cy - h / 2 + 3, w * 0.18, h - 8);
}

function draw() {
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(0, 0, cv.width, cv.height);
  if (!bolts) return requestAnimationFrame(draw);
  spin = Math.max(0, spin - 0.06);
  layout().forEach((r, i) => {
    const cx = r.x + r.w / 2, nh = 34;
    // base plate and threaded rod
    ctx.fillStyle = '#475569';
    ctx.beginPath(); ctx.roundRect(cx - r.w / 2, r.y + r.h - 16, r.w, 16, 6); ctx.fill();
    ctx.fillStyle = '#cbd5e1';
    ctx.fillRect(cx - 7, r.y + r.h - 16 - CAP * nh - 26, 14, CAP * nh + 26);
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 2;
    for (let y = r.y + r.h - 20; y > r.y + r.h - 16 - CAP * nh - 22; y -= 7) { ctx.beginPath(); ctx.moveTo(cx - 7, y); ctx.lineTo(cx + 7, y - 3); ctx.stroke(); }
    bolts[i].forEach((c, k) => {
      const lifted = i === sel && k >= bolts[i].length - (() => { let run = 0; for (let j = bolts[i].length - 1; j >= 0 && bolts[i][j] === bolts[i][bolts[i].length - 1]; j--) run++; return run; })();
      hexNut(cx, r.y + r.h - 16 - nh / 2 - k * nh - (lifted ? 34 : 0), r.w * 0.9, nh - 4, COLORS[c]);
    });
    if (i === sel) { ctx.strokeStyle = '#fde047'; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(cx - r.w / 2 - 4, r.y - 10, r.w + 8, r.h + 14, 10); ctx.stroke(); }
  });
  requestAnimationFrame(draw);
}

cv.addEventListener('pointerdown', e => {
  if (!ov.classList.contains('hidden')) return;
  const p = canvasPoint(cv, e);
  const i = layout().findIndex(r => p.x > r.x - 10 && p.x < r.x + r.w + 10 && p.y > r.y - 20 && p.y < r.y + r.h + 10);
  if (i < 0) { sel = -1; return; }
  if (sel < 0) { if (bolts[i].length) { sel = i; Sound.beep(520, 0.04, 'triangle', 0.03); } return; }
  if (!move(sel, i) && bolts[i].length && i !== sel) { sel = i; return; }
  sel = -1;
});
document.getElementById('undo').onclick = () => { if (history.length) { bolts = history.pop(); moves++; sel = -1; hud(); } };
document.getElementById('extra').onclick = () => { if (!extraUsed) { extraUsed = true; bolts.push([]); hud(); } };
document.getElementById('restart').onclick = () => startLevel(false);
generate();
startLevel(false);
draw();
</script>
</body>
</html>
