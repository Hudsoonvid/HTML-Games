<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car Escape</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<header class="topbar">
  <a class="back" href="../index.html">← Arcade</a>
  <h1>🚗 Car Escape</h1>
  <div class="stats">Level <b id="level">1</b> Cars left <b id="left">0</b> Taps <b id="taps">0</b></div>
</header>
<div class="controls">
  <button class="btn alt" id="restart">↺ Restart level</button>
  <button class="btn alt" id="hint">💡 Hint</button>
</div>
<div class="stage">
  <canvas id="c" class="game" width="480" height="560"></canvas>
  <div class="overlay hidden" id="ov"></div>
</div>
<p class="help">Tap a car and it drives straight ahead (the way its headlights point). If something is in the way it bumps and comes back. Get every car out of the jammed lot.</p>
<script src="shared.js"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov');
const COLORS = ['#ef4444', '#3b82f6', '#22c55e', '#facc15', '#a855f7', '#f97316', '#06b6d4', '#ec4899', '#84cc16', '#f43f5e'];
const DIRS = { r: [1, 0], l: [-1, 0], d: [0, 1], u: [0, -1] };
let level = Store.get('carescape-level', 1), N, cars, startCars, taps, anims = [], S, OX, OY, hintCar = null;

function occupied(list, skip) {
  const g = Array.from({ length: N }, () => Array(N).fill(null));
  list.forEach(c => { if (c !== skip && !c.gone) cells(c).forEach(([x, y]) => { g[y][x] = c; }); });
  return g;
}
function cells(c) {
  const out = [];
  for (let i = 0; i < c.len; i++) out.push(c.horiz ? [c.x + i, c.y] : [c.x, c.y + i]);
  return out;
}
// first car in this car's way, or null if the road to the edge is clear
function blocker(c, list) {
  const g = occupied(list, c);
  const [dx, dy] = DIRS[c.dir];
  let x = dx > 0 ? c.x + (c.horiz ? c.len - 1 : 0) : c.x, y = dy > 0 ? c.y + (c.horiz ? 0 : c.len - 1) : c.y;
  for (;;) {
    x += dx; y += dy;
    if (x < 0 || y < 0 || x >= N || y >= N) return null;
    if (g[y][x]) return { car: g[y][x], dist: Math.abs(x - (dx > 0 ? c.x + (c.horiz ? c.len - 1 : 0) : c.x)) + Math.abs(y - (dy > 0 ? c.y + (c.horiz ? 0 : c.len - 1) : c.y)) - 1 };
  }
}

// Every car gets a clear way out when it is placed, so taking cars away in
// reverse order always works: the level is always solvable.
function generate() {
  N = Math.min(6 + Math.floor((level - 1) / 3), 10);
  const target = Math.floor(N * N * Math.min(0.42 + level * 0.02, 0.62));
  let list = [], filled = 0, tries = 0;
  while (filled < target && tries++ < 4000) {
    const horiz = Math.random() < 0.5, len = Math.random() < 0.3 ? 3 : 2;
    const x = randInt(0, horiz ? N - len : N - 1), y = randInt(0, horiz ? N - 1 : N - len);
    const dir = horiz ? pick(['l', 'r']) : pick(['u', 'd']);
    const car = { x, y, len, horiz, dir, color: pick(COLORS), id: list.length };
    const g = occupied(list);
    if (cells(car).some(([cx, cy]) => g[cy][cx])) continue;
    if (blocker(car, list)) continue;
    list.push(car);
    filled += len;
  }
  return list;
}

function layout() {
  S = Math.floor(Math.min((cv.width - 40) / N, (cv.height - 40) / N));
  OX = (cv.width - S * N) / 2;
  OY = (cv.height - S * N) / 2;
}

function startLevel(fresh) {
  if (fresh || !startCars) startCars = generate();
  cars = startCars.map(c => ({ ...c, gone: false, off: 0 }));
  taps = 0;
  anims = [];
  hintCar = null;
  layout();
  overlay(ov, null);
  hud();
}

function hud() {
  document.getElementById('level').textContent = level;
  document.getElementById('left').textContent = cars.filter(c => !c.gone).length;
  document.getElementById('taps').textContent = taps;
}

function tapCar(c) {
  if (c.gone || anims.some(a => a.car === c)) return;
  taps++;
  hintCar = null;
  const b = blocker(c, cars);
  if (!b) {
    anims.push({ car: c, kind: 'exit', t: 0 });
    Sound.beep(520, 0.08, 'triangle', 0.04);
  } else {
    anims.push({ car: c, kind: 'bump', t: 0, dist: b.dist, other: b.car });
    Sound.beep(180, 0.15, 'square', 0.05);
  }
  hud();
}

function update(dt) {
  for (const a of anims) {
    a.t += dt;
    const c = a.car;
    if (a.kind === 'exit') {
      c.off = (a.t / 1000) * 14 * Math.min(1, a.t / 150 + 0.3);
      if (c.off > N + 4) { c.gone = true; a.done = true; }
    } else {
      const reach = a.dist + 0.15, half = 160 + a.dist * 60;
      c.off = a.t < half ? reach * (a.t / half) : Math.max(0, reach * (1 - (a.t - half) / half));
      if (a.t > half * 2) { c.off = 0; a.done = true; }
      if (a.t > half && !a.shook) { a.shook = true; a.other.shake = 220; }
    }
  }
  anims = anims.filter(a => !a.done);
  cars.forEach(c => { if (c.shake) c.shake = Math.max(0, c.shake - dt); });
  if (cars.every(c => c.gone) && !anims.length && ov.classList.contains('hidden')) {
    const stars = taps <= startCars.length ? '⭐⭐⭐' : taps <= startCars.length * 1.4 ? '⭐⭐' : '⭐';
    level++;
    Store.set('carescape-level', level);
    Sound.beep(880, 0.3, 'triangle');
    overlay(ov, `<h2>Lot cleared! ${stars}</h2><p>${startCars.length} cars in ${taps} taps</p><button class="btn" onclick="startLevel(true)">Level ${level}</button>`);
  }
  hud();
}

function drawCar(c) {
  const [dx, dy] = DIRS[c.dir];
  const shake = c.shake ? Math.sin(c.shake / 15) * 3 : 0;
  const x = OX + (c.x + dx * c.off) * S + (c.horiz ? 0 : shake), y = OY + (c.y + dy * c.off) * S + (c.horiz ? shake : 0);
  const w = (c.horiz ? c.len : 1) * S, h = (c.horiz ? 1 : c.len) * S, pad = S * 0.1;
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2);
  const ang = { r: 0, d: Math.PI / 2, l: Math.PI, u: -Math.PI / 2 }[c.dir];
  ctx.rotate(ang);
  const L = (c.horiz ? w : h) - pad * 2, Wd = S - pad * 2;
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.roundRect(-L / 2 + 3, -Wd / 2 + 4, L, Wd, S * 0.18); ctx.fill();
  ctx.fillStyle = c === hintCar && Math.floor(performance.now() / 250) % 2 ? '#fff' : c.color;
  ctx.beginPath(); ctx.roundRect(-L / 2, -Wd / 2, L, Wd, S * 0.18); ctx.fill();
  ctx.fillStyle = 'rgba(15,23,42,.75)';
  ctx.beginPath(); ctx.roundRect(L / 2 - S * 0.62, -Wd / 2 + S * 0.08, S * 0.22, Wd - S * 0.16, 4); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-L / 2 + S * 0.18, -Wd / 2 + S * 0.1, S * 0.18, Wd - S * 0.2, 4); ctx.fill();
  ctx.fillStyle = '#fef08a';
  ctx.beginPath(); ctx.arc(L / 2 - S * 0.06, -Wd / 2 + S * 0.14, S * 0.07, 0, 7); ctx.arc(L / 2 - S * 0.06, Wd / 2 - S * 0.14, S * 0.07, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.beginPath(); ctx.moveTo(S * 0.1, 0); ctx.lineTo(-S * 0.08, -S * 0.12); ctx.lineTo(-S * 0.08, S * 0.12); ctx.fill();
  ctx.restore();
}

function draw() {
  ctx.fillStyle = '#334155';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#475569';
  ctx.fillRect(OX - 8, OY - 8, N * S + 16, N * S + 16);
  ctx.strokeStyle = 'rgba(255,255,255,.18)';
  ctx.setLineDash([S * 0.25, S * 0.2]);
  for (let i = 0; i <= N; i++) {
    ctx.beginPath(); ctx.moveTo(OX + i * S, OY); ctx.lineTo(OX + i * S, OY + N * S); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(OX, OY + i * S); ctx.lineTo(OX + N * S, OY + i * S); ctx.stroke();
  }
  ctx.setLineDash([]);
  cars.forEach(c => { if (!c.gone) drawCar(c); });
}

let last = 0;
function loop(t) {
  const dt = Math.min(40, t - last);
  last = t;
  if (cars) { update(dt); draw(); }
  requestAnimationFrame(loop);
}

cv.addEventListener('pointerdown', e => {
  if (!ov.classList.contains('hidden')) return;
  const p = canvasPoint(cv, e);
  const gx = Math.floor((p.x - OX) / S), gy = Math.floor((p.y - OY) / S);
  const c = cars.find(c => !c.gone && cells(c).some(([x, y]) => x === gx && y === gy));
  if (c) tapCar(c);
});
document.getElementById('restart').onclick = () => startLevel(false);
document.getElementById('hint').onclick = () => { hintCar = cars.find(c => !c.gone && !blocker(c, cars)) || null; };

startLevel(true);
requestAnimationFrame(loop);
</script>
</body>
</html>
