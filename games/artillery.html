<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artillery</title>
<link rel="stylesheet" href="shared.css">
<style>
  .aim { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; align-items: center; color: var(--muted); font-size: 14px; }
  .aim label { display: flex; align-items: center; gap: 8px; }
  .aim input[type=range] { width: 160px; accent-color: var(--accent); }
  .aim b { color: var(--fg); min-width: 2.5em; display: inline-block; }
</style>
</head>
<body>
<header class="topbar">
  <a class="back" href="../index.html">← Arcade</a>
  <h1>💣 Artillery</h1>
  <div class="stats" id="stat"></div>
</header>
<div class="controls"><button class="btn alt" id="menu">Change mode</button></div>
<div class="vsbar" id="vs"></div>
<div class="stage">
  <canvas id="c" class="game" width="800" height="450"></canvas>
  <div class="overlay hidden" id="ov"></div>
</div>
<div class="aim">
  <label>Angle <input type="range" id="ang" min="0" max="180" value="45"> <b id="angV">45°</b></label>
  <label>Power <input type="range" id="pow" min="10" max="100" value="60"> <b id="powV">60</b></label>
  <button class="btn" id="fire">Fire!</button>
</div>
<p class="help"><kbd>←</kbd><kbd>→</kbd> angle · <kbd>↑</kbd><kbd>↓</kbd> power · <kbd>Space</kbd> fire. Mind the wind. Each shot carves the landscape. Play online, vs the computer or with a friend taking turns.</p>
<script src="shared.js"></script>
<script src="net.js"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov');
const W = cv.width, H = cv.height, GRAV = 300, BLAST = 32, FIX = 1 / 240;
const angEl = document.getElementById('ang'), powEl = document.getElementById('pow');
let S, ground, tanks, turn, shell, booms = [], wind = 0, winds = [], shots = 0, state = 'idle', last = 0, aiTimer = 0, trail = [], acc = 0, mySide = 0;
// Shots are simulated with a fixed time step and plain arithmetic so both players' screens agree exactly.
const dist = (dx, dy) => Math.sqrt(dx * dx + dy * dy);
const myTurn = () => S && state === 'aim' && (S.mode === 'local' || turn === mySide);
const nameOf = i => (S.mode === 'local' ? (i === 0 ? 'Blue' : 'Red') : i === mySide ? 'You' : S.opp.name);

function genTerrain() {
  const g = new Array(W);
  const a = [rand(30, 60), rand(15, 35), rand(5, 15)], p = [rand(0, 7), rand(0, 7), rand(0, 7)], fr = [rand(0.004, 0.008), rand(0.012, 0.02), rand(0.03, 0.05)];
  const base = rand(H * 0.55, H * 0.7);
  for (let x = 0; x < W; x++) g[x] = base + a[0] * Math.sin(x * fr[0] + p[0]) + a[1] * Math.sin(x * fr[1] + p[1]) + a[2] * Math.sin(x * fr[2] + p[2]);
  // a hill in the middle makes direct shots harder
  const hill = rand(0.95, 1);
  for (let x = 0; x < W; x++) g[x] -= Math.max(0, 110 - Math.abs(x - W / 2) * 0.6) * hill;
  // flatten the tank spots
  [[60, 120], [W - 120, W - 60]].forEach(([a0, b0]) => { const y = g[Math.floor((a0 + b0) / 2)]; for (let x = a0; x < b0; x++) g[x] = y; });
  return g.map(v => Math.round(v));
}

const groundY = x => ground[clamp(Math.floor(x), 0, W - 1)];

function begin(s) {
  S = s;
  S.on('fire', d => { if (d && state === 'aim' && turn !== mySide) { const t = tanks[turn]; t.angle = clamp(+d.a | 0, 0, 180); t.power = clamp(+d.p | 0, 10, 100); fire(t); } });
  S.startRound(() => ({ ground: genTerrain(), winds: Array.from({ length: 80 }, () => Math.round(rand(-60, 60))), first: S.lastFirst == null ? randInt(0, 1) : 1 - S.lastFirst }), cfg => {
    S.lastFirst = cfg.first;
    ground = Float64Array.from(cfg.ground);
    winds = cfg.winds;
    mySide = S.mode === 'online' ? S.seat : 0;
    tanks = [
      { x: 90, hp: 100, angle: 45, power: 60, color: '#22d3ee' },
      { x: W - 90, hp: 100, angle: 135, power: 60, color: '#f87171', learn: 1 }
    ];
    booms = []; shell = null; trail = []; shots = 0;
    turn = S.mode === 'local' ? 0 : cfg.first;
    wind = winds[0];
    syncInputs();
    overlay(ov, null);
    document.getElementById('stat').textContent = S.mode === 'cpu' ? `CPU level ${S.level.toFixed(2)}` : S.mode === 'online' ? 'Online' : '2 players';
    document.getElementById('vs').innerHTML = S.mode === 'local' ? '<b style="color:#22d3ee">Blue</b> vs <b style="color:#f87171">Red</b>' : `<b style="color:${tanks[mySide].color}">${S.me.name}</b> vs <b style="color:${tanks[1 - mySide].color}">${S.opp.name}</b>`;
    startTurn();
  });
}

function startTurn() {
  if (S.ai && turn !== mySide) { state = 'ai'; aiTimer = S.delay(500, 900); }
  else state = 'aim';
  syncInputs();
}

function syncInputs() {
  const t = tanks[S && S.mode === 'local' ? turn : mySide];
  angEl.value = t.angle;
  powEl.value = t.power;
  document.getElementById('angV').textContent = t.angle + '°';
  document.getElementById('powV').textContent = t.power;
  document.getElementById('fire').disabled = !myTurn();
}

function muzzle(t) {
  const a = t.angle * Math.PI / 180, y = groundY(t.x) - 10;
  return { x: t.x + Math.cos(a) * 18, y: y - Math.sin(a) * 18 };
}

function fire(t) {
  if (S.human && turn === mySide) S.send('fire', { a: t.angle, p: t.power });
  const a = t.angle * Math.PI / 180, m = muzzle(t), sp = t.power * 7;
  shell = { x: m.x, y: m.y, vx: Math.cos(a) * sp, vy: -Math.sin(a) * sp, owner: t };
  trail = [];
  acc = 0;
  state = 'fly';
  syncInputs();
  Sound.beep(160, 0.15, 'sawtooth', 0.05);
}

function stepShell(sh, dt, w) {
  sh.vx += w * dt;
  sh.vy += GRAV * dt;
  sh.x += sh.vx * dt;
  sh.y += sh.vy * dt;
  if (sh.x < 0 || sh.x >= W || sh.y > H) return 'out';
  if (sh.y >= groundY(sh.x)) return 'ground';
  for (const t of tanks) if (t !== sh.owner || sh.y > groundY(t.x) - 30) {
    if (dist(sh.x - t.x, sh.y - (groundY(t.x) - 8)) < 13) return 'tank';
  }
  return null;
}

function explode(x, y) {
  booms.push({ x, y, t: 0 });
  Sound.beep(70, 0.5, 'sawtooth', 0.07);
  for (let xx = Math.floor(x - BLAST); xx <= x + BLAST; xx++) {
    if (xx < 0 || xx >= W) continue;
    const h = Math.sqrt(BLAST * BLAST - (xx - x) * (xx - x));
    if (ground[xx] < y + h) ground[xx] = Math.min(H - 4, Math.max(ground[xx], y + h));
  }
  for (const t of tanks) {
    const d = dist(t.x - x, groundY(t.x) - 8 - y);
    if (d < BLAST + 14) t.hp = Math.max(0, t.hp - Math.round(12 + 48 * (1 - d / (BLAST + 14))));
  }
}

function endTurn() {
  if (tanks.some(t => t.hp <= 0)) {
    state = 'over';
    const mine = tanks[mySide].hp, theirs = tanks[1 - mySide].hp;
    const draw = mine <= 0 && theirs <= 0;
    const title = draw ? 'Mutual destruction!' : S.mode === 'local' ? `${tanks[0].hp > 0 ? 'Blue' : 'Red'} wins! 🎖️` : theirs <= 0 ? 'Victory! 🎖️' : `${S.opp.name} destroyed your tank`;
    setTimeout(() => Lobby.end(S, { result: draw ? 0.5 : theirs <= 0 ? 1 : 0, title }), 700);
    return;
  }
  turn = 1 - turn;
  shots++;
  wind = winds[shots % winds.length];
  startTurn();
}

// The computer finds a good shot by simulation, then misses by less as the level rises
// and as it gets its eye in over the battle.
function aiAim() {
  const me = tanks[turn], foe = tanks[1 - turn], left = me.x > W / 2;
  let best = null, bestD = Infinity;
  for (let ang = left ? 95 : 5; ang <= (left ? 175 : 85); ang += 2) for (let pw = 20; pw <= 100; pw += 2) {
    const a = ang * Math.PI / 180, m = muzzle({ ...me, angle: ang });
    const sh = { x: m.x, y: m.y, vx: Math.cos(a) * pw * 7, vy: -Math.sin(a) * pw * 7, owner: me };
    let r = null, n = 0;
    while (!r && n++ < 600) r = stepShell(sh, 1 / 60, wind);
    if (r === 'out') continue;
    const d = Math.abs(sh.x - foe.x) + Math.abs(sh.y - groundY(foe.x)) * 0.5;
    if (d < bestD) { bestD = d; best = [ang, pw]; }
  }
  if (!best) best = [left ? 135 : 45, 60];
  const err = (8 - S.level * 7.4) * (me.learn || 1);
  me.learn = Math.max(0.3, (me.learn || 1) * 0.75);
  me.angle = clamp(Math.round(best[0] + rand(-err, err)), 0, 180);
  me.power = clamp(Math.round(best[1] + rand(-err, err) * 1.5), 10, 100);
}

function update(dt) {
  booms.forEach(b => { b.t += dt; });
  booms = booms.filter(b => b.t < 500);
  if (state === 'ai') {
    aiTimer -= dt;
    if (aiTimer <= 0) { aiAim(); fire(tanks[turn]); }
  } else if (state === 'fly') {
    acc += dt / 1000;
    while (acc >= FIX && shell) {
      acc -= FIX;
      const r = stepShell(shell, FIX, wind);
      trail.push([shell.x, shell.y]);
      if (r === 'out') { shell = null; state = 'boom'; aiTimer = 400; }
      else if (r) { explode(shell.x, shell.y); shell = null; state = 'boom'; aiTimer = 700; }
    }
  } else if (state === 'boom') {
    aiTimer -= dt;
    if (aiTimer <= 0) endTurn();
  }
}

function drawTank(t, active) {
  const y = groundY(t.x);
  const a = t.angle * Math.PI / 180;
  ctx.strokeStyle = t.color;
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(t.x, y - 10); ctx.lineTo(t.x + Math.cos(a) * 20, y - 10 - Math.sin(a) * 20); ctx.stroke();
  ctx.fillStyle = t.color;
  ctx.beginPath(); ctx.arc(t.x, y - 10, 8, Math.PI, 0); ctx.fill();
  ctx.beginPath(); ctx.roundRect(t.x - 15, y - 10, 30, 9, 4); ctx.fill();
  ctx.fillStyle = '#1f2937';
  ctx.beginPath(); ctx.roundRect(t.x - 16, y - 3, 32, 5, 3); ctx.fill();
  ctx.fillStyle = '#1f2937';
  ctx.fillRect(t.x - 22, y - 38, 44, 6);
  ctx.fillStyle = t.hp > 50 ? '#22c55e' : t.hp > 25 ? '#f59e0b' : '#ef4444';
  ctx.fillRect(t.x - 22, y - 38, 44 * t.hp / 100, 6);
  if (active) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(t.x - 5, y - 52); ctx.lineTo(t.x + 5, y - 52); ctx.lineTo(t.x, y - 44); ctx.fill(); }
}

function draw() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0c4a6e'); g.addColorStop(1, '#f59e0b');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  if (!ground) return;
  ctx.fillStyle = '#3f2a14';
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x < W; x += 2) ctx.lineTo(x, ground[x]);
  ctx.lineTo(W, H);
  ctx.fill();
  ctx.strokeStyle = '#65a30d';
  ctx.lineWidth = 3;
  ctx.beginPath();
  for (let x = 0; x < W; x += 2) x ? ctx.lineTo(x, ground[x]) : ctx.moveTo(0, ground[0]);
  ctx.stroke();
  if (!tanks) return;
  tanks.forEach((t, i) => drawTank(t, i === turn && (state === 'aim' || state === 'ai')));
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  trail.forEach(([x, y], i) => { if (i % 4 === 0) ctx.fillRect(x, y, 2, 2); });
  if (shell) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(shell.x, shell.y, 4, 0, 7); ctx.fill(); }
  booms.forEach(b => {
    ctx.fillStyle = `rgba(253,224,71,${1 - b.t / 500})`;
    ctx.beginPath(); ctx.arc(b.x, b.y, BLAST * (0.5 + b.t / 1000), 0, 7); ctx.fill();
  });
  ctx.fillStyle = '#e6e7f2';
  ctx.font = '14px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText(`Wind ${Math.abs(wind)} ${wind < 0 ? '◀' : wind > 0 ? '▶' : ''}`, W / 2, 24);
  ctx.fillStyle = 'rgba(255,255,255,.6)';
  ctx.fillRect(W / 2, 32, wind * 1.2, 4);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#e6e7f2';
  if (state === 'aim' || state === 'ai') ctx.fillText(S.mode === 'local' ? `${nameOf(turn)}'s turn` : turn === mySide ? 'Your turn' : `${S.opp.name} is aiming…`, 12, 24);
}

function loop(t) {
  const dt = Math.min(40, t - last);
  last = t;
  if (S && state !== 'idle' && state !== 'over') update(dt);
  draw();
  requestAnimationFrame(loop);
}

function setAim(da, dp) {
  if (!myTurn()) return;
  const t = tanks[turn];
  t.angle = clamp(t.angle + da, 0, 180);
  t.power = clamp(t.power + dp, 10, 100);
  syncInputs();
}
angEl.oninput = () => { if (myTurn()) { tanks[turn].angle = +angEl.value; syncInputs(); } };
powEl.oninput = () => { if (myTurn()) { tanks[turn].power = +powEl.value; syncInputs(); } };
document.getElementById('fire').onclick = () => { if (myTurn()) fire(tanks[turn]); };
document.getElementById('menu').onclick = () => Lobby.open();
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); setAim(1, 0); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); setAim(-1, 0); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); setAim(0, 1); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); setAim(0, -1); }
  else if (e.key === ' ') { e.preventDefault(); if (myTurn()) fire(tanks[turn]); }
});

ground = Float64Array.from(genTerrain());
requestAnimationFrame(loop);
Lobby.open({ game: 'artillery', title: '💣 Artillery', local: true, onStart: begin });
</script>
</body>
</html>
