<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battleship</title>
<link rel="stylesheet" href="shared.css">
<style>
  .boards { display: flex; gap: 28px; flex-wrap: wrap; justify-content: center; }
  .side h3 { margin: 4px 0 8px; text-align: center; font-size: 15px; color: var(--muted); }
  .grid { --s: min(34px, calc((100vw - 40px) / 10)); display: grid; grid-template-columns: repeat(10, var(--s)); gap: 2px; background: #0c4a6e; padding: 4px; border-radius: 8px; }
  .cell { width: var(--s); height: var(--s); background: #075985; border: 0; border-radius: 3px; padding: 0; position: relative; font-size: calc(var(--s) * .5); }
  #enemy .cell { cursor: crosshair; }
  #enemy .cell:hover:not(.shot) { background: #0ea5e9; }
  .cell.ship { background: #64748b; }
  .cell.sunk { background: #7f1d1d; }
  .cell.shot::after { content: ''; position: absolute; inset: 35%; border-radius: 50%; background: #e0f2fe; opacity: .6; }
  .cell.hit::after { content: '💥'; inset: 0; background: none; opacity: 1; display: flex; align-items: center; justify-content: center; }
  .fleet { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .fleet span.gone { text-decoration: line-through; opacity: .5; }
</style>
</head>
<body>
<header class="topbar">
  <a class="back" href="../index.html">← Arcade</a>
  <h1>🚢 Battleship</h1>
  <div class="stats" id="stat"></div>
</header>
<div class="controls">
  <button class="btn alt" id="random">🔀 Reposition my fleet</button>
  <button class="btn alt" id="menu">Change mode</button>
</div>
<div class="vsbar" id="vs"></div>
<div class="msg" id="msg"></div>
<div class="boards">
  <div class="side"><h3 id="enemyTitle">Enemy waters — fire here</h3><div class="grid" id="enemy"></div><div class="fleet" id="efleet"></div></div>
  <div class="side"><h3>Your fleet</h3><div class="grid" id="mine"></div><div class="fleet" id="mfleet"></div></div>
</div>
<p class="help">Play online or vs the computer. Take turns firing at enemy waters. Sink all five enemy ships first: Carrier (5), Battleship (4), Cruiser (3), Submarine (3), Destroyer (2). You can reposition your fleet until you fire your first shot.</p>
<script src="shared.js"></script>
<script src="net.js"></script>
<script>
const SHIPS = [['Carrier', 5], ['Battleship', 4], ['Cruiser', 3], ['Submarine', 3], ['Destroyer', 2]];
// me: my fleet + the shots fired at it. foe: what I know about the enemy (their fleet only in computer games).
let S, me, foe, myTurn, over, started, ai;
const $ = id => document.getElementById(id);

function placeFleet() {
  const grid = Array(100).fill(-1), ships = [];
  SHIPS.forEach(([name, len], idx) => {
    for (;;) {
      const horiz = Math.random() < 0.5, r = randInt(0, horiz ? 9 : 10 - len), c = randInt(0, horiz ? 10 - len : 9);
      const cells = Array.from({ length: len }, (_, k) => (horiz ? r * 10 + c + k : (r + k) * 10 + c));
      if (cells.some(i => grid[i] >= 0)) continue;
      cells.forEach(i => { grid[i] = idx; });
      ships.push({ name, cells, hits: 0 });
      break;
    }
  });
  return { grid, ships, shots: new Set() };
}
// the enemy board as I see it: results of my shots
const blankView = () => ({ shots: new Map(), sunk: [], sunkNames: [] });

function render() {
  const mineEl = $('mine'), enemyEl = $('enemy');
  mineEl.innerHTML = ''; enemyEl.innerHTML = '';
  for (let i = 0; i < 100; i++) {
    const b = document.createElement('button');
    b.className = 'cell';
    const shipIdx = me.grid[i], ship = shipIdx >= 0 ? me.ships[shipIdx] : null;
    if (ship) b.classList.add('ship');
    if (ship && ship.hits === ship.cells.length) b.classList.add('sunk');
    if (me.shots.has(i)) b.classList.add('shot', ...(ship ? ['hit'] : []));
    mineEl.appendChild(b);
    const e = document.createElement('button');
    e.className = 'cell';
    const r = foe.shots.get(i);
    if (r) e.classList.add('shot', ...(r !== 'miss' ? ['hit'] : []));
    if (foe.sunk.includes(i)) e.classList.add('ship', 'sunk');
    if (over && foe.fleet && foe.fleet.grid[i] >= 0 && !foe.sunk.includes(i)) e.classList.add('ship');
    e.onclick = () => fire(i);
    enemyEl.appendChild(e);
  }
  const fleet = (names, lost) => SHIPS.map(([n, l]) => `<span class="${lost.includes(n) ? 'gone' : ''}">${n} (${l})</span>`).join('');
  $('efleet').innerHTML = fleet(SHIPS.map(x => x[0]), foe.sunkNames);
  $('mfleet').innerHTML = fleet(SHIPS.map(x => x[0]), me.ships.filter(s => s.hits === s.cells.length).map(s => s.name));
  $('random').disabled = started;
  $('vs').innerHTML = `<b>${S.me.name}</b> vs <b>${S.opp.name}</b> ${over ? '' : `<span class="turn">${myTurn ? 'Your turn' : S.opp.name + "'s turn"}</span>`}`;
  $('enemyTitle').textContent = `${S.opp.name}'s waters — fire here`;
  $('stat').textContent = S.mode === 'cpu' ? `CPU level ${S.level.toFixed(2)}` : 'Online';
}

// apply a shot at my fleet; returns what the shooter learns
function takeShot(i) {
  started = true;
  me.shots.add(i);
  const idx = me.grid[i];
  if (idx < 0) return { i, r: 'miss' };
  const ship = me.ships[idx];
  ship.hits++;
  if (ship.hits < ship.cells.length) return { i, r: 'hit' };
  return { i, r: 'sunk', name: ship.name, cells: ship.cells, lost: me.ships.every(s => s.hits === s.cells.length) };
}

// what I learn about the enemy board from a shot result
function learn(res) {
  foe.shots.set(res.i, res.r);
  if (res.r === 'sunk') { foe.sunk.push(...res.cells); foe.sunkNames.push(res.name); }
  const msg = $('msg');
  msg.textContent = res.r === 'miss' ? 'You missed.' : res.r === 'hit' ? 'Hit!' : `You sank their ${res.name}! 🔥`;
  Sound.beep(res.r === 'miss' ? 220 : 600, res.r === 'miss' ? 0.08 : 0.15, res.r === 'miss' ? 'sine' : 'square', 0.05);
  if (res.lost) return finish(true);
  myTurn = false;
  render();
  if (S.ai) { const r = S.round; setTimeout(() => { if (r === S.round && !over) aiTurn(); }, S.delay(350, 800)); }
}

function fire(i) {
  if (over || !myTurn || foe.shots.has(i) || foe.waiting) return;
  started = true;
  if (S.ai) return learn(foeShot(i));
  foe.waiting = true;
  S.send('fire', { i });
}

// computer side: its own hidden fleet
function foeShot(i) {
  const f = foe.fleet;
  f.shots.add(i);
  const idx = f.grid[i];
  if (idx < 0) return { i, r: 'miss' };
  const ship = f.ships[idx];
  ship.hits++;
  if (ship.hits < ship.cells.length) return { i, r: 'hit' };
  return { i, r: 'sunk', name: ship.name, cells: ship.cells, lost: f.ships.every(s => s.hits === s.cells.length) };
}

// hunt with a checkerboard, then finish off wounded ships; higher levels hunt smarter
function aiPick() {
  const open = i => i >= 0 && i < 100 && !me.shots.has(i);
  if (Math.random() < 0.5 - S.level * 0.5) return pick([...Array(100).keys()].filter(open));
  const live = ai.hits.filter(i => { const s = me.ships[me.grid[i]]; return s.hits < s.cells.length; });
  if (live.length) {
    if (live.length >= 2) {
      const horiz = live.every(i => Math.floor(i / 10) === Math.floor(live[0] / 10));
      const vert = live.every(i => i % 10 === live[0] % 10);
      if (horiz || vert) {
        const sorted = live.slice().sort((a, b) => a - b), step = horiz ? 1 : 10;
        const ends = [sorted[0] - step, sorted[sorted.length - 1] + step].filter(i => open(i) && (!horiz || Math.floor(i / 10) === Math.floor(sorted[0] / 10)));
        if (ends.length) return pick(ends);
      }
    }
    const cands = [];
    live.forEach(i => [-10, 10, -1, 1].forEach(d => {
      const n = i + d;
      if (open(n) && (Math.abs(d) === 10 || Math.floor(n / 10) === Math.floor(i / 10))) cands.push(n);
    }));
    if (cands.length) return pick(cands);
  }
  const pool = [...Array(100).keys()].filter(i => open(i) && (Math.floor(i / 10) + i % 10) % 2 === 0);
  return pool.length ? pick(pool) : pick([...Array(100).keys()].filter(open));
}

function aiTurn() {
  const res = takeShot(aiPick());
  if (res.r !== 'miss') ai.hits.push(res.i);
  incoming(res);
}

// someone fired at me
function incoming(res) {
  $('msg').textContent += res.r === 'miss' ? ` ${S.opp.name} missed.` : res.r === 'hit' ? ` ${S.opp.name} hit your ship!` : ` ${S.opp.name} sank your ${res.name}!`;
  if (res.lost) return finish(false);
  myTurn = true;
  render();
}

function finish(won) {
  over = true;
  myTurn = false;
  render();
  const title = won ? 'Victory! You sank the entire enemy fleet. 🎉' : `${S.opp.name} sank your fleet`;
  $('msg').textContent = title;
  Sound.beep(won ? 880 : 150, 0.4, 'triangle');
  setTimeout(() => Lobby.end(S, { result: won ? 1 : 0, title }), 1300);
}

function begin(s) {
  S = s;
  S.on('fire', d => {
    if (!d || typeof d.i !== 'number' || d.i < 0 || d.i > 99 || me.shots.has(d.i) || myTurn || over) return;
    const res = takeShot(d.i);
    S.send('result', res);
    incoming(res);
  });
  S.on('result', d => { if (d && foe.waiting) { foe.waiting = false; learn(d); } });
  S.startRound(() => ({ first: S.lastFirst == null ? randInt(0, 1) : 1 - S.lastFirst }), cfg => {
    S.lastFirst = cfg.first;
    me = placeFleet();
    foe = blankView();
    if (S.ai) foe.fleet = placeFleet();
    ai = { hits: [] };
    over = false; started = false;
    myTurn = cfg.first === S.seat;
    $('msg').textContent = myTurn ? 'Fire when ready, captain!' : `${S.opp.name} fires first…`;
    render();
    if (S.ai && !myTurn) { const r = S.round; setTimeout(() => { if (r === S.round) aiTurn(); }, S.delay(400, 800)); }
  });
}

$('random').onclick = () => { if (!started && me) { me = placeFleet(); render(); } };
$('menu').onclick = () => Lobby.open();
me = placeFleet(); foe = blankView();
Lobby.open({ game: 'battleship', title: '🚢 Battleship', local: false, onStart: begin });
</script>
</body>
</html>
