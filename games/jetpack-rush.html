<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jetpack Rush</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<header class="topbar">
  <a class="back" href="../index.html">← Arcade</a>
  <h1>🎒 Jetpack Rush</h1>
  <div class="stats">Distance <b id="dist">0</b>m 🪙 <b id="coins">0</b> Best <b id="best">0</b>m</div>
</header>
<div class="stage">
  <canvas id="c" class="game" width="800" height="440"></canvas>
  <div class="overlay" id="ov"></div>
</div>
<p class="help">Hold anywhere (or hold <kbd>Space</kbd>) to fire the jetpack and rise; let go to fall. Dodge electric zappers and incoming missiles (watch for the ⚠️ warning), and grab coins. Shields 🛡️ save you from one hit.</p>
<script src="shared.js"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov');
const W = cv.width, H = cv.height, FLOOR = H - 40, CEIL = 30, PX = 160;
let p, zaps, missiles, coins, items, dist, speed, gotCoins, best = Store.get('jetpack-best', 0), bank = Store.get('jetpack-bank', 0), state = 'ready', last = 0, holding = false, spawnX, missileT, flames = [];

function newGame() {
  p = { y: FLOOR - 30, vy: 0, shield: false, inv: 0 };
  zaps = []; missiles = []; coins = []; items = []; flames = [];
  dist = 0; speed = 260; gotCoins = 0; spawnX = W + 100; missileT = 6000;
  state = 'play';
  overlay(ov, null);
  hud();
}

function hud() {
  document.getElementById('dist').textContent = Math.floor(dist);
  document.getElementById('coins').textContent = bank + (gotCoins || 0);
  document.getElementById('best').textContent = best;
}

// zappers are rotating or fixed bars; coin patterns fill the gaps
function spawn() {
  const kind = Math.random();
  if (kind < 0.55) {
    const len = rand(90, 170), cy = rand(CEIL + 60, FLOOR - 60);
    zaps.push({ x: spawnX, y: cy, len, ang: pick([0, Math.PI / 2, Math.PI / 4, -Math.PI / 4]), spin: Math.random() < 0.25 + dist / 8000 ? rand(-1.6, 1.6) : 0 });
  } else if (kind < 0.85) {
    const cy = rand(CEIL + 40, FLOOR - 80), rows = randInt(1, 3);
    for (let r = 0; r < rows; r++) for (let c = 0; c < 8; c++) coins.push({ x: spawnX + c * 26, y: cy + r * 26 + Math.sin(c / 2) * 20 });
  } else {
    items.push({ x: spawnX, y: rand(CEIL + 40, FLOOR - 40), kind: 'shield' });
  }
  spawnX += rand(200, 340) - Math.min(dist / 60, 90);
}

function hit() {
  if (p.inv > 0) return;
  if (p.shield) { p.shield = false; p.inv = 1200; Sound.beep(300, 0.2, 'square', 0.05); return; }
  state = 'over';
  bank += gotCoins;
  Store.set('jetpack-bank', bank);
  if (recordBest('jetpack-best', Math.floor(dist))) best = Math.floor(dist);
  gotCoins = 0;
  hud();
  Sound.beep(100, 0.6, 'sawtooth', 0.06);
  setTimeout(() => overlay(ov, `<h2>Zapped! ⚡</h2><p>${Math.floor(dist)} m · total coins ${bank}</p><button class="btn" onclick="newGame()">Fly again</button>`), 500);
}

function segDist(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, t = clamp(((px - x1) * dx + (py - y1) * dy) / (dx * dx + dy * dy), 0, 1);
  return Math.hypot(px - x1 - dx * t, py - y1 - dy * t);
}

function update(dt) {
  const s = dt / 1000;
  speed = Math.min(560, 260 + dist * 0.12);
  dist += speed * s / 10;
  if (holding) { p.vy -= 2300 * s; flames.push({ x: PX - 8, y: p.y + 22, vx: rand(-40, 40), vy: rand(150, 260), t: 0 }); }
  p.vy += 1250 * s;
  p.vy = clamp(p.vy, -520, 620);
  p.y += p.vy * s;
  if (p.y < CEIL + 20) { p.y = CEIL + 20; p.vy = 0; }
  if (p.y > FLOOR - 20) { p.y = FLOOR - 20; p.vy = 0; }
  p.inv = Math.max(0, p.inv - dt);
  const dx = speed * s;
  spawnX -= dx;
  while (spawnX < W + 400) spawn();
  zaps.forEach(z => { z.x -= dx; z.ang += z.spin * s; });
  coins.forEach(c => { c.x -= dx; });
  items.forEach(i => { i.x -= dx; });
  missileT -= dt;
  if (missileT <= 0) { missiles.push({ y: p.y, warn: 1100, x: W + 40 }); missileT = Math.max(1800, 6500 - dist * 2); }
  missiles.forEach(m => {
    if (m.warn > 0) { m.warn -= dt; m.y += clamp(p.y - m.y, -200 * s, 200 * s); }
    else m.x -= (speed + 380) * s;
  });
  for (const z of zaps) {
    const hx = Math.cos(z.ang) * z.len / 2, hy = Math.sin(z.ang) * z.len / 2;
    if (segDist(PX, p.y, z.x - hx, z.y - hy, z.x + hx, z.y + hy) < 20) hit();
  }
  for (const m of missiles) if (m.warn <= 0 && Math.abs(m.x - PX) < 26 && Math.abs(m.y - p.y) < 18) { m.x = -100; hit(); }
  coins = coins.filter(c => { if (Math.hypot(c.x - PX, c.y - p.y) < 24) { gotCoins++; Sound.beep(1300, 0.03, 'triangle', 0.02); return false; } return c.x > -20; });
  items = items.filter(i => { if (Math.hypot(i.x - PX, i.y - p.y) < 28) { p.shield = true; Sound.beep(700, 0.15, 'triangle', 0.04); return false; } return i.x > -20; });
  zaps = zaps.filter(z => z.x > -200);
  missiles = missiles.filter(m => m.x > -60);
  flames.forEach(f => { f.t += dt; f.x += (f.vx - speed) * s; f.y += f.vy * s; });
  flames = flames.filter(f => f.t < 300);
  hud();
}

function draw() {
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(0, 0, W, H);
  // lab wall stripes scroll with distance
  const off = ((dist || 0) * 10) % 120;
  ctx.fillStyle = '#273449';
  for (let x = -off; x < W; x += 120) ctx.fillRect(x, CEIL, 60, FLOOR - CEIL);
  ctx.fillStyle = '#475569';
  ctx.fillRect(0, 0, W, CEIL); ctx.fillRect(0, FLOOR, W, H - FLOOR);
  if (!p) return;
  coins.forEach(c => { ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(c.x, c.y, 8, 0, 7); ctx.fill(); ctx.strokeStyle = '#a16207'; ctx.lineWidth = 2; ctx.stroke(); });
  items.forEach(i => { ctx.font = '26px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🛡️', i.x, i.y); });
  zaps.forEach(z => {
    const hx = Math.cos(z.ang) * z.len / 2, hy = Math.sin(z.ang) * z.len / 2;
    ctx.strokeStyle = `rgba(250,204,21,${0.6 + Math.random() * 0.4})`; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(z.x - hx, z.y - hy);
    for (let k = 1; k < 8; k++) ctx.lineTo(z.x - hx + hx * 2 * k / 8 + rand(-4, 4), z.y - hy + hy * 2 * k / 8 + rand(-4, 4));
    ctx.lineTo(z.x + hx, z.y + hy); ctx.stroke();
    ctx.fillStyle = '#94a3b8';
    [[-1, -1], [1, 1]].forEach(([a]) => { ctx.beginPath(); ctx.arc(z.x + hx * a, z.y + hy * a, 10, 0, 7); ctx.fill(); });
  });
  missiles.forEach(m => {
    if (m.warn > 0) { if (Math.floor(m.warn / 120) % 2) { ctx.font = '26px system-ui'; ctx.textAlign = 'center'; ctx.fillText('⚠️', W - 26, m.y); } }
    else { ctx.font = '34px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.save(); ctx.translate(m.x, m.y); ctx.scale(-1, 1); ctx.fillText('🚀', 0, 0); ctx.restore(); }
  });
  flames.forEach(f => { ctx.fillStyle = `rgba(251,146,60,${1 - f.t / 300})`; ctx.beginPath(); ctx.arc(f.x, f.y, 5, 0, 7); ctx.fill(); });
  // the hero
  if (state !== 'over' || Math.floor(performance.now() / 100) % 2) {
    ctx.globalAlpha = p.inv > 0 && Math.floor(p.inv / 80) % 2 ? 0.4 : 1;
    ctx.fillStyle = '#64748b'; ctx.fillRect(PX - 16, p.y - 6, 10, 26);
    ctx.font = '34px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🧑‍🚀', PX, p.y);
    ctx.globalAlpha = 1;
    if (p.shield) { ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(PX, p.y, 26, 0, 7); ctx.stroke(); }
  }
}

function loop(t) {
  const dt = Math.min(34, t - last);
  last = t;
  if (state === 'play') update(dt);
  draw();
  requestAnimationFrame(loop);
}

const press = v => { holding = v; };
cv.addEventListener('pointerdown', () => press(true));
cv.addEventListener('pointerup', () => press(false));
cv.addEventListener('pointercancel', () => press(false));
document.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'ArrowUp') { press(true); if (state === 'ready') newGame(); } });
document.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'ArrowUp') press(false); });
hud();
overlay(ov, '<h2>🎒 Jetpack Rush</h2><p>Hold to fly, release to drop.</p><button class="btn" onclick="newGame()">Play</button>');
requestAnimationFrame(loop);
</script>
</body>
</html>
