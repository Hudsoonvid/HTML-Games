<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swing Hook</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<header class="topbar">
  <a class="back" href="../index.html">← Arcade</a>
  <h1>🪝 Swing Hook</h1>
  <div class="stats">Distance <b id="dist">0</b>m Best <b id="best">0</b>m</div>
</header>
<div class="stage">
  <canvas id="c" class="game" width="800" height="460"></canvas>
  <div class="overlay" id="ov"></div>
</div>
<p class="help">Hold anywhere (or hold <kbd>Space</kbd>) to shoot a grappling hook at the nearest ring ahead and swing. Let go at the right moment to fly forward. Bounce pads launch you upward. Don't fall into the lava!</p>
<script src="shared.js"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov');
const W = cv.width, H = cv.height, LAVA = H - 30, G = 1300;
let p, anchors, pads, rope, camX, best = Store.get('swing-best', 0), state = 'ready', last = 0, holding = false, nextX, trail = [];

function newGame() {
  p = { x: 100, y: 120, vx: 260, vy: 0 };
  anchors = []; pads = []; rope = null; camX = 0; nextX = 220; trail = [];
  while (nextX < 3000) addAnchor();
  state = 'play';
  overlay(ov, null);
  hud();
}

function addAnchor() {
  anchors.push({ x: nextX, y: rand(70, 190) });
  if (Math.random() < 0.15) pads.push({ x: nextX + rand(60, 120), w: 70 });
  nextX += rand(170, 260) + Math.min(p ? p.x / 80 : 0, 80);
}

function hud() {
  document.getElementById('dist').textContent = p ? Math.floor((p.x - 100) / 20) : 0;
  document.getElementById('best').textContent = best;
}

function grab() {
  // nearest ring that is ahead of (or just behind) the player and above
  let bestA = null, bd = Infinity;
  for (const a of anchors) {
    if (a.x < p.x - 40 || a.y > p.y - 20) continue;
    const d = Math.hypot(a.x - p.x, a.y - p.y);
    if (d < 360 && d < bd) { bd = d; bestA = a; }
  }
  if (bestA) { rope = { a: bestA, len: bd }; Sound.beep(700, 0.04, 'triangle', 0.03); }
}

function update(dt) {
  const s = dt / 1000;
  if (holding && !rope) grab();
  if (!holding && rope) { rope = null; p.vx *= 1.05; }
  p.vy += G * s;
  p.x += p.vx * s;
  p.y += p.vy * s;
  if (rope) {
    // keep the rope length: project position onto the circle and remove outward velocity
    const dx = p.x - rope.a.x, dy = p.y - rope.a.y, d = Math.hypot(dx, dy);
    if (d > rope.len) {
      const nx = dx / d, ny = dy / d;
      p.x = rope.a.x + nx * rope.len; p.y = rope.a.y + ny * rope.len;
      const vn = p.vx * nx + p.vy * ny;
      if (vn > 0) { p.vx -= vn * nx; p.vy -= vn * ny; }
    }
    // reel in a little for momentum
    rope.len = Math.max(60, rope.len - 30 * s);
  }
  p.vx *= Math.pow(0.995, dt / 16);
  for (const pd of pads) if (p.vy > 0 && p.x > pd.x && p.x < pd.x + pd.w && p.y > LAVA - 30 && p.y < LAVA - 10) { p.vy = -900; p.vx = Math.max(p.vx, 280); Sound.beep(900, 0.1, 'triangle', 0.04); }
  if (p.y < 14) { p.y = 14; p.vy = Math.abs(p.vy) * 0.3; }
  if (p.y > LAVA - 8) {
    state = 'over';
    const d = Math.floor((p.x - 100) / 20);
    if (recordBest('swing-best', d)) best = d;
    hud();
    Sound.beep(110, 0.5, 'sawtooth', 0.06);
    setTimeout(() => overlay(ov, `<h2>Into the lava! 🔥</h2><p>${d} m</p><button class="btn" onclick="newGame()">Swing again</button>`), 400);
  }
  camX += (p.x - 220 - camX) * Math.min(1, 5 * s);
  while (nextX < camX + W + 600) addAnchor();
  anchors = anchors.filter(a => a.x > camX - 300);
  pads = pads.filter(pd => pd.x > camX - 300);
  trail.push({ x: p.x, y: p.y });
  if (trail.length > 20) trail.shift();
  hud();
}

function draw() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#312e81'); g.addColorStop(1, '#f97316');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  if (!p) return;
  ctx.fillStyle = 'rgba(15,23,42,.5)';
  for (let i = 0; i < 8; i++) { const x = ((i * 140 - camX * 0.3) % (W + 200) + W + 200) % (W + 200) - 100; ctx.fillRect(x, 220 + (i * 37) % 90, 70, H); }
  ctx.save();
  ctx.translate(-camX, 0);
  anchors.forEach(a => {
    const near = !rope && a.x > p.x - 40 && a.y < p.y - 20 && Math.hypot(a.x - p.x, a.y - p.y) < 360;
    ctx.strokeStyle = near ? '#fde047' : '#e2e8f0'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(a.x, a.y, 10, 0, 7); ctx.stroke();
  });
  pads.forEach(pd => { ctx.fillStyle = '#22c55e'; ctx.fillRect(pd.x, LAVA - 20, pd.w, 10); ctx.fillStyle = '#64748b'; ctx.fillRect(pd.x + pd.w / 2 - 4, LAVA - 10, 8, 20); });
  ctx.fillStyle = '#f97316';
  ctx.fillRect(camX, LAVA, W, H - LAVA);
  ctx.fillStyle = '#fde047';
  for (let x = Math.floor(camX / 30) * 30; x < camX + W; x += 30) { ctx.beginPath(); ctx.arc(x + 15, LAVA + 4 + Math.sin(x + performance.now() / 300) * 3, 6, 0, 7); ctx.fill(); }
  if (rope) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(rope.a.x, rope.a.y); ctx.lineTo(p.x, p.y); ctx.stroke(); }
  trail.forEach((t, i) => { ctx.fillStyle = `rgba(255,255,255,${i / 40})`; ctx.beginPath(); ctx.arc(t.x, t.y, 3, 0, 7); ctx.fill(); });
  // stickman
  ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  const ang = Math.atan2(p.vy, p.vx) * 0.3;
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(ang);
  ctx.beginPath(); ctx.arc(0, -16, 7, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(0, 8); ctx.moveTo(0, -4); ctx.lineTo(rope ? 6 : -9, rope ? -14 : 2); ctx.moveTo(0, -4); ctx.lineTo(9, 2); ctx.moveTo(0, 8); ctx.lineTo(-7, 20); ctx.moveTo(0, 8); ctx.lineTo(8, 19); ctx.stroke();
  ctx.restore();
  ctx.restore();
}

function loop(t) {
  const dt = Math.min(25, t - last);
  last = t;
  if (state === 'play') { update(dt / 2); if (state === 'play') update(dt / 2); }
  draw();
  requestAnimationFrame(loop);
}

const press = v => { holding = v; };
cv.addEventListener('pointerdown', () => press(true));
cv.addEventListener('pointerup', () => press(false));
cv.addEventListener('pointercancel', () => press(false));
document.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'ArrowUp') { press(true); if (state !== 'play' && !e.repeat) newGame(); } });
document.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'ArrowUp') press(false); });
hud();
overlay(ov, '<h2>🪝 Swing Hook</h2><p>Hold to hook and swing, release to fly.</p><button class="btn" onclick="newGame()">Play</button>');
requestAnimationFrame(loop);
</script>
</body>
</html>
