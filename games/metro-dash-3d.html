<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metro Dash 3D</title>
<link rel="stylesheet" href="shared.css">
<style>#c { width: min(560px, calc(100vw - 24px)); aspect-ratio: 3 / 4; height: auto; }</style>
</head>
<body>
<header class="topbar">
  <a class="back" href="../index.html">← Arcade</a>
  <h1>🛹 Metro Dash 3D</h1>
  <div class="stats">Score <b id="score">0</b> 🪙 <b id="coins">0</b> Best <b id="best">0</b></div>
</header>
<div class="stage">
  <canvas id="c" class="game"></canvas>
  <div class="overlay" id="ov"></div>
</div>
<p class="help">Swipe left/right (or <kbd>←</kbd><kbd>→</kbd>) to switch tracks, swipe up (<kbd>↑</kbd>/<kbd>Space</kbd>) to jump over barriers and down (<kbd>↓</kbd>) to roll under them. Trains block a whole track — jump onto the ramped ones and run along the roofs! Grab coins as you go.</p>
<script src="shared.js"></script>
<script src="gl3d.js"></script>
<script>
const cv = document.getElementById('c'), ov = document.getElementById('ov');
const LANE = 2.6, TRAIN_H = 3;
let R, M = {}, obs, coins, P, state = 'ready', last = 0, best = Store.get('metro-best', 0), score = 0, gotCoins = 0, nextZ, groundMesh;

function buildMeshes() {
  const tr = GL3D.builder();
  tr.box(-1.15, 0, -6, 2.3, TRAIN_H, 12, [[0.85, 0.2, 0.2], [0.85, 0.2, 0.2], [0.8, 0.8, 0.85], [0.3, 0.3, 0.3], [0.95, 0.85, 0.3], [0.95, 0.85, 0.3]]);
  for (let z = -5; z < 5.5; z += 2.2) { tr.box(1.16, 1.4, z, 0.02, 0.9, 1.4, [0.6, 0.85, 1]); tr.box(-1.18, 1.4, z, 0.02, 0.9, 1.4, [0.6, 0.85, 1]); }
  M.train = R.mesh(tr);
  const rp = GL3D.builder();
  rp.quad([-1.1, 0, 4], [1.1, 0, 4], [1.1, TRAIN_H, -2], [-1.1, TRAIN_H, -2], [0.6, 0.6, 0.65]);
  M.ramp = R.mesh(rp);
  const lo = GL3D.builder();
  lo.box(-1.1, 0, -0.15, 0.2, 1.1, 0.3, [0.9, 0.9, 0.9]).box(0.9, 0, -0.15, 0.2, 1.1, 0.3, [0.9, 0.9, 0.9]).box(-1.2, 0.7, -0.15, 2.4, 0.45, 0.3, [[0.95, 0.3, 0.3], [0.95, 0.3, 0.3], [1, 1, 1], [1, 1, 1], [1, 0.4, 0.3], [1, 0.4, 0.3]]);
  M.low = R.mesh(lo);
  const hi = GL3D.builder();
  hi.box(-1.1, 0, -0.15, 0.2, 2.6, 0.3, [0.3, 0.3, 0.3]).box(0.9, 0, -0.15, 0.2, 2.6, 0.3, [0.3, 0.3, 0.3]).box(-1.2, 1.7, -0.15, 2.4, 0.9, 0.3, [1, 0.8, 0.1]);
  M.high = R.mesh(hi);
  const c = GL3D.builder();
  c.cylinder(0, 0, 0.35, -0.06, 0.06, [1, 0.8, 0.1], 12, [1, 0.9, 0.3]);
  M.coin = R.mesh(c);
  const p = GL3D.builder();
  p.box(-0.3, 0.7, -0.2, 0.6, 0.8, 0.4, [0.2, 0.55, 0.95]).box(-0.28, 0, -0.15, 0.24, 0.72, 0.3, [0.2, 0.2, 0.3]).box(0.04, 0, -0.15, 0.24, 0.72, 0.3, [0.2, 0.2, 0.3]).cube(0, 1.75, 0, 0.45, 0.45, 0.45, [1, 0.8, 0.6]).cube(0, 2.02, 0.05, 0.5, 0.15, 0.55, [0.9, 0.2, 0.3]);
  M.player = R.mesh(p);
  const g = GL3D.builder();
  for (let i = 0; i < 40; i++) {
    const z0 = -i * 4, z1 = z0 - 4;
    g.quad([-12, 0, z0], [12, 0, z0], [12, 0, z1], [-12, 0, z1], i % 2 ? [0.45, 0.4, 0.35] : [0.42, 0.37, 0.32]);
    for (let l = -1; l <= 1; l++) {
      g.box(l * LANE - 0.75, 0.01, z1, 0.12, 0.08, 4, [0.7, 0.7, 0.75]).box(l * LANE + 0.63, 0.01, z1, 0.12, 0.08, 4, [0.7, 0.7, 0.75]);
      g.box(l * LANE - 1, 0.005, z0 - 1, 2, 0.05, 0.4, [0.35, 0.25, 0.15]).box(l * LANE - 1, 0.005, z0 - 3, 2, 0.05, 0.4, [0.35, 0.25, 0.15]);
    }
    // buildings along the sides
    const h1 = 6 + ((i * 37) % 9), h2 = 6 + ((i * 53) % 11);
    g.box(-14, 0, z1, 4, h1, 3.6, [0.55, 0.45 + (i % 3) * 0.08, 0.6]).box(10, 0, z1, 4, h2, 3.6, [0.5 + (i % 2) * 0.1, 0.5, 0.65]);
  }
  groundMesh = R.mesh(g);
}

function spawn(z) {
  const free = [-1, 0, 1];
  const pattern = Math.random();
  if (pattern < 0.45) {
    // one or two trains, leaving a lane open
    const n = Math.random() < 0.4 ? 2 : 1, lanes = shuffle(free.slice()).slice(0, n);
    lanes.forEach(l => { const ramp = Math.random() < 0.35; obs.push({ k: 'train', lane: l, z, len: 12, ramp }); if (ramp) obs.push({ k: 'ramp', lane: l, z: z - 8 }); });
  } else if (pattern < 0.8) {
    shuffle(free.slice()).slice(0, randInt(1, 2)).forEach(l => obs.push({ k: Math.random() < 0.5 ? 'low' : 'high', lane: l, z }));
  }
  const cl = pick(free);
  if (!obs.some(o => o.lane === cl && Math.abs(o.z - z) < 8 && o.k === 'train')) for (let k = 0; k < 5; k++) coins.push({ lane: cl, z: z + 8 + k * 2, y: 0.9 });
}

function newGame() {
  obs = []; coins = []; nextZ = 40;
  P = { lane: 0, x: 0, z: 0, y: 0, vy: 0, roll: 0, speed: 16, ground: 0 };
  score = 0; gotCoins = 0;
  state = 'play';
  overlay(ov, null);
  hud();
}

function hud() {
  document.getElementById('score').textContent = score;
  document.getElementById('coins').textContent = gotCoins;
  document.getElementById('best').textContent = best;
}

function move(d) {
  if (state !== 'play') return;
  if (d === 'left') P.lane = Math.max(-1, P.lane - 1);
  else if (d === 'right') P.lane = Math.min(1, P.lane + 1);
  else if (d === 'up' && P.y <= P.ground + 0.01) { P.vy = 11; P.roll = 0; Sound.beep(600, 0.05, 'triangle', 0.03); }
  else if (d === 'down') { P.roll = 650; if (P.y > P.ground) P.vy = -18; }
}

// height of the surface under the runner (train roofs and ramps count)
function surfaceAt(lane, z) {
  let h = 0;
  for (const o of obs) {
    if (o.lane !== lane) continue;
    if (o.k === 'train' && z > o.z - o.len / 2 && z < o.z + o.len / 2) h = Math.max(h, TRAIN_H);
    if (o.k === 'ramp' && z > o.z - 4 && z < o.z + 2) h = Math.max(h, TRAIN_H * (z - (o.z - 4)) / 6);
  }
  return h;
}

function update(dt) {
  const t = dt / 1000;
  P.speed = Math.min(38, 16 + P.z / 140);
  P.z += P.speed * t;
  P.x += (P.lane * LANE - P.x) * Math.min(1, 14 * t);
  P.roll = Math.max(0, P.roll - dt);
  const lane = Math.round(P.x / LANE);
  P.ground = surfaceAt(lane, P.z);
  P.vy -= 32 * t;
  P.y += P.vy * t;
  if (P.y < P.ground) {
    // walking into the side or front of a train (not up a ramp) is a crash
    if (P.ground - P.y > 0.6 && !obs.some(o => o.k === 'ramp' && o.lane === lane && P.z > o.z - 4 && P.z < o.z + 2.2)) return crash('Smacked into a train! 🚆');
    P.y = P.ground; P.vy = 0;
  }
  for (const o of obs) {
    if (o.lane !== lane || Math.abs(o.z - P.z) > 0.45) continue;
    if (o.k === 'low' && P.y < 0.9) return crash('Tripped over a barrier!');
    if (o.k === 'high' && P.roll <= 0 && P.y < 2.4) return crash('Hit the high bar — roll under it!');
  }
  coins = coins.filter(c => { if (c.lane === lane && Math.abs(c.z - P.z) < 0.8 && Math.abs(P.y + 0.9 - c.y) < 1.4) { gotCoins++; Sound.beep(1300, 0.03, 'triangle', 0.02); return false; } return c.z > P.z - 5; });
  while (nextZ < P.z + 140) { spawn(nextZ); nextZ += rand(18, 28) - Math.min(8, P.z / 300); }
  obs = obs.filter(o => o.z > P.z - 20);
  score = Math.floor(P.z) + gotCoins * 10;
  hud();
}

function crash(why) {
  state = 'over';
  if (recordBest('metro-best', score)) best = score;
  hud();
  Sound.beep(100, 0.5, 'sawtooth', 0.06);
  overlay(ov, `<h2>${why}</h2><p>Score ${score} · 🪙 ${gotCoins}</p><button class="btn" onclick="newGame()">Run again</button>`);
}

function render() {
  R.resize();
  const p = P || { x: 0, y: 0, z: 0, roll: 0 };
  R.camera([p.x * 0.7, p.y + 4.6, -p.z + 7.5], [p.x * 0.85, p.y + 1.2, -p.z - 6]);
  R.begin();
  const base = Math.floor(p.z / 8) * 8 - 8;
  R.draw(groundMesh, M4.translate(0, 0, -base));
  (obs || []).forEach(o => { if (o.z < p.z + 130) R.draw(M[o.k], M4.translate(o.lane * LANE, 0, -o.z)); });
  (coins || []).forEach(c => R.draw(M.coin, M4.chain(M4.translate(c.lane * LANE, c.y, -c.z), M4.rotY(performance.now() / 300), M4.rotX(Math.PI / 2))));
  const sq = p.roll > 0 ? 0.5 : 1;
  R.draw(M.player, M4.chain(M4.translate(p.x, p.y, -p.z), M4.scale(1, sq, 1)));
}

function loop(t) {
  const dt = Math.min(40, t - last);
  last = t;
  if (state === 'play') update(dt);
  if (R) render();
  requestAnimationFrame(loop);
}

if (!GL3D.supported()) overlay(ov, '<h2>3D not available</h2><p>This game needs WebGL, which your browser or device has turned off.</p>');
else {
  R = GL3D.create(cv, { fog: [0.62, 0.8, 0.98], fogNear: 50, fogFar: 120, ambient: 0.55, light: [-0.4, -1, -0.5], fov: 60 });
  buildMeshes();
  obs = []; coins = []; P = { lane: 0, x: 0, z: 0, y: 0, vy: 0, roll: 0, speed: 16, ground: 0 }; nextZ = 40;
  for (let z = 40; z < 140; z += 24) spawn(z);
  hud();
  overlay(ov, '<h2>🛹 Metro Dash 3D</h2><p>Swipe to dodge trains, jump and roll.</p><button class="btn" onclick="newGame()">Run</button>');
  requestAnimationFrame(loop);
}
const KEYS = { ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right', ArrowUp: 'up', w: 'up', ' ': 'up', ArrowDown: 'down', s: 'down' };
document.addEventListener('keydown', e => { if (KEYS[e.key]) { if (state === 'play') move(KEYS[e.key]); else if (R && e.key === ' ' && !e.repeat) newGame(); } });
let sw = null;
cv.addEventListener('pointerdown', e => { sw = { x: e.clientX, y: e.clientY }; });
cv.addEventListener('pointermove', e => {
  if (!sw) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 28) return;
  move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  sw = null;
});
cv.addEventListener('pointerup', e => { if (sw && e.pointerType === 'mouse') { const r = cv.getBoundingClientRect(); move(e.clientX - r.left < r.width / 3 ? 'left' : e.clientX - r.left > r.width * 2 / 3 ? 'right' : 'up'); } sw = null; });
</script>
</body>
</html>
