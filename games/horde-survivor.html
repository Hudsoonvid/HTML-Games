<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horde Survivor</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<header class="topbar">
  <a class="back" href="../index.html">← Arcade</a>
  <h1>🧛 Horde Survivor</h1>
  <div class="stats">Time <b id="time">0:00</b> Level <b id="lvl">1</b> Kills <b id="kills">0</b> Best <b id="best">0:00</b></div>
</header>
<div class="stage">
  <canvas id="c" class="game" width="640" height="640"></canvas>
  <div class="overlay" id="ov"></div>
</div>
<p class="help">Move with <kbd>WASD</kbd>/arrows or by holding and dragging anywhere (a virtual joystick). Your weapons fire on their own. Collect the gems that monsters drop to level up and pick an upgrade. Survive as long as you can!</p>
<script src="shared.js"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov');
const W = cv.width, H = cv.height;
const FOES = [{ e: '🦇', hp: 3, sp: 95, r: 12, xp: 1 }, { e: '🧟', hp: 8, sp: 55, r: 15, xp: 2 }, { e: '👻', hp: 6, sp: 80, r: 14, xp: 2 }, { e: '💀', hp: 16, sp: 60, r: 16, xp: 4 }, { e: '👹', hp: 60, sp: 45, r: 22, xp: 15 }];
let P, foes, shots, gems, fx, time, kills, xp, need, lvl, weapons, state = 'ready', last = 0, keys = {}, joy = null, spawnT, best = Store.get('horde-best', 0), cam;

const UPGRADES = [
  { id: 'wand', name: '🔮 Magic Wand', desc: 'Shoots the nearest monster' },
  { id: 'knife', name: '🔪 Knives', desc: 'Throws knives where you move' },
  { id: 'orb', name: '🌀 Orbit', desc: 'Spinning orbs circle you' },
  { id: 'aura', name: '🧄 Garlic', desc: 'Hurts monsters close to you' },
  { id: 'bolt', name: '⚡ Lightning', desc: 'Strikes random monsters' },
  { id: 'speed', name: '👟 Boots', desc: '+12% move speed' },
  { id: 'heal', name: '❤️ Heart', desc: 'Heal 40% and +10 max HP' },
  { id: 'magnet', name: '🧲 Magnet', desc: 'Pick up gems from further away' }
];

function newGame() {
  P = { x: 0, y: 0, hp: 100, max: 100, sp: 160, magnet: 60, face: [1, 0], inv: 0 };
  foes = []; shots = []; gems = []; fx = [];
  time = 0; kills = 0; xp = 0; need = 5; lvl = 1; spawnT = 0;
  weapons = { wand: 1 };
  cam = { x: 0, y: 0 };
  state = 'play';
  overlay(ov, null);
  hud();
}

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
function hud() {
  document.getElementById('time').textContent = fmt(time || 0);
  document.getElementById('lvl').textContent = lvl || 1;
  document.getElementById('kills').textContent = kills || 0;
  document.getElementById('best').textContent = fmt(best);
}

function levelUp() {
  lvl++; xp -= need; need = Math.floor(need * 1.35 + 3);
  state = 'pick';
  Sound.beep(880, 0.2, 'triangle');
  const opts = shuffle(UPGRADES.filter(u => (weapons[u.id] || 0) < 6)).slice(0, 3);
  overlay(ov, `<h2>Level ${lvl}! Pick one</h2>${opts.map(u => `<button class="btn" style="min-width:260px" onclick="choose('${u.id}')">${u.name} ${weapons[u.id] ? 'Lv ' + (weapons[u.id] + 1) : '(new)'}<br><small>${u.desc}</small></button>`).join('')}`);
}
function choose(id) {
  if (id === 'speed') P.sp *= 1.12;
  else if (id === 'heal') { P.max += 10; P.hp = Math.min(P.max, P.hp + P.max * 0.4); }
  else if (id === 'magnet') P.magnet *= 1.5;
  weapons[id] = (weapons[id] || 0) + 1;
  overlay(ov, null);
  state = 'play';
}

function spawn() {
  const tier = Math.min(FOES.length - 2, Math.floor(time / 50));
  let k = randInt(0, tier);
  if (time > 60 && Math.random() < 0.01) k = 4;
  const f = FOES[k], a = rand(0, Math.PI * 2), d = Math.hypot(W, H) / 2 + 40;
  foes.push({ ...f, x: P.x + Math.cos(a) * d, y: P.y + Math.sin(a) * d, hp: f.hp * (1 + time / 240), max: f.hp * (1 + time / 240), hit: 0 });
}

function nearest(x, y, skip) {
  let b = null, bd = Infinity;
  for (const f of foes) { if (skip && skip.has(f)) continue; const d = Math.hypot(f.x - x, f.y - y); if (d < bd) { bd = d; b = f; } }
  return b;
}

function damage(f, n) {
  f.hp -= n; f.hit = 80;
  if (f.hp <= 0 && !f.dead) {
    f.dead = true; kills++;
    gems.push({ x: f.x, y: f.y, v: f.xp });
    fx.push({ x: f.x, y: f.y, t: 0, e: '💥' });
  }
}

const wt = {};
function fireWeapons(dt) {
  for (const id in weapons) {
    const L = weapons[id];
    wt[id] = (wt[id] || 0) - dt;
    if (id === 'wand' && wt[id] <= 0) {
      wt[id] = Math.max(250, 900 - L * 110);
      const used = new Set();
      for (let k = 0; k < Math.ceil(L / 2); k++) { const t = nearest(P.x, P.y, used); if (!t) break; used.add(t); const a = Math.atan2(t.y - P.y, t.x - P.x); shots.push({ x: P.x, y: P.y, vx: Math.cos(a) * 420, vy: Math.sin(a) * 420, dmg: 4 + L * 1.5, life: 1.4, e: '✨', pierce: 1 }); }
    } else if (id === 'knife' && wt[id] <= 0) {
      wt[id] = Math.max(140, 520 - L * 60);
      for (let k = 0; k < L; k++) { const sp = (k - (L - 1) / 2) * 0.12, a = Math.atan2(P.face[1], P.face[0]) + sp; shots.push({ x: P.x, y: P.y, vx: Math.cos(a) * 520, vy: Math.sin(a) * 520, dmg: 3 + L, life: 0.8, e: '🔪', pierce: 2, rot: a }); }
    } else if (id === 'bolt' && wt[id] <= 0) {
      wt[id] = Math.max(500, 2200 - L * 250);
      for (let k = 0; k < L; k++) { const t = pick(foes.filter(f => Math.abs(f.x - P.x) < W / 2 && Math.abs(f.y - P.y) < H / 2)); if (t) { damage(t, 10 + L * 5); fx.push({ x: t.x, y: t.y, t: 0, e: '⚡' }); } }
      if (L) Sound.beep(1200, 0.04, 'square', 0.02);
    } else if (id === 'aura' && wt[id] <= 0) {
      wt[id] = 400;
      const R = 50 + L * 14;
      foes.forEach(f => { if (Math.hypot(f.x - P.x, f.y - P.y) < R + f.r) damage(f, 1.5 + L); });
    } else if (id === 'orb') {
      const n = L + 1, R = 70 + L * 6, ang = performance.now() / 300;
      for (let k = 0; k < n; k++) {
        const ox = P.x + Math.cos(ang + k * Math.PI * 2 / n) * R, oy = P.y + Math.sin(ang + k * Math.PI * 2 / n) * R;
        foes.forEach(f => { if (!f.orbT || f.orbT < performance.now()) if (Math.hypot(f.x - ox, f.y - oy) < f.r + 12) { damage(f, 3 + L * 2); f.orbT = performance.now() + 300; } });
      }
    }
  }
}

function update(dt) {
  const s = dt / 1000;
  time += s;
  let mx = 0, my = 0;
  if (keys.ArrowLeft || keys.a) mx--;
  if (keys.ArrowRight || keys.d) mx++;
  if (keys.ArrowUp || keys.w) my--;
  if (keys.ArrowDown || keys.s) my++;
  if (joy && joy.cur) { const dx = joy.cur.x - joy.x, dy = joy.cur.y - joy.y, d = Math.hypot(dx, dy); if (d > 6) { mx = dx / Math.max(d, 40); my = dy / Math.max(d, 40); } }
  const m = Math.hypot(mx, my);
  if (m > 0) { const k = Math.min(1, m); P.x += mx / m * P.sp * k * s; P.y += my / m * P.sp * k * s; P.face = [mx / m, my / m]; }
  spawnT -= dt;
  const rate = Math.max(90, 900 - time * 6);
  while (spawnT <= 0) { spawn(); spawnT += rate; if (foes.length > 260) break; }
  fireWeapons(dt);
  foes.forEach(f => {
    const a = Math.atan2(P.y - f.y, P.x - f.x);
    f.x += Math.cos(a) * f.sp * s; f.y += Math.sin(a) * f.sp * s;
    f.hit = Math.max(0, f.hit - dt);
    if (Math.hypot(f.x - P.x, f.y - P.y) < f.r + 14 && P.inv <= 0) { P.hp -= f.xp > 10 ? 15 : 5; P.inv = 400; Sound.beep(160, 0.06, 'square', 0.04); }
  });
  // keep the horde from stacking on one point
  for (let i = 0; i < foes.length; i++) for (let j = i + 1; j < Math.min(foes.length, i + 12); j++) {
    const a = foes[i], b = foes[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = a.r + b.r;
    if (d < min && d > 0) { const push = (min - d) / 2; a.x -= dx / d * push; a.y -= dy / d * push; b.x += dx / d * push; b.y += dy / d * push; }
  }
  P.inv -= dt;
  shots.forEach(sh => {
    sh.x += sh.vx * s; sh.y += sh.vy * s; sh.life -= s;
    for (const f of foes) if (!f.dead && Math.hypot(f.x - sh.x, f.y - sh.y) < f.r + 6) { damage(f, sh.dmg); sh.pierce--; if (sh.pierce <= 0) { sh.life = 0; break; } }
  });
  shots = shots.filter(sh => sh.life > 0);
  foes = foes.filter(f => !f.dead && Math.hypot(f.x - P.x, f.y - P.y) < 1400);
  gems = gems.filter(g => {
    const d = Math.hypot(g.x - P.x, g.y - P.y);
    if (d < P.magnet) { g.x += (P.x - g.x) * 8 * s; g.y += (P.y - g.y) * 8 * s; }
    if (d < 16) { xp += g.v; Sound.beep(1000 + Math.min(xp, 40) * 10, 0.02, 'triangle', 0.02); return false; }
    return true;
  });
  fx.forEach(e => { e.t += dt; });
  fx = fx.filter(e => e.t < 300);
  cam.x = P.x - W / 2; cam.y = P.y - H / 2;
  if (xp >= need) levelUp();
  if (P.hp <= 0) {
    state = 'over';
    if (time > best) { best = Math.floor(time); Store.set('horde-best', best); }
    Sound.beep(100, 0.6, 'sawtooth', 0.06);
    overlay(ov, `<h2>You were overrun</h2><p>Survived ${fmt(time)} · level ${lvl} · ${kills} kills</p><button class="btn" onclick="newGame()">Try again</button>`);
  }
  hud();
}

function draw() {
  ctx.fillStyle = '#1c1917';
  ctx.fillRect(0, 0, W, H);
  if (!P) return;
  // tiled ground
  ctx.strokeStyle = '#292524';
  const ox = -((cam.x % 64) + 64) % 64, oy = -((cam.y % 64) + 64) % 64;
  for (let x = ox; x < W; x += 64) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = oy; y < H; y += 64) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.save();
  ctx.translate(-cam.x, -cam.y);
  if (weapons.aura) { ctx.fillStyle = 'rgba(250,250,210,.08)'; ctx.beginPath(); ctx.arc(P.x, P.y, 50 + weapons.aura * 14, 0, 7); ctx.fill(); }
  gems.forEach(g => { ctx.fillStyle = g.v > 5 ? '#f43f5e' : g.v > 1 ? '#22c55e' : '#38bdf8'; ctx.beginPath(); ctx.moveTo(g.x, g.y - 6); ctx.lineTo(g.x + 5, g.y); ctx.lineTo(g.x, g.y + 6); ctx.lineTo(g.x - 5, g.y); ctx.fill(); });
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  foes.forEach(f => {
    ctx.globalAlpha = f.hit ? 0.5 : 1;
    ctx.font = `${f.r * 2}px system-ui`;
    ctx.fillText(f.e, f.x, f.y);
    ctx.globalAlpha = 1;
    if (f.max > 30) { ctx.fillStyle = '#7f1d1d'; ctx.fillRect(f.x - 20, f.y - f.r - 8, 40, 4); ctx.fillStyle = '#ef4444'; ctx.fillRect(f.x - 20, f.y - f.r - 8, 40 * f.hp / f.max, 4); }
  });
  ctx.font = '18px system-ui';
  shots.forEach(sh => { ctx.save(); ctx.translate(sh.x, sh.y); if (sh.rot != null) ctx.rotate(sh.rot + Math.PI / 4); ctx.fillText(sh.e, 0, 0); ctx.restore(); });
  if (weapons.orb) {
    const n = weapons.orb + 1, R = 70 + weapons.orb * 6, ang = performance.now() / 300;
    for (let k = 0; k < n; k++) ctx.fillText('🌀', P.x + Math.cos(ang + k * Math.PI * 2 / n) * R, P.y + Math.sin(ang + k * Math.PI * 2 / n) * R);
  }
  fx.forEach(e => { ctx.globalAlpha = 1 - e.t / 300; ctx.font = '20px system-ui'; ctx.fillText(e.e, e.x, e.y); ctx.globalAlpha = 1; });
  ctx.globalAlpha = P.inv > 0 && Math.floor(P.inv / 60) % 2 ? 0.5 : 1;
  ctx.font = '30px system-ui';
  ctx.fillText('🧙', P.x, P.y);
  ctx.globalAlpha = 1;
  ctx.restore();
  // HP and XP bars
  ctx.fillStyle = '#450a0a'; ctx.fillRect(W / 2 - 24, H / 2 + 22, 48, 5);
  ctx.fillStyle = '#ef4444'; ctx.fillRect(W / 2 - 24, H / 2 + 22, 48 * Math.max(0, P.hp) / P.max, 5);
  ctx.fillStyle = '#1e3a8a'; ctx.fillRect(0, 0, W, 8);
  ctx.fillStyle = '#60a5fa'; ctx.fillRect(0, 0, W * Math.min(1, xp / need), 8);
  if (joy && joy.cur) { ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(joy.x, joy.y, 40, 0, 7); ctx.stroke(); ctx.fillStyle = 'rgba(255,255,255,.3)'; const dx = joy.cur.x - joy.x, dy = joy.cur.y - joy.y, d = Math.hypot(dx, dy), k = Math.min(1, 40 / (d || 1)); ctx.beginPath(); ctx.arc(joy.x + dx * k, joy.y + dy * k, 16, 0, 7); ctx.fill(); }
}

function loop(t) {
  const dt = Math.min(40, t - last);
  last = t;
  if (state === 'play') update(dt);
  draw();
  requestAnimationFrame(loop);
}

cv.addEventListener('pointerdown', e => { joy = canvasPoint(cv, e); joy.cur = { x: joy.x, y: joy.y }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { if (joy) joy.cur = canvasPoint(cv, e); });
cv.addEventListener('pointerup', () => { joy = null; });
cv.addEventListener('pointercancel', () => { joy = null; });
document.addEventListener('keydown', e => { keys[e.key] = true; if ((e.key === ' ' || e.key === 'Enter') && (state === 'ready' || state === 'over')) newGame(); });
document.addEventListener('keyup', e => { keys[e.key] = false; });
hud();
overlay(ov, '<h2>🧛 Horde Survivor</h2><p>Move to dodge — your weapons fire by themselves.</p><button class="btn" onclick="newGame()">Play</button>');
requestAnimationFrame(loop);
</script>
</body>
</html>
