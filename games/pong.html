<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pong</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<header class="topbar">
  <a class="back" href="../index.html">← Arcade</a>
  <h1>🏓 Pong</h1>
  <div class="stats" id="stat">First to <b>7</b></div>
</header>
<div class="controls"><button class="btn alt" id="menu">Change mode</button></div>
<div class="vsbar" id="vs"></div>
<div class="stage">
  <canvas id="c" class="game" width="720" height="440"></canvas>
  <div class="overlay hidden" id="ov"></div>
</div>
<p class="help">Move your paddle with the mouse, touch, or <kbd>W</kbd>/<kbd>S</kbd> (also <kbd>↑</kbd>/<kbd>↓</kbd>). Two players on one device: left uses <kbd>W</kbd>/<kbd>S</kbd> or the left half of the screen, right uses <kbd>↑</kbd>/<kbd>↓</kbd> or the right half. First to 7 wins. <kbd>Space</kbd> pauses vs the computer.</p>
<script src="shared.js"></script>
<script src="net.js"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov');
const W = cv.width, H = cv.height, PH = 80, PW = 12, WIN = 7;
let S, L, R, ball, state = 'idle', keys = {}, last = 0, serveDir = 1, aiError = 0, aiTimer = 0, sendT = 0, touches = {};
// the host (seat 0) plays the left paddle and runs the ball; the guest plays the right paddle
const mine = () => (S && S.mode === 'online' && S.seat === 1 ? R : L);
const runsBall = () => !S || !S.human || S.host;

function resetBall() { ball = { x: W / 2, y: H / 2, vx: 0, vy: 0, r: 8, wait: 900 }; }

function begin(s) {
  S = s;
  S.on('st', d => { if (!S.host && d) { Object.assign(ball, d.b); L.y = d.l; L.score = d.ls; R.score = d.rs; } });
  S.on('in', d => { if (S.host && d && typeof d.y === 'number') R.y = clamp(d.y, PH / 2, H - PH / 2); });
  S.on('end', d => { if (!S.host && d) { L.score = d.ls; R.score = d.rs; endMatch(); } });
  S.startRound(() => ({ serve: randInt(0, 1) ? 1 : -1 }), cfg => {
    L = { y: H / 2, score: 0 };
    R = { y: H / 2, score: 0 };
    serveDir = cfg.serve === -1 ? -1 : 1;
    resetBall();
    state = 'play';
    overlay(ov, null);
    const you = S.mode === 'online' && S.seat === 1 ? 'right' : 'left';
    document.getElementById('vs').innerHTML = S.mode === 'local' ? '<b style="color:#8b5cf6">Left</b> vs <b style="color:#22d3ee">Right</b>' : you === 'left' ? `<b style="color:#8b5cf6">${S.me.name} (you)</b> vs <b style="color:#22d3ee">${S.opp.name}</b>` : `<b style="color:#8b5cf6">${S.opp.name}</b> vs <b style="color:#22d3ee">${S.me.name} (you)</b>`;
    document.getElementById('stat').innerHTML = S.mode === 'cpu' ? `First to <b>7</b> · CPU ${S.level.toFixed(2)}` : 'First to <b>7</b>';
  });
}

function serve() {
  const a = rand(-0.5, 0.5);
  ball.vx = Math.cos(a) * 6 * serveDir;
  ball.vy = Math.sin(a) * 6;
}

function paddleHit(p, x, dir) {
  if (Math.abs(ball.y - p.y) < PH / 2 + ball.r && Math.abs(ball.x - x) < PW / 2 + ball.r && Math.sign(ball.vx) !== dir) {
    const off = (ball.y - p.y) / (PH / 2);
    const sp = Math.min(Math.hypot(ball.vx, ball.vy) + 0.4, 15);
    const a = off * 0.9;
    ball.vx = Math.cos(a) * sp * dir;
    ball.vy = Math.sin(a) * sp;
    ball.x = x + dir * (PW / 2 + ball.r);
    Sound.beep(dir > 0 ? 440 : 520, 0.04);
  }
}

function endMatch() {
  if (state === 'over') return;
  state = 'over';
  const myScore = mine() === L ? L.score : R.score, theirs = mine() === L ? R.score : L.score;
  const title = S.mode === 'local' ? (L.score > R.score ? 'Left player wins!' : 'Right player wins!') : myScore > theirs ? 'You win! 🎉' : `${S.opp.name} wins`;
  setTimeout(() => Lobby.end(S, { result: myScore > theirs ? 1 : 0, title, detail: `${L.score} – ${R.score}` }), 700);
}

function point(side) {
  side.score++;
  Sound.beep(200, 0.2, 'triangle');
  serveDir = side === L ? 1 : -1;
  resetBall();
  if (side.score >= WIN) {
    if (S.human) S.send('end', { ls: L.score, rs: R.score });
    endMatch();
  }
}

// the computer gets faster, quicker to react and more accurate as the level rises
function aiMove(p, x, f, dt) {
  const L0 = S.level, speed = 3.5 + L0 * 6, react = 0.4 - L0 * 0.33, err = 70 - L0 * 60;
  aiTimer -= dt;
  if (aiTimer <= 0) { aiTimer = react * 1000; aiError = rand(-err, err); }
  let target = H / 2;
  if (ball.vx > 0) {
    // predict where the ball will reach the paddle, including wall bounces
    const t = (x - ball.x) / ball.vx;
    let py = ball.y + ball.vy * t;
    const span = H - 2 * ball.r;
    py = ((py - ball.r) % (2 * span) + 2 * span) % (2 * span);
    py = py > span ? 2 * span - py : py;
    target = py + ball.r + aiError;
  }
  p.y += clamp(target - p.y, -speed * f, speed * f);
}

function update(dt) {
  const f = dt / 16.67, sp = 7 * f;
  if (S.mode === 'local') {
    if (keys.w || keys.W) L.y -= sp;
    if (keys.s || keys.S) L.y += sp;
    if (keys.ArrowUp) R.y -= sp;
    if (keys.ArrowDown) R.y += sp;
  } else {
    const me = mine();
    if (keys.w || keys.W || keys.ArrowUp) me.y -= sp;
    if (keys.s || keys.S || keys.ArrowDown) me.y += sp;
    if (S.ai) aiMove(R, W - 30, f, dt);
  }
  L.y = clamp(L.y, PH / 2, H - PH / 2);
  R.y = clamp(R.y, PH / 2, H - PH / 2);

  if (S.human) {
    sendT += dt;
    if (sendT > 60) {
      sendT = 0;
      if (S.host) S.send('st', { b: { x: Math.round(ball.x), y: Math.round(ball.y), vx: +ball.vx.toFixed(2), vy: +ball.vy.toFixed(2), wait: Math.round(ball.wait) }, l: Math.round(L.y), ls: L.score, rs: R.score });
      else S.send('in', { y: Math.round(R.y) });
    }
  }

  if (ball.wait > 0) {
    ball.wait -= dt;
    if (ball.wait <= 0 && runsBall()) serve();
    return;
  }
  const steps = 3;
  for (let i = 0; i < steps; i++) {
    ball.x += ball.vx * f / steps;
    ball.y += ball.vy * f / steps;
    if (ball.y < ball.r) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }
    if (ball.y > H - ball.r) { ball.y = H - ball.r; ball.vy = -Math.abs(ball.vy); }
    paddleHit(L, 30, 1);
    paddleHit(R, W - 30, -1);
  }
  // only the host decides points; the guest waits for its snapshot
  if (runsBall()) {
    if (ball.x < -20) point(R);
    else if (ball.x > W + 20) point(L);
  }
}

function draw() {
  ctx.fillStyle = '#05060d';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#23264a';
  for (let y = 10; y < H; y += 30) ctx.fillRect(W / 2 - 2, y, 4, 16);
  ctx.font = 'bold 56px system-ui';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#2e3260';
  ctx.fillText(L.score, W / 2 - 80, 70);
  ctx.fillText(R.score, W / 2 + 80, 70);
  ctx.fillStyle = '#8b5cf6';
  ctx.fillRect(30 - PW / 2, L.y - PH / 2, PW, PH);
  ctx.fillStyle = '#22d3ee';
  ctx.fillRect(W - 30 - PW / 2, R.y - PH / 2, PW, PH);
  if (S && S.mode !== 'local' && state === 'play') {
    ctx.font = 'bold 13px system-ui';
    ctx.fillStyle = '#fde047';
    ctx.fillText('YOU', mine() === L ? 30 : W - 30, mine().y - PH / 2 - 8);
  }
  if (ball.x > -30 && ball.x < W + 30) {
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function loop(t) {
  const dt = Math.min(50, t - last);
  last = t;
  if (state === 'play') update(dt);
  draw();
  requestAnimationFrame(loop);
}

// touch/mouse: you move your own paddle; on one device each half of the screen drives one paddle
function pointerMove(e) {
  if (state !== 'play' || (e.pointerType === 'mouse' && e.type === 'pointermove' && !S)) return;
  const p = canvasPoint(cv, e);
  if (S.mode === 'local') (p.x > W / 2 ? R : L).y = p.y;
  else mine().y = p.y;
}
cv.addEventListener('pointermove', pointerMove);
cv.addEventListener('pointerdown', pointerMove);
cv.style.touchAction = 'none';
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
  if (e.key === ' ' && S && !S.human && S.mode !== 'online') {
    if (state === 'play') { state = 'paused'; overlay(ov, '<h2>Paused</h2><p>Space to resume</p>'); }
    else if (state === 'paused') { state = 'play'; overlay(ov, null); }
  }
});
document.addEventListener('keyup', e => { keys[e.key] = false; });
document.getElementById('menu').onclick = () => Lobby.open();

L = { y: H / 2, score: 0 };
R = { y: H / 2, score: 0 };
resetBall();
requestAnimationFrame(loop);
Lobby.open({ game: 'pong', title: '🏓 Pong', local: true, onStart: begin });
</script>
</body>
</html>
