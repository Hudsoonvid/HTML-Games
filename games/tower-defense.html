<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tower Defense</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<header class="topbar">
  <a class="back" href="../index.html">← Arcade</a>
  <h1>🛡️ Tower Defense</h1>
  <div class="stats">Wave <b id="wave">0</b> ❤️ <b id="lives">20</b> 💰 <b id="gold">120</b> Best <b id="best">0</b></div>
</header>
<div class="controls" id="build"></div>
<div class="stage">
  <canvas id="c" class="game" width="720" height="480"></canvas>
  <div class="overlay hidden" id="ov"></div>
</div>
<div class="controls"><button class="btn" id="go">▶ Send wave</button><button class="btn alt" id="fast">⏩ 1×</button><button class="btn alt" id="newg">New game</button></div>
<p class="help">Pick a tower above, then tap a grass square to build it. Tap a built tower to upgrade or sell it. Creeps follow the road — don't let them reach the castle. Every 5th wave brings a boss.</p>
<script src="shared.js"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov');
const CS = 40, COLS = 18, ROWS = 12;
const PATH = [[0, 2], [5, 2], [5, 8], [2, 8], [2, 10], [10, 10], [10, 4], [14, 4], [14, 9], [17, 9]];
const TOWERS = {
  arrow: { name: '🏹 Arrow', cost: 50, range: 110, rate: 450, dmg: 6, col: '#a16207' },
  cannon: { name: '💣 Cannon', cost: 90, range: 95, rate: 1300, dmg: 18, splash: 45, col: '#374151' },
  frost: { name: '❄️ Frost', cost: 70, range: 90, rate: 900, dmg: 2, slow: 0.5, col: '#0ea5e9' },
  sniper: { name: '🎯 Sniper', cost: 130, range: 230, rate: 1900, dmg: 45, col: '#7c3aed' }
};
let road, towers, creeps, bullets, fx, gold, lives, wave, spawning, sel = 'arrow', picked = null, speed = 1, state = 'build', last = 0, best = Store.get('td-best', 0);

// all road cells, and the waypoint polyline in pixels
function makeRoad() {
  road = new Set();
  for (let i = 0; i < PATH.length - 1; i++) {
    const [x1, y1] = PATH[i], [x2, y2] = PATH[i + 1];
    for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) road.add(x + ',' + y);
  }
}
const WP = PATH.map(([x, y]) => [x * CS + CS / 2, y * CS + CS / 2]);

function newGame() {
  makeRoad();
  towers = []; creeps = []; bullets = []; fx = [];
  gold = 120; lives = 20; wave = 0; spawning = null; picked = null; speed = 1; state = 'build';
  document.getElementById('fast').textContent = '⏩ 1×';
  overlay(ov, null);
  buildBar();
  hud();
}

function buildBar() {
  document.getElementById('build').innerHTML = Object.entries(TOWERS).map(([k, t]) => `<button class="btn ${sel === k ? '' : 'alt'}" data-k="${k}">${t.name} 💰${t.cost}</button>`).join('');
  document.querySelectorAll('#build button').forEach(b => { b.onclick = () => { sel = b.dataset.k; picked = null; buildBar(); }; });
}

function hud() {
  document.getElementById('wave').textContent = wave;
  document.getElementById('lives').textContent = lives;
  document.getElementById('gold').textContent = gold;
  document.getElementById('best').textContent = best;
  document.getElementById('go').disabled = !!spawning || creeps.length > 0 || state === 'over';
}

function sendWave() {
  if (spawning || creeps.length) return;
  wave++;
  const boss = wave % 5 === 0;
  spawning = { left: boss ? 1 + Math.floor(wave / 10) : 8 + wave * 2, t: 0, boss };
  hud();
}

function spawnCreep(boss) {
  const hp = (20 + wave * wave * 3.2) * (boss ? 14 : 1);
  const fast = !boss && wave > 3 && Math.random() < 0.25;
  creeps.push({ seg: 0, x: WP[0][0] - 20, y: WP[0][1], hp, max: hp, sp: boss ? 28 : fast ? 72 : 46, slowT: 0, e: boss ? '👹' : fast ? '🐺' : pick(['🐛', '🪲', '🐌']), bounty: boss ? 60 + wave * 3 : 4 + Math.floor(wave / 2) });
}

function update(dt) {
  const s = dt / 1000;
  if (spawning) {
    spawning.t -= dt;
    if (spawning.t <= 0 && spawning.left > 0) { spawnCreep(spawning.boss); spawning.left--; spawning.t = spawning.boss ? 2500 : 650; }
    if (spawning.left <= 0) spawning = null;
  }
  for (const c of creeps) {
    const sp = c.sp * (c.slowT > 0 ? 0.5 : 1);
    c.slowT -= dt;
    let move = sp * s;
    while (move > 0 && c.seg < WP.length - 1) {
      const [tx, ty] = WP[c.seg + 1], dx = tx - c.x, dy = ty - c.y, d = Math.hypot(dx, dy);
      if (d <= move) { c.x = tx; c.y = ty; c.seg++; move -= d; }
      else { c.x += dx / d * move; c.y += dy / d * move; move = 0; }
    }
    if (c.seg >= WP.length - 1) { c.done = true; lives -= c.max > 500 && c.sp < 30 ? 5 : 1; Sound.beep(150, 0.2, 'square', 0.05); }
  }
  creeps = creeps.filter(c => !c.done && c.hp > 0);
  for (const t of towers) {
    const T = TOWERS[t.k], L = t.lvl;
    t.cd -= dt;
    if (t.cd > 0) continue;
    const range = T.range * (1 + (L - 1) * 0.12);
    // target the creep furthest along the road within range
    let target = null, bestProg = -1;
    for (const c of creeps) {
      if (Math.hypot(c.x - t.px, c.y - t.py) > range) continue;
      const prog = c.seg * 10000 - Math.hypot(WP[Math.min(c.seg + 1, WP.length - 1)][0] - c.x, WP[Math.min(c.seg + 1, WP.length - 1)][1] - c.y);
      if (prog > bestProg) { bestProg = prog; target = c; }
    }
    if (!target) continue;
    t.cd = T.rate / (1 + (L - 1) * 0.15);
    t.ang = Math.atan2(target.y - t.py, target.x - t.px);
    bullets.push({ x: t.px, y: t.py, target, k: t.k, dmg: T.dmg * (1 + (L - 1) * 0.6), sp: t.k === 'sniper' ? 900 : 380 });
    Sound.beep(t.k === 'cannon' ? 120 : t.k === 'sniper' ? 900 : 600, 0.02, 'square', 0.012);
  }
  bullets.forEach(b => {
    const c = b.target, dx = c.x - b.x, dy = c.y - b.y, d = Math.hypot(dx, dy);
    if (d < b.sp * s || c.hp <= 0) {
      b.done = true;
      if (c.hp <= 0) return;
      const T = TOWERS[b.k];
      if (T.splash) { creeps.forEach(o => { if (Math.hypot(o.x - c.x, o.y - c.y) < T.splash) hurt(o, b.dmg); }); fx.push({ x: c.x, y: c.y, t: 0, r: T.splash }); }
      else hurt(c, b.dmg);
      if (T.slow) c.slowT = 1500;
    } else { b.x += dx / d * b.sp * s; b.y += dy / d * b.sp * s; }
  });
  bullets = bullets.filter(b => !b.done);
  fx.forEach(f => { f.t += dt; });
  fx = fx.filter(f => f.t < 250);
  if (lives <= 0) {
    state = 'over';
    if (wave - 1 > best) { best = wave - 1; Store.set('td-best', best); }
    Sound.beep(100, 0.6, 'sawtooth', 0.06);
    overlay(ov, `<h2>The castle fell</h2><p>You held out for ${wave - 1} waves.</p><button class="btn" onclick="newGame()">Play again</button>`);
  } else if (!spawning && !creeps.length && state === 'play') {
    state = 'build';
    gold += 20 + wave * 2;
    if (wave > best) { best = wave; Store.set('td-best', best); }
  }
  hud();
}

function hurt(c, n) {
  if (c.hp <= 0) return;
  c.hp -= n;
  if (c.hp <= 0) { gold += c.bounty; Sound.beep(700, 0.03, 'triangle', 0.02); }
}

function draw() {
  ctx.fillStyle = '#4d7c0f';
  ctx.fillRect(0, 0, cv.width, cv.height);
  for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++) {
    if (road && road.has(x + ',' + y)) { ctx.fillStyle = '#d6b37a'; ctx.fillRect(x * CS, y * CS, CS, CS); }
    else if ((x + y) % 2) { ctx.fillStyle = 'rgba(0,0,0,.05)'; ctx.fillRect(x * CS, y * CS, CS, CS); }
  }
  ctx.font = '30px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🏰', WP[WP.length - 1][0], WP[WP.length - 1][1]);
  if (!towers) return;
  if (hover && !road.has(hover.x + ',' + hover.y) && !towers.some(t => t.x === hover.x && t.y === hover.y) && !picked) {
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.beginPath(); ctx.arc(hover.x * CS + CS / 2, hover.y * CS + CS / 2, TOWERS[sel].range, 0, 7); ctx.fill();
  }
  towers.forEach(t => {
    const T = TOWERS[t.k];
    if (picked === t) { ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.beginPath(); ctx.arc(t.px, t.py, T.range * (1 + (t.lvl - 1) * 0.12), 0, 7); ctx.fill(); }
    ctx.fillStyle = T.col; ctx.beginPath(); ctx.roundRect(t.x * CS + 4, t.y * CS + 4, CS - 8, CS - 8, 8); ctx.fill();
    ctx.save(); ctx.translate(t.px, t.py); ctx.rotate(t.ang || 0); ctx.fillStyle = '#111827'; ctx.fillRect(0, -3, 16, 6); ctx.restore();
    ctx.fillStyle = '#fde047'; ctx.font = 'bold 10px system-ui'; ctx.fillText('★'.repeat(t.lvl), t.px, t.y * CS + CS - 7);
  });
  ctx.font = '24px system-ui';
  creeps.forEach(c => {
    ctx.fillText(c.e, c.x, c.y);
    if (c.slowT > 0) { ctx.fillStyle = 'rgba(56,189,248,.35)'; ctx.beginPath(); ctx.arc(c.x, c.y, 13, 0, 7); ctx.fill(); }
    ctx.fillStyle = '#7f1d1d'; ctx.fillRect(c.x - 14, c.y - 18, 28, 4);
    ctx.fillStyle = '#22c55e'; ctx.fillRect(c.x - 14, c.y - 18, 28 * Math.max(0, c.hp) / c.max, 4);
  });
  bullets.forEach(b => { ctx.fillStyle = b.k === 'frost' ? '#7dd3fc' : b.k === 'cannon' ? '#111' : '#fde047'; ctx.beginPath(); ctx.arc(b.x, b.y, b.k === 'cannon' ? 5 : 3, 0, 7); ctx.fill(); });
  fx.forEach(f => { ctx.fillStyle = `rgba(251,146,60,${0.6 - f.t / 420})`; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.5 + f.t / 500), 0, 7); ctx.fill(); });
  if (picked) {
    const T = TOWERS[picked.k], up = Math.round(T.cost * picked.lvl * 0.9), sell = Math.round(T.cost * picked.lvl * 0.6);
    const bx = clamp(picked.px - 80, 4, cv.width - 164), by = picked.py > 100 ? picked.py - 90 : picked.py + 30;
    ctx.fillStyle = 'rgba(15,23,42,.92)'; ctx.beginPath(); ctx.roundRect(bx, by, 160, 60, 10); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '13px system-ui';
    ctx.fillText(`${T.name} ★${picked.lvl}`, bx + 80, by + 14);
    ctx.fillStyle = picked.lvl < 4 && gold >= up ? '#22c55e' : '#475569'; ctx.fillRect(bx + 8, by + 26, 70, 26);
    ctx.fillStyle = '#b91c1c'; ctx.fillRect(bx + 82, by + 26, 70, 26);
    ctx.fillStyle = '#fff';
    ctx.fillText(picked.lvl < 4 ? `⬆ 💰${up}` : 'MAX', bx + 43, by + 40);
    ctx.fillText(`Sell 💰${sell}`, bx + 117, by + 40);
    picked.ui = { bx, by, up, sell };
  }
}

function loop(t) {
  const dt = Math.min(50, t - last);
  last = t;
  if (state === 'play' || (state === 'build' && (spawning || creeps.length))) for (let i = 0; i < speed; i++) update(dt);
  draw();
  requestAnimationFrame(loop);
}

let hover = null;
cv.addEventListener('pointermove', e => { const p = canvasPoint(cv, e); hover = { x: Math.floor(p.x / CS), y: Math.floor(p.y / CS) }; });
cv.addEventListener('pointerdown', e => {
  if (state === 'over') return;
  const p = canvasPoint(cv, e), x = Math.floor(p.x / CS), y = Math.floor(p.y / CS);
  if (picked && picked.ui) {
    const { bx, by, up, sell } = picked.ui;
    if (p.y > by + 26 && p.y < by + 52) {
      if (p.x > bx + 8 && p.x < bx + 78) { if (picked.lvl < 4 && gold >= up) { gold -= up; picked.lvl++; Sound.beep(880, 0.1, 'triangle', 0.04); } hud(); return; }
      if (p.x > bx + 82 && p.x < bx + 152) { gold += sell; towers = towers.filter(t => t !== picked); picked = null; hud(); return; }
    }
  }
  const t = towers.find(o => o.x === x && o.y === y);
  if (t) { picked = picked === t ? null : t; return; }
  picked = null;
  if (road.has(x + ',' + y) || x >= COLS || y >= ROWS) return;
  const T = TOWERS[sel];
  if (gold < T.cost) { Sound.beep(160, 0.05, 'square', 0.03); return; }
  gold -= T.cost;
  towers.push({ k: sel, x, y, px: x * CS + CS / 2, py: y * CS + CS / 2, lvl: 1, cd: 0 });
  Sound.beep(500, 0.06, 'triangle', 0.04);
  hud();
});
document.getElementById('go').onclick = () => { if (state === 'over') return; state = 'play'; sendWave(); };
document.getElementById('fast').onclick = () => { speed = speed === 1 ? 2 : speed === 2 ? 3 : 1; document.getElementById('fast').textContent = `⏩ ${speed}×`; };
document.getElementById('newg').onclick = newGame;
newGame();
requestAnimationFrame(loop);
</script>
</body>
</html>
