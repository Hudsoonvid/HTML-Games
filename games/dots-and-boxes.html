<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dots and Boxes</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<header class="topbar">
  <a class="back" href="../index.html">← Arcade</a>
  <h1>🔲 Dots &amp; Boxes</h1>
  <div class="stats"><span style="color:#22d3ee"><span id="p1name">P1</span> <b id="s1">0</b></span> <span style="color:#f472b6"><span id="p2name">P2</span> <b id="s2">0</b></span></div>
</header>
<div class="controls">
  <select id="size"><option value="3">3 × 3 boxes</option><option value="5" selected>5 × 5 boxes</option><option value="7">7 × 7 boxes</option></select>
  <button class="btn alt" id="menu">Change mode</button>
</div>
<div class="msg" id="msg"></div>
<div class="stage">
  <canvas id="c" class="game" width="540" height="540"></canvas>
</div>
<p class="help">Take turns drawing a line between two neighbouring dots. Close the fourth side of a box to claim it — and you must go again. Most boxes wins. Avoid drawing the third side of a box!</p>
<script src="shared.js"></script>
<script src="net.js"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), msg = document.getElementById('msg');
const COL = ['', '#22d3ee', '#f472b6'];
let S, N, G, M, lines, owner, turn, score, hover = null, over, me = 1;
// player 1 (cyan) moves first; me is this player's number
const myTurn = () => S && !over && (S.mode === 'local' || turn === me);
const nameOf = p => (S.mode === 'local' ? 'P' + p : p === me ? 'You' : S.opp.name);

// line ids: 'h,r,c' (r: 0..N, c: 0..N-1) and 'v,r,c' (r: 0..N-1, c: 0..N)
function allLines() {
  const out = [];
  for (let r = 0; r <= N; r++) for (let c = 0; c < N; c++) out.push(`h,${r},${c}`);
  for (let r = 0; r < N; r++) for (let c = 0; c <= N; c++) out.push(`v,${r},${c}`);
  return out;
}
function boxesOf(id) {
  const [t, r, c] = id.split(','), R = +r, C = +c, out = [];
  if (t === 'h') { if (R > 0) out.push([R - 1, C]); if (R < N) out.push([R, C]); }
  else { if (C > 0) out.push([R, C - 1]); if (C < N) out.push([R, C]); }
  return out;
}
const sides = (set, r, c) => [`h,${r},${c}`, `h,${r + 1},${c}`, `v,${r},${c}`, `v,${r},${c + 1}`].filter(l => set.has(l)).length;

function begin(s) {
  S = s;
  S.on('move', d => { if (d && typeof d.l === 'string' && turn !== me && !over && allLines().includes(d.l)) drawLine(d.l, true); });
  S.startRound(() => ({ n: +document.getElementById('size').value, first: S.lastFirst == null ? randInt(0, 1) : 1 - S.lastFirst }), cfg => {
    S.lastFirst = cfg.first;
    N = [3, 5, 7].includes(cfg.n) ? cfg.n : 5;
    document.getElementById('size').value = N;
    document.getElementById('size').disabled = S.human;
    me = S.mode === 'local' ? 1 : cfg.first === S.seat ? 1 : 2;
    M = 40;
    G = (cv.width - 2 * M) / N;
    lines = new Map();
    owner = Array.from({ length: N }, () => Array(N).fill(0));
    turn = 1;
    score = [0, 0, 0];
    over = false;
    document.getElementById('p1name').textContent = nameOf(1);
    document.getElementById('p2name').textContent = nameOf(2);
    status();
    if (S.ai && turn !== me) aiTurn();
  });
}

function aiTurn() { const r = S.round; setTimeout(() => { if (r === S.round && !over && turn !== me) cpu(); }, S.delay(250, 450)); }

function status() {
  document.getElementById('s1').textContent = score[1];
  document.getElementById('s2').textContent = score[2];
  if (over) return;
  msg.textContent = S.mode === 'local' ? `Player ${turn}'s turn` : turn === me ? 'Your turn' : `${S.opp.name} is thinking…`;
}

function drawLine(id, fromNet) {
  if (over || lines.has(id)) return;
  if (!fromNet && S.human && turn === me) S.send('move', { l: id });
  lines.set(id, turn);
  let made = 0;
  for (const [r, c] of boxesOf(id)) if (sides(lines, r, c) === 4) { owner[r][c] = turn; made++; }
  score[turn] += made;
  Sound.beep(made ? 760 : 420, 0.05, 'triangle', 0.04);
  if (lines.size === allLines().length) {
    over = true;
    status();
    const [a, b2] = [score[1], score[2]];
    const mine = score[me], theirs = score[3 - me];
    const title = a === b2 ? `Tie game, ${a}–${b2}!` : S.mode === 'local' ? `Player ${a > b2 ? 1 : 2} wins ${Math.max(a, b2)}–${Math.min(a, b2)}!` : mine > theirs ? `You win ${mine}–${theirs}! 🎉` : `${S.opp.name} wins ${theirs}–${mine}`;
    msg.textContent = title;
    setTimeout(() => Lobby.end(S, { result: a === b2 ? 0.5 : mine > theirs ? 1 : 0, title }), 900);
    return;
  }
  if (!made) turn = 3 - turn;
  status();
  if (S.ai && turn !== me) aiTurn();
}

// how many boxes the opponent could grab in a row after we play `id`
function giveaway(id) {
  const set = new Set(lines.keys());
  set.add(id);
  let taken = 0, progress = true;
  while (progress) {
    progress = false;
    for (const l of allLines()) {
      if (set.has(l)) continue;
      if (boxesOf(l).some(([r, c]) => sides(set, r, c) === 3)) {
        set.add(l);
        taken += boxesOf(l).filter(([r, c]) => sides(set, r, c) === 4).length;
        progress = true;
      }
    }
  }
  return taken;
}

// takes free boxes, avoids drawing a third side, and gives away as little as it can;
// at lower levels it sometimes misses those and just plays anywhere
function cpu() {
  if (over || turn === me) return;
  const free = allLines().filter(l => !lines.has(l));
  if (Math.random() > 0.35 + S.level * 0.7) return drawLine(pick(free));
  const take = free.find(l => boxesOf(l).some(([r, c]) => sides(lines, r, c) === 3));
  if (take) return drawLine(take);
  const safe = free.filter(l => boxesOf(l).every(([r, c]) => sides(lines, r, c) < 2));
  if (safe.length) return drawLine(pick(safe));
  let best = null, bv = Infinity;
  for (const l of shuffle(free)) { const g = giveaway(l); if (g < bv) { bv = g; best = l; } }
  drawLine(best);
}

function lineCoords(id) {
  const [t, r, c] = id.split(',').map((v, i) => (i ? +v : v));
  return t === 'h' ? [M + c * G, M + r * G, M + (c + 1) * G, M + r * G] : [M + c * G, M + r * G, M + c * G, M + (r + 1) * G];
}

function nearest(p) {
  let best = null, bd = G * 0.35;
  for (const l of allLines()) {
    const [x1, y1, x2, y2] = lineCoords(l);
    const d = Math.hypot(p.x - (x1 + x2) / 2, p.y - (y1 + y2) / 2);
    if (d < bd) { bd = d; best = l; }
  }
  return best;
}

function draw() {
  ctx.fillStyle = '#0b0c18';
  ctx.fillRect(0, 0, cv.width, cv.height);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (owner[r][c]) {
    ctx.fillStyle = owner[r][c] === 1 ? 'rgba(34,211,238,.25)' : 'rgba(244,114,182,.25)';
    ctx.fillRect(M + c * G + 3, M + r * G + 3, G - 6, G - 6);
    ctx.fillStyle = COL[owner[r][c]];
    ctx.font = `bold ${G * 0.35}px system-ui`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(nameOf(owner[r][c]).slice(0, 6), M + c * G + G / 2, M + r * G + G / 2);
  }
  ctx.lineCap = 'round';
  if (hover && !lines.has(hover) && myTurn()) {
    const [x1, y1, x2, y2] = lineCoords(hover);
    ctx.strokeStyle = 'rgba(255,255,255,.3)';
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  lines.forEach((p, l) => {
    const [x1, y1, x2, y2] = lineCoords(l);
    ctx.strokeStyle = COL[p];
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  });
  ctx.fillStyle = '#e6e7f2';
  for (let r = 0; r <= N; r++) for (let c = 0; c <= N; c++) { ctx.beginPath(); ctx.arc(M + c * G, M + r * G, 6, 0, 7); ctx.fill(); }
  requestAnimationFrame(draw);
}

cv.addEventListener('pointermove', e => { hover = nearest(canvasPoint(cv, e)); });
cv.addEventListener('pointerdown', e => {
  if (!myTurn()) return;
  const l = nearest(canvasPoint(cv, e));
  if (l) drawLine(l);
});
document.getElementById('size').onchange = () => { if (S && !S.human) Lobby.open(); };
document.getElementById('menu').onclick = () => Lobby.open();
N = 5; M = 40; G = (cv.width - 2 * M) / N; lines = new Map(); owner = Array.from({ length: N }, () => Array(N).fill(0));
draw();
Lobby.open({ game: 'dots-and-boxes', title: '🔲 Dots & Boxes', local: true, onStart: begin });
</script>
</body>
</html>
