<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048</title>
<link rel="stylesheet" href="shared.css">
<style>
  #board {
    --size: min(460px, calc(100vw - 24px));
    --gap: calc(var(--size) * 0.03);
    --cell: calc((var(--size) - 5 * var(--gap)) / 4);
    width: var(--size); height: var(--size);
    background: #3b3552; border-radius: 12px; position: relative; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .slot, .tile { position: absolute; width: var(--cell); height: var(--cell); border-radius: 8px;
    transform: translate(calc(var(--gap) + var(--c) * (var(--cell) + var(--gap))), calc(var(--gap) + var(--r) * (var(--cell) + var(--gap)))); }
  .slot { background: rgba(255,255,255,.07); }
  .tile { transition: transform .11s ease-in-out; z-index: 1; }
  .tile .in { width: 100%; height: 100%; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: calc(var(--cell) * .42); }
  .tile.new .in { animation: appear .16s ease-out .08s backwards; }
  .tile.pop .in { animation: pop .18s ease-out; }
  .tile.merged { z-index: 2; }
  @keyframes appear { from { transform: scale(0); } }
  @keyframes pop { 50% { transform: scale(1.18); } }
  .scores { display: flex; gap: 10px; }
  .scorebox { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 14px; text-align: center; min-width: 76px; }
  .scorebox small { display: block; color: var(--muted); font-size: 11px; letter-spacing: 1px; }
  .scorebox b { font-size: 20px; }
</style>
</head>
<body>
<header class="topbar">
  <a class="back" href="../index.html">← Arcade</a>
  <h1>🔢 2048</h1>
  <div class="scores"><div class="scorebox"><small>SCORE</small><b id="score">0</b></div><div class="scorebox"><small>BEST</small><b id="best">0</b></div></div>
</header>
<div class="controls">
  <button class="btn" id="new">New game</button>
  <button class="btn alt" id="undo">Undo</button>
</div>
<div class="stage">
  <div id="board"></div>
  <div class="overlay hidden" id="ov"></div>
</div>
<p class="help">Use <kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> / <kbd>WASD</kbd> or swipe to slide the tiles. Equal tiles merge. Reach the <b>2048</b> tile to win! <kbd>U</kbd> undoes one move.</p>
<script src="shared.js"></script>
<script>
const boardEl = document.getElementById('board'), ov = document.getElementById('ov');
const N = 4;
const COLORS = {
  2: ['#eee4da', '#776e65'], 4: ['#ede0c8', '#776e65'], 8: ['#f2b179', '#fff'], 16: ['#f59563', '#fff'],
  32: ['#f67c5f', '#fff'], 64: ['#f65e3b', '#fff'], 128: ['#edcf72', '#fff'], 256: ['#edcc61', '#fff'],
  512: ['#edc850', '#fff'], 1024: ['#edc53f', '#fff'], 2048: ['#edc22e', '#fff'], 4096: ['#a78bfa', '#fff'], 8192: ['#8b5cf6', '#fff']
};
let tiles, score, won, keepPlaying, history = [], nextId = 1, busy = false;
let best = Store.get('2048-best', 0);
document.getElementById('best').textContent = best;

for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
  const s = document.createElement('div');
  s.className = 'slot';
  s.style.setProperty('--r', r);
  s.style.setProperty('--c', c);
  boardEl.appendChild(s);
}

function makeTile(r, c, value, cls) {
  const el = document.createElement('div');
  el.className = 'tile ' + (cls || '');
  el.innerHTML = '<div class="in"></div>';
  const t = { id: nextId++, r, c, value, el };
  place(t);
  paint(t);
  boardEl.appendChild(el);
  return t;
}

function place(t) { t.el.style.setProperty('--r', t.r); t.el.style.setProperty('--c', t.c); }
function paint(t) {
  const [bg, fg] = COLORS[t.value] || ['#3c3a32', '#fff'];
  const inner = t.el.firstChild;
  inner.style.background = bg;
  inner.style.color = fg;
  inner.textContent = t.value;
  if (t.value >= 1024) inner.style.fontSize = 'calc(var(--cell) * .32)';
  else if (t.value >= 128) inner.style.fontSize = 'calc(var(--cell) * .37)';
  else inner.style.fontSize = '';
}

function at(r, c) { return tiles.find(t => t.r === r && t.c === c); }

function addRandom() {
  const empty = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!at(r, c)) empty.push([r, c]);
  if (!empty.length) return;
  const [r, c] = pick(empty);
  tiles.push(makeTile(r, c, Math.random() < 0.9 ? 2 : 4, 'new'));
}

function snapshot() { return { cells: tiles.map(t => [t.r, t.c, t.value]), score, won }; }

function restore(s) {
  tiles.forEach(t => t.el.remove());
  tiles = s.cells.map(([r, c, v]) => makeTile(r, c, v));
  score = s.score;
  won = s.won;
  updateScore();
}

function newGame() {
  if (tiles) tiles.forEach(t => t.el.remove());
  tiles = [];
  score = 0; won = false; keepPlaying = false; history = [];
  addRandom(); addRandom();
  updateScore();
  overlay(ov, null);
}

function updateScore() {
  document.getElementById('score').textContent = score;
  if (score > best) { best = score; Store.set('2048-best', best); }
  document.getElementById('best').textContent = best;
}

function move(dir) {
  if (busy || !ov.classList.contains('hidden')) return;
  const before = snapshot();
  const vertical = dir === 'up' || dir === 'down';
  const reverse = dir === 'right' || dir === 'down';
  let moved = false;
  const removed = [];
  for (let i = 0; i < N; i++) {
    let line = tiles.filter(t => (vertical ? t.c : t.r) === i).sort((a, b) => vertical ? a.r - b.r : a.c - b.c);
    if (reverse) line.reverse();
    const out = [];
    for (const t of line) {
      const prev = out[out.length - 1];
      if (prev && prev.value === t.value && !prev.justMerged) {
        prev.justMerged = true;
        t.into = prev;
        removed.push(t);
      } else out.push(t);
    }
    out.forEach((t, k) => {
      const pos = reverse ? N - 1 - k : k;
      const r = vertical ? pos : i, c = vertical ? i : pos;
      if (t.r !== r || t.c !== c) moved = true;
      t.r = r; t.c = c;
    });
    removed.forEach(t => { if (t.into) { moved = true; t.r = t.into.r; t.c = t.into.c; } });
  }
  if (!moved) return;
  history.push(before);
  if (history.length > 20) history.shift();
  tiles.forEach(t => { t.el.classList.remove('new', 'pop', 'merged'); place(t); });
  busy = true;
  setTimeout(() => {
    removed.forEach(t => t.el.remove());
    tiles = tiles.filter(t => !removed.includes(t));
    tiles.forEach(t => {
      if (t.justMerged) {
        t.value *= 2;
        score += t.value;
        paint(t);
        void t.el.offsetWidth;
        t.el.classList.add('pop', 'merged');
        if (t.value === 2048 && !won) won = true;
      }
      t.justMerged = false;
      t.into = null;
    });
    addRandom();
    updateScore();
    busy = false;
    if (removed.length) Sound.beep(300 + Math.log2(Math.max(...tiles.map(t => t.value))) * 40, 0.05, 'triangle', 0.03);
    if (won && !keepPlaying) {
      keepPlaying = true;
      overlay(ov, `<h2>You made 2048! 🎉</h2><p>Score ${score}</p><button class="btn" onclick="overlay(ov, null)">Keep going</button><button class="btn alt" onclick="newGame()">New game</button>`);
    } else if (!canMove()) {
      overlay(ov, `<h2>Game over</h2><p>Score ${score}</p><button class="btn" onclick="newGame()">Try again</button><button class="btn alt" onclick="undo()">Undo</button>`);
    }
  }, 120);
}

function canMove() {
  if (tiles.length < N * N) return true;
  for (const t of tiles) {
    const right = at(t.r, t.c + 1), down = at(t.r + 1, t.c);
    if ((right && right.value === t.value) || (down && down.value === t.value)) return true;
  }
  return false;
}

function undo() {
  if (busy || !history.length) return;
  restore(history.pop());
  overlay(ov, null);
}

const KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };
document.addEventListener('keydown', e => {
  if (KEYS[e.key]) move(KEYS[e.key]);
  if (e.key === 'u' || e.key === 'U') undo();
});
onSwipe(boardEl, move);
document.getElementById('new').onclick = newGame;
document.getElementById('undo').onclick = undo;
newGame();
</script>
</body>
</html>
