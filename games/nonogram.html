<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nonogram</title>
<link rel="stylesheet" href="shared.css">
<style>
  .wrap { max-width: calc(100vw - 12px); overflow: auto; }
  #board { display: grid; gap: 0; user-select: none; -webkit-user-select: none; touch-action: none; width: max-content; margin: 0 auto; background: var(--panel); padding: 6px; border-radius: 10px; }
  .cell { width: var(--s); height: var(--s); background: #e2e8f0; border: 1px solid #94a3b8; display: flex; align-items: center; justify-content: center; font-size: calc(var(--s) * .6); color: #64748b; cursor: pointer; }
  .cell.fill { background: #312e81; border-color: #312e81; }
  .cell.x::after { content: '✕'; }
  .cell.t { border-top: 2px solid #1e1b4b; }
  .cell.l { border-left: 2px solid #1e1b4b; }
  .cell.hl { box-shadow: inset 0 0 0 100px rgba(139,92,246,.12); }
  .cell.fill.hl { box-shadow: none; }
  .clue { display: flex; align-items: flex-end; justify-content: center; font-size: calc(var(--s) * .45); font-weight: 700; color: var(--fg); padding: 2px; gap: 1px; }
  .clue.col { flex-direction: column; align-items: center; justify-content: flex-end; line-height: 1.1; }
  .clue.row { justify-content: flex-end; align-items: center; gap: 6px; padding-right: 6px; }
  .clue.done { color: #4b5280; }
  #mode.x { background: var(--warn); color: #000; }
</style>
</head>
<body>
<header class="topbar">
  <a class="back" href="../index.html">← Arcade</a>
  <h1>🖼️ Nonogram</h1>
  <div class="stats">Time <b id="time">0</b>s</div>
</header>
<div class="controls">
  <select id="size"><option value="5">5 × 5</option><option value="10" selected>10 × 10</option><option value="15">15 × 15</option></select>
  <button class="btn" id="new">New puzzle</button>
  <button class="btn alt" id="mode">✏️ Fill mode</button>
  <button class="btn alt" id="clear">Clear</button>
</div>
<div class="stage">
  <div class="wrap"><div id="board"></div></div>
  <div class="overlay hidden" id="ov"></div>
</div>
<p class="help">The numbers tell you the lengths of filled runs in each row and column, in order. Left-click (or drag) to fill, right-click to mark a cell as empty ✕. On touch, switch modes with the button.</p>
<script src="shared.js"></script>
<script>
const boardEl = document.getElementById('board'), ov = document.getElementById('ov');
let N, sol, state, rowClues, colClues, cellEls, xMode = false, dragVal = null, t0, timerId, solved;

const runs = arr => { const out = []; let n = 0; arr.forEach(v => { if (v) n++; else if (n) { out.push(n); n = 0; } }); if (n) out.push(n); return out; };
const same = (a, b) => a.length === b.length && a.every((v, i) => v === b[i]);

function newPuzzle() {
  N = +document.getElementById('size').value;
  do {
    sol = Array.from({ length: N }, () => Array.from({ length: N }, () => Math.random() < 0.58 ? 1 : 0));
  } while (sol.some(r => !r.some(Boolean)));
  rowClues = sol.map(runs);
  colClues = sol[0].map((_, c) => runs(sol.map(r => r[c])));
  state = Array.from({ length: N }, () => Array(N).fill(0)); // 0 empty, 1 filled, 2 crossed
  const s = Math.max(20, Math.min(36, Math.floor((Math.min(window.innerWidth, 900) - 40) / (N + Math.ceil(N / 2) + 1))));
  boardEl.style.setProperty('--s', s + 'px');
  const maxRow = Math.max(...rowClues.map(c => c.length)), maxCol = Math.max(...colClues.map(c => c.length));
  boardEl.style.gridTemplateColumns = `${Math.max(2, maxRow) * s * 0.62 + 10}px repeat(${N}, var(--s))`;
  boardEl.style.gridTemplateRows = `${Math.max(2, maxCol) * s * 0.52 + 6}px repeat(${N}, var(--s))`;
  boardEl.innerHTML = '<div></div>';
  colClues.forEach((c, i) => { const d = document.createElement('div'); d.className = 'clue col'; d.id = 'cc' + i; d.innerHTML = (c.length ? c : [0]).map(v => `<span>${v}</span>`).join(''); boardEl.appendChild(d); });
  cellEls = [];
  for (let r = 0; r < N; r++) {
    const d = document.createElement('div');
    d.className = 'clue row';
    d.id = 'rc' + r;
    d.innerHTML = (rowClues[r].length ? rowClues[r] : [0]).map(v => `<span>${v}</span>`).join('');
    boardEl.appendChild(d);
    cellEls.push([]);
    for (let c = 0; c < N; c++) {
      const el = document.createElement('div');
      el.className = 'cell' + (r && r % 5 === 0 ? ' t' : '') + (c && c % 5 === 0 ? ' l' : '');
      el.dataset.r = r;
      el.dataset.c = c;
      boardEl.appendChild(el);
      cellEls[r].push(el);
    }
  }
  solved = false;
  clearInterval(timerId);
  t0 = Date.now();
  timerId = setInterval(() => { document.getElementById('time').textContent = Math.floor((Date.now() - t0) / 1000); }, 500);
  overlay(ov, null);
  render();
}

function render() {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const el = cellEls[r][c];
    el.classList.toggle('fill', state[r][c] === 1);
    el.classList.toggle('x', state[r][c] === 2);
  }
  for (let r = 0; r < N; r++) document.getElementById('rc' + r).classList.toggle('done', same(runs(state[r].map(v => v === 1)), rowClues[r]));
  for (let c = 0; c < N; c++) document.getElementById('cc' + c).classList.toggle('done', same(runs(state.map(row => row[c] === 1)), colClues[c]));
}

function apply(el) {
  if (!el || !el.classList.contains('cell') || solved) return;
  const r = +el.dataset.r, c = +el.dataset.c;
  if (state[r][c] === dragVal) return;
  state[r][c] = dragVal;
  render();
  check();
}

function check() {
  const ok = state.every((row, r) => same(runs(row.map(v => v === 1)), rowClues[r])) &&
    state[0].every((_, c) => same(runs(state.map(row => row[c] === 1)), colClues[c]));
  if (!ok) return;
  solved = true;
  clearInterval(timerId);
  const secs = Math.floor((Date.now() - t0) / 1000);
  const best = recordBest('nonogram-best-' + N, secs, true);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (state[r][c] === 2) state[r][c] = 0;
  render();
  Sound.beep(880, 0.3, 'triangle');
  setTimeout(() => overlay(ov, `<h2>Picture complete! 🎨</h2><p>${secs}s · Best for ${N}×${N}: ${best}s</p><button class="btn" onclick="newPuzzle()">Next puzzle</button><button class="btn alt" onclick="overlay(ov, null)">Admire it</button>`), 400);
}

function highlight(el) {
  const r = el && el.dataset.r != null ? +el.dataset.r : -1, c = el && el.dataset.c != null ? +el.dataset.c : -1;
  cellEls.forEach((row, rr) => row.forEach((cel, cc) => cel.classList.toggle('hl', rr === r || cc === c)));
}

boardEl.addEventListener('contextmenu', e => e.preventDefault());
boardEl.addEventListener('pointerdown', e => {
  const el = e.target.closest('.cell');
  if (!el) return;
  e.preventDefault();
  const r = +el.dataset.r, c = +el.dataset.c;
  const want = e.button === 2 || xMode ? 2 : 1;
  dragVal = state[r][c] === want ? 0 : want;
  Sound.beep(dragVal === 1 ? 520 : 330, 0.03, 'triangle', 0.025);
  apply(el);
});
boardEl.addEventListener('pointermove', e => {
  const el = document.elementFromPoint(e.clientX, e.clientY);
  if (e.pointerType === 'mouse') highlight(el && el.closest ? el.closest('.cell') : null);
  if (dragVal === null) return;
  apply(el && el.closest ? el.closest('.cell') : null);
});
window.addEventListener('pointerup', () => { dragVal = null; });
boardEl.addEventListener('pointerleave', () => highlight(null));

document.getElementById('new').onclick = newPuzzle;
document.getElementById('size').onchange = newPuzzle;
document.getElementById('clear').onclick = () => { state = state.map(r => r.map(() => 0)); solved = false; render(); };
document.getElementById('mode').onclick = e => {
  xMode = !xMode;
  e.currentTarget.classList.toggle('x', xMode);
  e.currentTarget.textContent = xMode ? '✕ Cross mode' : '✏️ Fill mode';
};
newPuzzle();
</script>
</body>
</html>
