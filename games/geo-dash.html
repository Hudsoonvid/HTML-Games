<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geo Dash</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<header class="topbar">
  <a class="back" href="../index.html">← Arcade</a>
  <h1>🔷 Geo Dash</h1>
  <div class="stats">Level <b id="level">1</b> Attempt <b id="att">1</b> Best <b id="best">0%</b></div>
</header>
<div class="controls"><select id="pick"></select></div>
<div class="stage">
  <canvas id="c" class="game" width="800" height="400"></canvas>
  <div class="overlay" id="ov"></div>
</div>
<p class="help">Tap, click or hold <kbd>Space</kbd>/<kbd>↑</kbd> to jump. Land on blocks, leap over spikes and pits. Yellow pads launch you high. Each level is the same every attempt — learn it and reach 100%!</p>
<script src="shared.js"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov');
const W = cv.width, H = cv.height, T = 40, GROUND = H - 70, SPEED = 330, GRAV = 2600, JUMP = 760;
const LEVELS = 6;
let level = Store.get('geodash-level', 1), unlocked = Store.get('geodash-unlocked', 1), att = 1, obs, len, p, camX, state = 'ready', last = 0, holding = false, parts = [], beat = 0;

// seeded random so a level is identical on every attempt
function rng(seed) { return () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }; }

// level = sequence of hand-made chunks, chosen by a seed; later levels use harder chunks
function build() {
  const r = rng(level * 7919);
  const CHUNKS = [
    x => [['spike', x, 0]],
    x => [['spike', x, 0], ['spike', x + 1, 0]],
    x => [['block', x, 0], ['block', x + 1, 0], ['spike', x + 3, 0]],
    x => [['block', x, 0], ['block', x + 1, 0], ['block', x + 2, 1], ['block', x + 3, 1], ['spike', x + 2, 0], ['spike', x + 3, 0]],
    x => [['pit', x, 0, 2]],
    x => [['pad', x, 0], ['spike', x + 2, 0], ['spike', x + 3, 0], ['spike', x + 4, 0], ['block', x + 6, 1], ['block', x + 7, 1]],
    x => [['spike', x, 0], ['spike', x + 1, 0], ['spike', x + 2, 0]],
    x => [['block', x, 0], ['spike', x + 1, 0], ['block', x + 2, 0], ['block', x + 2, 1], ['spike', x + 3, 0], ['block', x + 4, 0]],
    x => [['pit', x, 0, 3], ['block', x + 1.5, 1]],
    x => [['block', x, 1], ['block', x + 1, 1], ['block', x + 2, 2], ['block', x + 3, 2], ['block', x + 4, 3], ['spike', x + 1, 0], ['spike', x + 2, 0], ['spike', x + 3, 0], ['spike', x + 4, 0]]
  ];
  const hard = Math.min(CHUNKS.length, 4 + level);
  obs = [];
  let x = 12;
  const n = 18 + level * 4;
  for (let i = 0; i < n; i++) {
    const c = CHUNKS[Math.floor(r() * hard)](x);
    obs.push(...c.map(([k, cx, cy, w]) => ({ k, x: cx * T, y: cy, w: (w || 1) * T })));
    x = Math.max(...c.map(o => o[1] + (o[3] || 1))) + 4 + Math.floor(r() * 3);
  }
  len = (x + 8) * T;
}

function start() {
  build();
  p = { x: 4 * T, y: GROUND - T, vy: 0, rot: 0, ground: true, dead: false };
  camX = 0; parts = [];
  state = 'play';
  overlay(ov, null);
  hud();
}

function hud() {
  document.getElementById('level').textContent = level;
  document.getElementById('att').textContent = att;
  document.getElementById('best').textContent = Store.get('geodash-best-' + level, 0) + '%';
}

const pct = () => Math.min(100, Math.floor((p.x / len) * 100));

function die() {
  p.dead = true;
  state = 'dead';
  Sound.beep(110, 0.3, 'sawtooth', 0.05);
  for (let i = 0; i < 20; i++) parts.push({ x: p.x + T / 2, y: p.y + T / 2, vx: rand(-300, 300), vy: rand(-400, 100), t: 0 });
  const b = Store.get('geodash-best-' + level, 0);
  if (pct() > b) Store.set('geodash-best-' + level, pct());
  setTimeout(() => { att++; start(); }, 700);
}

function win() {
  state = 'won';
  Store.set('geodash-best-' + level, 100);
  if (level >= unlocked && level < LEVELS) { unlocked = level + 1; Store.set('geodash-unlocked', unlocked); fillPick(); }
  Sound.beep(988, 0.4, 'triangle');
  overlay(ov, `<h2>Level ${level} complete! 🎉</h2><p>${att} attempt${att > 1 ? 's' : ''}</p>${level < LEVELS ? `<button class="btn" onclick="level++;Store.set('geodash-level',level);att=1;fillPick();start()">Level ${level + 1}</button>` : '<p>You beat every level! 🏆</p>'}<button class="btn alt" onclick="att=1;start()">Replay</button>`);
}

function solidTop(x0, x1, y) {
  // highest surface under the player's feet (blocks), or the ground unless over a pit
  let top = Infinity;
  const overPit = obs.some(o => o.k === 'pit' && x0 + 6 > o.x && x1 - 6 < o.x + o.w);
  if (!overPit) top = GROUND;
  for (const o of obs) if (o.k === 'block' && x1 > o.x + 2 && x0 < o.x + T - 2) {
    const oy = GROUND - (o.y + 1) * T;
    if (oy >= y - 8 && oy < top) top = oy;
  }
  return top;
}

function update(dt) {
  const s = dt / 1000;
  beat += dt;
  p.x += SPEED * s;
  if (holding && p.ground) { p.vy = -JUMP; p.ground = false; Sound.beep(520, 0.03, 'square', 0.02); }
  p.vy += GRAV * s;
  const ny = p.y + p.vy * s;
  const floor = solidTop(p.x, p.x + T, p.y + T);
  if (ny + T >= floor && p.vy >= 0) { p.y = floor - T; p.vy = 0; p.ground = true; p.rot = Math.round(p.rot / (Math.PI / 2)) * (Math.PI / 2); }
  else { p.y = ny; p.ground = false; p.rot += 7.5 * s; }
  if (p.y > H) return die();
  for (const o of obs) {
    if (o.x > p.x + T + 10 || o.x + o.w < p.x - 10) continue;
    const oy = GROUND - (o.y + 1) * T;
    if (o.k === 'spike') {
      // forgiving triangle hitbox
      if (p.x + T - 8 > o.x + 10 && p.x + 8 < o.x + T - 10 && p.y + T - 6 > oy + 14 && p.y < oy + T) return die();
    } else if (o.k === 'block') {
      // hitting the side of a block (not landing on it) is fatal
      if (p.x + T > o.x + 4 && p.x < o.x + T - 4 && p.y + T > oy + 10 && p.y < oy + T - 4) return die();
    } else if (o.k === 'pad') {
      if (p.x + T > o.x + 6 && p.x < o.x + T - 6 && p.y + T >= GROUND - 12) { p.vy = -JUMP * 1.45; p.ground = false; Sound.beep(880, 0.06, 'triangle', 0.04); }
    }
  }
  camX = p.x - 4 * T;
  if (p.x >= len - 6 * T) win();
}

function draw() {
  const hue = (level * 55 + 200) % 360;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `hsl(${hue},60%,30%)`); g.addColorStop(1, `hsl(${hue},70%,14%)`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // parallax squares
  ctx.fillStyle = `hsla(${hue},60%,50%,.12)`;
  for (let i = 0; i < 12; i++) { const x = ((i * 157 - camX * 0.3) % (W + 200) + W + 200) % (W + 200) - 100; ctx.fillRect(x, 40 + (i * 53) % 200, 60, 60); }
  if (!obs) return;
  ctx.save();
  ctx.translate(-camX, 0);
  // ground with pits cut out
  ctx.fillStyle = `hsl(${hue},55%,22%)`;
  ctx.fillRect(camX, GROUND, W, H - GROUND);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(camX, GROUND); ctx.lineTo(camX + W, GROUND); ctx.stroke();
  obs.forEach(o => {
    if (o.x > camX + W + 50 || o.x + o.w < camX - 50) return;
    const oy = GROUND - (o.y + 1) * T;
    if (o.k === 'pit') { ctx.fillStyle = '#05060d'; ctx.fillRect(o.x, GROUND - 1, o.w, H - GROUND + 2); }
    else if (o.k === 'block') { ctx.fillStyle = '#0f172a'; ctx.fillRect(o.x, oy, T, T); ctx.strokeStyle = '#e2e8f0'; ctx.strokeRect(o.x + 1, oy + 1, T - 2, T - 2); }
    else if (o.k === 'spike') { ctx.fillStyle = '#0f172a'; ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.moveTo(o.x + 4, oy + T); ctx.lineTo(o.x + T / 2, oy + 4); ctx.lineTo(o.x + T - 4, oy + T); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    else if (o.k === 'pad') { ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.ellipse(o.x + T / 2, GROUND - 4, T / 2 - 4, 6, 0, Math.PI, 0); ctx.fill(); }
  });
  // finish line
  ctx.fillStyle = '#fff';
  for (let y = 0; y < GROUND; y += 20) ctx.fillRect(len - 6 * T + ((y / 20) % 2) * 10, y, 10, 10);
  if (!p.dead) {
    ctx.save();
    ctx.translate(p.x + T / 2, p.y + T / 2);
    ctx.rotate(p.rot);
    ctx.fillStyle = '#facc15'; ctx.fillRect(-T / 2, -T / 2, T, T);
    ctx.fillStyle = '#0ea5e9'; ctx.fillRect(-T / 2 + 6, -T / 2 + 6, T - 12, T - 12);
    ctx.fillStyle = '#facc15'; ctx.fillRect(-8, -8, 16, 16);
    ctx.restore();
  }
  parts.forEach(q => { q.t += 16; q.x += q.vx / 60; q.y += q.vy / 60; q.vy += 30; ctx.fillStyle = `rgba(250,204,21,${1 - q.t / 700})`; ctx.fillRect(q.x, q.y, 6, 6); });
  ctx.restore();
  // progress bar
  ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fillRect(W / 2 - 150, 12, 300, 8);
  ctx.fillStyle = '#4ade80'; ctx.fillRect(W / 2 - 150, 12, 3 * pct(), 8);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'left'; ctx.fillText(pct() + '%', W / 2 + 158, 21);
}

function loop(t) {
  const dt = Math.min(25, t - last);
  last = t;
  if (state === 'play') { update(dt / 2); if (state === 'play') update(dt / 2); }
  draw();
  requestAnimationFrame(loop);
}

function fillPick() {
  const sel = document.getElementById('pick');
  sel.innerHTML = '';
  for (let i = 1; i <= LEVELS; i++) sel.innerHTML += `<option value="${i}" ${i > unlocked ? 'disabled' : ''}>Level ${i}${i > unlocked ? ' 🔒' : ''} · best ${Store.get('geodash-best-' + i, 0)}%</option>`;
  sel.value = level;
}
document.getElementById('pick').onchange = e => { level = +e.target.value; Store.set('geodash-level', level); att = 1; start(); e.target.blur(); };
const press = v => { holding = v; if (v && state === 'ready') start(); };
cv.addEventListener('pointerdown', () => press(true));
cv.addEventListener('pointerup', () => press(false));
cv.addEventListener('pointercancel', () => press(false));
document.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') press(true); });
document.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') press(false); });
level = Math.min(level, unlocked);
fillPick();
build();
p = { x: 4 * T, y: GROUND - T, vy: 0, rot: 0, ground: true };
camX = 0;
hud();
overlay(ov, '<h2>🔷 Geo Dash</h2><p>Tap or hold to jump. Same level every time — learn it!</p><button class="btn" onclick="start()">Play</button>');
requestAnimationFrame(loop);
</script>
</body>
</html>
