<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Missile Defense</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<header class="topbar">
  <a class="back" href="../index.html">← Arcade</a>
  <h1>🚀 Missile Defense</h1>
  <div class="stats">Score <b id="score">0</b> Wave <b id="wave">1</b> Best <b id="best">0</b></div>
</header>
<div class="stage">
  <canvas id="c" class="game" width="720" height="520"></canvas>
  <div class="overlay" id="ov"></div>
</div>
<p class="help">Click / tap where you want a counter-missile to explode. The nearest battery with ammo fires. Keys <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> fire from the left, middle or right battery at the mouse position.</p>
<script src="shared.js"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov');
const W = cv.width, H = cv.height, GROUND = H - 40;
const BASE_X = [60, W / 2, W - 60];
const CITY_X = [150, 230, 310, 410, 490, 570];
let cities, bases, enemies, shots, booms, score, wave, toSpawn, spawnT, state = 'ready', last = 0, mouse = { x: W / 2, y: H / 2 }, bonusT = 0, bonusText = '';
let best = Store.get('missile-best', 0);

function hud() {
  document.getElementById('score').textContent = score;
  document.getElementById('wave').textContent = wave;
  document.getElementById('best').textContent = best;
}

function startWave() {
  bases = BASE_X.map(x => ({ x, ammo: 10, alive: true }));
  enemies = []; shots = []; booms = [];
  toSpawn = 8 + wave * 3;
  spawnT = 600;
}

function start() {
  score = 0; wave = 1;
  cities = CITY_X.map(x => ({ x, alive: true }));
  startWave();
  state = 'play';
  overlay(ov, null);
  hud();
}

function targets() {
  return [...cities.filter(c => c.alive).map(c => c.x), ...bases.filter(b => b.alive).map(b => b.x)];
}

function spawnEnemy(fromX, fromY) {
  const t = targets();
  if (!t.length) return;
  const tx = pick(t) + rand(-6, 6);
  const sx = fromX ?? rand(20, W - 20), sy = fromY ?? 0;
  const speed = 0.35 + wave * 0.06 + rand(0, 0.12);
  const d = Math.hypot(tx - sx, GROUND - sy);
  enemies.push({ sx, sy, x: sx, y: sy, tx, ty: GROUND, vx: (tx - sx) / d * speed, vy: (GROUND - sy) / d * speed, split: wave > 1 && Math.random() < 0.15 + wave * 0.02 });
}

function fire(tx, ty, which) {
  if (state !== 'play' || ty > GROUND - 15) return;
  let base;
  if (which != null) base = bases[which].alive && bases[which].ammo > 0 ? bases[which] : null;
  else base = bases.filter(b => b.alive && b.ammo > 0).sort((a, b) => Math.abs(a.x - tx) - Math.abs(b.x - tx))[0];
  if (!base) return;
  base.ammo--;
  const sx = base.x, sy = GROUND - 18, d = Math.hypot(tx - sx, ty - sy), sp = base === bases[1] ? 9 : 6.5;
  shots.push({ sx, sy, x: sx, y: sy, tx, ty, vx: (tx - sx) / d * sp, vy: (ty - sy) / d * sp });
  Sound.beep(700, 0.05, 'square', 0.03);
}

function update(dt) {
  const f = dt / 16.67;
  if (bonusT > 0) {
    bonusT -= dt;
    if (bonusT <= 0) { wave++; startWave(); hud(); }
    return;
  }
  spawnT -= dt;
  if (spawnT <= 0 && toSpawn > 0) {
    const n = Math.min(toSpawn, randInt(1, 2 + Math.floor(wave / 3)));
    for (let i = 0; i < n; i++) spawnEnemy();
    toSpawn -= n;
    spawnT = Math.max(500, 2200 - wave * 150) * rand(0.6, 1.3);
  }
  for (const s of shots) {
    s.x += s.vx * f; s.y += s.vy * f;
    if ((s.vy < 0 && s.y <= s.ty) || Math.hypot(s.tx - s.x, s.ty - s.y) < 8) {
      s.dead = true;
      booms.push({ x: s.tx, y: s.ty, r: 0, t: 0, friendly: true });
    }
  }
  shots = shots.filter(s => !s.dead);
  for (const e of enemies) {
    e.x += e.vx * f; e.y += e.vy * f;
    if (e.split && e.y > H * 0.3 && e.y < H * 0.5) {
      e.split = false;
      for (let k = 0; k < 2; k++) spawnEnemy(e.x, e.y);
    }
    if (e.y >= GROUND) {
      e.dead = true;
      booms.push({ x: e.x, y: GROUND, r: 0, t: 0 });
      cities.forEach(c => { if (c.alive && Math.abs(c.x - e.x) < 28) c.alive = false; });
      bases.forEach(b => { if (b.alive && Math.abs(b.x - e.x) < 28) { b.alive = false; b.ammo = 0; } });
      Sound.beep(90, 0.3, 'sawtooth', 0.05);
    }
  }
  for (const b of booms) {
    b.t += dt;
    b.r = 36 * Math.sin(Math.min(1, b.t / 1400) * Math.PI);
    if (b.t > 1400) b.dead = true;
    for (const e of enemies) {
      if (!e.dead && Math.hypot(e.x - b.x, e.y - b.y) < b.r) {
        e.dead = true;
        score += 25;
        booms.push({ x: e.x, y: e.y, r: 0, t: 0 });
        Sound.beep(300 + Math.random() * 100, 0.08, 'sawtooth', 0.03);
      }
    }
  }
  booms = booms.filter(b => !b.dead);
  enemies = enemies.filter(e => !e.dead);
  hud();
  if (!cities.some(c => c.alive)) {
    state = 'over';
    best = recordBest('missile-best', score);
    hud();
    overlay(ov, `<h2>The End</h2><p>All cities destroyed. Score ${score} · Wave ${wave}</p><button class="btn" onclick="start()">Play again</button>`);
    return;
  }
  if (toSpawn === 0 && !enemies.length && !booms.length && !shots.length) {
    const c = cities.filter(c => c.alive).length, a = bases.reduce((s, b) => s + b.ammo, 0);
    score += c * 100 + a * 5;
    bonusText = `Wave ${wave} cleared! ${c} cities × 100 + ${a} missiles × 5`;
    // rebuild one city every 3 waves
    if (wave % 3 === 0) { const dead = cities.find(c => !c.alive); if (dead) { dead.alive = true; bonusText += ' · city rebuilt!'; } }
    bonusT = 2500;
    hud();
  }
}

function draw() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#020617'); g.addColorStop(1, '#1e1b4b');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#a16207';
  ctx.fillRect(0, GROUND, W, H - GROUND);
  if (!cities) return;
  for (const c of cities) {
    if (c.alive) {
      ctx.fillStyle = '#22d3ee';
      ctx.fillRect(c.x - 18, GROUND - 12, 36, 12);
      ctx.fillRect(c.x - 12, GROUND - 22, 8, 10);
      ctx.fillRect(c.x + 2, GROUND - 26, 8, 14);
    } else {
      ctx.fillStyle = '#44403c';
      ctx.fillRect(c.x - 16, GROUND - 5, 32, 5);
    }
  }
  for (const b of bases) {
    ctx.fillStyle = b.alive ? '#a3a3a3' : '#44403c';
    ctx.beginPath(); ctx.moveTo(b.x - 30, GROUND); ctx.lineTo(b.x - 14, GROUND - 18); ctx.lineTo(b.x + 14, GROUND - 18); ctx.lineTo(b.x + 30, GROUND); ctx.fill();
    ctx.fillStyle = '#e6e7f2';
    for (let i = 0; i < b.ammo; i++) ctx.fillRect(b.x - 14 + (i % 5) * 6, GROUND + 8 + Math.floor(i / 5) * 8, 3, 6);
  }
  ctx.lineWidth = 1.5;
  for (const e of enemies) {
    ctx.strokeStyle = '#ef4444';
    ctx.beginPath(); ctx.moveTo(e.sx, e.sy); ctx.lineTo(e.x, e.y); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.fillRect(e.x - 1.5, e.y - 1.5, 3, 3);
  }
  for (const s of shots) {
    ctx.strokeStyle = '#60a5fa';
    ctx.beginPath(); ctx.moveTo(s.sx, s.sy); ctx.lineTo(s.x, s.y); ctx.stroke();
    ctx.strokeStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(s.tx - 4, s.ty - 4); ctx.lineTo(s.tx + 4, s.ty + 4); ctx.moveTo(s.tx + 4, s.ty - 4); ctx.lineTo(s.tx - 4, s.ty + 4); ctx.stroke();
  }
  for (const b of booms) {
    ctx.fillStyle = `hsl(${(b.t / 4) % 360}, 90%, 65%)`;
    ctx.beginPath(); ctx.arc(b.x, b.y, Math.max(0, b.r), 0, 7); ctx.fill();
  }
  if (bonusT > 0) {
    ctx.fillStyle = '#fde047';
    ctx.font = 'bold 18px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(bonusText, W / 2, H / 2);
  }
  if (state === 'play') {
    ctx.strokeStyle = '#e6e7f2';
    ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 8, 0, 7); ctx.moveTo(mouse.x - 12, mouse.y); ctx.lineTo(mouse.x + 12, mouse.y); ctx.moveTo(mouse.x, mouse.y - 12); ctx.lineTo(mouse.x, mouse.y + 12); ctx.stroke();
  }
}

function loop(t) {
  const dt = Math.min(50, t - last);
  last = t;
  if (state === 'play') update(dt);
  draw();
  requestAnimationFrame(loop);
}

score = 0; wave = 1;
hud();
cv.style.cursor = 'none';
cv.addEventListener('pointermove', e => { mouse = canvasPoint(cv, e); });
cv.addEventListener('pointerdown', e => { e.preventDefault(); mouse = canvasPoint(cv, e); fire(mouse.x, mouse.y); });
document.addEventListener('keydown', e => {
  const k = { a: 0, s: 1, d: 2, A: 0, S: 1, D: 2 }[e.key];
  if (k != null) fire(mouse.x, mouse.y, k);
  if ((e.key === ' ' || e.key === 'Enter') && state !== 'play') start();
});

overlay(ov, '<h2>Missile Defense</h2><p>Protect your six cities from incoming missiles.</p><button class="btn" onclick="start()">Start</button>');
requestAnimationFrame(loop);
</script>
</body>
</html>
