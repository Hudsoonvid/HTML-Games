<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pin Pull</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<header class="topbar">
  <a class="back" href="../index.html">← Arcade</a>
  <h1>📍 Pin Pull</h1>
  <div class="stats">Level <b id="level">1</b> Gold <b id="gold">0</b></div>
</header>
<div class="controls"><button class="btn alt" id="restart">↺ Restart level</button></div>
<div class="stage">
  <canvas id="c" class="game" width="400" height="600"></canvas>
  <div class="overlay hidden" id="ov"></div>
</div>
<p class="help">Tap a pin to pull it out. Get the gold 🟡 to the hero. Lava 🔥 burns the hero, but water turns lava into harmless stone. Lava also finishes off monsters — keep them away from the hero!</p>
<script src="shared.js"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov');
const PR = 5, G = 0.18, WALL = 10, PIN = 10;
// walls: [x1,y1,x2,y2]; pins slide from (x1,y1) toward (x2,y2), where the handle is
const LEVELS = [
  { name: 'Pull the pin', walls: [[120, 30, 120, 570], [280, 30, 280, 570], [120, 570, 280, 570]], pins: [[112, 250, 300, 250]],
    gold: [130, 140, 270, 240], hero: [200, 546], need: 25 },
  { name: 'Choose wisely', walls: [[40, 30, 40, 262], [180, 30, 180, 262], [220, 30, 220, 262], [360, 30, 360, 262], [20, 240, 20, 580], [380, 240, 380, 580], [20, 280, 186, 380], [380, 280, 214, 380], [20, 580, 380, 580]],
    pins: [[188, 255, 26, 255], [212, 255, 374, 255]], gold: [50, 70, 170, 240], lava: [230, 70, 350, 240], hero: [200, 556], need: 25 },
  { name: 'Cool it down', walls: [[140, 30, 140, 570], [260, 30, 260, 570], [140, 570, 260, 570]],
    pins: [[132, 150, 272, 150], [268, 250, 128, 250], [132, 350, 272, 350]], water: [150, 50, 250, 140], lava: [150, 160, 250, 240], gold: [150, 260, 250, 340], hero: [200, 546], need: 20 },
  { name: 'Monster below', walls: [[30, 30, 30, 466], [150, 30, 150, 466], [250, 30, 250, 466], [370, 30, 370, 466], [10, 440, 10, 580], [390, 440, 390, 580], [10, 580, 390, 580], [150, 460, 250, 460], [10, 460, 30, 460], [370, 460, 390, 460]],
    pins: [[22, 185, 162, 185], [158, 330, 18, 330], [242, 330, 382, 330]], lava: [40, 50, 140, 175], monster: [90, 305], gold: [260, 200, 360, 320], hero: [330, 556], need: 25 },
  { name: 'Sink the lava', walls: [[40, 30, 40, 580], [360, 30, 360, 580], [200, 215, 200, 580], [40, 580, 360, 580]],
    pins: [[200, 215, 200, 22], [208, 222, 28, 222], [192, 222, 372, 222]], gold: [50, 60, 190, 205], lava: [210, 60, 350, 205], hero: [120, 556], need: 25 }
];
let level = Store.get('pinpull-level', 0) % LEVELS.length, L, parts, pins, walls, hero, monster, got, state = 'play', last = 0, acc = 0;

function fill(box, type, out) {
  const [x1, y1, x2, y2] = box;
  for (let y = y2 - PR; y > y1 + PR; y -= PR * 2.05) for (let x = x1 + PR + (Math.round(y) % 2) * 2; x < x2 - PR; x += PR * 2.05) out.push({ x, y, vx: 0, vy: 0, type });
}

function startLevel() {
  L = LEVELS[level];
  walls = L.walls.map(w => ({ x1: w[0], y1: w[1], x2: w[2], y2: w[3], t: WALL }));
  pins = L.pins.map(p => ({ x1: p[0], y1: p[1], x2: p[2], y2: p[3], t: PIN, off: 0, pulling: false, gone: false }));
  parts = [];
  if (L.gold) fill(L.gold, 'gold', parts);
  if (L.lava) fill(L.lava, 'lava', parts);
  if (L.water) fill(L.water, 'water', parts);
  hero = { x: L.hero[0], y: L.hero[1], r: 16, dead: false };
  monster = L.monster ? { x: L.monster[0], y: L.monster[1], vx: 0, vy: 0, r: 16, dead: false } : null;
  got = 0; state = 'play';
  overlay(ov, null);
  hud();
}

function hud() {
  document.getElementById('level').textContent = `${level + 1} · ${L.name}`;
  document.getElementById('gold').textContent = `${got}/${L.need}`;
}

// the segment a pin currently covers as it slides out
function pinSeg(p) {
  const dx = p.x2 - p.x1, dy = p.y2 - p.y1, len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
  return { x1: p.x1 + ux * p.off, y1: p.y1 + uy * p.off, x2: p.x2 + ux * p.off, y2: p.y2 + uy * p.off, t: p.t };
}

function collideSeg(o, r, s, bounce) {
  const dx = s.x2 - s.x1, dy = s.y2 - s.y1, l2 = dx * dx + dy * dy;
  const t = clamp(((o.x - s.x1) * dx + (o.y - s.y1) * dy) / l2, 0, 1);
  const px = s.x1 + dx * t, py = s.y1 + dy * t;
  let nx = o.x - px, ny = o.y - py, d = Math.hypot(nx, ny);
  const min = r + s.t / 2;
  if (d >= min) return false;
  if (o.px !== undefined && t > 0 && t < 1) {
    // push back out on the side it came from, so crowds can't squeeze through a pin
    const len = Math.sqrt(l2), sx = -dy / len, sy = dx / len;
    const sgn = (o.px - s.x1) * sx + (o.py - s.y1) * sy >= 0 ? 1 : -1;
    nx = sx * sgn; ny = sy * sgn;
  } else {
    if (d < 1e-6) { nx = 0; ny = -1; d = 1; }
    nx /= d; ny /= d;
  }
  o.x = px + nx * min; o.y = py + ny * min;
  const vn = o.vx * nx + o.vy * ny;
  if (vn < 0) { o.vx -= (1 + bounce) * vn * nx; o.vy -= (1 + bounce) * vn * ny; o.vx *= 0.985; }
  return ny < -0.5;
}

function lose(why) {
  if (state !== 'play') return;
  state = 'lost';
  hero.dead = true;
  Sound.beep(110, 0.5, 'sawtooth', 0.06);
  setTimeout(() => overlay(ov, `<h2>${why}</h2><p>Think about the order you pull the pins.</p><button class="btn" onclick="startLevel()">Try again</button>`), 500);
}

function step() {
  const segs = walls.concat(pins.filter(p => !p.gone).map(pinSeg));
  // particles
  for (const p of parts) {
    p.px = p.x; p.py = p.y;
    p.vy += G;
    p.vx *= 0.995;
    p.x += p.vx; p.y += p.vy;
    for (const s of segs) collideSeg(p, PR, s, 0.1);
  }
  // particle-particle pushes, using a grid so it stays fast
  const cell = PR * 2.4, grid = new Map();
  parts.forEach((p, i) => { const k = Math.floor(p.x / cell) + ',' + Math.floor(p.y / cell); (grid.get(k) || grid.set(k, []).get(k)).push(i); });
  for (let i = 0; i < parts.length; i++) {
    const a = parts[i], cx = Math.floor(a.x / cell), cy = Math.floor(a.y / cell);
    for (let gx = cx - 1; gx <= cx + 1; gx++) for (let gy = cy - 1; gy <= cy + 1; gy++) {
      const list = grid.get(gx + ',' + gy);
      if (!list) continue;
      for (const j of list) {
        if (j <= i) continue;
        const b = parts[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
        if (d >= PR * 2 || d === 0) continue;
        if ((a.type === 'lava' && b.type === 'water') || (a.type === 'water' && b.type === 'lava')) { a.type = b.type = 'stone'; Sound.beep(200, 0.05, 'triangle', 0.02); }
        const push = (PR * 2 - d) / 2, nx = dx / d, ny = dy / d;
        a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push;
        const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (rv < 0) { a.vx += nx * rv * 0.5; a.vy += ny * rv * 0.5; b.vx -= nx * rv * 0.5; b.vy -= ny * rv * 0.5; }
      }
    }
  }
  // a second pass keeps pushed particles on the right side of walls and pins
  for (const p of parts) for (const sg of segs) collideSeg(p, PR, sg, 0.1);
  // monster: falls, walks toward the hero when it lands in the same room
  if (monster && !monster.dead) {
    monster.px = monster.x; monster.py = monster.y;
    monster.vy += G;
    monster.x += monster.vx; monster.y += monster.vy;
    let grounded = false;
    for (const s of segs) if (collideSeg(monster, monster.r, s, 0)) grounded = true;
    if (grounded && Math.abs(monster.y - hero.y) < 60) monster.vx = Math.sign(hero.x - monster.x) * 1.1;
    else if (grounded) monster.vx *= 0.8;
    if (parts.some(p => p.type === 'lava' && Math.hypot(p.x - monster.x, p.y - monster.y) < monster.r + PR)) { monster.dead = true; Sound.beep(160, 0.3, 'square', 0.05); }
    if (!monster.dead && Math.hypot(monster.x - hero.x, monster.y - hero.y) < monster.r + hero.r) lose('The monster got the hero! 👹');
  }
  // gold is collected, lava burns
  parts = parts.filter(p => {
    const d = Math.hypot(p.x - hero.x, p.y - hero.y);
    if (d < hero.r + PR + 2) {
      if (p.type === 'gold') { got++; Sound.beep(1000 + got * 10, 0.03, 'triangle', 0.02); return false; }
      if (p.type === 'lava') lose('The hero got burned! 🔥');
    }
    return p.y < 700;
  });
  if (state === 'play' && got >= L.need) {
    state = 'won';
    Sound.beep(880, 0.3, 'triangle');
    level = (level + 1) % LEVELS.length;
    Store.set('pinpull-level', level);
    setTimeout(() => overlay(ov, `<h2>Rich! 💰</h2><p>${level === 0 ? 'You finished every level — playing them again.' : 'On to the next one.'}</p><button class="btn" onclick="startLevel()">Next level</button>`), 600);
  }
  pins.forEach(p => { if (p.pulling && !p.gone) { p.off += 6; if (p.off > Math.hypot(p.x2 - p.x1, p.y2 - p.y1) + 10) p.gone = true; } });
}

const COL = { gold: '#facc15', lava: '#f97316', water: '#38bdf8', stone: '#78716c' };
function draw() {
  ctx.fillStyle = '#e0e7ff';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.lineCap = 'round';
  walls.forEach(w => { ctx.strokeStyle = '#475569'; ctx.lineWidth = w.t; ctx.beginPath(); ctx.moveTo(w.x1, w.y1); ctx.lineTo(w.x2, w.y2); ctx.stroke(); });
  pins.forEach(p => {
    if (p.gone) return;
    const s = pinSeg(p);
    ctx.strokeStyle = '#ca8a04'; ctx.lineWidth = p.t;
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
    ctx.strokeStyle = '#eab308'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(s.x2, s.y2, 11, 0, 7); ctx.stroke();
  });
  parts.forEach(p => {
    ctx.fillStyle = COL[p.type];
    ctx.beginPath(); ctx.arc(p.x, p.y, PR + 0.6, 0, 7); ctx.fill();
  });
  ctx.font = '30px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(hero.dead ? '💀' : state === 'won' ? '🤩' : '🧑', hero.x, hero.y);
  if (monster) ctx.fillText(monster.dead ? '💨' : '👹', monster.x, monster.y);
  ctx.fillStyle = '#1e293b'; ctx.font = 'bold 13px system-ui';
  ctx.fillText(`${got}/${L.need}`, hero.x, hero.y - 26);
}

function loop(t) {
  const dt = Math.min(50, t - last);
  last = t;
  acc += dt;
  while (acc > 8) { acc -= 8; if (state !== 'lost') step(); }
  draw();
  requestAnimationFrame(loop);
}

cv.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  const q = canvasPoint(cv, e);
  // tap the handle or anywhere along the pin
  let bestPin = null, bd = 26;
  pins.forEach(p => {
    if (p.gone || p.pulling) return;
    const s = pinSeg(p), dx = s.x2 - s.x1, dy = s.y2 - s.y1, t = clamp(((q.x - s.x1) * dx + (q.y - s.y1) * dy) / (dx * dx + dy * dy), 0, 1);
    const d = Math.hypot(q.x - (s.x1 + dx * t), q.y - (s.y1 + dy * t));
    if (d < bd) { bd = d; bestPin = p; }
  });
  if (bestPin) { bestPin.pulling = true; Sound.beep(600, 0.06, 'triangle', 0.04); }
});
document.getElementById('restart').onclick = startLevel;
startLevel();
requestAnimationFrame(loop);
</script>
</body>
</html>
