<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoop Shot</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<header class="topbar">
  <a class="back" href="../index.html">← Arcade</a>
  <h1>🏀 Hoop Shot</h1>
  <div class="stats">Time <b id="time">60</b> Score <b id="score">0</b> Streak <b id="streak">0</b> Best <b id="best">0</b></div>
</header>
<div class="stage">
  <canvas id="c" class="game" width="440" height="680"></canvas>
  <div class="overlay" id="ov"></div>
</div>
<p class="help">Flick the ball upward toward the hoop — swipe faster for a longer shot. Swishes (no rim) score 3, other baskets 2, and your streak adds a bonus. The hoop starts sliding once you get going. Score as much as you can in 60 seconds!</p>
<script src="shared.js"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov');
const W = cv.width, H = cv.height, BR = 22, G = 1500, RIM = 4;
let hoop, balls, score, streak, time, state = 'ready', last = 0, best = Store.get('hoop-best', 0), swipe = null, pops = [];

function newGame() {
  hoop = { x: W / 2, y: 210, w: 86, vx: 0 };
  balls = []; pops = [];
  score = 0; streak = 0; time = 60;
  spawnBall();
  state = 'play';
  overlay(ov, null);
  hud();
}
function spawnBall() { balls.push({ x: W / 2 + rand(-80, 80), y: H - 90, vx: 0, vy: 0, live: false, rim: false, scored: false, prevY: H - 90, r: BR }); }

function hud() {
  document.getElementById('time').textContent = Math.ceil(Math.max(0, time || 0));
  document.getElementById('score').textContent = score || 0;
  document.getElementById('streak').textContent = streak || 0;
  document.getElementById('best').textContent = best;
}

function rimPoints() { return [[hoop.x - hoop.w / 2, hoop.y], [hoop.x + hoop.w / 2, hoop.y]]; }

function update(dt) {
  const s = dt / 1000;
  time -= s;
  if (time <= 0) {
    state = 'over';
    if (recordBest('hoop-best', score)) best = score;
    hud();
    Sound.beep(300, 0.6, 'square', 0.05);
    overlay(ov, `<h2>Buzzer! 📣</h2><p>You scored ${score}</p><button class="btn" onclick="newGame()">Play again</button>`);
    return;
  }
  // the hoop starts moving as your score grows
  const moveSpeed = score >= 10 ? Math.min(160, 40 + score * 3) : 0;
  if (moveSpeed && !hoop.vx) hoop.vx = moveSpeed;
  if (hoop.vx) { hoop.vx = Math.sign(hoop.vx) * moveSpeed; hoop.x += hoop.vx * s; if (hoop.x < 80 || hoop.x > W - 80) { hoop.vx *= -1; hoop.x = clamp(hoop.x, 80, W - 80); } }
  for (const b of balls) {
    if (!b.live) continue;
    b.prevY = b.y;
    b.vy += G * s;
    b.x += b.vx * s; b.y += b.vy * s;
    // shrink as it flies away from you (fake depth)
    b.r = BR * clamp(0.65 + (b.y - 150) / (H - 150) * 0.35, 0.65, 1);
    if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx) * 0.6; }
    if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx) * 0.6; }
    // only interacts with the hoop while coming down
    if (b.vy > 0) {
      for (const [rx, ry] of rimPoints()) {
        const dx = b.x - rx, dy = b.y - ry, d = Math.hypot(dx, dy);
        if (d < b.r + RIM) {
          const nx = dx / d, ny = dy / d, vn = b.vx * nx + b.vy * ny;
          b.x = rx + nx * (b.r + RIM); b.y = ry + ny * (b.r + RIM);
          if (vn < 0) { b.vx -= 1.6 * vn * nx; b.vy -= 1.6 * vn * ny; }
          b.rim = true;
          Sound.beep(240, 0.04, 'square', 0.03);
        }
      }
      if (!b.scored && b.prevY < hoop.y && b.y >= hoop.y && Math.abs(b.x - hoop.x) < hoop.w / 2 - b.r * 0.5) {
        b.scored = true;
        streak++;
        const pts = (b.rim ? 2 : 3) + Math.floor(streak / 3);
        score += pts;
        pops.push({ x: hoop.x, y: hoop.y + 30, t: 0, text: b.rim ? `+${pts}` : `SWISH +${pts}` });
        Sound.beep(b.rim ? 700 : 990, 0.15, 'triangle', 0.05);
        b.vx *= 0.3;
      }
    }
    if (b.y > H + 60) { b.done = true; if (!b.scored) streak = 0; }
  }
  balls = balls.filter(b => !b.done);
  if (!balls.some(b => !b.live)) spawnBall();
  pops.forEach(p => { p.t += dt; });
  pops = pops.filter(p => p.t < 900);
  hud();
}

function draw() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1e293b'); g.addColorStop(1, '#78350f');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#b45309'; ctx.fillRect(0, H - 150, W, 150);
  ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(W / 2, H + 40, 160, Math.PI, 0); ctx.stroke();
  if (!hoop) return;
  // backboard and net back
  ctx.fillStyle = '#f8fafc'; ctx.fillRect(hoop.x - 70, hoop.y - 120, 140, 96);
  ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 4; ctx.strokeRect(hoop.x - 30, hoop.y - 70, 60, 46);
  ctx.fillStyle = '#64748b'; ctx.fillRect(hoop.x - 4, hoop.y - 24, 8, 24);
  const drawNet = () => { ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2; for (let i = 0; i <= 6; i++) { const t = i / 6; ctx.beginPath(); ctx.moveTo(hoop.x - hoop.w / 2 + hoop.w * t, hoop.y); ctx.lineTo(hoop.x - hoop.w / 3 + hoop.w * 0.66 * t, hoop.y + 50); ctx.stroke(); } };
  // balls behind the rim (going up) are drawn before the hoop front
  balls.filter(b => b.live && b.vy < 0).forEach(drawBall);
  drawNet();
  ctx.strokeStyle = '#f97316'; ctx.lineWidth = RIM * 2;
  ctx.beginPath(); ctx.ellipse(hoop.x, hoop.y, hoop.w / 2, 8, 0, 0, 7); ctx.stroke();
  balls.filter(b => !b.live || b.vy >= 0).forEach(drawBall);
  pops.forEach(p => { ctx.fillStyle = `rgba(253,224,71,${1 - p.t / 900})`; ctx.font = 'bold 26px system-ui'; ctx.textAlign = 'center'; ctx.fillText(p.text, p.x, p.y - p.t / 20); });
  if (swipe) { ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(swipe.sx, swipe.sy); ctx.lineTo(swipe.x, swipe.y); ctx.stroke(); }
}
function drawBall(b) {
  ctx.fillStyle = '#ea580c'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
  ctx.strokeStyle = '#431407'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.moveTo(b.x - b.r, b.y); ctx.lineTo(b.x + b.r, b.y); ctx.moveTo(b.x, b.y - b.r); ctx.lineTo(b.x, b.y + b.r); ctx.stroke();
}

function loop(t) {
  const dt = Math.min(33, t - last);
  last = t;
  if (state === 'play') for (let k = 0; k < 3; k++) update(dt / 3);
  draw();
  requestAnimationFrame(loop);
}

cv.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  const p = canvasPoint(cv, e);
  swipe = { sx: p.x, sy: p.y, x: p.x, y: p.y, t: performance.now() };
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => { if (swipe) { const p = canvasPoint(cv, e); swipe.x = p.x; swipe.y = p.y; } });
cv.addEventListener('pointerup', () => {
  if (!swipe) return;
  const b = balls.find(q => !q.live), dx = swipe.x - swipe.sx, dy = swipe.y - swipe.sy, dtm = Math.max(60, performance.now() - swipe.t);
  swipe = null;
  if (!b || dy > -20) return;
  // flick speed sets the throw; capped so it can't fly off the top
  const k = clamp(Math.hypot(dx, dy) / dtm, 0.4, 2.2);
  b.vy = -clamp(780 + k * 260, 800, 1300);
  b.vx = dx / Math.max(1, -dy) * Math.abs(b.vy) * 0.55;
  b.live = true;
  Sound.beep(400, 0.05, 'triangle', 0.03);
});
hud();
overlay(ov, '<h2>🏀 Hoop Shot</h2><p>Flick the ball into the hoop — 60 seconds on the clock.</p><button class="btn" onclick="newGame()">Play</button>');
requestAnimationFrame(loop);
</script>
</body>
</html>
