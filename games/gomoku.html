<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gomoku</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<header class="topbar">
  <a class="back" href="../index.html">← Arcade</a>
  <h1>⚫ Gomoku</h1>
  <div class="stats" id="stat"></div>
</header>
<div class="controls">
  <button class="btn alt" id="undo">↶ Undo</button>
  <button class="btn alt" id="menu">Change mode</button>
</div>
<div class="vsbar" id="vs"></div>
<div class="msg" id="msg"></div>
<div class="stage">
  <canvas id="c" class="game" width="600" height="600"></canvas>
</div>
<p class="help">Five in a row wins — horizontally, vertically or diagonally. Black moves first. Tap an intersection to place a stone. Play online, vs the computer or with a friend.</p>
<script src="shared.js"></script>
<script src="net.js"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), msg = document.getElementById('msg');
const N = 15, CS = cv.width / (N + 1), DIRS = [[0, 1], [1, 0], [1, 1], [1, -1]];
const TABLE = [0, 1, 12, 150, 2500, 100000];
let S, b, turn, over, moves, winLine, me = 1;
// black (1) moves first; me is this player's colour
const myTurn = () => S && !over && (S.mode === 'local' || turn === me);

function status() {
  document.getElementById('vs').innerHTML = S.mode === 'local' ? '<b>⚫ Black</b> vs <b>⚪ White</b>' : `<b>${S.me.name}</b> ${me === 1 ? '⚫' : '⚪'} vs <b>${S.opp.name}</b> ${me === 1 ? '⚪' : '⚫'}`;
  document.getElementById('stat').textContent = S.mode === 'cpu' ? `CPU level ${S.level.toFixed(2)}` : S.mode === 'online' ? 'Online' : '2 players';
  if (over) return;
  msg.textContent = S.mode === 'local' ? `${turn === 1 ? 'Black' : 'White'} to move` : turn === me ? `Your move (${me === 1 ? 'black' : 'white'})` : `${S.opp.name} is thinking…`;
}

function fiveAt(r, c, p) {
  for (const [dr, dc] of DIRS) {
    const line = [[r, c]];
    for (const s of [1, -1]) for (let k = 1; k < 5; k++) {
      const rr = r + dr * k * s, cc = c + dc * k * s;
      if (rr < 0 || cc < 0 || rr >= N || cc >= N || b[rr][cc] !== p) break;
      line.push([rr, cc]);
    }
    if (line.length >= 5) return line;
  }
  return null;
}

// Sum over every 5-cell window through (r, c) that the opponent doesn't block.
function potential(r, c, p) {
  let total = 0;
  for (const [dr, dc] of DIRS) {
    for (let start = -4; start <= 0; start++) {
      let mine = 1, blocked = false;
      for (let k = 0; k < 5; k++) {
        const rr = r + dr * (start + k), cc = c + dc * (start + k);
        if (rr < 0 || cc < 0 || rr >= N || cc >= N) { blocked = true; break; }
        if (rr === r && cc === c) continue;
        const v = b[rr][cc];
        if (v === -p) { blocked = true; break; }
        if (v === p) mine++;
      }
      if (!blocked) total += TABLE[mine];
    }
  }
  return total;
}

// weighs its own threats against yours; weaker levels add noise and defend less
function cpuMove() {
  const ai = -me, L = S.level;
  if (!moves.length) return place(7, 7);
  let best = null, bv = -Infinity;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (b[r][c]) continue;
    // only consider cells near existing stones
    let near = false;
    for (let dr = -2; dr <= 2 && !near; dr++) for (let dc = -2; dc <= 2; dc++) { const rr = r + dr, cc = c + dc; if (rr >= 0 && cc >= 0 && rr < N && cc < N && b[rr][cc]) { near = true; break; } }
    if (!near) continue;
    const atk = potential(r, c, ai), def = potential(r, c, me);
    const v = atk * (0.6 + 0.5 * L) + def * (0.45 + 0.55 * L) + rand(0, (1 - L) * 500);
    if (v > bv) { bv = v; best = [r, c]; }
  }
  place(...best);
}

function place(r, c, fromNet) {
  if (!fromNet && S.human && turn === me) S.send('move', { r, c });
  b[r][c] = turn;
  moves.push([r, c]);
  Sound.beep(turn === 1 ? 500 : 400, 0.05, 'triangle', 0.05);
  const line = fiveAt(r, c, turn);
  if (line) {
    over = true;
    winLine = line;
    const title = S.mode === 'local' ? `${turn === 1 ? 'Black' : 'White'} wins!` : turn === me ? 'Five in a row — you win! 🎉' : `${S.opp.name} got five in a row`;
    msg.textContent = title;
    Sound.beep(turn === me || S.mode === 'local' ? 880 : 160, 0.4, 'triangle');
    setTimeout(() => Lobby.end(S, { result: turn === me ? 1 : 0, title }), 1100);
    return;
  }
  if (moves.length === N * N) { over = true; msg.textContent = 'Board full — draw!'; setTimeout(() => Lobby.end(S, { result: 0.5, title: 'Board full — draw!' }), 900); return; }
  turn = -turn;
  status();
  if (S.ai && turn !== me) { const rd = S.round; setTimeout(() => { if (rd === S.round && !over) cpuMove(); }, S.delay(250, 500)); }
}

function begin(s) {
  S = s;
  S.on('move', d => { if (d && turn !== me && !over && d.r >= 0 && d.r < N && d.c >= 0 && d.c < N && !b[d.r][d.c]) place(d.r, d.c, true); });
  S.startRound(() => ({ black: S.lastBlack == null ? randInt(0, 1) : 1 - S.lastBlack }), cfg => {
    S.lastBlack = cfg.black;
    me = S.mode === 'local' ? 1 : cfg.black === S.seat ? 1 : -1;
    b = Array.from({ length: N }, () => Array(N).fill(0));
    turn = 1; over = false; moves = []; winLine = null;
    status();
    if (S.ai && turn !== me) { const rd = S.round; setTimeout(() => { if (rd === S.round) cpuMove(); }, S.delay(250, 500)); }
  });
}

function draw() {
  ctx.fillStyle = '#e7b36a';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.strokeStyle = '#7c4a1e';
  ctx.lineWidth = 1;
  for (let i = 0; i < N; i++) {
    ctx.beginPath(); ctx.moveTo(CS, CS * (i + 1)); ctx.lineTo(CS * N, CS * (i + 1)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(CS * (i + 1), CS); ctx.lineTo(CS * (i + 1), CS * N); ctx.stroke();
  }
  ctx.fillStyle = '#7c4a1e';
  [[3, 3], [3, 11], [7, 7], [11, 3], [11, 11]].forEach(([r, c]) => { ctx.beginPath(); ctx.arc(CS * (c + 1), CS * (r + 1), 4, 0, 7); ctx.fill(); });
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (!b[r][c]) continue;
    const x = CS * (c + 1), y = CS * (r + 1);
    const g = ctx.createRadialGradient(x - 5, y - 5, 2, x, y, CS * 0.45);
    if (b[r][c] === 1) { g.addColorStop(0, '#6b7280'); g.addColorStop(1, '#030712'); }
    else { g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#cbd5e1'); }
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, CS * 0.44, 0, 7); ctx.fill();
  }
  const lastM = moves[moves.length - 1];
  if (lastM) { ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(CS * (lastM[1] + 1), CS * (lastM[0] + 1), 4, 0, 7); ctx.fill(); }
  if (winLine) {
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    const pts = winLine.slice().sort((a, z) => a[0] - z[0] || a[1] - z[1]);
    const a = pts[0], z = pts[pts.length - 1];
    ctx.beginPath(); ctx.moveTo(CS * (a[1] + 1), CS * (a[0] + 1)); ctx.lineTo(CS * (z[1] + 1), CS * (z[0] + 1)); ctx.stroke();
  }
  requestAnimationFrame(draw);
}

cv.addEventListener('pointerdown', e => {
  if (!myTurn()) return;
  const p = canvasPoint(cv, e);
  const c = Math.round(p.x / CS) - 1, r = Math.round(p.y / CS) - 1;
  if (r < 0 || c < 0 || r >= N || c >= N || b[r][c]) return;
  place(r, c);
});
document.getElementById('menu').onclick = () => Lobby.open();
// undo (vs computer only) takes back your stone and the computer's reply
document.getElementById('undo').onclick = () => {
  if (!S || S.mode !== 'cpu' || (!over && turn !== me)) return;
  const n = moves.length && b[moves[moves.length - 1][0]][moves[moves.length - 1][1]] === -me ? 2 : 1;
  for (let k = 0; k < n && moves.length; k++) { const [r, c] = moves.pop(); b[r][c] = 0; }
  over = false; winLine = null; turn = me;
  status();
};
b = Array.from({ length: N }, () => Array(N).fill(0));
moves = [];
draw();
Lobby.open({ game: 'gomoku', title: '⚫ Gomoku', local: true, onStart: begin });
</script>
</body>
</html>
