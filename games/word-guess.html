<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Guess</title>
<link rel="stylesheet" href="shared.css">
<style>
  #grid { display: grid; grid-template-rows: repeat(6, 1fr); gap: 6px; margin: 10px auto; width: min(330px, calc(100vw - 32px)); }
  .gr { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .gr.shake { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  .tile { aspect-ratio: 1; border: 2px solid #3a3f6e; display: flex; align-items: center; justify-content: center; font-size: clamp(22px, 7vw, 32px); font-weight: 800; text-transform: uppercase; border-radius: 6px; }
  .tile.filled { border-color: #6b72b0; animation: pop .1s; }
  @keyframes pop { 50% { transform: scale(1.1); } }
  .tile.flip { animation: flip .5s ease forwards; }
  @keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
  .correct { background: #16a34a; border-color: #16a34a !important; color: #fff; }
  .present { background: #ca8a04; border-color: #ca8a04 !important; color: #fff; }
  .absent { background: #374151; border-color: #374151 !important; color: #cbd5e1; }
  #kb { display: flex; flex-direction: column; gap: 6px; width: min(500px, calc(100vw - 12px)); margin: 8px auto; }
  .kr { display: flex; gap: 5px; justify-content: center; }
  .key { flex: 1; max-width: 44px; height: 54px; border: 0; border-radius: 6px; background: #4b5280; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; text-transform: uppercase; padding: 0; }
  .key.wide { max-width: 70px; flex: 1.5; font-size: 12px; }
  .toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: #f8fafc; color: #000; padding: 10px 18px; border-radius: 8px; font-weight: 700; z-index: 20; }
  .modes { display: flex; gap: 8px; }
  #statsbox { display: flex; gap: 16px; justify-content: center; font-size: 13px; color: var(--muted); margin: 4px 0; }
  #statsbox b { display: block; font-size: 20px; color: var(--fg); text-align: center; }
</style>
</head>
<body>
<header class="topbar">
  <a class="back" href="../index.html">← Arcade</a>
  <h1>🟩 Word Guess</h1>
  <div class="modes"><button class="btn alt" id="mDaily">Daily</button><button class="btn alt" id="mFree">Unlimited</button></div>
</header>
<div id="statsbox"></div>
<div id="grid"></div>
<div class="controls" id="after" style="display:none"><button class="btn" id="again">New word</button></div>
<div id="kb"></div>
<p class="help">Guess the hidden 5-letter word in 6 tries. 🟩 right letter, right spot · 🟨 in the word, wrong spot · ⬛ not in the word. Type on your keyboard or tap the keys.</p>
<script src="shared.js"></script>
<script>
const WORDS = (
  'about above actor acute adapt admit adopt adult after again agent agree ahead alarm album alert alike alive ' +
  'allow alone along alter amber among angel anger angle angry apple apply arena argue arise armor aroma arrow ' +
  'aside asset audio avoid awake award aware awful bacon badge badly baker basic basin batch beach beard beast ' +
  'began begin being below bench berry birth black blade blame blank blast blaze bleak blend bless blind block ' +
  'blood bloom blown board boast bonus boost booth bound brain brand brass brave bread break breed brick bride ' +
  'brief bring brisk broad broke brook brown brush build built bunch burst cabin cable camel candy canoe carry ' +
  'catch cause cedar chain chair chalk champ chant charm chart chase cheap check cheek cheer chess chest chief ' +
  'child chill choir chord chose civic civil claim clash class clean clear clerk click cliff climb clock close ' +
  'cloth cloud clown coach coast cocoa colon color comet comic coral couch cough count court cover crack craft ' +
  'crane crash crawl crazy cream creek crest crime crisp crowd crown crude cruel crumb crush crust curve cycle ' +
  'daily dairy dance dealt death debut decay decor delay delta dense depth diary dirty disco ditch dizzy dodge ' +
  'doing donor doubt dough dozen draft drain drama drank dream dress dried drift drill drink drive drown eager ' +
  'eagle early earth easel eaten eight elbow elder elect elite empty enemy enjoy enter entry equal equip error ' +
  'essay event every exact exist extra fable faint fairy faith false fancy feast fence ferry fever fiber field ' +
  'fifth fifty fight final first flake flame flash fleet flesh float flock flood floor flour fluid flute focus ' +
  'foggy force forge forth forty forum found frame frank fraud fresh front frost fruit fully funny fuzzy gauge ' +
  'ghost giant given glass gleam globe glove glory goose grace grade grain grand grant grape graph grasp grass ' +
  'grave gravy great greed green greet grief grill grind groan group grove growl guard guess guest guide habit ' +
  'happy hardy harsh haste hatch haunt haven heart heavy hedge hello hinge hobby honey honor horse hotel hound ' +
  'house hover human humid humor hurry ideal image index inner input irony issue ivory jelly jewel joint joker ' +
  'jolly judge juice jumbo kayak knife knock known label labor large laser later laugh layer learn lease least ' +
  'leave legal lemon level lever light limit linen liver llama lobby local lodge logic loose lover lower loyal ' +
  'lucky lunar lunch lyric magic major maker mango manor maple march marsh match maybe mayor medal media melon ' +
  'mercy merit merry metal meter midst might minor minus mixer model moist money month moose moral motor mount ' +
  'mouse mouth movie muddy music naive nasty naval nerve never newly night ninja noble noise north notch novel ' +
  'nurse nylon oasis ocean offer often olive onion opera orbit order organ other otter ought ounce outer owner ' +
  'oxide paint panel panic paper party pasta patch pause peace peach pearl pedal penny perch phase phone photo ' +
  'piano piece pilot pinch pitch pixel pizza place plain plane plant plate plaza plead pluck plumb plume plush ' +
  'point polar porch pound power press price pride prime print prior prism prize probe proof proud prove prune ' +
  'pulse punch pupil puppy purse queen query quest quick quiet quilt quirk quota quote radar radio rainy raise ' +
  'rally ranch range rapid ratio reach react ready realm rebel refer relax relay reply rider ridge rifle right ' +
  'rigid rinse risky rival river roast robin robot rocky rogue roost rough round route royal rugby ruler rural ' +
  'rusty saint salad salon sandy sauce scale scare scarf scene scent scone scope score scout scrap screw scrub ' +
  'seize sense serve seven shade shake shall shape share shark sharp sheep sheet shelf shell shift shine shiny ' +
  'shirt shock shore short shout shrub sight silly since siren sixth sixty skate skill skirt skull slate sleep ' +
  'slice slide slope small smart smell smile smoke snack snake sneak solar solid solve sonic sorry sound south ' +
  'space spare spark speak spear speed spell spend spice spicy spike spine spoon sport spray squad stack staff ' +
  'stage stain stair stake stamp stand stare start state steak steal steam steel steep stick still sting stock ' +
  'stone stood stool storm story stove straw strip stuck study stuff style sugar suite sunny super surge swamp ' +
  'swarm swear sweat sweep sweet swift swing sword syrup table taken taste teach teeth tempo thank theme thick ' +
  'thief thing think third thorn those three threw throw thumb tiger tight timer tired title toast today token ' +
  'topic torch total touch tough towel tower toxic trace track trade trail train trait tramp trash treat trend ' +
  'trial tribe trick tried troop truck truly trunk trust truth tulip tumor tuner twice twist ultra uncle under ' +
  'union unity until upper upset urban usage usual vague valid value valve vapor vault venue verse video vigor ' +
  'villa vinyl viola viral virus visit vital vivid vocal voice voter wagon waist waste watch water weary weave ' +
  'wedge weigh weird whale wheat wheel where which while whirl white whole whose widen width witch woman world ' +
  'worry worth would wound woven wrist write wrong yacht yearn yeast yield young youth zebra zesty'
).trim().split(' ');
let mode = Store.get('wordguess-mode', 'daily'), answer, rows, cur, row, done, keyState;
const gridEl = document.getElementById('grid');

function dayIndex() {
  const d = new Date();
  return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
}
function dailyWord() {
  // deterministic shuffle so consecutive days don't give alphabetically adjacent words
  const i = dayIndex();
  return WORDS[(i * 7919 + 13) % WORDS.length];
}

function stats() { return Store.get('wordguess-stats-' + mode, { played: 0, won: 0, streak: 0, max: 0 }); }
function showStats() {
  const s = stats();
  document.getElementById('statsbox').innerHTML = `<div><b>${s.played}</b>Played</div><div><b>${s.played ? Math.round(s.won / s.played * 100) : 0}%</b>Won</div><div><b>${s.streak}</b>Streak</div><div><b>${s.max}</b>Max streak</div>`;
  document.getElementById('mDaily').classList.toggle('active', mode === 'daily');
  document.getElementById('mFree').classList.toggle('active', mode === 'free');
}

function build() {
  gridEl.innerHTML = '';
  for (let r = 0; r < 6; r++) {
    const rowEl = document.createElement('div');
    rowEl.className = 'gr';
    for (let c = 0; c < 5; c++) rowEl.insertAdjacentHTML('beforeend', '<div class="tile"></div>');
    gridEl.appendChild(rowEl);
  }
  const kb = document.getElementById('kb');
  kb.innerHTML = '';
  ['qwertyuiop', 'asdfghjkl', '+zxcvbnm-'].forEach(line => {
    const r = document.createElement('div');
    r.className = 'kr';
    [...line].forEach(ch => {
      const b = document.createElement('button');
      b.className = 'key' + (ch === '+' || ch === '-' ? ' wide' : '');
      b.textContent = ch === '+' ? 'Enter' : ch === '-' ? '⌫' : ch;
      b.dataset.k = ch;
      b.onclick = () => press(ch === '+' ? 'Enter' : ch === '-' ? 'Backspace' : ch);
      r.appendChild(b);
    });
    kb.appendChild(r);
  });
}

function newGame() {
  build();
  answer = mode === 'daily' ? dailyWord() : pick(WORDS);
  rows = []; cur = ''; row = 0; done = false; keyState = {};
  document.getElementById('after').style.display = 'none';
  // restore today's daily progress
  if (mode === 'daily') {
    const saved = Store.get('wordguess-daily', null);
    if (saved && saved.day === dayIndex()) saved.rows.forEach(g => { cur = g; submit(true); });
  }
  showStats();
  paint();
}

function toast(msg, ms = 1400) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}

function evaluate(guess) {
  const res = Array(5).fill('absent'), counts = {};
  [...answer].forEach((ch, i) => { if (guess[i] !== ch) counts[ch] = (counts[ch] || 0) + 1; });
  [...guess].forEach((ch, i) => {
    if (answer[i] === ch) res[i] = 'correct';
    else if (counts[ch]) { res[i] = 'present'; counts[ch]--; }
  });
  return res;
}

function paint() {
  const rowEls = gridEl.children;
  for (let r = 0; r < 6; r++) {
    const word = r < rows.length ? rows[r].g : r === row ? cur : '';
    [...rowEls[r].children].forEach((t, c) => {
      t.textContent = word[c] || '';
      t.classList.toggle('filled', !!word[c] && r === row && !done);
    });
  }
}

function press(k) {
  if (done) return;
  if (k === 'Enter') return submit(false);
  if (k === 'Backspace') { cur = cur.slice(0, -1); return paint(); }
  if (/^[a-z]$/i.test(k) && cur.length < 5) { cur += k.toLowerCase(); paint(); }
}

function submit(silent) {
  if (cur.length < 5) {
    const r = gridEl.children[row];
    r.classList.remove('shake'); void r.offsetWidth; r.classList.add('shake');
    return toast('Not enough letters');
  }
  const res = evaluate(cur);
  rows.push({ g: cur, res });
  const rowEl = gridEl.children[row];
  [...rowEl.children].forEach((t, i) => {
    t.textContent = cur[i];
    const apply = () => { t.classList.add(res[i]); };
    if (silent) apply();
    else { setTimeout(() => { t.classList.add('flip'); setTimeout(apply, 250); }, i * 220); }
  });
  const g = cur;
  const rank = { absent: 0, present: 1, correct: 2 };
  [...g].forEach((ch, i) => { if (!keyState[ch] || rank[res[i]] > rank[keyState[ch]]) keyState[ch] = res[i]; });
  const updateKeys = () => document.querySelectorAll('.key').forEach(b => { const s = keyState[b.dataset.k]; b.classList.remove('correct', 'present', 'absent'); if (s) b.classList.add(s); });
  silent ? updateKeys() : setTimeout(updateKeys, 1300);
  row++;
  cur = '';
  if (mode === 'daily' && !silent) Store.set('wordguess-daily', { day: dayIndex(), rows: rows.map(r => r.g) });
  const won = g === answer;
  if (won || row === 6) {
    done = true;
    if (!silent) {
      const s = stats();
      s.played++;
      if (won) { s.won++; s.streak++; s.max = Math.max(s.max, s.streak); } else s.streak = 0;
      Store.set('wordguess-stats-' + mode, s);
    }
    setTimeout(() => {
      if (!silent) toast(won ? ['Genius!', 'Magnificent!', 'Impressive!', 'Splendid!', 'Great!', 'Phew!'][row - 1] : 'The word was ' + answer.toUpperCase(), 2500);
      if (!silent) Sound.beep(won ? 880 : 160, 0.3, won ? 'triangle' : 'sawtooth');
      showStats();
      document.getElementById('after').style.display = '';
      document.getElementById('again').textContent = mode === 'daily' ? 'Play unlimited mode' : 'New word';
    }, silent ? 0 : 1400);
  }
  paint();
}

document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Enter' || e.key === 'Backspace' || /^[a-z]$/i.test(e.key)) { e.preventDefault(); press(e.key); }
});
document.getElementById('again').onclick = () => { if (mode === 'daily') setMode('free'); else newGame(); };
function setMode(m) { mode = m; Store.set('wordguess-mode', m); newGame(); }
document.getElementById('mDaily').onclick = () => setMode('daily');
document.getElementById('mFree').onclick = () => setMode('free');
newGame();
</script>
</body>
</html>
