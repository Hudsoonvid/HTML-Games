<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Water Sort</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<header class="topbar">
  <a class="back" href="../index.html">← Arcade</a>
  <h1>🧪 Water Sort</h1>
  <div class="stats">Level <b id="level">1</b> Moves <b id="moves">0</b></div>
</header>
<div class="controls">
  <button class="btn alt" id="undo">↶ Undo</button>
  <button class="btn alt" id="extra">➕ Extra tube</button>
  <button class="btn alt" id="restart">↺ Restart</button>
</div>
<div class="stage">
  <canvas id="c" class="game" width="560" height="560"></canvas>
  <div class="overlay hidden" id="ov"></div>
</div>
<p class="help">Tap a tube, then tap another to pour. Water only pours onto the same colour or into an empty tube, and only while there is room. Finish when every tube holds a single colour.</p>
<script src="shared.js"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov');
const COLORS = ['#ef4444', '#3b82f6', '#22c55e', '#facc15', '#a855f7', '#f97316', '#06b6d4', '#ec4899', '#84cc16', '#94a3b8', '#7c3aed', '#14b8a6'];
const CAP = 4;
let level = Store.get('watersort-level', 1), tubes, start, sel = -1, moves = 0, history = [], extraUsed = false, pourAnim = null;

function generate() {
  const n = Math.min(3 + Math.floor((level + 1) / 2), COLORS.length);
  let units;
  // reshuffle until no tube starts already solved
  do {
    units = shuffle([].concat(...Array.from({ length: n }, (_, c) => Array(CAP).fill(c))));
    tubes = Array.from({ length: n }, (_, i) => units.slice(i * CAP, i * CAP + CAP));
  } while (tubes.some(t => t.every(v => v === t[0])));
  tubes.push([], []);
  start = tubes.map(t => t.slice());
}

function startLevel(fresh) {
  if (fresh) generate();
  tubes = start.map(t => t.slice());
  sel = -1; moves = 0; history = []; extraUsed = false; pourAnim = null;
  overlay(ov, null);
  hud();
}

function hud() {
  document.getElementById('level').textContent = level;
  document.getElementById('moves').textContent = moves;
  document.getElementById('extra').disabled = extraUsed;
}

function layout() {
  const n = tubes.length, perRow = n <= 7 ? n : Math.ceil(n / 2), rows = Math.ceil(n / perRow);
  const tw = Math.min(56, (cv.width - 40) / perRow - 14), th = tw * 3.3;
  const out = [];
  for (let i = 0; i < n; i++) {
    const row = Math.floor(i / perRow), col = i % perRow, inRow = Math.min(perRow, n - row * perRow);
    const gap = (cv.width - inRow * tw) / (inRow + 1);
    const y0 = (cv.height - rows * th - (rows - 1) * 50) / 2 + row * (th + 50);
    out.push({ x: gap + col * (tw + gap), y: y0, w: tw, h: th });
  }
  return out;
}

// how many units of the top colour can move from a to b
function pourable(a, b) {
  const A = tubes[a], B = tubes[b];
  if (a === b || !A.length || B.length >= CAP) return 0;
  const top = A[A.length - 1];
  if (B.length && B[B.length - 1] !== top) return 0;
  let run = 0;
  for (let i = A.length - 1; i >= 0 && A[i] === top; i--) run++;
  return Math.min(run, CAP - B.length);
}

function pour(a, b) {
  const k = pourable(a, b);
  if (!k) return false;
  history.push(tubes.map(t => t.slice()));
  for (let i = 0; i < k; i++) tubes[b].push(tubes[a].pop());
  moves++;
  pourAnim = { a, b, t: 0 };
  Sound.beep(300 + tubes[b].length * 80, 0.12, 'sine', 0.05);
  hud();
  if (tubes.every(t => !t.length || (t.length === CAP && t.every(v => v === t[0])))) {
    level++;
    Store.set('watersort-level', level);
    setTimeout(() => {
      Sound.beep(880, 0.3, 'triangle');
      overlay(ov, `<h2>Sorted! 🎉</h2><p>Solved in ${moves} moves</p><button class="btn" onclick="startLevel(true)">Level ${level}</button>`);
    }, 400);
  }
  return true;
}

function draw() {
  ctx.fillStyle = '#0b1020';
  ctx.fillRect(0, 0, cv.width, cv.height);
  if (!tubes) return requestAnimationFrame(draw);
  const L = layout();
  if (pourAnim) { pourAnim.t += 16; if (pourAnim.t > 300) pourAnim = null; }
  L.forEach((r, i) => {
    const lift = i === sel ? -18 : 0, unit = (r.h - 10) / CAP;
    // glass
    ctx.save();
    ctx.translate(0, lift);
    ctx.beginPath();
    ctx.moveTo(r.x, r.y);
    ctx.lineTo(r.x, r.y + r.h - r.w / 2);
    ctx.arc(r.x + r.w / 2, r.y + r.h - r.w / 2, r.w / 2, Math.PI, 0, true);
    ctx.lineTo(r.x + r.w, r.y);
    ctx.save();
    ctx.clip();
    tubes[i].forEach((c, k) => {
      ctx.fillStyle = COLORS[c];
      ctx.fillRect(r.x, r.y + r.h - (k + 1) * unit, r.w, unit + 1);
    });
    ctx.fillStyle = 'rgba(255,255,255,.12)';
    ctx.fillRect(r.x + r.w * 0.15, r.y, r.w * 0.15, r.h);
    ctx.restore();
    ctx.strokeStyle = i === sel ? '#fde047' : 'rgba(226,232,240,.8)';
    ctx.lineWidth = 3;
    ctx.stroke();
    if (pourAnim && pourAnim.b === i) {
      ctx.fillStyle = `rgba(255,255,255,${0.3 * (1 - pourAnim.t / 300)})`;
      ctx.fillRect(r.x, r.y, r.w, r.h);
    }
    ctx.restore();
  });
  requestAnimationFrame(draw);
}

cv.addEventListener('pointerdown', e => {
  if (!ov.classList.contains('hidden')) return;
  const p = canvasPoint(cv, e), L = layout();
  const i = L.findIndex(r => p.x > r.x - 8 && p.x < r.x + r.w + 8 && p.y > r.y - 24 && p.y < r.y + r.h + 10);
  if (i < 0) { sel = -1; return; }
  if (sel < 0) { if (tubes[i].length) { sel = i; Sound.beep(500, 0.04, 'triangle', 0.03); } return; }
  if (!pour(sel, i) && tubes[i].length && i !== sel) { sel = i; return; }
  sel = -1;
});
document.getElementById('undo').onclick = () => { if (history.length) { tubes = history.pop(); moves++; sel = -1; hud(); } };
document.getElementById('extra').onclick = () => { if (!extraUsed) { extraUsed = true; tubes.push([]); hud(); } };
document.getElementById('restart').onclick = () => startLevel(false);
generate();
startLevel(false);
draw();
</script>
</body>
</html>
