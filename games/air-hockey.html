<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Air Hockey</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<header class="topbar">
  <a class="back" href="../index.html">← Arcade</a>
  <h1>🏒 Air Hockey</h1>
  <div class="stats" id="stat"></div>
</header>
<div class="controls"><button class="btn alt" id="menu">Change mode</button></div>
<div class="vsbar" id="vs"></div>
<div class="stage">
  <canvas id="c" class="game" width="420" height="680"></canvas>
  <div class="overlay hidden" id="ov"></div>
</div>
<p class="help">Move your mallet (bottom) with the mouse or a finger, or with <kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd>. Hit the puck into the far goal. First to 7 wins. Two players on one device: each player uses their own half of the screen (top player can also use <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>).</p>
<script src="shared.js"></script>
<script src="net.js"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), ov = document.getElementById('ov');
const W = cv.width, H = cv.height, PR = 16, MR = 26, GOAL = 140, WIN = 7;
// P1 = bottom (host), P2 = top (guest / computer). The guest sees the table turned round.
let S, puck, P1, P2, state = 'idle', last = 0, keys = {}, pauseT = 0, sendT = 0, ptrs = {};
const mine = () => (S && S.mode === 'online' && S.seat === 1 ? P2 : P1);
const flipped = () => mine() === P2;
const runsPuck = () => !S || !S.human || S.host;

function resetPuck(towards) {
  puck = { x: W / 2, y: towards > 0 ? H / 2 + 60 : H / 2 - 60, vx: 0, vy: 0 };
  pauseT = 700;
}

function begin(s) {
  S = s;
  S.on('st', d => { if (!S.host && d) { Object.assign(puck, d.p); P1.x = d.a.x; P1.y = d.a.y; P1.vx = d.a.vx; P1.vy = d.a.vy; P1.score = d.s[0]; P2.score = d.s[1]; pauseT = d.w; hud(); } });
  S.on('in', d => { if (S.host && d && typeof d.x === 'number') { P2.tx = d.x; P2.ty = d.y; } });
  S.on('end', d => { if (!S.host && d) { P1.score = d.s[0]; P2.score = d.s[1]; endMatch(); } });
  S.startRound(() => ({ towards: randInt(0, 1) ? 1 : -1 }), cfg => {
    P1 = { x: W / 2, y: H - 80, vx: 0, vy: 0, tx: W / 2, ty: H - 80, score: 0 };
    P2 = { x: W / 2, y: 80, vx: 0, vy: 0, tx: W / 2, ty: 80, score: 0 };
    resetPuck(cfg.towards);
    state = 'play';
    overlay(ov, null);
    hud();
  });
}

function hud() {
  const meP = mine(), oppP = meP === P1 ? P2 : P1;
  document.getElementById('stat').innerHTML = S.mode === 'local' ? `Blue <b>${P1.score}</b> Red <b>${P2.score}</b>` : `You <b>${meP.score}</b> ${S.mode === 'cpu' ? 'CPU' : 'Them'} <b>${oppP.score}</b>`;
  document.getElementById('vs').innerHTML = S.mode === 'local' ? '<b style="color:#2563eb">Blue (bottom)</b> vs <b style="color:#ef4444">Red (top)</b>' : `<b style="color:${meP === P1 ? '#2563eb' : '#ef4444'}">${S.me.name}</b> vs <b style="color:${meP === P1 ? '#ef4444' : '#2563eb'}">${S.opp.name}</b>${S.mode === 'cpu' ? ` · level ${S.level.toFixed(2)}` : ''}`;
}

function collide(m) {
  const dx = puck.x - m.x, dy = puck.y - m.y, d = Math.hypot(dx, dy);
  if (d === 0 || d >= PR + MR) return;
  const nx = dx / d, ny = dy / d;
  puck.x = m.x + nx * (PR + MR);
  puck.y = m.y + ny * (PR + MR);
  const rvx = puck.vx - m.vx, rvy = puck.vy - m.vy, dot = rvx * nx + rvy * ny;
  if (dot < 0) {
    puck.vx -= 1.9 * dot * nx;
    puck.vy -= 1.9 * dot * ny;
    Sound.beep(300 + Math.random() * 100, 0.03, 'square', 0.03);
  }
}

function moveMallet(m, maxSp, f) {
  const minY = m === P1 ? H / 2 + MR : MR, maxY = m === P1 ? H - MR : H / 2 - MR;
  const tx = clamp(m.tx, MR, W - MR), ty = clamp(m.ty, minY, maxY);
  let dx = tx - m.x, dy = ty - m.y;
  const d = Math.hypot(dx, dy), lim = maxSp * f;
  if (d > lim) { dx *= lim / d; dy *= lim / d; }
  m.vx = dx / f;
  m.vy = dy / f;
  m.x += dx;
  m.y += dy;
}

// the computer (top) is faster and more aggressive at higher levels
function aiTarget(f) {
  const lv = S.level, aggro = 0.5 + lv * 0.5;
  if (puck.y < H / 2 + 40 && (puck.vy < 2 || puck.y < P2.y + 40)) {
    if (puck.y < P2.y) { P2.tx = puck.x + (puck.x < W / 2 ? 30 : -30); P2.ty = puck.y - 40; }
    else { P2.tx = puck.x + (W / 2 - puck.x) * 0.1; P2.ty = puck.y - MR * aggro; }
  } else {
    P2.tx = W / 2 + (puck.x - W / 2) * 0.6;
    P2.ty = 70;
  }
  return 4 + lv * 7;
}

function keyAim(m, l, r, u, d, flip) {
  if (!(keys[l] || keys[r] || keys[u] || keys[d])) return;
  const sx = flip ? -1 : 1;
  m.tx = m.x + ((keys[r] ? 1 : 0) - (keys[l] ? 1 : 0)) * 12 * sx;
  m.ty = m.y + ((keys[d] ? 1 : 0) - (keys[u] ? 1 : 0)) * 12 * sx;
}

function update(dt) {
  const f = Math.max(dt / 16.67, 0.01);
  if (S.mode === 'local') {
    keyAim(P1, 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', false);
    keyAim(P2, 'a', 'd', 'w', 's', false);
  } else keyAim(mine(), 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', flipped());
  moveMallet(P1, 22, f);
  moveMallet(P2, S.ai ? aiTarget(f) : 22, f);
  if (S.human) {
    sendT += dt;
    if (sendT > 60) {
      sendT = 0;
      const r = v => Math.round(v * 10) / 10;
      if (S.host) S.send('st', { p: { x: r(puck.x), y: r(puck.y), vx: r(puck.vx), vy: r(puck.vy) }, a: { x: r(P1.x), y: r(P1.y), vx: r(P1.vx), vy: r(P1.vy) }, s: [P1.score, P2.score], w: Math.round(pauseT) });
      else S.send('in', { x: Math.round(P2.tx), y: Math.round(P2.ty) });
    }
  }
  if (pauseT > 0) { pauseT -= dt; return; }
  const steps = 4;
  for (let i = 0; i < steps; i++) {
    puck.x += puck.vx * f / steps;
    puck.y += puck.vy * f / steps;
    if (puck.x < PR) { puck.x = PR; puck.vx = Math.abs(puck.vx) * 0.9; }
    if (puck.x > W - PR) { puck.x = W - PR; puck.vx = -Math.abs(puck.vx) * 0.9; }
    const inGoal = Math.abs(puck.x - W / 2) < GOAL / 2 - PR / 2;
    if (!inGoal) {
      if (puck.y < PR) { puck.y = PR; puck.vy = Math.abs(puck.vy) * 0.9; }
      if (puck.y > H - PR) { puck.y = H - PR; puck.vy = -Math.abs(puck.vy) * 0.9; }
    }
    collide(P1);
    collide(P2);
  }
  puck.vx *= Math.pow(0.996, f);
  puck.vy *= Math.pow(0.996, f);
  const sp = Math.hypot(puck.vx, puck.vy);
  if (sp > 20) { puck.vx *= 20 / sp; puck.vy *= 20 / sp; }
  if (runsPuck()) {
    if (puck.y < -PR) goal(P1);
    else if (puck.y > H + PR) goal(P2);
  } else if (puck.y < -PR || puck.y > H + PR) { puck.vx = puck.vy = 0; }
}

function endMatch() {
  if (state === 'over') return;
  state = 'over';
  hud();
  const meP = mine(), oppP = meP === P1 ? P2 : P1;
  const title = S.mode === 'local' ? (P1.score > P2.score ? 'Blue wins! 🏆' : 'Red wins! 🏆') : meP.score > oppP.score ? 'You win! 🏆' : `${S.opp.name} wins`;
  setTimeout(() => Lobby.end(S, { result: meP.score > oppP.score ? 1 : 0, title, detail: `${meP.score} – ${oppP.score}` }), 700);
}

function goal(scorer) {
  scorer.score++;
  Sound.beep(scorer === mine() || S.mode === 'local' ? 880 : 220, 0.3, 'triangle');
  hud();
  resetPuck(scorer === P1 ? -1 : 1);
  if (scorer.score >= WIN) {
    if (S.human) S.send('end', { s: [P1.score, P2.score] });
    endMatch();
  }
}

function mallet(m, color) {
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(m.x, m.y, MR, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath(); ctx.arc(m.x, m.y, MR * 0.6, 0, 7); ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(m.x, m.y, MR * 0.4, 0, 7); ctx.fill();
}

function draw() {
  ctx.save();
  if (flipped()) { ctx.translate(W, H); ctx.rotate(Math.PI); }
  ctx.fillStyle = '#e0f2fe';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#fca5a5';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(W / 2, H / 2, 60, 0, 7); ctx.stroke();
  ctx.strokeStyle = '#93c5fd';
  ctx.beginPath(); ctx.arc(W / 2, 0, 90, 0, Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.arc(W / 2, H, 90, Math.PI, 0); ctx.stroke();
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(W / 2 - GOAL / 2, 0, GOAL, 6);
  ctx.fillRect(W / 2 - GOAL / 2, H - 6, GOAL, 6);
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 8;
  ctx.strokeRect(0, 0, W, H);
  if (puck) {
    mallet(P2, '#ef4444');
    mallet(P1, '#2563eb');
    ctx.fillStyle = '#111827';
    ctx.beginPath(); ctx.arc(puck.x, puck.y, PR, 0, 7); ctx.fill();
    ctx.strokeStyle = '#4b5563';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(puck.x, puck.y, PR - 4, 0, 7); ctx.stroke();
  }
  ctx.restore();
}

function loop(t) {
  const dt = Math.min(40, t - last);
  last = t;
  if (state === 'play') update(dt);
  draw();
  requestAnimationFrame(loop);
}

// each pointer steers the mallet on the half of the table where it went down (two-player touch works)
function tablePoint(e) { const p = canvasPoint(cv, e); return flipped() ? { x: W - p.x, y: H - p.y } : p; }
cv.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  const p = tablePoint(e);
  ptrs[e.pointerId] = S.mode === 'local' ? (p.y > H / 2 ? P1 : P2) : mine();
  ptrs[e.pointerId].tx = p.x; ptrs[e.pointerId].ty = p.y;
});
cv.addEventListener('pointermove', e => {
  if (state !== 'play') return;
  const p = tablePoint(e);
  let m = ptrs[e.pointerId];
  if (!m && e.pointerType === 'mouse') m = S.mode === 'local' ? (p.y > H / 2 ? P1 : P2) : mine();
  if (m) { m.tx = p.x; m.ty = p.y; }
});
const lift = e => { delete ptrs[e.pointerId]; };
cv.addEventListener('pointerup', lift);
cv.addEventListener('pointercancel', lift);
cv.style.touchAction = 'none';
document.addEventListener('keydown', e => { keys[e.key] = true; if (e.key.startsWith('Arrow')) e.preventDefault(); });
document.addEventListener('keyup', e => { keys[e.key] = false; });
document.getElementById('menu').onclick = () => Lobby.open();

P1 = { x: W / 2, y: H - 80, vx: 0, vy: 0, tx: W / 2, ty: H - 80, score: 0 };
P2 = { x: W / 2, y: 80, vx: 0, vy: 0, tx: W / 2, ty: 80, score: 0 };
resetPuck(1);
requestAnimationFrame(loop);
Lobby.open({ game: 'air-hockey', title: '🏒 Air Hockey', local: true, onStart: begin });
</script>
</body>
</html>
