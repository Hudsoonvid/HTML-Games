<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic-Tac-Toe</title>
<link rel="stylesheet" href="shared.css">
<style>
  #board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: min(380px, calc(100vw - 32px)); aspect-ratio: 1; }
  .sq { border: 0; border-radius: 14px; background: var(--panel-2); font-size: min(80px, 18vw); font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .sq:hover:empty { background: #2c3060; }
  .sq.x { color: #22d3ee; } .sq.o { color: #f472b6; }
  .sq.win { background: #3b2f6b; animation: pulse .6s ease-in-out 3; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  .sq span { animation: drop .15s ease-out; }
  @keyframes drop { from { transform: scale(.3); opacity: 0; } }
</style>
</head>
<body>
<header class="topbar">
  <a class="back" href="../index.html">← Arcade</a>
  <h1>❌ Tic-Tac-Toe ⭕</h1>
  <div class="stats" id="stat"></div>
</header>
<div class="controls"><button class="btn alt" id="menu">Change mode</button></div>
<div class="vsbar" id="vs"></div>
<div class="msg" id="msg"></div>
<div id="board"></div>
<p class="help">Get three in a row. Play online, against the computer (it gets sharper as your skill grows) or with a friend on this device. Keys <kbd>1</kbd>–<kbd>9</kbd> pick squares.</p>
<script src="shared.js"></script>
<script src="net.js"></script>
<script>
const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
const boardEl = document.getElementById('board'), msg = document.getElementById('msg');
// X always moves first; mine is the mark this player uses
let S, b, turn, over, mine = 'X', sqs = [];

for (let i = 0; i < 9; i++) {
  const s = document.createElement('button');
  s.className = 'sq';
  s.onclick = () => humanMove(i);
  boardEl.appendChild(s);
  sqs.push(s);
}

function winner(bd) {
  for (const l of LINES) if (bd[l[0]] && bd[l[0]] === bd[l[1]] && bd[l[1]] === bd[l[2]]) return { p: bd[l[0]], line: l };
  return bd.every(Boolean) ? { p: 'D' } : null;
}

function minimax(bd, player, me, depth) {
  const w = winner(bd);
  if (w) return { score: w.p === me ? 10 - depth : w.p === 'D' ? 0 : depth - 10 };
  let best = { score: player === me ? -Infinity : Infinity };
  for (let i = 0; i < 9; i++) {
    if (bd[i]) continue;
    bd[i] = player;
    const r = minimax(bd, player === 'O' ? 'X' : 'O', me, depth + 1);
    bd[i] = null;
    if (player === me ? r.score > best.score : r.score < best.score) best = { score: r.score, move: i };
  }
  return best;
}

// the stronger the level, the more often it plays the perfect move
function aiMove() {
  const ai = mine === 'X' ? 'O' : 'X';
  const empty = b.map((v, i) => (v ? -1 : i)).filter(i => i >= 0);
  const perfect = Math.random() < 0.25 + S.level * 0.78;
  const m = !perfect ? pick(empty) : empty.length === 9 ? pick([0, 2, 4, 6, 8]) : minimax(b.slice(), ai, ai, 0).move;
  place(m);
}

const isMyTurn = () => S.mode === 'local' || turn === mine;
const nameOf = mark => (S.mode === 'local' ? mark : mark === mine ? 'You' : S.opp.name);

function status() {
  msg.textContent = over ? msg.textContent : S.mode === 'local' ? `${turn} to move` : isMyTurn() ? 'Your move' : `${S.opp.name} is thinking…`;
  document.getElementById('vs').innerHTML = S.mode === 'local' ? '<b>✕ Player 1</b> vs <b>◯ Player 2</b>' : `<b>${S.me.name}</b> (${mine === 'X' ? '✕' : '◯'}) vs <b>${S.opp.name}</b> (${mine === 'X' ? '◯' : '✕'})`;
  document.getElementById('stat').textContent = S.mode === 'cpu' ? `CPU level ${S.level.toFixed(2)}` : S.mode === 'online' ? 'Online' : '2 players';
}

function place(i, fromNet) {
  if (over || b[i]) return;
  const who = turn;
  b[i] = turn;
  if (!fromNet && S.human && who === mine) S.send('move', { i });
  Sound.beep(turn === 'X' ? 520 : 400, 0.05, 'triangle', 0.04);
  turn = turn === 'X' ? 'O' : 'X';
  render();
  const w = winner(b);
  if (w) {
    over = true;
    if (w.line) w.line.forEach(k => sqs[k].classList.add('win'));
    const draw = w.p === 'D';
    const title = draw ? "It's a draw!" : S.mode === 'local' ? `${w.p} wins!` : w.p === mine ? 'You win! 🎉' : `${S.opp.name} wins`;
    msg.textContent = title;
    Sound.beep(draw ? 300 : 880, 0.25, 'triangle');
    setTimeout(() => Lobby.end(S, { result: draw ? 0.5 : w.p === mine ? 1 : 0, title }), 900);
    return;
  }
  status();
  if (S.ai && turn !== mine) { const r = S.round; setTimeout(() => { if (r === S.round && !over) aiMove(); }, S.delay(250, 600)); }
}

function humanMove(i) {
  if (!S || over || b[i] || !isMyTurn()) return;
  place(i);
}

function render() {
  b.forEach((v, i) => {
    sqs[i].className = 'sq' + (v ? ' ' + v.toLowerCase() : '');
    sqs[i].innerHTML = v ? `<span>${v === 'X' ? '✕' : '◯'}</span>` : '';
  });
}

function begin(s) {
  S = s;
  S.on('move', d => { if (d && d.i >= 0 && d.i < 9 && turn !== mine) place(d.i, true); });
  // whoever is X moves first; alternate between rounds
  S.startRound(() => ({ x: S.lastX == null ? randInt(0, 1) : 1 - S.lastX }), cfg => {
    S.lastX = cfg.x;
    b = Array(9).fill(null);
    over = false;
    turn = 'X';
    mine = S.mode === 'local' ? 'X' : cfg.x === S.seat ? 'X' : 'O';
    render();
    status();
    if (S.ai && turn !== mine) { const r = S.round; setTimeout(() => { if (r === S.round) aiMove(); }, S.delay(300, 600)); }
  });
}

document.addEventListener('keydown', e => { const n = +e.key; if (n >= 1 && n <= 9) humanMove(n - 1); });
document.getElementById('menu').onclick = () => Lobby.open();
b = Array(9).fill(null);
render();
Lobby.open({ game: 'tic-tac-toe', title: '❌ Tic-Tac-Toe ⭕', local: true, onStart: begin });
</script>
</body>
</html>
