<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Math</title>
<link rel="stylesheet" href="shared.css">
<style>
  .area { width: min(480px, calc(100vw - 24px)); display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 28px 16px; position: relative; }
  #problem { font-size: clamp(40px, 12vw, 72px); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
  #answer { font-size: 32px; width: 220px; text-align: center; padding: 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); color: var(--fg); outline: none; }
  #answer:focus { border-color: var(--accent); }
  .pad { display: grid; grid-template-columns: repeat(3, 72px); gap: 8px; }
  .pad button { height: 56px; font-size: 22px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); cursor: pointer; }
  @media (pointer: fine) { .pad { display: none; } }
  .good { color: var(--good); } .bad { color: var(--bad); }
</style>
</head>
<body>
<header class="topbar">
  <a class="back" href="../index.html">← Arcade</a>
  <h1>➗ Quick Math</h1>
  <div class="stats">Score <b id="score">0</b> Time <b id="time">60</b> Best <b id="best">0</b></div>
</header>
<div class="stage">
  <div class="panel area">
    <div id="problem">7 × 8</div>
    <input id="answer" inputmode="numeric" autocomplete="off" placeholder="?">
    <div class="msg" id="msg"></div>
    <div class="pad" id="pad"></div>
    <button class="btn alt" id="skip">Skip (−1)</button>
  </div>
  <div class="overlay" id="ov"></div>
</div>
<p class="help">Solve as many problems as you can in 60 seconds. The answer is accepted as soon as you type it. Problems get harder as your score climbs.</p>
<script src="shared.js"></script>
<script>
const ov = document.getElementById('ov'), input = document.getElementById('answer'), msg = document.getElementById('msg');
let answer, score, timeLeft, solved, state = 'ready', last = 0;
let best = Store.get('quickmath-best', 0);
document.getElementById('best').textContent = best;

const pad = document.getElementById('pad');
['7', '8', '9', '4', '5', '6', '1', '2', '3', '−', '0', '⌫'].forEach(k => {
  const b = document.createElement('button');
  b.textContent = k;
  b.onclick = () => {
    if (k === '⌫') input.value = input.value.slice(0, -1);
    else if (k === '−') input.value = input.value.startsWith('-') ? input.value.slice(1) : '-' + input.value;
    else input.value += k;
    check();
  };
  pad.appendChild(b);
});

function makeProblem() {
  const lvl = Math.min(Math.floor(score / 8), 5);
  const ops = lvl === 0 ? ['+', '-'] : lvl < 2 ? ['+', '-', '×'] : ['+', '-', '×', '÷'];
  const op = pick(ops);
  const hi = [10, 20, 50, 100, 200, 500][lvl];
  let a, b;
  if (op === '+') { a = randInt(1, hi); b = randInt(1, hi); answer = a + b; }
  else if (op === '-') { a = randInt(1, hi); b = randInt(1, hi); if (lvl < 2 && b > a) [a, b] = [b, a]; answer = a - b; }
  else if (op === '×') { const m = [10, 10, 12, 15, 20, 25][lvl]; a = randInt(2, m); b = randInt(2, m); answer = a * b; }
  else { const m = [10, 10, 12, 15, 20, 25][lvl]; b = randInt(2, m); answer = randInt(2, m); a = answer * b; }
  document.getElementById('problem').textContent = `${a} ${op === '-' ? '−' : op} ${b}`;
  input.value = '';
}

function start() {
  score = 0; solved = 0; timeLeft = 60000;
  state = 'play';
  msg.textContent = '';
  makeProblem();
  overlay(ov, null);
  input.focus();
  hud();
}

function hud() {
  document.getElementById('score').textContent = score;
  document.getElementById('time').textContent = Math.ceil(timeLeft / 1000);
}

function check() {
  if (state !== 'play') return;
  const v = input.value.trim().replace('−', '-');
  if (v !== '' && v !== '-' && Number(v) === answer) {
    score++;
    solved++;
    msg.textContent = pick(['Nice!', 'Correct!', 'Yes!', 'Great!', '✓']);
    msg.className = 'msg good';
    Sound.beep(880, 0.05, 'triangle');
    makeProblem();
    hud();
  }
}

input.addEventListener('input', check);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (state !== 'play') return start();
    if (input.value.trim() !== '') { msg.textContent = `Not quite`; msg.className = 'msg bad'; Sound.beep(160, 0.12, 'sawtooth'); input.select(); }
  }
});
document.getElementById('skip').onclick = () => {
  if (state !== 'play') return;
  score = Math.max(0, score - 1);
  msg.textContent = `It was ${answer}`;
  msg.className = 'msg bad';
  makeProblem();
  hud();
  input.focus();
};

function loop(t) {
  const dt = Math.min(50, t - last);
  last = t;
  if (state === 'play') {
    timeLeft -= dt;
    if (timeLeft <= 0) {
      timeLeft = 0;
      state = 'over';
      best = recordBest('quickmath-best', score);
      document.getElementById('best').textContent = best;
      overlay(ov, `<h2>Time's up!</h2><p>You solved ${solved} problems · Score ${score}</p><p>Best ${best}</p><button class="btn" onclick="start()">Play again</button>`);
    }
    hud();
  }
  requestAnimationFrame(loop);
}

overlay(ov, '<h2>Quick Math</h2><p>60 seconds of mental arithmetic.</p><button class="btn" onclick="start()">Start</button>');
requestAnimationFrame(loop);
</script>
</body>
</html>
