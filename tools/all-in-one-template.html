<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>HTML Games Arcade — Mega All-In-One</title>
</head>
<body>
<!--
  HTML Games Arcade — Mega All-In-One: @COUNT@ games in this one self-contained file. No other files are needed.
  Generated by tools/build.js from the games/ folder; edit the games there and rebuild.

  Google Sites: Insert > Embed > "Embed code", paste this whole file, then stretch the box.
  For the whole screen: Pages > + > "Full page embed" > Add embed > Embed code.
  Any other site: upload this file and use
    <iframe src="all-in-one.html" style="width:100%;height:100vh;border:0" allow="fullscreen *; autoplay *"></iframe>
  or paste the whole file into the site's custom-HTML block.
  To start on a particular game, add data-game="chess" (any game id) to the div below,
  or link to this file with #chess on the end of the address.
-->
<div id="html-games-arcade"></div>
<noscript>The HTML Games Arcade needs JavaScript turned on.</noscript>
<script>
(function () {
'use strict';
// every game (and the shared code they use), deflate-compressed and base64-encoded
const PACK = "@PACK@";
const GAMES = "@GAMES@";

/*@INFLATE@*/

const CATEGORIES = ['Arcade', 'Mobile Hits', 'Ad Games', 'Puzzle', 'Skill', 'Word', 'Board', 'Cards & Dice'];

const CSS = `
:host { display: block; }
/* all: initial stops the host page's inherited text styles leaking in when the code is pasted into a site */
.root {
  all: initial;
  display: block;
  container-type: inline-size;
  --bg: #0b1021;
  --panel: rgba(17, 24, 39, 0.9);
  --line: rgba(148, 163, 184, 0.25);
  --text: #e5eefb;
  --muted: #a8b5cf;
  --accent: #8b5cf6;
  --accent-2: #22d3ee;
  --shadow: rgba(15, 23, 42, 0.55);
  color-scheme: dark;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 16px;
  line-height: 1.4;
  color: var(--text);
  background:
    radial-gradient(circle at top left, rgba(139, 92, 246, 0.14), transparent 28%),
    radial-gradient(circle at bottom right, rgba(34, 211, 238, 0.12), transparent 32%),
    var(--bg);
  -webkit-tap-highlight-color: transparent;
}
:host(.inline) .root { border-radius: 18px; overflow: hidden; }
* { box-sizing: border-box; }
button, input { font: inherit; }
[hidden] { display: none !important; }

.app {
  width: 100%;
  height: var(--app-h, 100vh);
  display: grid;
  grid-template-columns: 340px minmax(0, 1fr);
  overflow: hidden;
}
.app.full { grid-template-columns: 0 minmax(0, 1fr); }
.app.full .sidebar { visibility: hidden; padding: 0; border: 0; }

.sidebar {
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-right: 1px solid var(--line);
  background: rgba(10, 16, 28, 0.92);
  padding: 16px 12px 0;
}
.brand { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; padding: 2px 6px 4px; }
.brand h1 { font-size: 1.2rem; margin: 0; letter-spacing: -0.04em; }
.brand .badge { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; font-size: 0.72rem; font-weight: 700; padding: 6px 10px; border-radius: 999px; }

.controls { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 10px; }
.controls input {
  width: 100%; background: rgba(15, 23, 42, 0.9); color: var(--text); border: 1px solid var(--line);
  border-radius: 12px; padding: 11px 12px; font-size: 0.96rem; outline: none;
}
.controls input:focus { border-color: rgba(139, 92, 246, 0.8); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.18); }

button.ui {
  border: 1px solid var(--line); background: rgba(31, 41, 55, 0.85); color: var(--text);
  border-radius: 12px; cursor: pointer; padding: 10px 12px; font-weight: 600;
  transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
}
button.ui:hover { transform: translateY(-1px); border-color: rgba(139, 92, 246, 0.75); }

.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: none; flex-shrink: 0; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; border: 1px solid var(--line); background: rgba(15, 23, 42, 0.7); color: var(--muted); padding: 6px 11px; border-radius: 999px; cursor: pointer; font-size: 0.8rem; white-space: nowrap; }
.chip.on { background: linear-gradient(135deg, var(--accent), #6d4fe0); border-color: transparent; color: #fff; }

.game-list { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; overflow: auto; padding: 2px 2px 16px; -webkit-overflow-scrolling: touch; }
.game-btn {
  display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 10px; background: rgba(15, 23, 42, 0.7); border: 1px solid var(--line); color: var(--text);
  border-radius: 12px; cursor: pointer; transition: transform 0.15s ease, border-color 0.15s ease;
}
.game-btn:hover { transform: translateY(-1px); border-color: rgba(139, 92, 246, 0.75); }
.game-btn.active { background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(34, 211, 238, 0.12)); border-color: rgba(139, 92, 246, 0.7); box-shadow: inset 0 0 0 1px rgba(139, 92, 246, 0.35); }
.game-icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 1.4rem; background: linear-gradient(135deg, rgba(139,92,246,.24), rgba(34,211,238,.12)); border: 1px solid rgba(148, 163, 184, 0.2); }
.game-meta { min-width: 0; }
.game-name { font-weight: 700; font-size: 0.96rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.game-desc { font-size: 0.73rem; color: var(--muted); line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.game-tag { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.tag { font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 4px 7px; background: rgba(148, 163, 184, 0.08); border-radius: 999px; white-space: nowrap; }
.tag.online { color: #67e8f9; background: rgba(34, 211, 238, 0.12); }
.tag.d3 { color: #c4b5fd; background: rgba(139, 92, 246, 0.16); }

.viewer { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: rgba(8, 12, 22, 0.55); }
.topbar { padding: 10px 14px; border-bottom: 1px solid var(--line); background: rgba(14, 20, 31, 0.6); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.topbar h2 { margin: 0; font-size: 1.05rem; letter-spacing: -0.03em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .actions { display: flex; gap: 8px; }
.topbar button.ui { padding: 8px 11px; }
#backBtn { display: none; }
.frame-wrap { flex: 1; min-height: 0; padding: 10px; }
.frame-wrap iframe { display: block; width: 100%; height: 100%; border: 1px solid var(--line); border-radius: 16px; background: #0e0f1a; box-shadow: 0 18px 48px var(--shadow); }
.app.full .frame-wrap { padding: 0; }
.app.full .frame-wrap iframe { border-radius: 0; border: 0; }

.empty, .loading { color: var(--muted); background: rgba(15, 23, 42, 0.7); border: 1px dashed var(--line); padding: 18px 14px; border-radius: 12px; text-align: center; }
.loading { margin: 14px; }

/* phones and narrow embeds: show either the list or the game, full size */
@container (max-width: 760px) {
  .app, .app.full { grid-template-columns: 1fr; }
  .sidebar { border-right: none; padding: 12px 10px 0; }
  .app.show-game .sidebar { display: none; }
  .app:not(.show-game) .viewer { display: none; }
  #backBtn { display: inline-block; }
  #fullBtn { display: none; }
  .frame-wrap { padding: 0; }
  .frame-wrap iframe { border-radius: 0; border: 0; box-shadow: none; }
  .topbar { padding: 8px 10px; }
}
`;

// ---------- setup ----------
const host = document.getElementById('html-games-arcade');
// opened as its own page (directly, through an <iframe src>, or as a Google Sites embed)
// vs pasted into the middle of another page
const standalone = [...document.body.children].every(el => el === host || /^(SCRIPT|NOSCRIPT|STYLE|TEMPLATE|LINK|META|TITLE)$/.test(el.tagName));
const useHash = standalone && /^(https?|file):$/.test(location.protocol);
if (standalone) {
  document.documentElement.style.cssText += ';background:#0b1021;height:100%';
  document.body.style.cssText += ';margin:0;height:100%;overflow:hidden';
  host.style.setProperty('--app-h', '100vh');
  if (window.CSS && window.CSS.supports && window.CSS.supports('height', '100dvh')) host.style.setProperty('--app-h', '100dvh');
} else {
  host.style.setProperty('--app-h', 'clamp(600px, 92vh, 1000px)');
}
host.classList.add(standalone ? 'standalone' : 'inline');
const shadow = host.attachShadow({ mode: 'open' });
shadow.innerHTML = `<style>${CSS}</style>
<div class="root">
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>Mega All-In-One</h1>
        <span class="badge" id="totalBadge">${GAMES.length}</span>
      </div>
      <div class="controls">
        <input id="searchInput" type="search" placeholder="Search ${GAMES.length} games..." aria-label="Search games" />
        <button class="ui" id="randomBtn" type="button">Random</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="game-list" id="gameList"></div>
    </aside>
    <main class="viewer">
      <div class="topbar">
        <button class="ui" id="backBtn" type="button">← Games</button>
        <h2 id="titleLabel">Loading…</h2>
        <div class="actions">
          <button class="ui" id="fullBtn" type="button" title="Hide the list and give the game the whole space">⛶ Full view</button>
          <button class="ui" id="openTabBtn" type="button">Open Game</button>
        </div>
      </div>
      <div class="frame-wrap" id="frameWrap"><div class="loading">Loading ${GAMES.length} games…</div></div>
    </main>
  </div>
</div>`;

const $ = id => shadow.getElementById(id);
const app = $('app'), searchInput = $('searchInput'), gameList = $('gameList'), titleLabel = $('titleLabel'), frameWrap = $('frameWrap');
const store = {
  get(k, d) { try { const v = localStorage.getItem('html-games:' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('html-games:' + k, JSON.stringify(v)); } catch (e) { /* storage blocked */ } }
};
const byId = id => GAMES.find(g => g[0] === id);
const narrow = () => host.getBoundingClientRect().width <= 760;
let SRC = null, LIBS = {}, selectedId = null, gameFrame = null;
let chip = store.get('aio-chip', 'All');

// ---------- unpacking ----------
async function unpack() {
  const bin = Uint8Array.from(atob(PACK), c => c.charCodeAt(0));
  let bytes = null;
  if (typeof DecompressionStream === 'function') {
    try {
      const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      bytes = new Uint8Array(await new Response(stream).arrayBuffer());
    } catch (e) { bytes = null; }
  }
  if (!bytes) bytes = inflateRaw(bin);
  return JSON.parse(new TextDecoder().decode(bytes));
}

// Each game is a complete HTML page. Shared code is stored once and put back
// into the page here, then the page runs in its own frame so games never clash.
function gameDoc(id) {
  let html = SRC[id];
  for (const name in LIBS) {
    const code = LIBS[name];
    if (name.endsWith('.css')) html = html.split(`<link rel="stylesheet" href="${name}">`).join('<style>' + code + '<\/style>');
    else html = html.split(`<script src="${name}"><\/script>`).join('<script>' + code + '<\/script>');
  }
  return html;
}

// ---------- list ----------
function matches(g) {
  const q = searchInput.value.trim().toLowerCase();
  if (q && !`${g[0]} ${g[1]} ${g[3]} ${g[4]} ${g[5] || ''}`.toLowerCase().includes(q)) return false;
  if (chip === 'All') return true;
  if (chip === 'online') return g[5] === 'online';
  if (chip === '3d') return g[5] === '3d';
  return g[3] === chip;
}

function renderChips() {
  const el = $('chips');
  el.innerHTML = '';
  const add = (key, label) => {
    const b = document.createElement('button');
    b.className = 'chip' + (chip === key ? ' on' : '');
    b.textContent = label;
    b.onclick = () => { chip = key; store.set('aio-chip', chip); renderChips(); renderList(); };
    el.appendChild(b);
  };
  add('All', 'All');
  add('online', '🌐 Online');
  add('3d', '🧊 3D');
  CATEGORIES.forEach(c => add(c, c));
}

function renderList() {
  const games = GAMES.filter(matches);
  $('totalBadge').textContent = games.length;
  gameList.innerHTML = '';
  if (!games.length) {
    gameList.innerHTML = '<div class="empty">No games match your search.</div>';
    return;
  }
  const frag = document.createDocumentFragment();
  games.forEach(([id, name, icon, category, desc, flag]) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'game-btn' + (selectedId === id ? ' active' : '');
    button.innerHTML = `
      <div class="game-icon">${icon}</div>
      <div class="game-meta"><div class="game-name">${name}</div><div class="game-desc">${desc}</div></div>
      <div class="game-tag">${flag === 'online' ? '<span class="tag online">🌐 Online</span>' : flag === '3d' ? '<span class="tag d3">3D</span>' : ''}<span class="tag">${category}</span></div>`;
    button.addEventListener('click', () => { selectedId = id; renderList(); loadGame(id, true); });
    frag.appendChild(button);
  });
  gameList.appendChild(frag);
}

function revealActive() {
  const active = gameList.querySelector('.game-btn.active');
  if (active) gameList.scrollTop = active.offsetTop - gameList.offsetTop - 8;
}

// ---------- playing ----------
function loadGame(id, focus) {
  const g = byId(id);
  if (!g || !SRC) return;
  selectedId = id;
  titleLabel.textContent = `${g[2]}  ${g[1]}`;
  $('openTabBtn').textContent = narrow() ? 'Open' : `Open ${g[1]}`;
  if (gameFrame) gameFrame.remove();
  frameWrap.innerHTML = '';
  // a fresh frame per game stops the previous game's timers, sounds and connections
  gameFrame = document.createElement('iframe');
  gameFrame.title = g[1];
  gameFrame.setAttribute('allow', 'fullscreen *; autoplay *; gamepad *');
  gameFrame.allowFullscreen = true;
  gameFrame.srcdoc = gameDoc(id);
  if (focus) gameFrame.addEventListener('load', e => { try { e.target.contentWindow.focus(); } catch (err) { /* ignore */ } });
  frameWrap.appendChild(gameFrame);
  app.classList.add('show-game');
  if (useHash) { try { history.replaceState(null, '', '#' + id); } catch (e) { /* ignore */ } }
  store.set('aio-last', id);
}

function backToList() {
  app.classList.remove('show-game');
  if (gameFrame) { gameFrame.remove(); gameFrame = null; }
  frameWrap.innerHTML = '';
  titleLabel.textContent = 'Pick a game';
  revealActive();
}

$('backBtn').addEventListener('click', backToList);
$('randomBtn').addEventListener('click', () => {
  const pool = GAMES.filter(matches);
  const g = (pool.length ? pool : GAMES)[Math.floor(Math.random() * (pool.length || GAMES.length))];
  selectedId = g[0];
  renderList();
  revealActive();
  loadGame(g[0], true);
});
searchInput.addEventListener('input', renderList);
$('fullBtn').addEventListener('click', () => {
  const on = !app.classList.contains('full');
  app.classList.toggle('full', on);
  $('fullBtn').textContent = on ? '☰ Show list' : '⛶ Full view';
  if (on && document.fullscreenEnabled && !document.fullscreenElement) host.requestFullscreen().catch(() => {});
  if (!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
});
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && app.classList.contains('full')) { app.classList.remove('full'); $('fullBtn').textContent = '⛶ Full view'; }
});
// open the current game on its own in a new tab (built from the copy stored in this file)
$('openTabBtn').addEventListener('click', () => {
  if (!selectedId || !SRC) return;
  const url = URL.createObjectURL(new Blob([gameDoc(selectedId)], { type: 'text/html' }));
  window.open(url, '_blank');
  setTimeout(() => URL.revokeObjectURL(url), 60000);
});
if (useHash) {
  window.addEventListener('hashchange', () => {
    const id = decodeURIComponent(location.hash.slice(1));
    if (byId(id) && id !== selectedId) { selectedId = id; renderList(); revealActive(); loadGame(id, true); }
  });
}

renderChips();
renderList();
unpack().then(data => {
  SRC = data.games;
  LIBS = data.libs;
  const isGame = id => !!byId(id);
  const fromHash = useHash ? decodeURIComponent(location.hash.slice(1)) : '';
  const first = [host.dataset.game, fromHash].find(isGame);
  selectedId = first || (narrow() ? null : (isGame(store.get('aio-last', '')) ? store.get('aio-last', '') : 'snake'));
  renderList();
  revealActive();
  if (selectedId) loadGame(selectedId, false);
  else { titleLabel.textContent = 'Pick a game'; frameWrap.innerHTML = ''; }
}).catch(err => {
  frameWrap.innerHTML = '<div class="loading">Sorry — this browser could not unpack the games (' + String(err && err.message || err) + ').</div>';
});
})();
</script>
</body>
</html>
